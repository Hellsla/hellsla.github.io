# Fysiikkalabra QA for every course: build every lesson (drafts included), run the headless simulation and inquiry
# tests, check answer positions, carried reviews and the committed site. No AI task repeats these checks.
# This repository serves GitHub Pages from its root branch (the teacher's other sites). Ruukkilabra itself is published at
# https://ruukkilab.fi/ by .github/workflows/ruukkilabra-deploy.yml after this workflow has passed on main (teacher 2026-11-04).
# On a pull request the three browser steps (simulations, inquiry tests, layout at eight widths) test only the pages the
# change can alter (scripts/ci_scope.py; teacher 2026-11-01); a change to anything shared runs them in full. Every other
# check, and the whole run on main, weekly and on a manual run, is full. A newer push to a pull request cancels its older run.
name: fysiikkalabra-ci
on:
  push:
    branches: [main]   # a pull request's branch is tested by its pull_request run (the required check qa)
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  pull_request:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  schedule: [{ cron: "0 19 * * 0" }]   # Sunday 21:00 Helsinki (winter time): weekly QA run
  workflow_dispatch: {}                 # a full run by hand (Actions -> fysiikkalabra-ci -> Run workflow)
permissions: { contents: read }
concurrency:
  group: fysiikkalabra-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fysiikkalabra } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # reviews.py verify re-derives carried reviews from history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install markdown playwright numpy && playwright install --with-deps chromium
      - name: which pages the browser steps test (a pull request - the pages it can change, or full; scripts/ci_scope.py, teacher 2026-11-01)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then pages=$(python scripts/ci_scope.py "origin/${{ github.base_ref }}" 2> /tmp/scope.txt) || { pages=full; echo "scripts/ci_scope.py failed: full run" >> /tmp/scope.txt; }; else pages=full; echo "full run (${{ github.event_name }})" > /tmp/scope.txt; fi
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          { echo "### Browser steps: ${pages:-no page changed}"; sed 's/^/    /' /tmp/scope.txt; } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python scripts/lint_lesson.py --all
      - name: every worked example and exercise has a complete model solution (teacher 2026-10-27)
        run: python scripts/check_solutions.py --all
      - name: known physics errors are not taught as fact again (docs/physics-guardrails.md, teacher 2026-10-28)
        run: python scripts/test_physics_phrases.py
      - name: every vector is written with an overline in texts, figures, simulations and interface strings (rule 14, teacher 2026-10-29)
        run: python scripts/test_notation.py
      - name: learning goals complete their heading "Tällä tunnilla opit" / "you will learn to" (teacher 2026-10-29)
        run: python scripts/objectives.py && python scripts/test_objectives.py
      - name: every numeric exercise shows its model solution's rounded answer, and it agrees with the value the check accepts (teacher 2026-10-30)
        run: python scripts/answers_shown.py
      - name: Sovella itsenäisesti tasks (points, criteria, competencies, links, solutions, answers, translations) and their tests (teacher 2026-10-28)
        run: python scripts/practice.py check && python scripts/test_practice.py
      - name: experimental investigations (metadata, prerequisites, F/E levels, working-mode blocks, help links, figures; teacher 2026-10-30)
        run: python scripts/investigations.py check
      - name: TVT-ohjeet (fields, links to and from investigations, figures; teacher 2026-10-31)
        run: python scripts/guides.py check
      - name: course units of local courses (FY14 Road to Fusion; fields, chapters, inquiry, components, sources, figures; teacher 2026-11-01)
        run: python scripts/units.py check
      - name: the figure catalog is current and figures in tasks resolve, render and hash as they should (scripts/figcat.py)
        run: python scripts/figcat.py build --check && python scripts/test_figcat.py
      - name: assessment audits are current (docs/assessment/)
        run: python scripts/assessment.py --all --check
      - name: competency coverage reports are current (docs/coverage/)
        run: python scripts/coverage.py --all --check
      - run: python scripts/build.py --all
      - name: built pages are accessible as static HTML (field names, aria references, unique ids, figure text alternatives, button names, page language; teacher 2026-10-30)
        run: python scripts/check_a11y.py site
      - name: a figure shown twice on a page has its own SVG ids (teacher 2026-10-29)
        run: python scripts/test_svgids.py && python scripts/svgids.py site
      - name: force diagrams obey their physics (scripts/fbd.py, docs/force-diagrams.md)
        run: python scripts/test_fbd.py
      - name: every "Voimakuvio" step of a model solution shows a drawn force diagram, and every ```voimakuvio spec draws with its physics checked (scripts/fbdspec.py, teacher 2026-10-30)
        run: python scripts/fbdspec.py check && python scripts/test_fbdspec.py
      - name: the simulations' physics models pass their tests (assets/sims/*/*/model.js, tests/models/, teacher 2026-10-30)
        run: python scripts/test_models.py
      - name: every lesson has Edellinen luku / Seuraava luku in the teaching order (teacher 2026-10-29)
        run: python scripts/test_chapter_nav.py site
      - name: front page and module pages list what each language published, one link per row, language links land on a note (teacher 2026-10-29)
        run: python scripts/test_home.py
      - name: the solution editor under every exercise (Abitti's Digabi editor, loaded on the first click; copy for L'Math; teacher 2026-11-01)
        run: python scripts/test_writepad.py
      - name: read aloud on every lesson page (browser voice, formulas as words, the sentence and word highlighted; teacher 2026-11-03)
        run: python scripts/test_readaloud.py
      - name: the progress bar of a lesson (sticky stage bar, stage on screen, done stages in localStorage, no JavaScript; teacher 2026-11-03)
        run: python scripts/test_progress.py
      - run: python scripts/test_reviews.py
      - run: python scripts/test_inquiry.py
      - run: python scripts/reviews.py verify
      - name: a temporary FY4 course through the whole pipeline (nothing is published)
        run: python scripts/test_courses.py
      - name: the exercise bank's schema (multiple choice, data tables, kinds, minimum counts)
        run: python scripts/test_exercise_bank.py
      - name: every language has every text, and every translation keeps the Finnish lesson's numbers, formulas and structure
        run: python scripts/check_i18n.py
      - name: a trial English lesson through the language check, the reviews and the build into site/en/ (nothing is published)
        run: python scripts/test_i18n.py
      - name: a course unit's translation through translate_kit, the checks, the reviews and the build (nothing is published)
        run: python scripts/test_unit_i18n.py
      - name: which lessons this pull request touches, and which review each needs
        if: github.event_name == 'pull_request'
        run: python scripts/reviews.py impact "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: simulations (every page, or the pull request's pages)
        if: steps.scope.outputs.pages != ''
        env: { PAGES: "${{ steps.scope.outputs.pages }}" }
        run: if [ "$PAGES" = full ]; then python scripts/test_sims.py; else python scripts/test_sims.py $PAGES; fi
      - name: inquiry tests of every lesson with inquiry.json, or of the pull request's pages (gating, locks, reveal, options and feedback as rendered, navigation, 360 px)
        if: steps.scope.outputs.pages != ''
        env: { PAGES: "${{ steps.scope.outputs.pages }}" }
        run: |
          fail=0
          for f in content/fi/*/*/inquiry.json; do
            case "$f" in content/fi/units/*) continue;; esac   # course units (FY12) are checked by units.py check, as FY14's are
            id=$(basename "$(dirname "$f")")
            if [ "$PAGES" != full ]; then case " $PAGES " in *" $id "*) ;; *) continue;; esac; fi
            if python scripts/test_inquiry.py "$id" > "/tmp/inquiry-$id.txt" 2>&1; then tail -1 "/tmp/inquiry-$id.txt" | sed "s/^/$id: /"
            else fail=1; echo "::error::inquiry tests failed for $id"; grep -E "^FAIL" "/tmp/inquiry-$id.txt" || tail -20 "/tmp/inquiry-$id.txt"; fi
          done
          exit $fail
      - name: correct options are spread over the positions in every course (as the pages show them)
        run: python scripts/check_choices.py --all
      - name: committed site/ is exactly a fresh render of the reviewed sources and templates
        run: |
          python scripts/build.py
          if [ -n "$(git status --porcelain site/)" ]; then echo "site/ is not a fresh render of the reviewed sources (run build.py and commit):"; git status --short site/; exit 1; fi
      - name: the copy published at https://ruukkilab.fi/ (site/ at the root) names none of the teacher's other sites and has no broken relative link (scripts/deploy_site.py, teacher 2026-11-04)
        run: python scripts/deploy_site.py /tmp/ruukkilab
      - name: "every published page at eight widths (640 = 1280 px at 200 % zoom), closed, with hints and solutions open and with everything open; no overflow, overlap, empty column beside an opened card or a figure, cards out of order, over-long lines, small text or controls, or headings under the sticky navigation (NOTES.md §8)"
        if: steps.scope.outputs.pages != ''
        env: { PAGES: "${{ steps.scope.outputs.pages }}" }
        run: |
          fail=0
          if [ "$PAGES" = full ]; then only=""; else only="$PAGES"; fi
          for w in 360 390 640 768 1024 1280 1440 1920; do python scripts/check_layout.py $only --site --width $w > "/tmp/layout-$w.txt" 2>&1 || { fail=1; echo "::error::layout check failed at $w px"; grep -v "^OK" "/tmp/layout-$w.txt"; }; done
          exit $fail
      - run: |
          for d in content/fi/*/*/; do
            case "$d" in *_gold*) continue;; esac
            python scripts/check_latex.py "$d"
          done
