<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vieriminen · FY05</title>
<style>
  /* ---------- yhteinen ulkoasu (sama kaikissa FY05-simulaatioissa) ----------
     Mitoitus on tehty luokkahuoneen näyttöä varten: peruskoko seuraa ikkunan kokoa
     (16:9-upotuksessa noin 4 % korkeudesta) ja kaikki mitat ovat em-yksiköissä,
     joten koko käyttöliittymä skaalautuu kuin kalvo. ?koko=1,2 suurentaa kaiken 20 %. */
  :root{
    --bg:#ffffff; --panel:#f6f6f3;
    --ink:#2b2e33; --ink-2:#555a61; --ink-3:#858a91;
    --line:#e2e2de; --line-2:#c6c6c0;
    --accent:#2f6f9f; --accent-soft:#e3edf6;
    --c-blue:#2a7aab; --c-red:#c2404f; --c-orange:#d8761f; --c-green:#35895a; --c-violet:#7a62b0;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --koko:1;
  }
  *{box-sizing:border-box}
  html{font-size:calc(clamp(12px,min(2.75vw,4vh),60px) * var(--koko))}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);font-size:1rem;line-height:1.3}
  .app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
  .app.is-bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    user-select:none;-webkit-user-select:none}
  .panel{width:13.4em;background:var(--panel);border-left:1px solid var(--line);
    padding:.55em .7em .5em;display:flex;flex-direction:column;gap:.35em;overflow:hidden}
  .app.is-bottom .panel{width:auto;font-size:.92em;border-left:0;border-top:1px solid var(--line);flex-direction:row;
    flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.35em 1.2em;padding:.4em 1em .5em}
  .group{display:flex;flex-direction:column;gap:.15em;min-width:0}
  .ctl{display:flex;flex-direction:column;gap:0}
  .ctl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 .5em;font-size:.88em;line-height:1.2;color:var(--ink-2);white-space:nowrap}
  .ctl-head b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
  .sym{font-style:italic}
  sub{font-size:.72em;line-height:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.3em;margin:0;background:transparent;
    cursor:pointer;font-size:inherit;--p:50%}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px;border-radius:.4em}
  input[type=range]::-webkit-slider-runnable-track{height:.28em;border-radius:.2em;
    background:linear-gradient(to right,var(--accent) 0 var(--p),var(--line-2) var(--p) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.05em;height:1.05em;margin-top:-.385em;border-radius:50%;
    background:#fff;border:.1em solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
  input[type=range]::-moz-range-track{height:.28em;border-radius:.2em;background:var(--line-2)}
  input[type=range]::-moz-range-progress{height:.28em;border-radius:.2em;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:.95em;height:.95em;border-radius:50%;background:#fff;border:.1em solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .chk{display:flex;align-items:center;gap:.45em;font-size:.9em;line-height:1.2;cursor:pointer;user-select:none;min-height:1.5em;white-space:nowrap}
  .chk input{font-size:inherit;width:1.05em;height:1.05em;margin:0;accent-color:var(--accent);cursor:pointer;flex:none}
  .chk.wrap{white-space:normal;align-items:flex-start}
  .chk.wrap input{margin-top:.1em}
  .btns{display:flex;gap:.3em;flex-wrap:wrap}
  .btns .btn{flex:1 1 0}
  .btn{font:inherit;font-size:.9em;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:.35em;
    min-height:2.05em;padding:0 .55em;border-radius:.5em;border:1px solid var(--line-2);background:#fff;color:var(--ink);
    cursor:pointer;touch-action:manipulation;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn:active{background:#f1f1ee}
  .btn svg{width:1em;height:1em;flex:none}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#1c1f23}
  .btn.wide{width:100%}
  .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:default}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:.5em;overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:.9em;border:0;background:transparent;padding:0 .7em;min-height:2.0em;color:var(--ink-2);
    cursor:pointer;touch-action:manipulation}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .key{display:inline-block;width:1.4em;height:.7em;flex:none;position:relative}
  .key::before{content:"";position:absolute;left:0;right:.35em;top:calc(50% - .08em);height:.16em;background:var(--c)}
  .key::after{content:"";position:absolute;right:0;top:calc(50% - .3em);border-left:.5em solid var(--c);
    border-top:.3em solid transparent;border-bottom:.3em solid transparent}
  .key.none{visibility:hidden}
  .legend{display:flex;flex-direction:column;gap:.15em;font-size:.85em;line-height:1.25;color:var(--ink-2)}
  .legend span{display:flex;align-items:center;gap:.5em}
  .legend[hidden]{display:none}
  @media (max-aspect-ratio:4/5),(max-width:560px){      /* puhelin pystyasennossa: säätimet kuvan alla */
    html{font-size:calc(clamp(13px,3.7vw,18px) * var(--koko))}
    html,body{overflow:auto}
    .app{position:static;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
    .stage{height:58vh;min-height:300px}
    .app .panel,.app.is-bottom .panel{width:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
  }

  /* ---------- tämän simulaation omat ---------- */
  .app.is-bottom .panel{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:.45em}
  .sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3em 1.4em}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:.45em 1.2em}
  .row .grp{display:flex;align-items:center;gap:.5em;font-size:.95em;color:var(--ink-2)}
  .row .grp .seg button,.row .grp .btn{font-size:1em}
  .row-btns{display:flex;gap:.4em;align-items:center}
  @media (max-aspect-ratio:4/5),(max-width:560px){
    .sliders{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app is-bottom">
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Pyörä alustalla. Pyörään kohdistuvan voiman vaikutuspistettä ja suuntaa voi raahata. Voiman momentti kosketuspisteen suhteen saa pyörän vierimään."></canvas>
  </div>

  <div class="panel" aria-label="Säätimet">
    <div class="sliders">
      <label class="ctl"><span class="ctl-head"><span>Voima <span class="sym">F</span></span><b data-for="F"></b></span>
        <input id="F" type="range" min="0" max="60" step="1" value="10" aria-label="Voiman suuruus"></label>
      <label class="ctl"><span class="ctl-head"><span>Massa <span class="sym">m</span></span><b data-for="m"></b></span>
        <input id="m" type="range" min="1" max="10" step="0.5" value="4" aria-label="Pyörän massa"></label>
      <label class="ctl"><span class="ctl-head"><span>Säde <span class="sym">r</span></span><b data-for="r"></b></span>
        <input id="r" type="range" min="0.2" max="0.6" step="0.05" value="0.4" aria-label="Pyörän säde"></label>
    </div>
    <div class="row">
      <div class="row-btns">
        <button class="btn primary" id="play" type="button"></button>
        <button class="btn" id="reset" type="button" title="Pyörä takaisin alkuun">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 8.2a4.7 4.7 0 1 0 1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2.6 2.4v3.4H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Alusta</button>
      </div>
      <label class="chk"><input type="checkbox" id="showMom" checked> Näytä momentti</label>
      <label class="chk"><input type="checkbox" id="showForces"> Muut voimat</label>
      <label class="chk"><input type="checkbox" id="showVel"> Pisteiden nopeudet</label>
      <label class="chk"><input type="checkbox" id="showVal"> Näytä arvot</label>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   Yhteiset apufunktiot
   ===================================================================== */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MINUS = '−', NBSP = ' ';
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'), line: css('--line'), line2: css('--line-2'),
  blue: css('--c-blue'), red: css('--c-red'), orange: css('--c-orange'), green: css('--c-green'), violet: css('--c-violet') };

/** Luku suomalaisittain: desimaalipilkku, oikea miinusmerkki, ei "−0,0". */
function fmt(x, d = 1) {
  if (!Number.isFinite(x)) return '–';
  const s = Math.abs(x).toFixed(d);
  const neg = x < 0 && +s !== 0;
  let [ip, fp] = s.split('.');
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? MINUS : '') + ip + (fp ? ',' + fp : '');
}
/** Luku n merkitsevällä numerolla (esim. 160, 32,0, 2,67, 0,100). */
function fmtSig(x, n = 3) {
  if (!Number.isFinite(x)) return '–';
  if (x === 0) return '0';
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)) + 1e-9));
  return fmt(x, Math.min(d, 6));
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* Pieni merkintäkieli kanvastekstille:
   {F} = kursiivinen suureen tunnus, {->v} = vektori (kursiivi + nuoli),
   _1 tai _{ab} = alaindeksi, ^2 tai ^{ab} = yläindeksi. */
const richCache = new Map();
function rich(src) {
  let out = richCache.get(src);
  if (out) return out;
  out = []; let buf = '';
  const flush = () => { if (buf) { out.push({ t: buf }); buf = ''; } };
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === '{') {
      const j = src.indexOf('}', i), body = src.slice(i + 1, j);
      flush();
      out.push(body.startsWith('->') ? { t: body.slice(2), it: true, vec: true } : { t: body, it: true });
      i = j;
    } else if ((c === '_' || c === '^') && i + 1 < src.length) {
      flush();
      let body;
      if (src[i + 1] === '{') { const j = src.indexOf('}', i + 1); body = src.slice(i + 2, j); i = j; }
      else { body = src[i + 1]; i++; }
      out.push(c === '_' ? { t: body, sub: true } : { t: body, sup: true });
    } else buf += c;
  }
  flush();
  richCache.set(src, out);
  return out;
}
/** Piirtää rikastetun tekstin; palauttaa leveyden. */
function drawRich(ctx, src, x, y, o = {}) {
  const size = o.size || 15, parts = rich(src), weight = o.weight || 400;
  const fontOf = (p) => `${p.it ? 'italic ' : ''}${weight} ${(p.sub || p.sup) ? Math.round(size * 0.72) : size}px ${FONT}`;
  let w = 0;
  const ws = parts.map((p) => { ctx.font = fontOf(p); const pw = ctx.measureText(p.t).width + (p.it ? size * 0.06 : 0); w += pw; return pw; });
  if (o.measure) return w;
  let cx = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  parts.forEach((p, k) => {
    ctx.font = fontOf(p);
    const dy = p.sub ? size * 0.3 : p.sup ? -size * 0.36 : 0;
    if (o.halo) {
      ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.strokeStyle = typeof o.halo === 'string' ? o.halo : 'rgba(255,255,255,0.92)';
      ctx.strokeText(p.t, cx, y + dy);
    }
    ctx.fillStyle = o.color || COL.ink;
    ctx.fillText(p.t, cx, y + dy);
    if (p.vec) {                                   // vektorinuoli kirjaimen yläpuolelle
      const ax0 = cx + size * 0.12, ax1 = cx + ws[k] + size * 0.02, ay = y - size * 0.62;
      ctx.strokeStyle = o.color || COL.ink; ctx.lineWidth = Math.max(1, size / 13);
      ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1, ay);
      ctx.moveTo(ax1 - size * 0.2, ay - size * 0.12); ctx.lineTo(ax1, ay); ctx.lineTo(ax1 - size * 0.2, ay + size * 0.12);
      ctx.stroke();
    }
    cx += ws[k];
  });
  return w;
}
/** Vektorinuoli (ohut varsi, kapea kärki). */
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const w = o.width || 2.4, L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 0.5) return;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const hl = Math.min(o.head || 10 + w * 1.2, L * 0.8), hw = hl * 0.58;
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(bx + ux, by + uy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(bx - uy * hw, by + ux * hw); ctx.lineTo(bx + uy * hw, by - ux * hw); ctx.closePath(); ctx.fill();
}
/** ?koko=1,2 (tai ?scale=) suurentaa koko käyttöliittymän: luokan näytölle voi valita sopivan koon. */
(() => {
  const q = new URLSearchParams(location.search), raw = q.get('koko') || q.get('scale') || q.get('zoom');
  const k = raw ? parseFloat(raw.replace(',', '.')) : NaN;
  if (k >= 0.5 && k <= 3) document.documentElement.style.setProperty('--koko', String(k));
})();
/** Kanvas, joka seuraa elementin kokoa ja näytön tarkkuutta.
    Piirtäminen tehdään loogisina pikseleinä: u = sivun peruskoko / 15 px. Kun ikkuna kasvaa
    (esim. luokan näyttö), myös tekstit, viivat ja merkit suurenevat samassa suhteessa.
    Kuvapuskuri on vähintään 2-kertainen, jotta kuva pysyy terävänä, kun esitysohjelma
    (esim. Slides.com) suurentaa upotuksen koko ruudulle. */
function setupCanvas(cv, onResize) {
  const view = { ctx: cv.getContext('2d'), W: 1, H: 1, dpr: 1, u: 1 };
  const resize = () => {
    const r = cv.getBoundingClientRect();
    const base = parseFloat(getComputedStyle(document.documentElement).fontSize) || 15;
    const boost = r.width * r.height <= 1.2e6 ? 2 : 1.5;
    const dev = Math.min(3, Math.max(window.devicePixelRatio || 1, boost));
    view.u = base / 15;
    view.W = Math.max(1, r.width / view.u); view.H = Math.max(1, r.height / view.u);
    view.dpr = dev * view.u;                       // looginen pikseli → laitepikseli
    cv.width = Math.round(r.width * dev); cv.height = Math.round(r.height * dev);
    if (onResize) onResize(view);
  };
  /** Osoittimen paikka loogisina pikseleinä. */
  view.pt = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / view.u, y: (e.clientY - r.top) / view.u }; };
  new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);       // peruskoko voi muuttua, vaikka kanvaksen koko ei muuttuisi
  resize();
  return view;
}
/** Liukusäädin + arvonäyttö. */
function bindRange(id, show, onInput) {
  const el = document.getElementById(id), out = document.querySelector(`[data-for="${id}"]`);
  const paint = () => {
    const v = +el.value, a = +el.min, b = +el.max;
    el.style.setProperty('--p', ((v - a) / (b - a) * 100) + '%');
    if (out) out.textContent = show(v);
  };
  el.addEventListener('input', () => { paint(); onInput(+el.value); });
  paint();
  return { el, set(v) { el.value = v; paint(); }, get v() { return +el.value; }, repaint: paint };
}
/** Kiinteän aika-askeleen silmukka: fysiikka ei riipu näytön virkistystaajuudesta. */
function startLoop({ dt, step, draw, running }) {
  let last = performance.now(), acc = 0;
  const frame = (ts) => {
    requestAnimationFrame(frame);
    const real = clamp((ts - last) / 1000, 0, 0.1);   // pitkä tauko (esim. välilehti piilossa) ei aiheuta hyppyä
    last = ts;
    if (running()) {
      acc += real;
      let n = 0;
      while (acc >= dt && n++ < 1000) { step(dt); acc -= dt; }
    }
    draw();
  };
  requestAnimationFrame(frame);
}

/* =====================================================================
   Fysiikka: vieriminen ja voiman momentti
   Alustalla lepäävään pyörään (umpinainen kiekko, I_cm = ½·m·r²) vaikuttaa voima F⃗
   pisteessä A. Pyörä vierii luistamatta, joten se kiertyy hetkellisesti kosketus-
   pisteen P ympäri. Voiman momentti P:n suhteen
       M = F·d,   d = P:n etäisyys F:n vaikutussuorasta,
   määrää, alkaako pyörä vieriä ja mihin suuntaan:
       I_P·α = M,  I_P = I_cm + m·r² = 3/2·m·r²,  a = α·r.
   Jos vaikutussuora kulkee P:n kautta (d = 0), momenttia ei ole eikä pyörä ala vieriä.
   Paino ja tukivoima vaikuttavat P:n kautta kulkevilla suorilla, joten niillä ei ole
   momenttia P:n suhteen. Kitkavoima vaikuttaa P:ssä: f = m·a − F_x (tarvittava lepokitka).
   ===================================================================== */
const g = 9.81;
const S = {
  F: 10, m: 4, r: 0.4,
  An: { x: 0, y: 1 },                   // vaikutuspiste keskipisteen suhteen, säteen yksiköissä (oletus: ylin piste)
  phi: 0,                               // voiman suunta, rad (0 = oikealle, y ylös)
  x: 0, om: 0, th: 0,                   // keskipisteen siirtymä (m), kulmanopeus (rad/s, myötäpäivään +), kiertokulma
  playing: false, out: false,
  show: { mom: true, forces: false, vel: false, val: false },
  drag: null, hover: null,
};
const unit = () => ({ x: Math.cos(S.phi), y: Math.sin(S.phi) });
/** Momentti kosketuspisteen suhteen (myötäpäivään positiivinen): M = (y_A + r)·F_x − x_A·F_y. */
function moment() {
  const u = unit(), ax = S.An.x * S.r, ay = S.An.y * S.r;
  return (ay + S.r) * S.F * u.x - ax * S.F * u.y;
}
/** Vaikutussuoran lähin piste kosketuspisteestä P (keskipisteen suhteen, m) ja momenttivarsi d. */
function leverArm() {
  const u = unit(), A = { x: S.An.x * S.r, y: S.An.y * S.r }, P = { x: 0, y: -S.r };
  const t = (P.x - A.x) * u.x + (P.y - A.y) * u.y;
  const Q = { x: A.x + t * u.x, y: A.y + t * u.y };
  return { Q, d: Math.hypot(P.x - Q.x, P.y - Q.y) };
}
function step(dt) {
  const I = 1.5 * S.m * S.r * S.r;       // hitausmomentti kosketuspisteen suhteen
  const alpha = moment() / I;
  S.om += alpha * dt;
  S.th += S.om * dt;
  S.x += S.om * S.r * dt;               // vierimisehto: v = ω r
  const cx = L.x0 + S.x * L.s, R = S.r * L.s;
  if (cx - R < -10 || cx + R > L.W + 10) { S.out = true; S.playing = false; paintPlay(); }
}
function resetMotion() { S.x = 0; S.om = 0; S.th = 0; S.out = false; }

/* =====================================================================
   Piirtäminen
   ===================================================================== */
const cv = document.getElementById('cv');
let L = {};
const view = setupCanvas(cv, (v) => {
  const fs = clamp(Math.min(v.W / 30, v.H / 16), 12, 18);
  const ground = v.H - fs * 2.7;
  L = { W: v.W, H: v.H, fs, ground, s: Math.min(v.W / 4.2, (ground - 12) / 1.25), x0: v.W * 0.42, kF: 2.0 };   // s: px/m, kF: px/N
});

function draw() {
  const { ctx, dpr } = view, { W, H, fs, s, ground, kF } = L;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const r = S.r, R = r * s, cx = L.x0 + S.x * s, cy = ground - R;
  const C = (q) => ({ x: cx + q.x * s, y: cy - q.y * s });      // keskipisteen suhteen (m) → ruutu
  const u = unit(), A = C({ x: S.An.x * r, y: S.An.y * r }), P = { x: cx, y: ground };
  const M = moment(), { Q, d } = leverArm(), Qs = C(Q);

  // alusta
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, ground); ctx.lineTo(W, ground); ctx.stroke();
  ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x < W; x += 14) { ctx.moveTo(x, ground + 1); ctx.lineTo(x - 7, ground + 8); }
  ctx.stroke();

  // pyörä: kiekko, puolat ja napa (puolat kiertyvät kulman θ verran myötäpäivään)
  ctx.fillStyle = 'rgba(240,241,238,0.92)'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let k = 0; k < 6; k++) { const a = S.th + k * Math.PI / 3; ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.sin(a), cy + R * Math.cos(a)); }
  ctx.stroke();
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 2 * Math.PI); ctx.fill();

  // momentin havainnollistus: vaikutussuora, momenttivarsi d ja kaarinuoli P:ssä
  if (S.show.mom && S.F > 0) {
    const ext = 2 * R + fs * 2;
    ctx.strokeStyle = COL.red; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(A.x - u.x * ext, A.y + u.y * ext); ctx.lineTo(A.x + u.x * ext, A.y - u.y * ext); ctx.stroke();
    ctx.setLineDash([]);
    if (d > 0.01) {
      ctx.strokeStyle = COL.ink2; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(Qs.x, Qs.y); ctx.stroke();
      // suoran kulman merkki Q:ssa
      const nx = (P.x - Qs.x) / (d * s), ny = (P.y - Qs.y) / (d * s), q = 7;
      ctx.beginPath(); ctx.moveTo(Qs.x + nx * q, Qs.y + ny * q); ctx.lineTo(Qs.x + nx * q + u.x * q, Qs.y + ny * q - u.y * q); ctx.lineTo(Qs.x + u.x * q, Qs.y - u.y * q); ctx.stroke();
      // nimiö varren viereen (kohtisuoraan varresta poispäin)
      const ox = -ny, oy = nx, mx = (P.x + Qs.x) / 2 + ox * fs * 0.7, my = (P.y + Qs.y) / 2 + oy * fs * 0.7;
      drawRich(ctx, S.show.val ? `{d} = ${fmt(d, 2)}${NBSP}m` : '{d}', mx, my,
        { size: fs * 0.95, color: COL.ink2, align: ox < -0.3 ? 'right' : ox > 0.3 ? 'left' : 'center', halo: true });
    }
    torqueArc(P.x, P.y, fs * 1.7, Math.abs(M), M > 0, COL.red);
    const mt = S.show.val ? `{M} = {F}{d} = ${fmt(Math.abs(M), 1)}${NBSP}Nm` : '{M} = {F}{d}';
    const fits = P.x + fs * 2.1 + drawRich(ctx, mt, 0, 0, { size: fs, measure: true }) < W - 6;   // reunan lähellä nimiö P:n vasemmalle puolelle
    drawRich(ctx, mt, P.x + (fits ? 1 : -1) * fs * 2.1, P.y + fs * 1.95, { size: fs, color: COL.red, align: fits ? 'left' : 'right', halo: true });
  }
  // kosketuspiste
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(P.x, P.y, 4, 0, 2 * Math.PI); ctx.fill();
  drawRich(ctx, 'P', P.x - fs * 0.5, P.y + fs * 1.95, { size: fs * 0.85, color: COL.ink2, align: 'right', halo: true });

  // muut voimat: paino, tukivoima ja kitka
  if (S.show.forces) {
    const Fy = S.F * u.y, N = Math.max(0, S.m * g - Fy);
    const I = 1.5 * S.m * r * r, a = M / I * r, f = S.m * a - S.F * u.x;
    arrow(ctx, cx, cy, cx, cy + S.m * g * kF, COL.blue, { width: 2.6 });
    // G:n nimiö nuolen oikealla puolella: kärjen kohdalla tai viimeistään alustan tasolla
    drawRich(ctx, S.show.val ? `{->G} = ${fmt(S.m * g, 1)}${NBSP}N` : '{->G}', cx + fs * 0.6, Math.min(cy + S.m * g * kF + fs * 0.2, ground - fs * 0.45), { size: fs, color: COL.blue, halo: true });
    arrow(ctx, P.x, P.y, P.x, P.y - N * kF, COL.green, { width: 2.6 });
    drawRich(ctx, S.show.val ? `{->N} = ${fmt(N, 1)}${NBSP}N` : '{->N}', P.x + fs * 0.6, P.y - Math.max(N * kF - fs * 0.35, fs * 1.6), { size: fs, color: COL.green, halo: true });
    if (Math.abs(f) > 0.3) {                       // kitkan nimiö alustan alle nuolen kärjen kohdalle
      arrow(ctx, P.x, P.y, P.x + f * kF, P.y, COL.orange, { width: 2.6 });
      drawRich(ctx, S.show.val ? `{->f} = ${fmt(Math.abs(f), 1)}${NBSP}N` : '{->f}', P.x + f * kF + Math.sign(f) * fs * 0.5, P.y + fs * 0.9,
        { size: fs, color: COL.orange, align: f > 0 ? 'left' : 'right', halo: true });
    }
  }

  // pisteiden nopeudet vierittäessä: ylin 2v, keskipiste v, kosketuspiste 0
  if (S.show.vel && Math.abs(S.om) > 0.05) {
    const v = S.om * r, kv = clamp(60 / Math.max(Math.abs(v), 0.5), 8, 30);   // keskipisteen nuoli enintään 60 px
    arrow(ctx, cx, cy, cx + v * kv, cy, COL.violet, { width: 2.6 });
    arrow(ctx, cx, cy - R, cx + 2 * v * kv, cy - R, COL.violet, { width: 2.6 });
    drawRich(ctx, '{v}', cx + v * kv + Math.sign(v) * fs * 0.8, cy - fs * 0.2, { size: fs, color: COL.violet, align: 'center', halo: true });
    drawRich(ctx, '2{v}', cx + 2 * v * kv + Math.sign(v) * fs * 1.1, cy - R - fs * 0.2, { size: fs, color: COL.violet, align: 'center', halo: true });
    ctx.strokeStyle = COL.violet; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, 2 * Math.PI); ctx.stroke();
    drawRich(ctx, '0', P.x - fs * 0.8, P.y - fs * 0.7, { size: fs, color: COL.violet, align: 'right', halo: true });
  }

  // voima F: nuoli kärki vaikutuspisteessä A; kärki ja kanta ovat raahattavia
  const len = S.F * kF, hd = Math.max(len, fs * 2.4);              // suuntakahva vähintään 2,4 em kärjestä
  const tail = { x: A.x - u.x * hd, y: A.y + u.y * hd };
  if (hd > len + 1) {                                             // ohut jatke kahvasta nuolen kantaan
    ctx.strokeStyle = COL.red; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(A.x - u.x * len, A.y + u.y * len); ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (S.F > 0) arrow(ctx, A.x - u.x * len, A.y + u.y * len, A.x, A.y, COL.red, { width: 3 });
  drawRich(ctx, S.show.val ? `{->F} = ${fmt(S.F, 0)}${NBSP}N` : '{->F}', tail.x - u.x * fs * 0.9 - u.y * fs * 0.9, tail.y + u.y * fs * 0.9 - u.x * fs * 0.9,
    { size: fs, color: COL.red, align: 'center', halo: true });
  const actTip = S.drag === 'tip' || S.hover === 'tip', actTail = S.drag === 'tail' || S.hover === 'tail';
  ctx.fillStyle = actTip ? COL.red : '#fff'; ctx.strokeStyle = COL.red; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(A.x, A.y, actTip ? 7 : 5.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = actTail ? COL.red : '#fff'; ctx.globalAlpha = actTail ? 1 : 0.7;
  ctx.beginPath(); ctx.arc(tail.x, tail.y, actTail ? 6 : 4.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); ctx.globalAlpha = 1;

  // lukemat
  if (S.show.val) {
    const f = fs * 0.95, lh = f * 1.45;
    let y = 14 + f * 0.6;
    for (const [t, c] of [
      [`{M} = {F}{d} = ${fmt(Math.abs(M), 1)}${NBSP}Nm ${M > 0.05 ? '(myötäpäivään)' : M < -0.05 ? '(vastapäivään)' : ''}`, COL.red],
      [`{α} = {M}/{I}_P = ${fmt(Math.abs(M) / (1.5 * S.m * r * r), 2)}${NBSP}rad/s^2`, COL.ink2],
      [`{v} = {ω}{r} = ${fmt(Math.abs(S.om * r), 2)}${NBSP}m/s`, COL.violet],
    ]) { drawRich(ctx, t, 14, y, { size: f, color: c, halo: true }); y += lh; }
  }
  if (S.out) drawRich(ctx, 'Pyörä poistui kuvasta – paina Alusta', W - 14, 14 + fs * 0.6 + fs * 1.4, { size: fs * 0.9, color: COL.ink2, align: 'right', halo: true });
  drawRich(ctx, 'aika hidastettu 3-kertaisesti', W - 14, 14 + fs * 0.6, { size: fs * 0.78, color: COL.ink3, align: 'right', halo: true });
}
/** Kaarinuoli pisteen (x, y) ympäri; kaaren pituus ∝ momentti, suunta myötä- tai vastapäivään. */
function torqueArc(x, y, R, M, cw, color) {
  const { ctx } = view;
  const sweep = Math.min(150, 7 * Math.abs(M)) * Math.PI / 180;
  if (sweep < 0.05) return;
  const a0 = -Math.PI / 2, a1 = a0 + (cw ? sweep : -sweep);
  const headA = Math.min(sweep * 0.6, 10 / R);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.2; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(x, y, R, a0, a1 + (cw ? -headA : headA), !cw); ctx.stroke();
  const ex = x + R * Math.cos(a1), ey = y + R * Math.sin(a1);
  const tx = (cw ? -1 : 1) * Math.sin(a1), ty = (cw ? 1 : -1) * Math.cos(a1);
  const bx = ex - tx * 10, by = ey - ty * 10;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(bx - ty * 5, by + tx * 5); ctx.lineTo(bx + ty * 5, by - tx * 5); ctx.closePath(); ctx.fill();
}

/* =====================================================================
   Käyttöliittymä
   ===================================================================== */
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.6v10.8l9-5.4z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/><rect x="9.3" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/></svg>';
const playBtn = document.getElementById('play');
function paintPlay() { playBtn.innerHTML = S.playing ? ICON_PAUSE + 'Tauko' : ICON_PLAY + 'Käynnistä'; }
playBtn.addEventListener('click', () => { if (S.out) resetMotion(); S.playing = !S.playing; paintPlay(); });
document.getElementById('reset').addEventListener('click', () => { resetMotion(); S.playing = false; paintPlay(); });
bindRange('F', (x) => fmt(x, 0) + NBSP + 'N', (x) => { S.F = x; });
bindRange('m', (x) => fmt(x, 1) + NBSP + 'kg', (x) => { S.m = x; });
bindRange('r', (x) => fmt(x, 2) + NBSP + 'm', (x) => { S.r = x; resetMotion(); });
for (const [id, key] of [['showMom', 'mom'], ['showForces', 'forces'], ['showVel', 'vel'], ['showVal', 'val']]) {
  const el = document.getElementById(id);
  S.show[key] = el.checked;
  el.addEventListener('change', () => { S.show[key] = el.checked; });
}

/* raahaus: kärki siirtää vaikutuspistettä pyörän sisällä, kanta kääntää voiman suuntaa */
const pos = (e) => view.pt(e);
function handles() {
  const R = S.r * L.s, cx = L.x0 + S.x * L.s, cy = L.ground - R, u = unit();
  const A = { x: cx + S.An.x * R, y: cy - S.An.y * R }, hd = Math.max(S.F * L.kF, L.fs * 2.4);
  return { A, tail: { x: A.x - u.x * hd, y: A.y + u.y * hd }, cx, cy, R };
}
function hit(p) {
  const h = handles();
  const dA = Math.hypot(p.x - h.A.x, p.y - h.A.y), dT = Math.hypot(p.x - h.tail.x, p.y - h.tail.y);
  if (dA < 16 && dA <= dT) return 'tip';
  if (dT < 16) return 'tail';
  return null;
}
cv.addEventListener('pointerdown', (e) => {
  const h = hit(pos(e));
  if (!h) return;
  S.drag = h; cv.setPointerCapture(e.pointerId); e.preventDefault();
});
cv.addEventListener('pointermove', (e) => {
  const p = pos(e), h = handles();
  if (S.drag === 'tip') {                       // vaikutuspiste pysyy pyörän sisällä
    let nx = (p.x - h.cx) / h.R, ny = (h.cy - p.y) / h.R, n = Math.hypot(nx, ny);
    if (n > 1) { nx /= n; ny /= n; }
    S.An = { x: Math.round(nx * 20) / 20, y: Math.round(ny * 20) / 20 };
    return;
  }
  if (S.drag === 'tail') {                      // suunta kannasta kärkeen 5° välein
    const ang = Math.atan2(-(h.A.y - p.y), h.A.x - p.x);
    S.phi = Math.round(ang / (Math.PI / 36)) * (Math.PI / 36);
    return;
  }
  S.hover = hit(p);
  cv.style.cursor = S.hover ? 'grab' : 'default';
});
const endDrag = () => { S.drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

paintPlay();
startLoop({ dt: 1 / 240, step: (dt) => step(dt / 3), draw, running: () => S.playing });
})();
</script>
</body>
