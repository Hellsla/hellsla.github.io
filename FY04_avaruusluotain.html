<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaruusluotain – Newtonin 1. laki</title>
<style>
  :root{
    --ink:#222;
    --space:#07101f;
    --blue:#69b8da;
    --orange:#f28c28;
    --yellow:#ffd95a;
  }
  html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
  .wrap{width:100%;max-width:1280px;margin:0 auto;padding:12px;box-sizing:border-box}
  .sim{position:relative;width:100%;aspect-ratio:16/9;min-height:330px;overflow:hidden;background:var(--space);border:1px solid #1d293b}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{min-width:46px;min-height:44px;border:1.6px solid #3f3d39;background:#fff;color:#222;border-radius:9px;font-size:20px;line-height:1;cursor:pointer}
  button.active{background:#f3f3f3}
  button:focus-visible{outline:3px solid #9ec8d8;outline-offset:2px}
  .reset{font-size:15px;padding:0 14px;min-width:auto}
  .readout{font-size:15px;white-space:nowrap;margin-left:4px}
  .hint{font-size:13px;color:#666;text-align:center;margin-top:6px}
  @media(max-width:480px){
    .sim{min-height:260px}
    .readout{width:100%;text-align:center;margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap" id="probe-newton1-small">
  <div class="sim" aria-label="Avaruusluotaimen liikesimulaatio">
    <svg viewBox="0 0 960 540" role="img" aria-label="Pieni avaruusluotain ja näkyvät ohjausmoottorit">
      <defs>
        <pattern id="solarGridSmall" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#244f78"/>
          <path d="M10 0H0V10" fill="none" stroke="#85a7c2" stroke-width="0.8" opacity=".75"/>
        </pattern>
        <radialGradient id="nebulaSmall" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#314a78" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#07101f" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="960" height="540" fill="#07101f"/>
      <ellipse cx="735" cy="145" rx="245" ry="150" fill="url(#nebulaSmall)"/>
      <ellipse cx="185" cy="410" rx="190" ry="115" fill="url(#nebulaSmall)" opacity=".45"/>

      <g fill="#fff" opacity=".9">
        <circle cx="46" cy="44" r="1.5"/><circle cx="88" cy="106" r="1"/><circle cx="130" cy="62" r="2"/><circle cx="176" cy="155" r="1.2"/>
        <circle cx="222" cy="92" r="1.1"/><circle cx="272" cy="39" r="1.5"/><circle cx="318" cy="128" r="1.8"/><circle cx="366" cy="76" r="1"/>
        <circle cx="415" cy="174" r="1.2"/><circle cx="462" cy="52" r="1.3"/><circle cx="510" cy="118" r="2"/><circle cx="556" cy="28" r="1"/>
        <circle cx="604" cy="166" r="1.4"/><circle cx="652" cy="84" r="1.1"/><circle cx="702" cy="42" r="1.7"/><circle cx="748" cy="130" r="1.2"/>
        <circle cx="798" cy="62" r="2"/><circle cx="844" cy="152" r="1"/><circle cx="902" cy="90" r="1.5"/><circle cx="934" cy="35" r="1"/>
        <circle cx="66" cy="238" r="1"/><circle cx="116" cy="302" r="1.6"/><circle cx="164" cy="220" r="1.2"/><circle cx="214" cy="352" r="1"/>
        <circle cx="258" cy="274" r="1.8"/><circle cx="306" cy="330" r="1.1"/><circle cx="354" cy="242" r="1.2"/><circle cx="402" cy="390" r="1.5"/>
        <circle cx="452" cy="312" r="1"/><circle cx="504" cy="224" r="1.6"/><circle cx="552" cy="364" r="1.1"/><circle cx="602" cy="286" r="1.9"/>
        <circle cx="652" cy="414" r="1"/><circle cx="704" cy="238" r="1.2"/><circle cx="754" cy="344" r="1.4"/><circle cx="806" cy="274" r="1"/>
        <circle cx="856" cy="402" r="1.7"/><circle cx="918" cy="312" r="1.2"/><circle cx="40" cy="470" r="1.4"/><circle cx="156" cy="446" r="1.8"/>
        <circle cx="330" cy="456" r="1"/><circle cx="522" cy="462" r="1.1"/><circle cx="714" cy="470" r="1"/><circle cx="902" cy="458" r="1.2"/>
      </g>

      <path id="trailSmall" d="" fill="none" stroke="#b8c8df" stroke-width="1.4" stroke-dasharray="5 7" opacity=".65"/>

      <g id="probeSmall" transform="translate(480 285) scale(.72)">
        <g id="flameRightSmall" visibility="hidden">
          <path d="M-72,-9 C-100,-5 -112,0 -101,7 C-92,13 -82,11 -72,7 C-83,2 -83,-3 -72,-9Z" fill="#f28c28" stroke="#fff" stroke-width="1.5"/>
          <path d="M-75,-5 C-92,-3 -97,0 -91,4 C-86,7 -80,6 -75,4Z" fill="#ffd95a"/>
        </g>
        <g id="flameLeftSmall" visibility="hidden">
          <path d="M72,-9 C100,-5 112,0 101,7 C92,13 82,11 72,7 C83,2 83,-3 72,-9Z" fill="#f28c28" stroke="#fff" stroke-width="1.5"/>
          <path d="M75,-5 C92,-3 97,0 91,4 C86,7 80,6 75,4Z" fill="#ffd95a"/>
        </g>
        <g id="flameDownSmall" visibility="hidden">
          <path d="M-8,-64 C-4,-91 2,-102 8,-90 C13,-79 11,-71 6,-64 C3,-75 -2,-75 -8,-64Z" fill="#f28c28" stroke="#fff" stroke-width="1.5"/>
          <path d="M-3,-66 C-1,-82 3,-87 5,-80 C7,-75 6,-70 3,-66Z" fill="#ffd95a"/>
        </g>
        <g id="flameUpSmall" visibility="hidden">
          <path d="M-8,64 C-4,91 2,102 8,90 C13,79 11,71 6,64 C3,75 -2,75 -8,64Z" fill="#f28c28" stroke="#fff" stroke-width="1.5"/>
          <path d="M-3,66 C-1,82 3,87 5,80 C7,75 6,70 3,66Z" fill="#ffd95a"/>
        </g>

        <line x1="-35" y1="0" x2="-67" y2="0" stroke="#d9d9d9" stroke-width="4"/>
        <line x1="35" y1="0" x2="67" y2="0" stroke="#d9d9d9" stroke-width="4"/>

        <rect x="-122" y="-23" width="55" height="46" rx="2" fill="url(#solarGridSmall)" stroke="#d9d9d9" stroke-width="2.5"/>
        <rect x="67" y="-23" width="55" height="46" rx="2" fill="url(#solarGridSmall)" stroke="#d9d9d9" stroke-width="2.5"/>

        <rect x="-35" y="-29" width="70" height="58" rx="5" fill="#ecebe6" stroke="#222" stroke-width="3"/>
        <path d="M-29,-20 H29 M-29,0 H29 M-29,20 H29 M-13,-25 V25 M13,-25 V25" stroke="#8b8b87" stroke-width="1" opacity=".45"/>

        <path d="M-36,-12 L-53,-10 L-62,0 L-53,10 L-36,12Z" fill="#9ba0a4" stroke="#161616" stroke-width="2.8"/>
        <rect x="-69" y="-8" width="10" height="16" rx="2" fill="#3c4145" stroke="#111" stroke-width="2.2"/>
        <ellipse cx="-69" cy="0" rx="3.5" ry="6" fill="#111"/>

        <path d="M36,-12 L53,-10 L62,0 L53,10 L36,12Z" fill="#9ba0a4" stroke="#161616" stroke-width="2.8"/>
        <rect x="59" y="-8" width="10" height="16" rx="2" fill="#3c4145" stroke="#111" stroke-width="2.2"/>
        <ellipse cx="69" cy="0" rx="3.5" ry="6" fill="#111"/>

        <path d="M-12,-30 L12,-30 L10,-47 L-10,-47Z" fill="#9ba0a4" stroke="#161616" stroke-width="2.8"/>
        <rect x="-7" y="-56" width="14" height="10" rx="2" fill="#3c4145" stroke="#111" stroke-width="2.2"/>
        <ellipse cx="0" cy="-56" rx="5.5" ry="3.4" fill="#111"/>

        <path d="M-12,30 L12,30 L10,47 L-10,47Z" fill="#9ba0a4" stroke="#161616" stroke-width="2.8"/>
        <rect x="-7" y="46" width="14" height="10" rx="2" fill="#3c4145" stroke="#111" stroke-width="2.2"/>
        <ellipse cx="0" cy="56" rx="5.5" ry="3.4" fill="#111"/>

        <line x1="0" y1="-29" x2="0" y2="-53" stroke="#d7d7d7" stroke-width="3.5"/>
        <path d="M-24,-61 Q0,-42 24,-61 Q19,-82 0,-86 Q-19,-82 -24,-61Z" fill="#f5f5f2" stroke="#222" stroke-width="2.8"/>
        <line x1="0" y1="-61" x2="0" y2="-76" stroke="#222" stroke-width="1.8"/>
        <circle cx="0" cy="-78" r="3.5" fill="#222"/>

        <rect x="17" y="-9" width="14" height="18" rx="2" fill="#646a6f" stroke="#222" stroke-width="2"/>
        <circle cx="24" cy="0" r="4" fill="#9fd7e6" stroke="#222" stroke-width="1.4"/>
      </g>

      <g opacity=".95">
        <line id="vLineSmall" x1="0" y1="0" x2="0" y2="0" stroke="#69b8da" stroke-width="3"/>
        <path id="vHeadSmall" d="" fill="#69b8da"/>
      </g>
    </svg>
  </div>

  <div class="controls" aria-label="Ohjaus">
    <button type="button" data-thrust="left" aria-label="Liiku vasemmalle">←</button>
    <button type="button" data-thrust="up" aria-label="Liiku ylös">↑</button>
    <button type="button" data-thrust="down" aria-label="Liiku alas">↓</button>
    <button type="button" data-thrust="right" aria-label="Liiku oikealle">→</button>
    <button type="button" id="resetSmall" class="reset">Nollaa</button>
    <span id="speedSmall" class="readout" aria-live="polite">v = 0,0 m/s</span>
  </div>
  <div class="hint">Nuolinäppäimet = moottorit</div>
</div>

<script>
(() => {
  const root=document.getElementById('probe-newton1-small');
  const probe=root.querySelector('#probeSmall');
  const trail=root.querySelector('#trailSmall');
  const speed=root.querySelector('#speedSmall');
  const vLine=root.querySelector('#vLineSmall');
  const vHead=root.querySelector('#vHeadSmall');
  const reset=root.querySelector('#resetSmall');
  const buttons=[...root.querySelectorAll('[data-thrust]')];
  const flames={
    right:root.querySelector('#flameRightSmall'),
    left:root.querySelector('#flameLeftSmall'),
    down:root.querySelector('#flameDownSmall'),
    up:root.querySelector('#flameUpSmall')
  };
  const W=960,H=540,thrust=48,marginX=105,marginY=92;
  const s={x:480,y:285,vx:0,vy:0,ax:0,ay:0,last:performance.now(),trail:[],active:new Set()};

  function setThrust(dir,on){
    on?s.active.add(dir):s.active.delete(dir);
    buttons.forEach(b=>b.classList.toggle('active',s.active.has(b.dataset.thrust)));
    Object.entries(flames).forEach(([k,n])=>n.setAttribute('visibility',s.active.has(k)?'visible':'hidden'));
  }
  function acceleration(){
    s.ax=(s.active.has('right')?thrust:0)-(s.active.has('left')?thrust:0);
    s.ay=(s.active.has('down')?thrust:0)-(s.active.has('up')?thrust:0);
  }
  function velocityArrow(){
    const scale=.8,ex=s.x+s.vx*scale,ey=s.y+s.vy*scale;
    vLine.setAttribute('x1',s.x);vLine.setAttribute('y1',s.y);vLine.setAttribute('x2',ex);vLine.setAttribute('y2',ey);
    const m=Math.hypot(s.vx,s.vy);
    if(m<1){vHead.setAttribute('d','');return;}
    const ux=s.vx/m,uy=s.vy/m,px=-uy,py=ux,bx=ex-ux*12,by=ey-uy*12;
    vHead.setAttribute('d',`M ${ex} ${ey} L ${bx+px*6} ${by+py*6} L ${bx-px*6} ${by-py*6} Z`);
  }
  function render(){
    probe.setAttribute('transform',`translate(${s.x.toFixed(2)} ${s.y.toFixed(2)}) scale(.72)`);
    speed.textContent=`v = ${Math.hypot(s.vx,s.vy).toFixed(1).replace('.',',')} m/s`;
    velocityArrow();
    trail.setAttribute('d',s.trail.length>1?'M '+s.trail.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L '):'');
  }
  function step(now){
    const dt=Math.min((now-s.last)/1000,.035);s.last=now;
    acceleration();s.vx+=s.ax*dt;s.vy+=s.ay*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x<marginX){s.x=marginX;s.vx=Math.abs(s.vx)}
    if(s.x>W-marginX){s.x=W-marginX;s.vx=-Math.abs(s.vx)}
    if(s.y<marginY){s.y=marginY;s.vy=Math.abs(s.vy)}
    if(s.y>H-marginY){s.y=H-marginY;s.vy=-Math.abs(s.vy)}
    if(!s.trail.length||Math.hypot(s.x-s.trail.at(-1)[0],s.y-s.trail.at(-1)[1])>8){
      s.trail.push([s.x,s.y]);if(s.trail.length>90)s.trail.shift()
    }
    render();requestAnimationFrame(step);
  }
  const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  root.tabIndex=0;
  root.addEventListener('keydown',e=>{if(!keys[e.key])return;e.preventDefault();setThrust(keys[e.key],true)});
  root.addEventListener('keyup',e=>{if(!keys[e.key])return;e.preventDefault();setThrust(keys[e.key],false)});
  root.addEventListener('blur',()=>[...s.active].forEach(d=>setThrust(d,false)));
  buttons.forEach(b=>{
    const d=b.dataset.thrust,stop=()=>setThrust(d,false);
    b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);setThrust(d,true);root.focus()});
    b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
  });
  reset.addEventListener('click',()=>{s.x=480;s.y=285;s.vx=0;s.vy=0;s.ax=0;s.ay=0;s.trail=[];[...s.active].forEach(d=>setThrust(d,false));render();root.focus()});
  render();requestAnimationFrame(step);
})();
</script>
</body>
</html>
