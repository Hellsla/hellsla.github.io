<svg viewBox="0 0 600 360" role="img" aria-label="Kaavakuva kahdesta värähtelijästä. Vasemmalla punnus riippuu jousesta. Täytenä piirretty punnus on tasapainoasemassa, jonka kohdalla on vaakasuora katkoviiva x = 0, ja katkoviivoin piirretyt punnukset ovat ylimmässä ja alimmassa asemassa. Tasapainoasemasta kumpaankin ääriasemaan on yhtä pitkä nuoli, jonka merkintä on A. Pystysuora akseli x osoittaa ylöspäin. Oikealla heiluri: punnus riippuu langasta, ja tasapainoasemassa lanka on pystysuorassa katkoviivan x = 0 kohdalla. Katkoviivoin piirretyt punnukset ovat ääriasemissa vasemmalla ja oikealla, ja tasapainoasemasta kumpaankin on vaakasuora nuoli A." class="fig-anim" style="max-width:100%;font-size:24px">
