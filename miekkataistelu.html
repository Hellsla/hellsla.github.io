<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miekkainsultti — Suomalainen Miekkataistelu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* ── GAME SHELL ── */
    #game {
      width: min(800px, 100vw);
      height: min(600px, 75vw);
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* ── SCENE (top ~62%) ── */
    #scene {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 62%;
      overflow: hidden;
    }

    #sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 100% at 25% 0%,
        #0f2460 0%, #081440 25%, #040c28 55%, #020818 80%, #000510 100%);
    }

    /* tree + ground silhouette */
    #landscape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* position pips */
    #pos-bar {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: clamp(3px, 0.6vw, 6px);
      z-index: 5;
    }
    .pip {
      width: clamp(12px, 2.4vw, 20px);
      height: clamp(6px, 1.2vw, 10px);
      background: #0a1030;
      border: 1px solid #1a3080;
      transition: background 0.25s;
    }
    .pip.won   { background: #2255cc; }
    .pip.cur   { background: #fff; border-radius: 50%;
                 width: clamp(8px, 1.6vw, 14px); height: clamp(8px, 1.6vw, 14px); }

    /* ── FIGHTERS (move left/right as one unit) ── */
    #fighters-wrap {
      position: absolute;
      /* height and bottom set so characters stand on the ground line */
      bottom: 16%;
      width: 68%;
      height: 75%;
      transition: left 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    #fighters-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* individual character shake/advance */
    #p-char, #e-char {
      transition: transform 0.05s;
    }

    @keyframes p-advance {
      0%  { transform: translateX(0); }
      35% { transform: translateX(6px); }
      100%{ transform: translateX(0); }
    }
    @keyframes p-retreat {
      0%  { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      55% { transform: translateX(5px); }
      80% { transform: translateX(-3px); }
      100%{ transform: translateX(0); }
    }
    @keyframes e-retreat {
      0%  { transform: translateX(0); }
      35% { transform: translateX(-6px); }
      100%{ transform: translateX(0); }
    }
    @keyframes e-advance {
      0%  { transform: translateX(0); }
      20% { transform: translateX(10px); }
      55% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
      100%{ transform: translateX(0); }
    }
    .p-adv { animation: p-advance 0.5s ease forwards; }
    .p-ret { animation: p-retreat 0.45s ease forwards; }
    .e-ret { animation: e-retreat 0.5s ease forwards; }
    .e-adv { animation: e-advance 0.45s ease forwards; }

    /* sword clash spark */
    #clash-spark {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }
    #clash-spark.show { opacity: 1; animation: spark-fade 0.45s ease forwards; }
    @keyframes spark-fade {
      0%  { opacity: 1; transform: scale(1); }
      60% { opacity: 0.8; transform: scale(1.3); }
      100%{ opacity: 0; transform: scale(0.5); }
    }

    /* ── DIALOG BOX (bottom 38%) ── */
    #dialog {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 38%;
      background: #000814;
      border-top: 3px solid #1a2d80;
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 1.2vw, 14px) clamp(10px, 2vw, 22px);
      gap: clamp(4px, 0.8vw, 8px);
    }

    #insult-text {
      font-family: 'Special Elite', serif;
      font-size: clamp(8px, 1.45vw, 13px);
      color: #dde8ff;
      line-height: 1.6;
      font-style: italic;
      border-bottom: 1px solid #1a2560;
      padding-bottom: clamp(4px, 0.7vw, 7px);
      flex-shrink: 0;
    }

    #options {
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 4px);
      flex: 1;
      overflow: hidden;
    }

    .opt {
      font-family: 'Special Elite', serif;
      font-size: clamp(7px, 1.25vw, 11px);
      color: #88aadd;
      background: transparent;
      border: none;
      text-align: left;
      padding: clamp(2px, 0.4vw, 4px) 0;
      cursor: pointer;
      line-height: 1.5;
      transition: color 0.12s;
      flex-shrink: 0;
    }
    .opt:hover:not(:disabled) { color: #ffffff; }
    .opt.correct { color: #44ee88; }
    .opt.wrong   { color: #ee4422; }

    #status {
      font-family: 'VT323', monospace;
      font-size: clamp(10px, 2vw, 18px);
      color: #6677aa;
      text-align: center;
      min-height: 1.4em;
      letter-spacing: 1px;
    }

    /* ── OVERLAY ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 5, 20, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 26px);
      z-index: 30;
      padding: 20px;
      text-align: center;
    }

    #ov-title {
      font-family: 'VT323', monospace;
      font-size: clamp(18px, 4vw, 40px);
      color: #ffdd44;
      letter-spacing: 3px;
      text-shadow: 3px 3px #000, 0 0 20px #ff880044;
    }

    #ov-sub {
      font-family: 'Special Elite', serif;
      font-size: clamp(9px, 1.6vw, 15px);
      color: #7788aa;
      max-width: 72%;
      line-height: 1.9;
    }

    #ov-btn {
      font-family: 'VT323', monospace;
      font-size: clamp(14px, 2.8vw, 26px);
      letter-spacing: 2px;
      background: transparent;
      color: #ffdd44;
      border: 2px solid #ffdd44;
      padding: clamp(6px, 1.2vw, 12px) clamp(18px, 3.5vw, 36px);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    #ov-btn:hover { background: #ffdd44; color: #000; }
  </style>
</head>
<body>

    <!-- position pips -->

    <!-- moon -->

      position:absolute; top:8%; right:16%;

          <rect x="18" y="77"  width="32" height="6"  fill="#5a2e10"/>

          <!-- determined brow -->
          <rect x="24" y="25"  width="6" height="2" fill="#a07010"/>

          <rect x="27" y="40"  width="10" height="2" fill="#c07050"/>

        <!-- ─── SWORD CLASH SPARK (at ~x=155,y=62) ─── -->

  <!-- ── DIALOG BOX ── -->

    <div id="insult-text">...</div>
    <div id="options">
      <button class="opt" id="opt0" onclick="choose(0)"></button>
      <button class="opt" id="opt1" onclick="choose(1)"></button>
      <button class="opt" id="opt2" onclick="choose(2)"></button>

  <!-- ── OVERLAY ── -->

    <div id="ov-title">⚔ MIEKKAINSULTTI ⚔</div>

      Vihollinen heittää loukkauksia.<br>
      Valitse paras vastaisku — se joka todella osuu!<br>
      Oikea vastaus → etenet.<br>
      Väärä vastaus → vihollinen etenee.
    </div>
    <button id="ov-btn" onclick="startGame()">ALOITA TAISTELU!</button>
  </div>

</div><!-- end #game -->

<script>
const duels = [
  {
    insult: '"Aina koski kohinassa ja aina tyhmä tohinassa."',
    correct: '"Hullu huutaa, viisas kuulee vähemmänkin."',
    wrong: [
      '"Koski on voimallinen — ota se kehuna!"',
      '"Tohinassani on tarmoa, etkä voi sitä kieltää!"'
    ]
  },
  {
    insult: '"Helppo tyhmä narrata."',
    correct: '"Hullu vipuun käy, viisas viuhtoo sivutse."',
    wrong: [
      '"En ole tyhmä — olen erikoislaatuisen analyyttinen!"',
      '"Narraaminen on häpeällinen tapa, kasvata tapasi ensin!"'
    ]
  },
  {
    insult: '"Joka kuuseen kurkottaa, se katajaan kapsahtaa."',
    correct: '"Paree kumartaa kuin kurottaa."',
    wrong: [
      '"Minä kurkottelen kuusen latvaan ja pidän siellä kotini!"',
      '"Kataja on arvokas kasvi enkä häpeä siihen kapsahtamista!"'
    ]
  },
  {
    insult: '"Ei haukkuva koira jänestä saa."',
    correct: '"Ei haukkuva koira pure."',
    wrong: [
      '"Minä en hauku enkä myöskään jäniksiä tarvitse!"',
      '"Jänikset ovat nopeita — asia erikseen, minä olen nopeampi!"'
    ]
  },
  {
    insult: '"Ahne ottaa rahat ja vie vielä kukkaronki."',
    correct: '"Ahneella on paskanen loppu."',
    wrong: [
      '"Minä en ole ahne — olen vain tarkka taloudenpitäjä!"',
      '"Kukkaroni pysyy minulla, se on lakiin kirjattu!"'
    ]
  },
  {
    insult: '"Laiska tyäs huomiseen lykkää."',
    correct: '"Ahkera kaikki voittaa."',
    wrong: [
      '"Huominen on uusi päivä — silloin on enemmän energiaa!"',
      '"Lykkääminen on viisautta, ajattele se strategiana!"'
    ]
  }
];

const MAX_POS = 8;
let queue = [], qIdx = 0, pos = 4, locked = false;
let opts = [], correctIdx = 0;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

/* ── START ── */
function startGame() {
  queue = shuffle(duels);
  qIdx = 0; pos = 4; locked = false;
  document.getElementById('overlay').style.display = 'none';
  buildPips();
  placeFighters();
  loadDuel();
}

/* ── POSITION PIPS ── */
function buildPips() {
  const bar = document.getElementById('pos-bar');
  bar.innerHTML = '';
  for (let i = 0; i <= MAX_POS; i++) {
    const d = document.createElement('div');
    d.className = 'pip'; d.id = 'pip' + i;
    bar.appendChild(d);
  }
  refreshPips();
}

function refreshPips() {
  for (let i = 0; i <= MAX_POS; i++) {
    const d = document.getElementById('pip' + i);
    if (!d) continue;
    d.className = 'pip';
    if (i < pos)  d.classList.add('won');
    if (i === pos) d.classList.add('cur');
  }
}

/* ── FIGHTER POSITION ── */
// fighters-wrap is 68% wide; left ranges 0 → 32%
// at pos=4 (center): left = 16% (centres the 68% div)
function placeFighters(animate) {
  const fw = document.getElementById('fighters-wrap');
  const leftPct = (pos / MAX_POS) * 32;
  fw.style.left = leftPct + '%';
}

/* ── LOAD DUEL ── */
function loadDuel() {
  const d = queue[qIdx % queue.length];
  opts = shuffle([
    { t: d.correct, ok: true },
    { t: d.wrong[0], ok: false },
    { t: d.wrong[1], ok: false }
  ]);
  correctIdx = opts.findIndex(o => o.ok);

  document.getElementById('insult-text').textContent = d.insult;
  document.getElementById('status').textContent = '';

  ['opt0','opt1','opt2'].forEach((id, i) => {
    const b = document.getElementById(id);
    b.textContent = i + 1 + '.  ' + opts[i].t;
    b.className = 'opt';
    b.disabled = false;
  });
  locked = false;
}

/* ── CHOICE ── */
function choose(i) {
  if (locked) return;
  locked = true;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);

  const won = opts[i].ok;
  document.getElementById('opt' + i).classList.add(won ? 'correct' : 'wrong');
  if (!won) document.getElementById('opt' + correctIdx).classList.add('correct');

  showSpark(won);

  if (won) {
    pos = Math.min(MAX_POS, pos + 1);
    document.getElementById('status').textContent = '— HYVIN SANOTTU! Vihollinen perääntyy! —';
    anim('p-char', 'p-adv');
    anim('e-char', 'e-ret');
  } else {
    pos = Math.max(0, pos - 1);
    document.getElementById('status').textContent = '— VÄÄRIN! Vihollinen etenee naureskellen! —';
    anim('p-char', 'p-ret');
    anim('e-char', 'e-adv');
  }

  refreshPips();
  setTimeout(placeFighters, 200);

  setTimeout(() => {
    if (pos >= MAX_POS) return endGame(true);
    if (pos <= 0)       return endGame(false);
    qIdx++;
    if (qIdx >= queue.length) { queue = shuffle(duels); qIdx = 0; }
    loadDuel();
  }, 2100);
}

function anim(id, cls) {
  const el = document.getElementById(id);
  el.classList.remove('p-adv','p-ret','e-ret','e-adv');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 550);
}

function showSpark(won) {
  const sp = document.getElementById('clash-spark');
  sp.style.opacity = '0';
  void sp.offsetWidth;
  // colour: gold for win, red-ish for lose
  const lines = sp.querySelectorAll('line');
  lines.forEach(l => l.setAttribute('stroke', won ? '#ffee00' : '#ff8800'));
  sp.querySelector('circle').setAttribute('fill', won ? '#ffff88' : '#ffaa44');
  // trigger anim
  sp.style.animation = 'none';
  void sp.offsetWidth;
  sp.style.animation = '';
  sp.style.opacity = '1';
  setTimeout(() => sp.style.opacity = '0', 400);
}

/* ── END GAME ── */
function endGame(won) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  document.getElementById('ov-title').textContent = won ? '⚔ VOITTO!' : '💀 TAPPIO!';
  document.getElementById('ov-sub').textContent = won
    ? 'Olet karkoittanut vihollisen! Suomen miekkainsulttikilpailun mestari!'
    : 'Olet hävinnyt! Harjoittele sanontoja enemmän ennen seuraavaa kohtaamista...';
  document.getElementById('ov-btn').textContent = 'UUSI TAISTELU!';
}

/* ── STARS ── */
window.addEventListener('load', () => {
  const sky = document.getElementById('sky');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    const big = Math.random() < 0.12;
    const sz = big ? (Math.random() * 1.5 + 2) : (Math.random() * 1.2 + 0.4);
    s.style.cssText = `
      position:absolute; border-radius:50%;
      width:${sz}px; height:${sz}px; background:#fff;
      top:${Math.random() * 68}%; left:${Math.random() * 100}%;
      opacity:${big ? 0.7 + Math.random()*0.3 : 0.3 + Math.random()*0.5};
      ${big ? 'box-shadow:0 0 3px #fff8;' : ''}
    `;
    sky.parentElement.insertBefore(s, sky.nextSibling);
  }
});
</script>
