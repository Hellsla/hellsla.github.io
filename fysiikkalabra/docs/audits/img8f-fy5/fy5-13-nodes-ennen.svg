<svg viewBox="0 0 600 338" role="img" aria-label="Kaavakuva seisovasta aallosta, ei mittakaavassa. Sininen yhtenäinen viiva on narun muoto yhdellä hetkellä ja sininen katkoviiva puolen jaksonajan päästä; vaalea alue niiden välissä on alue, jossa naru liikkuu. Mustat pisteet S ovat solmuja, joissa naru ei liiku. Niiden puolivälissä ovat kuvut K, joissa liike on suurin. Kahden vierekkäisen solmun etäisyys on merkitty puoleksi aallonpituudeksi ja solmun etäisyys viereisestä kuvusta neljännekseksi aallonpituudesta." style="max-width:100%;font-size:24px">
