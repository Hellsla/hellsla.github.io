     "html": "<p class=\"task\">Vetyatomin siirtymät, jotka päättyvät perustilaan <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow></semantics></math></span>,</span> muodostavat Lymanin sarjan. Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>.</span> Laske sarjan pisin aallonpituus nanometreinä (⁠<span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>626</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup> <mtext>J</mtext> <mtext>s</mtext></mrow></semantics></math></span>⁠, <span class=\"math-glue\"><span><math><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>998</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> <span><math><semantics><mrow><mn>1</mn> <mtext>eV</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>602</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup> <mtext>J</mtext></mrow></semantics></math></span>⁠).</p>",
     "answer": "<span><math><semantics><mrow><mn>122</mn> <mtext>nm</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy8-3-L1-08",
     "number": "3-8",
     "level": 1,
     "html": "<p class=\"task\">Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>.</span> Tasolla <span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>2</mn></mrow></semantics></math></span> oleva vetyatomi absorboi fotonin ja virittyy tasolle <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>4</mn></mrow></semantics></math></span>.</span> Kuinka suuri on absorboituneen fotonin energia elektronivoltteina?</p>",

    },
    {
     "id": "fy8-3-L2-01",
     "number": "3-9",
     "level": 2,
     "html": "<p class=\"task\">Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>.</span> Vetyatomin elektroni siirtyy tasolta <span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>5</mn></mrow></semantics></math></span> tasolle <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>2</mn></mrow></semantics></math></span>.</span> Laske syntyvän valon aallonpituus nanometreinä (⁠<span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>626</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup> <mtext>J</mtext> <mtext>s</mtext></mrow></semantics></math></span>⁠, <span class=\"math-glue\"><span><math><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>998</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> <span><math><semantics><mrow><mn>1</mn> <mtext>eV</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>602</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup> <mtext>J</mtext></mrow></semantics></math></span>⁠).</p>",
     "answer": "<span><math><semantics><mrow><mn>434</mn> <mtext>nm</mtext></mrow></semantics></math></span>"

    {
     "id": "fy8-3-L2-02",
     "number": "3-10",
     "level": 2,
     "html": "<p class=\"task\">Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>.</span> Vedyn violetti spektriviiva, jonka aallonpituus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>410</mn> <mtext>nm</mtext></mrow></semantics></math></span>,</span> syntyy siirtymässä, joka päättyy tasolle <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>2</mn></mrow></semantics></math></span>.</span> Miltä tasolta siirtymä alkaa? Anna vastaukseksi tason järjestysluku <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi></mrow></semantics></math></span>.</span></p>",
     "answer": "<span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>6</mn></mrow></semantics></math></span>"
    },

     "id": "fy8-3-L2-03",

     "level": 2,

     "html": "<p class=\"task\">Taulukossa on neljä vedyn Balmerin sarjan viivaa. Jokainen viiva syntyy siirtymässä tasolta <span><math><semantics><mrow><mi>n</mi></mrow></semantics></math></span> tasolle <span class=\"math-glue\"><span><math><semantics><mrow><mn>2</mn></mrow></semantics></math></span>,</span> ja aallonpituuksien epävarmuus on <span class=\"math-glue\"><span><math><semantics><mrow><mo>±</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>nm</mtext></mrow></semantics></math></span>.</span> Merkitään vedyn ionisaatioenergiaa perustilasta <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mtext>ion</mtext></msub></mrow></semantics></math></span>,</span> jolloin <span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><msub><mi>E</mi><mtext>ion</mtext></msub><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span> ja fotonin taajuudelle pätee <span class=\"math-glue\"><span><math><semantics><mrow><mi>f</mi><mo>=</mo><mfrac><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>−</mo><msub><mi>E</mi><mn>2</mn></msub></mrow><mi>h</mi></mfrac></mrow></semantics></math></span>.</span></p><p class=\"task ask\">a) Laske viivojen taajuudet <span><math><semantics><mrow><mi>f</mi><mo>=</mo><mfrac><mi>c</mi><mi>λ</mi></mfrac></mrow></semantics></math></span> ja piirrä pisteistä kuvaaja, jossa <span><math><semantics><mrow><mi>f</mi></mrow></semantics></math></span> on <span class=\"math-glue\"><span><math><semantics><mrow><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>:</span>n funktio. Sovita pisteisiin suora.</p><p class=\"task ask\">b) Määritä sovitetun suoran kulmakerroin ja päättele sen avulla ionisaatioenergia <span><math><semantics><mrow><msub><mi>E</mi><mtext>ion</mtext></msub></mrow></semantics></math></span> elektronivoltteina. Perustele, miksi pisteiden pitäisi asettua suoralle.</p><p class=\"task more\">Vastaa laatikkoon kohdan b) tulos elektronivoltteina (⁠<span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>626</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup> <mtext>J</mtext> <mtext>s</mtext></mrow></semantics></math></span>⁠, <span class=\"math-glue\"><span><math><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>998</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> <span><math><semantics><mrow><mn>1</mn> <mtext>eV</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>602</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup> <mtext>J</mtext></mrow></semantics></math></span>⁠).</p><table class=\"exp-table ex-data\"><caption>Vedyn Balmerin viivat (esimerkkiaineisto)</caption><thead><tr><th scope=\"col\"><span><math><semantics><mrow><mi>n</mi></mrow></semantics></math></span></th><th scope=\"col\"><span><math><semantics><mrow><mi>λ</mi> <mo stretchy=\"false\">(</mo><mtext>nm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th></tr></thead><tbody><tr><td>3</td><td>656,7</td></tr><tr><td>4</td><td>486,1</td></tr><tr><td>5</td><td>434,5</td></tr><tr><td>6</td><td>410,2</td></tr></tbody></table>",

     "html": "<p class=\"task scenario\">Kuvassa on kuvitteellisen atomin energiatasokaavio. Atomi on perustilassa <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow></semantics></math></span>.</span> Atomiin lähetetään viisi eri aallonpituuden fotonia, ja taulukossa on niiden aallonpituudet. Atomi absorboi fotonin vain, jos fotonin energia vastaa jotakin perustilasta ylemmän tason erotusta <span class=\"math-glue\">(<span><math><semantics><mrow><mo>±</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>05</mn> <mtext>eV</mtext></mrow></semantics></math></span>).</span></p><p class=\"task ask\">Kuinka monta taulukon fotonia atomi absorboi?</p><p class=\"task more\">Laske fotonien energiat ja vertaa niitä kaaviosta luettuihin energiaeroihin. Vastaa laatikkoon absorboituvien fotonien lukumäärä (⁠<span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>626</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup> <mtext>J</mtext> <mtext>s</mtext></mrow></semantics></math></span>⁠, <span class=\"math-glue\"><span><math><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>998</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> <span><math><semantics><mrow><mn>1</mn> <mtext>eV</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>602</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup> <mtext>J</mtext></mrow></semantics></math></span>⁠).</p><table class=\"exp-table ex-data\"><caption>Atomiin lähetetyt fotonit (esimerkkiaineisto)</caption><thead><tr><th scope=\"col\">Fotoni</th><th scope=\"col\"><span><math><semantics><mrow><mi>λ</mi> <mo stretchy=\"false\">(</mo><mtext>nm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math>      "html": "<p class=\"task\">Oppilas ratkaisee tehtävän: ”Vetyatomin elektroni siirtyy tasolta <span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>5</mn></mrow></semantics></math></span> perustilaan. Radalla <span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>5</mn></mrow></semantics></math></span> elektroni on <span><math><semantics><mrow><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><mn>25</mn></mrow></semantics></math></span> kertaa kauempana ytimestä kuin perustilassa, joten syntyvän fotonin energia on <span><math><semantics><mrow><mn>25</mn></mrow></semantics></math></span> kertaa perustilan ionisaatioenergia <span><math><semantics><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow></semantics></math></span> eli <span class=\"math-glue\"><span><math><semantics><mrow><mn>340</mn> <mtext>eV</mtext></mrow></semantics></math></span>.</span>” Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>.</span></p><p class=\"task ask\">a) Selitä, mikä oppilaan päättelyssä on virheellistä.</p><p class=\"task ask\">b) Laske fotonin energia oikein.</p><p class=\"task more\">Vastaa laatikkoon kohdan b) tulos elektronivoltteina.</p>",

lass=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mtext>k</mtext></msub><mo>=</mo><mstyle><mfrac><msubsup><mi>p</mi><mtext>e</mtext><mn>2</mn></msubsup><mrow><mn>2</mn><msub><mi>m</mi><mtext>e</mtext></msub></mrow></mfrac></mstyle></mrow></semantics></math></span>,</span> missä <span><math><semantics><mrow><msub><mi>m</mi><mtext>e</mtext></msub><mo>=</mo><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>109</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>31</mn></mrow></msup> <mtext>kg</mtext></mrow></semantics></math></span>⁠, ja energian säilymisestä. Sopivatko tulokset yhteen?</p><p class=\"task more\">Anna b)-kohdan tulos vastauslaatikkoon yksikössä <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup> <mtext>kg</mtext><mo>⋅</mo><mtext>m/s</mtext></mrow></semantics></math></span>.</span></p><table class=\"exp-table ex-data\"><caption>Sironneen fotonin aallonpituus</caption><thead><tr><th scope=\"col\"><span><math><semantics><mrow><mi>θ</mi> <mo stretchy=\"false\">(</mo><msup><mrow></mrow><mo>∘</mo></msup><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th><th scope=\"col\"><span><math><semantics><mrow><msup><mi>λ</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup> <mo stretchy=\"false\">(</mo><mtext>nm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th></tr></thead><tbody><tr><td>60</td><td>0,07230</td></tr><tr><td>90</td><td>0,07353</td></tr><tr><td>120</td><td>0,07476</td></tr></tbody></table>",

     "level": 2,
     "html": "<p class=\"task\">Kuvassa on molemmista päistä kiinnitetyn kielen kolme ensimmäistä seisovaa aaltoa. Esimerkkiaineisto: kielen pituus on <span><math><semantics><mrow><mi>L</mi><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>80</mn> <mtext>m</mtext></mrow></semantics></math></span> ja aallon nopeus kielessä <span class=\"math-glue\"><span><math><semantics><mrow><mi>v</mi><mo>=</mo><mn>64</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span></p><p class=\"task ask\">a) Mikä on kunkin kuvan tilan aallonpituus <span class=\"math-glue\"><span><math><semantics><mrow><mi>λ</mi></mrow></semantics></math></span>?</span></p><p class=\"task ask\">b) Laske kunkin tilan taajuus <span class=\"math-glue\"><span><math><semantics><mrow><mi>f</mi></mrow></semantics></math></span>.</span></p><p class=\"task ask\">c) Perustele laskemiesi taajuuksien avulla, miksi tila, jossa on enemmän solmuja, vastaa suurempaa taajuutta, ja kerro, mitä tämä kertoo atomin elektronin tiloista.</p><p class=\"task more\">Anna b)-kohdan tulos vastauslaatikkoon sen tilan osalta, jossa on kaksi solmua.</p><img alt=\"Kaavakuva: molemmista päistä kiinnitetyn kielen kolme ensimmäistä seisovaa aaltoa. Ylimmässä kieli värähtelee yhtenä kupuna eikä sen keskellä ole solmua, keskimmäisessä on yksi solmu ja kaksi kupua, alimmassa kaksi solmua ja kolme kupua. Muita värähtelytapoja ei synny, koska kielen päät pysyvät paikallaan. Mitä enemmän solmuja, sitä suurempi värähtelyn taajuus.\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHAAAAKACAIAAAB7VhiuAAAQAElEQVR4nOzdBXxb19kG8CtmmWSZmR1m5jYppMywdl3brczt1kH3be1WWrkrr11XZkopbZgZHTOzJJOY9b2yUkcRWZadxPD8f+fnXF8fyYptSfe577nncF0uFzNALpfTYtRaLAaHzepwWB12m8NupZ0MAAAAAADASMBisTlcPofL43D4HB5fIJQKRDLayQwQK/xARanJqO80G3ssJh0DAAAAAAAwughEcqFYLpbGUtYK8yZhBSqn067tbNX3tPft4QslAqGMyxP0pjo+bUQQ5gAAAAAAAE4Jl8tpt1moaESNNqhoZLUY+r4qjUqQxyaz2Zx+76efQEXfRt/dru1q9Yzoo/sVSaL4QqqFsRgAAAAAAIDRgiKP1aw3Gbr1PSqmd0ygPCZJGp0QunQUKlBRVlO      "id": "fy8-5-L2-07",
     "number": "5-15",
     "level": 2,
     "html": "<p class=\"task scenario\">Oppilas katsoo vetyatomin <span><math><semantics><mrow><mn>1</mn><mtext>s</mtext></mrow></semantics></math></span>-orbitaalin kuvaa, jonka raja on <span class=\"math-glue\"><span><math><semantics><mrow><mn>90</mn> <mi mathvariant=\"normal\">%</mi></mrow></semantics></math></span>:</span>n raja, ja päättelee: ”Raja on seinä. Elektroni pysyy aina rajan sisällä, joten yksikään mittaus ei osu sen ulkopuolelle.” Simulaatiossa <span class=\"math-glue\"><span><math><semantics><mrow><mn>2000</mn></mrow></semantics></math></span>:</span>sta mittauksesta kuitenkin <span><math><semantics><mrow><mn>205</mn></mrow></semantics></math></span> osuu rajan ulkopuolelle.</p><p class=\"task ask\">Mikä on oppilaan päättelyn virhe?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Raja on sovittu todennäköisyysraja: sen sisään osuu noin yhdeksän kymmenesosaa mittauksista, loput osuvat ulkopuolelle.</span></label></li><li><label><span>Ulkopuolen osumat ovat mittausvirheitä, jotka katoaisivat, jos mittauslaite olisi riittävän tarkka, joten raja olisi silloin seinä.</span></label></li><li><label><span>Simulaatio on virheellinen, koska sen pitäisi antaa kaikki osumat rajan sisäpuolelta, jos orbitaalin raja on piirretty oikeaan kohtaan.</span></label></li><li><label><span>Elektroni kiitää niin nopeasti, että se ehtii välillä rajan ulkopuolelle, vaikka se pysyy suurimman osan ajasta rajan sisällä.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Raja on sovittu todennäköisyysraja: sen sisään osuu noin yhdeksän kymmenesosaa mittauksista, loput osuvat ulkopuolelle."
    },

     "html": "<p class=\"task\">Esimerkkiaineisto: vetykaasun emissiospektrin näkyvät viivat syntyvät, kun atomin elektroni siirtyy ylemmältä kuorelta kuorelle <span class=\"math-glue\"><span><math><semantics><mrow><mi>n</mi><mo>=</mo><mn>2</mn></mrow></semantics></math></span>.</span> Taulukossa on neljän viivan aallonpituudet <span class=\"math-glue\"><span><math><semantics><mrow><mi>λ</mi></mrow></semantics></math></span>.</span></p><p class=\"task more\">Vetyatomin energiatasot ovat <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>6</mn> <mtext>eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>,</span> mutta viivojen alkukuoria ei tunneta.</p><p class=\"task ask\">a) Laske kunkin viivan fotonin energia <span><math><semantics><mrow><msub><mi>E</mi><mtext>f</mtext></msub></mrow></semantics></math></span> elektronivoltteina.</p><p class=\"task ask\">b) Päättele jokaiselle viivalle alkukuoren numero <span><math><semantics><mrow><mi>n</mi></mrow></semantics></math></span> ratkaisemalla se yhtälöstä <span><math><semantics><mrow><msub><mi>E</mi><mtext>f</mtext></msub><mo>=</mo><msub><mi>E</mi><mi>n</mi></msub><mo>−</mo><msub><mi>E</mi><mn>2</mn></msub></mrow></semantics></math></span>⁠. Perustele, miksi tulosten pitää olla kokonaislukuja.</p><p class=\"task ask\">c) Piirrä kuvaaja, jonka vaaka-akselilla on <span><math><semantics><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>−</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span> ja pystyakselilla <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>E</mi><mtext>f</mtext></msub></mrow></semantics></math></span>,</span> ja sovita pisteisiin suora. Määritä suoran kulmakerroin ja kerro, mitä se ilmaisee.</p><p class=\"task ask\">d) Ennusta seuraavan viivan, kuoresta <span><math><semantic      "html": "<p class=\"task\">Kilpirauhaspotilaalle annettiin jodi-131-valmistetta, ja potilaan kehossa olevan jodi-131:n aktiivisuutta mitattiin <span><math><semantics><mrow><mn>8</mn></mrow></semantics></math></span> vuorokauden ajan (esimerkkiaineisto). Jodi-131:n fysikaalinen puoliintumisaika on <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>T</mi><mtext>fys</mtext></msub><mo>=</mo><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>02</mn> <mtext>d</mtext></mrow></semantics></math></span>.</span> Aktiivisuus pienenee nopeammin kuin pelkän hajoamisen perusteella, koska elimistö myös poistaa jodia (virtsa, hiki). Poistuminen on biologinen prosessi, jota kuvaa oma puoliintumisaika <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>T</mi><mtext>bio</mtext></msub></mrow></semantics></math></span>.</span></p><p class=\"task more\">Hajoaminen ja poistuminen ovat toisistaan riippumattomia, ja kumpikin poistaa ytimiä samalla tavalla eksponentiaalisesti. Ytimen todennäköisyys poistua sekunnissa on siis näiden kahden todennäköisyyden summa, eli kokonaispoistumista kuvaa vakio <span><math><semantics><mrow><msub><mi>λ</mi><mtext>eff</mtext></msub><mo>=</mo><msub><mi>λ</mi><mtext>fys</mtext></msub><mo>+</mo><msub><mi>λ</mi><mtext>bio</mtext></msub></mrow></semantics></math></span>⁠.</p><p class=\"task ask\">a) Määritä taulukon avulla aktiivisuuden efektiivinen puoliintumisaika <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>T</mi><mtext>eff</mtext></msub></mrow></semantics></math></span>.</span></p><p class=\"task ask\">b) Määritä biologinen puoliintumisaika <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>T</mi><mtext>bio</mtext></msub></mrow></semantics></math></span>.</span></p><p class=\"task ask\">c) Kuinka monta prosenttia alkuaktiivisuudesta olisi jäljellä <span class=\"math-glue\"><span><math><semantics><mrow><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>d</mtext></mrow></semantics></math></span>:</span>n kuluttua, jos jodi poistuisi vain fysikaalisen hajoamisen kautta? Vertaa mitattuun arvoon ja päättele, kumpi prosessi pienentää kehon jodi-131-aktiivisuutta nopeammin.</p><p class=\"task more\">Vastauslaatikkoon tulee kohdan b) tulos vuorokausina.</p><table class=\"exp-table ex-data\"><caption>Potilaan kehon jodi-131-aktiivisuus (esimerkkiaineisto)</caption><thead><tr><th scope=\"col\"><span><math><semantics><mrow><mi>t</mi> <mo stretchy=\"false\">(</mo><mtext>d</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th><th scope=\"col\"><span><math><semantics><mrow><mi>A</mi> <mo stretchy=\"false\">(</mo><mtext>MBq</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th></tr></thead><tbody><tr><td>0</td><td>400</td></tr><tr><td>2</td><td>256</td></tr><tr><td>4</td><td>161</td></tr><tr><td>6</td><td>104</td></tr><tr><td>8</td><td>65,5</td></tr></tbody></table>",

     "html": "<p class=\"task\">Alfasäteilevää ainetta on kertynyt työntekijän maksaan, jonka massa on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>kg</mtext></mrow></semantics></math></span>.</span> Maksa absorboi alfasäteilystä vuodessa energian <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>63</mn> <mtext>mJ</mtext></mrow></semantics></math></span>.</span> Kysytään maksan ekvivalenttiannosta.</p><p class=\"task more\">Oppilaan ratkaisu: <span><math><semantics><mrow><mi>D</mi><mo>=</mo><mstyle><mfrac><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>63</mn> <mtext>mJ</mtext></mrow><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>kg</mtext></mrow></mfrac></mstyle><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>35</mn> <mtext>mGy</mtext></mrow></semantics></math></span>⁠. Gray ja sievert ovat sama asia, joten ekvivalenttiannos on <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>35</mn> <mtext>mSv</mtext></mrow></semantics></math></span>.</span></p><p class=\"task ask\">a) Mikä oppilaan päättelyssä on virheellistä? Selitä.</p><p class=\"task ask\">b) Laske maksan oikea ekvivalenttiannos. Alfasäteilyn painotuskerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>20</mn></mrow></semantics></math></span>.</span> Anna vastaus millisieverteinä.</p><p class=\"task more\">Vastauslaatikkoon tulee kohdan b) tulos.</p>",
     "answer": "<span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>mSv</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy8-13-L3-01",
     "number": "13-16",
     "level": 3,
     "html": "<p class=\"task\">Gammasäteilylähteen annosnopeus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>:</span>n etäisyydellä ilman suojaa <span class=\"math-glue\"><span><math><semantics><mrow><mn>80</mn> <mi>μ</mi><mtext>Sv/h</mtext></mrow></semantics></math></span>.</span></p><p class=\"task more\">Työ kestää <span class=\"math-glue\"><span><math><semantics><mrow><mn>30</mn> <mtext>min</mtext></mrow></semantics></math></span>,</span> ja sen voi tehdä kahdella tavalla: A) <span class=\"math-glue\"><span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>:</span>n päässä lähteestä ilman suojaa tai B) <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>:</span>n päässä <span class=\"math-glue\"><span><math><semantics><mrow><mn>18</mn> <mtext>mm</mtext></mrow></semantics></math></span>:</span>n lyijysuojan takana. Lyijyn puoliintumispaksuus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>mm</mtext></mrow></semantics></math></span>.</span></p><p class=\"task more\">Laske annos tavalla A miinus annos tavalla B. Anna vastaus mikrosieverteinä etumerkin kanssa: positiivinen erotus tarkoittaa, että tapa B antaa pienemmän annoksen.</p>",

    {

     "number": "13-17",
     "level": 3,
     "html": "<p class=\"task\">Omakotitalon radonpitoisuudeksi mitataan <span class=\"math-glue\"><span><math><semantics><mrow><mn>400</mn> <mfrac><mtext>Bq</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span>.</span> Suomalaisten asuntojen keskimääräinen pitoisuus <span><math><semantics><mrow><mn>94</mn> <mfrac><mtext>Bq</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span> antaa keskimäärin noin <span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>mSv</mtext></mrow></semantics></math></span> vuodessa, ja muut säteilylähteet antavat yhteensä keskimäärin noin <span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <mtext>mSv</mtext></mrow></semantics></math></span> vuodessa.</p><p class=\"task more\">Arvioi talon asukkaan efektiivinen vuosiannos kaikista lähteistä. Oletetaan, että radonannos on suoraan verrannollinen pitoisuuteen ja että muut lähteet antavat asukkaalle keskimääräisen annoksen. Anna vastaus millisieverteinä.</p>",

     "number": "13-18",

    {
     "id": "fy8-13-L3-04",
     "number": "13-19",
     "level": 3,
     "html": "<p class=\"task\">Omakotitalon asukas mittautti sisäilman radonpitoisuuden. Pitoisuus mitattiin neljässä kolmen kuukauden jaksossa vuoden ympäri (taulukko, esimerkkiaineisto).</p><p class=\"task more\">Suomalaisten asuntojen keskimääräinen radonpitoisuus <span><math><semantics><mrow><mn>94</mn> <mfrac><mtext>Bq</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span> aiheuttaa keskimäärin <span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>mSv</mtext></mrow></semantics></math></span> efektiivisen annoksen vuodessa (STUK-A263, 2020). Oletetaan, että radonannos on suoraan verrannollinen pitoisuuteen ja että asukas oleskelee kotona <span><math><semantics><mrow><mn>80</mn> <mi mathvariant=\"normal\">%</mi></mrow></semantics></math></span> siitä ajasta, jonka suomalainen keskimäärin oleskelee kotona. Asuntojen radonin viitearvo on <span class=\"math-glue\"><span><math><semantics><mrow><mn>300</mn> <mfrac><mtext>Bq</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span>.</span></p><p class=\"task ask\">a) Laske vuoden keskipitoisuus.</p><p class=\"task ask\">b) Laske asukkaan radonista saama efektiivinen vuosiannos.</p><p class=\"task ask\">c) Selitä, miksi talvella mitattu pitoisuus yliarvioi vuosiannoksen ja miksi virallinen radonmittaus tehdään silti lämmityskaudella. Ylittääkö vuoden keskipitoisuus viitearvon?</p><p class=\"task ask\">d) Asukas haluaa pienentää radonannoksensa radonkorjauksella enintään arvoon <span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>mSv</mtext></mrow></semantics></math></span> vuodessa. Kuinka suuri vuoden keskipitoisuus saa korjauksen jälkeen enintään olla? Anna vastaus yksikössä <span class=\"math-glue\"><span><math><semantics><mrow><mfrac><mtext>Bq</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span>.     },

    {

     "id": "fy8-15-L2-03",
     "number": "15-11",
     "level": 2,
     "html": "<p class=\"task scenario\">Gammafotoni voi muuttua atomiytimen lähellä elektroniksi ja positroniksi, jos sen energia on vähintään elektronin ja positronin lepoenergioiden summa <span class=\"math-glue\"><span><math><semantics><mrow><mn>2</mn><mo>⋅</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>511</mn> <mtext>MeV</mtext></mrow></semantics></math></span>.</span></p><p class=\"task ask\">Mikä on tällaisen fotonin suurin mahdollinen aallonpituus? Vastaa pikometreinä.</p><p class=\"task more\">Vakiot: <span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>626</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup> <mtext>J</mtext> <mtext>s</mtext></mrow></semantics></math></span>⁠, <span class=\"math-glue\"><span><math><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>998</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn> <mtext>MeV</mtext><mo>=</mo><mn>1</mn><msup><mn>0</mn><mn>6</mn></msup> <mtext>eV</mtext></mrow></semantics></math></span>,</span> <span><math><semantics><mrow><mn>1</mn> <mtext>eV</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>602</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup> <mtext>J</mtext></mrow></semantics></math></span> ja <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn> <mtext>pm</mtext><mo>=</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup> <mtext>m</mtext></mrow></semantics></math></span>.</span></p>",
     "answer": "<span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>21</mn> <mtext>pm</mtext></mrow></semantics></math></span>"

     "level": 2,
     "html": "<p class=\"task\">Neutroni koostuu kvarkeista <span class=\"math-glue\"><span><math><semantics><mrow><mi>u</mi> <mi>d</mi> <mi>d</mi></mrow></semantics></math></span>.</span> Kvarkkien massat ovat <span><math><semantics><mrow><msub><mi>m</mi><mi>u</mi></msub><mo>=</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>16</mn> <mfrac><mtext>MeV</mtext><msup><mi>c</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span> ja <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>m</mi><mi>d</mi></msub><mo>=</mo><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>70</mn> <mfrac><mtext>MeV</mtext><msup><mi>c</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span>,</span> ja neutronin massa on <span><math><semantics><mrow><mn>939</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>565</mn> <mfrac><mtext>MeV</mtext><msup><mi>c</mi><mn>2</mn></msup></mfrac></mrow></semantics></math></span> (Particle Data Group 2024). Kuinka monta prosenttia neutronin massasta on sen kvarkkien massojen summa?</p>",

    {
     "id": "fy8-15-L2-05",
     "number": "15-13",
     "level": 2,
     "html": "<p class=\"task\">Tutkija kokeilee, mitkä kvarkkien ja antikvarkkien yhdistelmät voisivat muodostaa hadronin. Hadronin varaus ja baryoniluku <span><math><semantics><mrow><mi>B</mi></mrow></semantics></math></span> ovat kumpikin kokonaislukuja.</p><p class=\"task more\">Taulukossa on seitsemän yhdistelmää (esimerkkiaineisto). Kvarkkien varaukset: <span><math><semantics><mrow><mi>u</mi></mrow></semantics></math></span> <span class=\"math-glue\">(<span><math><semantics><mrow><mo>+</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>e</mi></mrow></semantics></math></span>),</span> <span><math><semantics><mrow><mi>d</mi></mrow></semantics></math></span> ja <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> <span class=\"math-glue\">(<span><math><semantics><mrow><mo>−</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>e</mi></mrow></semantics></math></span>);</span> antikvarkin varaus on vastakkainen, ja baryoniluku on <span class=\"math-glue\"><span><math><semantics><mrow><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mtext>q</mtext></msub><mo>−</mo><msub><mi>n</mi><mover><mtext>q</mtext><mo>ˉ</mo></mover></msub></mrow><mn>3</mn></mfrac></mrow></semantics></math></span>.</span></p><p class=\"task more\">Kuinka monta yhdistelmää voi olla hadroni?</p><table class=\"exp-table ex-data\"><caption>Kvarkkiyhdistelmiä (esimerkkiaineisto)</caption><thead><tr><th scope=\"col\">Nro</th><th scope=\"col\">Yhdistelmä</th></tr></thead><tbody><tr><td>1</td><td><span><math><semantics><mrow><mi>u</mi> <mi>u</mi> <mi>d</mi></mrow></semantics></math></span></td></tr><tr><td>2</td><td><span><math><semantics><mrow><mi>u</mi> <mi>d</mi></mrow></semantics></math></span></td></tr><tr><td>3</td><td><span><math><semantics><mrow><mi>d</mi> <mover><mi>s</mi><mo>ˉ</mo></mover></mrow></semantics></math></span></td></tr><tr><td>4</td><td><span><math><semantics><mrow><mi>u</mi> <mi>u</mi> <mover><mi>d</mi><mo>ˉ</mo></mover></mrow></semantics></math></span></td></tr><tr><td>5</td><t      "answer": "<span><math><semantics><mrow><mn>5</mn></mrow></semantics></math></span>"
    },
    {
     "id": "fy8-15-L2-06",
     "number": "15-14",
     "level": 2,
     "html": "<p class=\"task\">Taulukon seitsemässä reaktiossa on oikeita hiukkasia, mutta kaikki reaktiot eivät ole mahdollisia (esimerkkiaineisto). Varaus, baryoniluku ja leptoniluku säilyvät kaikissa havaituissa reaktioissa. Neutriinon <span><math><semantics><mrow><mi>ν</mi></mrow></semantics></math></span> leptoniluku on <span><math><semantics><mrow><mo>+</mo><mn>1</mn></mrow></semantics></math></span> ja antineutriinon <span><math><semantics><mrow><mover><mi>ν</mi><mo>ˉ</mo></mover></mrow></semantics></math></span> <span class=\"math-glue\"><span><math><semantics><mrow><mo>−</mo><mn>1</mn></mrow></semantics></math></span>.</span></p><p class=\"task more\">Energiaa ei tarvitse tarkastella. Kuinka monessa reaktiossa jokin kolmesta säilymislaista rikkoutuu?</p><table class=\"exp-table ex-data\"><caption>Reaktioita (esimerkkiaineisto)</caption><thead><tr><th scope=\"col\">Nro</th><th scope=\"col\">Reaktio</th></tr></thead><tbody><tr><td>1</td><td><span><math><semantics><mrow><mi>n</mi><mo>→</mo><mi>p</mi><mo>+</mo><msup><mi>e</mi><mo>−</mo></msup><mo>+</mo><mover><mi>ν</mi><mo>ˉ</mo></mover></mrow></semantics></math></span></td></tr><tr><td>2</td><td><span><math><semantics><mrow><mi>p</mi><mo>+</mo><mover><mi>p</mi><mo>ˉ</mo></mover><mo>→</mo><mi>γ</mi><mo>+</mo><mi>γ</mi></mrow></semantics></math></span></td></tr><tr><td>3</td><td><span><math><semantics><mrow><mi>n</mi><mo>→</mo><mi>p</mi><mo>+</mo><msup><mi>e</mi><mo>−</mo></msup></mrow></semantics></math></span></td></tr><tr><td>4</td><td><span><math><semantics><mrow><mi>p</mi><mo>+</mo><msup><mi>e</mi><mo>−</mo></msup><mo>→</mo><mi>n</mi><mo>+</mo><mi>ν</mi></mrow></semantics></math></span></td></tr><tr><td>5</td><td><span><math><semantics><mrow><mi>p</mi><mo>+</mo><mi>n</mi><mo>→</mo><mi>p</mi><mo>+</mo><mi>p</mi></mrow></semantics></math></span></td></tr><tr><td>6</td><td><span><math><semantics><mrow><msup><mi>π</mi><mo>−</mo></msup><mo>→</mo><msup><mi>e</mi><mo>−</mo></msup><mo>+</mo><mover><mi>ν</mi><mo>ˉ</mo></mover></mrow></semantics></math></span></td></tr><tr><td>7</td><td><span><math><semantics><mrow><mi>n</mi><mo>+</mo><mi>n</mi><mo>→</mo><msup><mi>π</mi><mn>0</mn></msup><mo>+</mo><msup><mi>π</mi><mn>0</mn></msup></mrow></semantics></math></span></td></tr></tbody></table>",

    },

<script>
(function () {

  /* ---- aloitusnäkymä ---- */
  function loadHome() {

    return call('rlOverview').then(function (ov) {
      S.ov = ov;
      $('title').textContent = 'RuukkiLabra · ' + ov.course + (ov.group ? ' · ryhmä ' + ov.group : '') + ' · arviointi';
      $('students').textContent = 'Hyväksyttyjä palauttajia ' + ov.students + '.';

        d.open = S.open[c.id] !== undefined ? S.open[c.id] : c.submissions > 0;   // palautetut luvut auki

        sm.append(el('span', 'muted', '· palautuksia ' + c.submissions + (c.submissions ? ' · arvioitu ' + scored + '/' + all : '')));
        var tb = el('tbody'), table = el('table'), head = el('thead'), hr = el('tr');
        ['Tehtävä', 'Taso', 'Palautuksia', 'Joista tyhjiä', 'Arvioitu'].forEach(function (h) { hr.append(el('th', null, h)); });
        head.append(hr); table.append(head, tb);
        c.tasks.forEach(function (t) {
          var tr = el('tr', 'task-row'); tr.tabIndex = 0;
          tr.append(el('td', null, 'Tehtävä ' + t.number), el('td', null, String(t.level)), el('td', null, String(t.submissions)), el('td', null, String(t.empty)), el('td', null, String(t.scored)));

      var pb = $('problems').querySelector('tbody'); pb.textContent = '';
      ov.problems.forEach(function (p) {
        var tr = el('tr');
        var dc = el('td');
        tr.append(el('td', null, p.status), el('td', null, p.chapter), el('td', null, p.email), el('td', null, p.time), el('td', null, p.sub), el('td', null, p.reason), dc);
        if (p.status === 'Tarkistettava' || p.status === 'Hyväksytty') {   // opettajan päätös: Hyväksy / Hylkää / peru
          var want = p.decision ? '' : (p.status === 'Tarkistettava' ? 'Hyväksy' : 'Hylkää');

          b.addEventListener('click', function () { b.disabled = true; call('rlSetDecision', { key: p.key, decision: want }).then(loadHome, function (e) { b.disabled = false; $('homeState').textContent = 'Päätöstä ei tallennettu: ' + errText(e); }); });

  }
  // Kooste (opettaja 5.11.2026): nimet vasemmalla; Tehty, Tarkistamatta ja Pisteet joko koko opintojaksosta (luvut,
  // joista ryhmällä on palautuksia) tai yhdestä luvusta. Järjestys sarakkeen otsikosta.
  var num = function (x) { return String(Math.round(x * 100) / 100).replace('.', ','); };
  function renderSummary(ov) {
    var chs = ov.chapters.filter(function (c) { return c.submissions > 0; });
    var sel = $('scope'), want = S.scope || 'all';
    sel.textContent = '';
    var o = el('option', null, 'Kaikki palautetut luvut'); o.value = 'all'; sel.append(o);
    chs.forEach(function (c) { var x = el('option', null, 'Luku ' + c.number + ' · ' + c.title); x.value = c.id; sel.append(x); });
    if (want !== 'all' && !chs.some(function (c) { return c.id === want; })) want = 'all';
    sel.value = S.scope = want;
    var scope = want === 'all' ? chs : chs.filter(function (c) { return c.id === want; });
    var nTasks = scope.reduce(function (n, c) { return n + c.tasks.length; }, 0), max = nTasks * ov.maxPoints;
    var rows = ov.summary.map(function (s) {

      scope.forEach(function (c) { var x = s.chapters[c.id]; if (x) { r.answered += x.answered; r.unchecked += x.unchecked; r.points += x.points; r.returned++; } });

    });

    head.textContent = ''; body.textContent = '';

    [['name', 'Opiskelija', ''], ['answered', 'Tehty', 'n'], ['unchecked', 'Tarkistamatta', 'n'], ['points', 'Pisteet', 'n']].forEach(function (h) {
      var th = el('th', h[2]), b = el('button', 'sort', h[1] + ' ' + (key === h[0] ? (dir > 0 ? '▲' : '▼') : '⇅'));
      b.type = 'button'; b.setAttribute('data-key', h[0]);
      th.setAttribute('aria-sort', key === h[0] ? (dir > 0 ? 'ascending' : 'descending') : 'none');
      b.addEventListener('click', function () { S.sort = { key: h[0], dir: key === h[0] ? -dir : (h[0] === 'name' ? 1 : -1) }; renderSummary(S.ov); });
      th.append(b); hr.append(th);
    });
    head.append(hr);
    rows.forEach(function (r) {
      var tr = el('tr'); if (!r.returned) { tr.className = 'none'; tr.title = 'Ei palautusta tästä luvusta'; }
      var part = function (v, of) { var td = el('td', 'n'); td.append(el('span', 'v', v)); if (of !== undefined) td.append(el('span', 'of', ' / ' + of)); return td; };
      tr.append(el('td', null, r.name), part(String(r.answered), nTasks), part(String(r.unchecked)), part(num(r.points), num(max)));
      body.append(tr);

    $('summary').hidden = !rows.length; $('noSummary').hidden = !!rows.length; $('scopeWrap').hidden = !rows.length;
  }
  $('scope').addEventListener('change', function () { S.scope = $('scope').value; if (S.ov) renderSummary(S.ov); });
  $('refresh').addEventListener('click', loadHome);
  $('onlyOpen').addEventListener('change', function () { S.onlyOpen = $('onlyOpen').checked; });

  /* ---- arviointi ---- */
  function cur() { var e = S.entries[S.idx]; return e ? { entry: e, version: e.versions[S.ver] } : null; }

  function openTask(id) {

    $('home').hidden = true; $('grade').hidden = false;
    $('gTitle').textContent = S.ov.course + ' · Luku ' + S.chapter.number + ' · Tehtävä ' + S.task.number;

    fetchAnswer(e, v).then(function (a) {
      if (token !== S.token) return;   // ehdittiin siirtyä toiseen opiskelijaan
      renderAnswer(a); $('points').disabled = false;
    }, function (err) {
      if (token !== S.token) return;
      $('gAnswer').textContent = ''; $('gAnswer').append(el('p', 'err', 'Vastausta ei voitu näyttää: ' + errText(err)));
      $('points').disabled = false;
    });
    var nx = S.entries[idx + 1]; if (nx) fetchAnswer(nx, nx.versions[nx.versions.length - 1]).catch(function () {});   // seuraava valmiiksi
  }
  function fetchAnswer(e, v) {
    var k = v.fileId + '|' + S.task.id;
    if (!S.cache[k]) S.cache[k] = call('rlAnswer', { email: e.email, fileId: v.fileId, sub: v.sub, task: S.task.id }).catch(function (err) { delete S.cache[k]; throw err; });
    return S.cache[k];
  }
  function renderAnswer(a) {
    var box = $('gAnswer'); box.textContent = '';
    if (a.status === 'empty' || !a.content.length) { box.append(el('p', 'empty', 'Opiskelija jätti tehtävän tyhjäksi (ei ratkaisua editorissa).')); return; }
    var tex = $('showTex').checked, p = el('div');
    a.content.forEach(function (it) {
      if (it.type === 'text') p.append(el('span', 't', it.text));
      else if (it.type === 'math') {
        if (!tex && typeof it.png === 'string' && B64.test(it.png)) {
          var m = el('img', 'math'); m.alt = it.latex; m.title = it.latex; m.src = 'data:image/png;base64,' + it.png;
          m.style.width = Math.round(it.w * 1.25) + 'px'; m.style.height = Math.round(it.h * 1.25) + 'px'; p.append(m);
        } else p.append(el('code', 'math', it.latex));
      } else if (it.type === 'image' && (it.mime === 'image/png' || it.mime === 'image/jpeg') && B64.test(it.data)) {
        var i = el('img', 'shot'); i.alt = 'Opiskelijan kuva (' + it.w + ' × ' + it.h + ' px), suurenna napsauttamalla'; i.src = 'data:' + it.mime + ';base64,' + it.data;
        i.addEventListener('click', function () { zoom(i.src); }); p.append(i);
      }
    });
    box.append(p);
  }
  $('showTex').addEventListener('change', function () { var c = cur(); if (c) fetchAnswer(c.entry, c.version).then(function (a) { if (cur() && cur().version === c.version) renderAnswer(a); }); });
  function zoom(src) {
    var z = $('zoom'); z.textContent = ''; var i = el('img'); i.src = src; i.alt = 'Opiskelijan kuva täysikokoisena'; z.append(i); z.style.display = 'block';
  }
  $('zoom').addEventListener('click', function () { $('zoom').style.display = 'none'; });

  // Pisteiden tallennus: pyyntö kantaa opiskelijan, palautusversion ja tehtävän, joten myöhässä tuleva vastaus ei voi
  // osua väärään opiskelijaan. Yksi tallennus kerrallaan; seuraava odottaa edellistä.
  // Pisteet 0–max, enintään kaksi desimaalia, pilkku tai piste (opettaja 5.11.2026: "vaikka 0,5").
  function parsePoints(s) {
    s = s.trim();
    if (s === '') return { ok: true, value: '' };
    if (!/^\d+(?:[.,]\d{1,2})?$/.test(s)) return { ok: false };
    var v = Number(s.replace(',', '.'));
    return v > max() ? { ok: false } : { ok: true, value: v };
  }
  var badPoints = function () { return 'Pisteet: 0–' + scoreText(max()) + ' (esim. 0,5) tai tyhjä. Ei tallennettu.'; };
  function saveCurrent() {
    var c = cur(); if (!c) return Promise.resolve(true);
    var p = parsePoints($('points').value);
    if (!p.ok) { setState(badPoints(), 'no'); return Promise.resolve(false); }
    if (S.saving) return S.saving.then(function () { return saveCurrent(); });
    if (p.value === (c.version.score === null || c.version.score === undefined ? '' : c.version.score)) return Promise.resolve(true);
    var target = c.version, req = { email: c.entry.email, sub: target.sub, task: S.task.id, value: p.value };
    setState('Tallennetaan…', 'busy');
    S.saving = call('rlSaveScore', req).then(function (r) {
      target.score = r.value;
      if (cur() && cur().version === target) setState(r.value === '' ? 'Tallennettu ✓ (arvioimaton)' : 'Tallennettu ✓', 'ok');
      return true;
    }, function (e) {
      if (cur() && cur().version === target) setState('Tallennus epäonnistui: ' + errText(e) + ' Pisteitä ei tallennettu.', 'no');
      return false;
    }).then(function (ok) { S.saving = null; return ok; });
    return S.saving;
  }
  // ↓/↑: tallennus ja siirtyminen. Viimeisellä ↓ tallentaa ja kertoo, että tehtävä on käyty läpi.
  function go(delta) {
    if (S.nav || !cur()) return;
    var to = S.idx + delta;
    if (to < 0) return;
    if (to >= S.entries.length) {
      saveCurrent().then(function (ok) { if (ok && cur()) setState('Tallennettu ✓ · tehtävän viimeinen palautus', 'ok'); });
      return;
    }
    S.nav = true; $('prev').disabled = $('next').disabled = true;
    saveCurrent().then(function (ok) {
      S.nav = false;
      if (!ok) { $('prev').disabled = S.idx === 0; $('next').disabled = S.idx === S.entries.length - 1; return; }   // virhe: pysytään paikallaan
      show(to, null);
    });
  }
  // →/←: +1 / −1 piste (rajat 0 ja max), tallentuu heti. Tyhjästä → antaa 1 ja ← antaa 0.
  function step(delta) {
    if ($('points').disabled || !cur()) return;
    var p = parsePoints($('points').value), base = p.ok && p.value !== '' ? p.value : 0;
    var v = Math.max(0, Math.min(max(), Math.round((base + delta) * 100) / 100));
    $('points').value = scoreText(v);
    saveCurrent();
  }
  function setPoints(text) {
    if ($('points').disabled || !cur()) return;
    $('points').value = text;
    saveCurrent();
  }
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('points').addEventListener('change', function () { if (!S.nav) saveCurrent(); });
  // Pistekentässä (esim. 0,5): Enter, ↓ ja ↑ tallentavat ja siirtyvät, ja kohdistin palaa näkymään, jotta nuolet toimivat
  // taas; ← ja → liikuttavat kohdistinta kentässä; Esc poistuu kentästä.
  $('points').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); $('points').blur(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); $('points').blur(); go(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); $('points').blur(); }
  });
  $('gVer').addEventListener('change', function () {
    var want = Number($('gVer').value);
    if (S.nav) { $('gVer').value = String(S.ver); return; }
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (ok) show(S.idx, want); else $('gVer').value = String(S.ver); });
  });
  document.addEventListener('keydown', function (e) {
    if ($('zoom').style.display === 'block') { if (e.key === 'Escape') $('zoom').style.display = 'none'; return; }
    if ($('grade').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;   // muokkauskentässä näppäimet toimivat normaalisti
    if (e.key === 'ArrowDown') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (/^[0-9]$/.test(e.key)) { e.preventDefault(); setPoints(e.key); }   // numero suoraan pisteiksi, tallentuu heti
    else if (e.key === ',' || e.key === '.') { e.preventDefault(); if (!$('points').disabled) { $('points').focus(); $('points').value = '0,'; } }   // desimaali: kenttään
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); setPoints(''); }
    else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A' && tag !== 'TR') { e.preventDefault(); go(1); }
  });
  $('back').addEventListener('click', function () {
    if (S.nav) return;
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (!ok) return; S.token++; $('grade').hidden = true; $('home').hidden = false; loadHome(); });
  });
  window.addEventListener('beforeunload', function (e) {
    var c = cur(); if (!c || $('grade').hidden) return;
    var p = parsePoints($('points').value);
    if (S.saving || !p.ok || p.value !== (c.version.score === null ? '' : c.version.score)) { e.preventDefault(); e.returnValue = ''; }
  });
  window.rlReload = loadHome;   // paikallinen arviointisivu päivittää näkymän tiedostojen lukemisen jälkeen
  loadHome();
})();
</script>
</body>
</html>
