<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>We forge | Kiviruukin lukio</title>
<!--
  Kiviruukin sloganianimaatio iframe-upotukseen, esim. Slides.com-esitykseen:
  "We forge" ja vaihtuva vaaleanpunainen sana Yönsinisellä pohjalla,
  oikeassa alakulmassa Marjapuuro-muoto. Kaikki skaalautuu upotuksen kokoon.

    <iframe src="https://hellsla.github.io/we-forge.html"
            width="960" height="540" style="border:0"></iframe>

  URL-parametrit:
    ?lang=fi              Meillä taotaan tulevaisuuksia. / tietoa. / uria ja unelmia. / yhdessä.
    ?words=a,b,c          omat vaihtuvat sanat (pilkulla erotettuina)
    ?lead=Meillä%20taotaan  oma valkoinen alkuosa
    ?s=4                  sanan vaihtoväli sekunteina (oletus 2.8)
-->
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Kiviruukin lukion ensisijainen ilme */
    --navy:#012169;
    --pink:#fca5c7;
    --white:#ffffff;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }

  body{
    position:relative;
    overflow:hidden;
    background:var(--navy);
    font-family:"Lato", Arial, sans-serif;
  }

  /* Muoto on rajattu kuten graafisen ohjeiston kansisivulla. */
  .cloud{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    fill:var(--pink);
  }

  .slogan{
    position:absolute;
    left:7%;
    top:37%;
    transform:translateY(-50%);
    color:var(--white);
    font-weight:900;
    font-size:64px;              /* fit() asettaa oikean koon */
    line-height:1;
    letter-spacing:-0.02em;
    white-space:nowrap;
    visibility:hidden;
  }

  .slogan.is-ready{ visibility:visible; }

  .line{
    display:block;
    height:1.12em;
  }

  .changing{
    overflow:hidden;
    color:var(--pink);
  }

  .word{
    display:inline-block;
    transition:transform .42s cubic-bezier(.2,.7,.2,1), opacity .42s ease;
  }

  .word.is-out{ transform:translateY(-.55em); opacity:0; }
  .word.is-in{ transform:translateY(.55em); opacity:0; transition:none; }

  /* Pysty- ja neliömäisissä upotuksissa teksti ylös, muoto alaosaan. */
  @media (max-aspect-ratio:1/1){
    .cloud{ top:auto; height:58%; }
    .slogan{ top:24%; }
  }

  /* Vähennetty liike: sana vaihtuu pelkällä häivytyksellä. */
  @media (prefers-reduced-motion:reduce){
    .word.is-out,
    .word.is-in{ transform:none; }
  }

  .probe{
    position:absolute;
    left:-9999px;
    top:0;
    font-weight:900;
    font-size:100px;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }
</style>
</head>
<body>
<svg class="cloud" viewBox="-210.86 -52.08 841.89 595.28" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" focusable="false"><path d="M544.41 806.54C544.41 806.54 621.31 910.36 722.64 833.93C823.98 757.48 840.05 608.29 829.67 506.94C822.82 439.96 856.61 427.41 938.44 380.39C1058.47 311.4 1077.25 62.27 846.38 31.13C615.49 0 451.79 110.41 453.94 233.15C456.07 355.91 462.51 356 389.19 327.21C315.89 298.41 162.03 330.03 151.74 489.72C141.46 649.39 164.14 690.48 96.5 777.64C0.66 901.16 0 1037 87.32 1096.19C189.23 1165.25 232.94 1054.55 286.27 1062.02C339.61 1069.5 385.86 1170.63 489.77 1087.3C615.42 986.55 544.41 806.54 544.41 806.54"/></svg>

<div class="slogan" id="slogan" role="img" aria-label="We forge futures.">
  <span class="line" id="lead">We forge</span>
  <span class="line changing"><span class="word" id="word">futures.</span></span>
</div>
<span class="probe" id="probe" aria-hidden="true"></span>

<script>
(function(){
  "use strict";

  var params = new URLSearchParams(location.search);
  var lead = "We forge";
  var words = ["futures.", "knowledge.", "ideas.", "prototypes.", "together."];

  // Graafisen ohjeiston elävä slogan: "Meillä taotaan tulevaisuuksia. / tietoa. / …"
  if ((params.get("lang") || "").toLowerCase() === "fi"){
    document.documentElement.lang = "fi";
    lead = "Meillä taotaan";
    words = ["tulevaisuuksia.", "tietoa.", "uria ja unelmia.", "yhdessä."];
  }
  if (params.get("lead")) lead = params.get("lead");
  if (params.get("words")){
    var own = params.get("words").split(",").map(function(w){ return w.trim(); }).filter(Boolean);
    if (own.length) words = own;
  }
  var seconds = parseFloat(params.get("s"));
  if (!(seconds >= 1)) seconds = 2.8;

  var slogan = document.getElementById("slogan");
  var leadEl = document.getElementById("lead");
  var word = document.getElementById("word");
  var probe = document.getElementById("probe");
  leadEl.textContent = lead;
  word.textContent = words[0];
  slogan.setAttribute("aria-label", lead + " " + words[0]);

  var cloud = document.querySelector(".cloud");
  var shape = cloud.querySelector("path");

  // Missä kohtaa muoto alkaa vasemmalta pystyvälillä y0–y1 (px)?
  function cloudEdge(x0, y0, y1, w, h){
    var edge = w;
    try {
      var pt = cloud.createSVGPoint();
      var inv = shape.getScreenCTM().inverse();
      var stepY = Math.max(2, h / 80), stepX = Math.max(2, w / 240);
      for (var y = Math.max(0, y0); y <= Math.min(h, y1); y += stepY){
        for (var x = x0; x < edge; x += stepX){
          pt.x = x; pt.y = y;
          if (shape.isPointInFill(pt.matrixTransform(inv))){ edge = x; break; }
        }
      }
    } catch (e) {
      edge = w * 0.55;
    }
    return edge;
  }

  // Fonttikoko niin, että pisin sana mahtuu muodon vasemmalle puolelle.
  function fit(){
    var w = window.innerWidth, h = window.innerHeight;
    var tall = h >= w;
    var widest = 0;
    [lead].concat(words).forEach(function(t){
      probe.textContent = t;
      widest = Math.max(widest, probe.getBoundingClientRect().width / 100);
    });
    var size = Math.min(w * (tall ? 0.86 : 0.55) / widest, h * (tall ? 0.32 : 0.5) / 2.24);
    for (var k = 0; k < 4; k++){
      slogan.style.fontSize = size.toFixed(1) + "px";
      var box = slogan.getBoundingClientRect();
      var gap = size * 0.18;
      var room = cloudEdge(box.left, box.top - gap, box.bottom + gap, w, h) - box.left - gap;
      if (widest * size <= room) break;
      size = Math.max(8, room / widest);
    }
    slogan.classList.add("is-ready");
  }

  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(fit);
    // Varmistus, jos fonttia ei saada ladattua.
    setTimeout(fit, 1500);
  }
  fit();

  if (words.length < 2) return;
  var i = 0;
  setInterval(function(){
    word.classList.add("is-out");
    setTimeout(function(){
      i = (i + 1) % words.length;
      word.textContent = words[i];
      word.classList.remove("is-out");
      word.classList.add("is-in");
      void word.offsetWidth;
      word.classList.remove("is-in");
    }, 420);
  }, seconds * 1000);
})();
</script>
</body>
</html>
