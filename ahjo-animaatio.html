<title>Ahjo-animaatio | Kiviruukin lukio</title>
<!--
  Ahjo-ajastimen takomoanimaatio ilman ajastinta: pyörii jatkuvasti,
  esimerkiksi Slides.com-esityksen iframe-lohkoon upotettuna.

    <iframe src="https://hellsla.github.io/ahjo-animaatio.html"
            width="460" height="416" style="border:0"></iframe>

  Tausta on läpinäkyvä, joten alasin näkyy dian omaa taustaa vasten.
  Oman taustavärin saa URL-parametrilla ilman #-merkkiä, esim. ?bg=ffffff
  tai ?bg=fca5c7. Kuva skaalautuu upotuksen kokoon.
-->
<style>
  :root{
    --pink:#fca5c7;
    /* Kohtaus on suunniteltu 230 × 208 px:n kokoiseksi, kuten ajastimessa.
       --s skaalaa sen upotuksen kokoon. */
    --s:min(calc((100vw - 4px) / 230), calc((100vh - 4px) / 208));
    /* Ajastimen rytmi 1,5-kertaisena (50 % hitaampi) esitystä varten:
       isku, säteet 1,2 s, hidas himmeneminen, uusi isku 3,12 s:n välein.
       Ajastimen alkuperäinen tahti on 2.08s. */
    --cycle:3.12s;
    --first-hit:.5s;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }

  body{
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .scene{
    position:relative;
    width:calc(230 * var(--s));
    height:calc(208 * var(--s));
    pointer-events:none;
  }

  .scene img{
    position:absolute;
    left:0;
    display:block;
    width:100%;
    height:auto;
    max-width:none;
  }

  .anvil-base{ bottom:0; }

  .anvil-spark{
    bottom:calc(70 * var(--s));
    opacity:0;
    animation:rays var(--cycle) var(--first-hit) infinite both;
  }

  /* 0 %: isku ja nopea välähdys (0,18 s), 38,9 %: säteet alkavat himmetä
     hitaasti (1,8 s), 96,6 %: säteet poissa ennen seuraavaa iskua. */
  @keyframes rays{
    0%{ opacity:0; animation-timing-function:linear; }
    5.769%{ opacity:1; }
    38.942%{ opacity:1; animation-timing-function:ease-out; }
    96.635%,100%{ opacity:0; }
  }

  .spark{
    position:absolute;
    left:50%;
    top:calc(144 * var(--s));
    width:calc(13 * var(--s));
    height:calc(3 * var(--s));
    background:var(--pink);
    opacity:0;
    animation:spark var(--cycle) var(--first-hit) infinite both;
  }

  /* Kipinä lentää 0,72 s ja on sitten piilossa seuraavaan iskuun asti. */
  @keyframes spark{
    0%{
      opacity:0;
      transform:translate(-50%,0) rotate(var(--a));
      animation-timing-function:linear;
    }
    .5%{
      opacity:1;
      transform:translate(-50%,0) rotate(var(--a));
      animation-timing-function:ease-out;
    }
    23.077%,100%{
      opacity:0;
      transform:translate(calc(-50% + var(--dx) * var(--s)), calc(var(--dy) * var(--s))) rotate(var(--a));
    }
  }

  /* Oletussuunnat, jos skripti ei ole käytössä; skripti arpoo uudet joka iskuun. */
  .spark:nth-child(1){ --a:-150deg; --dx:-22.5; --dy:-13; }
  .spark:nth-child(2){ --a:-122deg; --dx:-13.8; --dy:-22; }
  .spark:nth-child(3){ --a:-97deg;  --dx:-3.2;  --dy:-25.8; }
  .spark:nth-child(4){ --a:-74deg;  --dx:7.2;   --dy:-25; }
  .spark:nth-child(5){ --a:-49deg;  --dx:17.1;  --dy:-19.6; }
  .spark:nth-child(6){ --a:-24deg;  --dx:23.8;  --dy:-10.6; }

  @media (prefers-reduced-motion:reduce){
    .spark{ display:none; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  // ?bg=ffffff (tai muu CSS-väri) antaa upotukselle oman taustan.
  var bg = new URLSearchParams(location.search).get("bg");
  if (bg){
    if (/^[0-9a-f]{3,8}$/i.test(bg)) bg = "#" + bg;
    if (window.CSS && CSS.supports("color", bg)) document.body.style.background = bg;
  }

  // Kuten ajastimessa: jokaisella iskulla kipinät lentävät satunnaisiin suuntiin.
  var sparks = document.querySelectorAll(".spark");
  function scatter(){
    for (var i = 0; i < sparks.length; i++){
      var a = -165 + Math.random() * 150;
      var sp = sparks[i].style;
      sp.setProperty("--a", a.toFixed(0) + "deg");
      sp.setProperty("--dx", (Math.cos(a * Math.PI / 180) * 26).toFixed(1));
      sp.setProperty("--dy", (Math.sin(a * Math.PI / 180) * 26).toFixed(1));
    }
  }
  // Iskun hetkellä alkaa uusi kierros; uudet suunnat arvotaan vasta,
  // kun tämän iskun kipinät ovat jo sammuneet.
  function scatterLater(){ setTimeout(scatter, 1000); }
  var rays = document.getElementById("rays");
  rays.addEventListener("animationstart", scatterLater);
  rays.addEventListener("animationiteration", scatterLater);
  scatter();
})();
</script>
