<!doctype html>
<html lang="{{t:format.html_lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — {{t:site.name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{t:site.name}}">
<meta property="og:locale" content="{{t:format.og_locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="theme-color" content="#f7f3ec">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="icon" href="brand/ruukkilabra-symboli.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/ruukkilabra-180.png">
<link rel="stylesheet" href="site.css">
{{strings}}
</head><body>
<div class="page lesson-page">
<header class="top">
  <a class="brand" href="index.html" aria-label="{{t:site.home_aria}}"><img class="brand-mark" src="brand/ruukkilabra-symboli.svg" alt="" width="40" height="40"><span class="brand-name">{{t:site.name}}<small>{{t:site.subtitle}}</small></span></a>
  <nav aria-label="{{t:site.main_menu}}"><a class="nav-modules" href="index.html#moduulit">{{t:site.modules}}</a>{{languages}}</nav>
</header>
<nav class="crumbs" aria-label="{{t:site.breadcrumb}}"><a href="index.html">{{t:site.name}}</a> › <a href="{{course}}.html">{{course}}</a> › {{title}}</nav>
{{notice}}
<nav class="toc" aria-label="{{t:lesson.steps_nav}}"><p class="toc-head"><span>{{course}}</span>{{title}}</p>{{toc}}</nav>
<main class="reading lesson">
{{main}}
</main>
<footer class="bottom"><span>{{t:site.footer}}</span><a href="{{course}}.html">{{back_to_course}}</a><a href="{{home}}">{{t:site.back_to_portfolio}}</a></footer>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script>/* inline maths (NOTES §1; visual audit 2026-10-31): never broken after a multiplication dot ("1,7 ·" / "10⁻¹⁵ m": KaTeX allows a break after every operator, so the box after a dot is merged into the one before; a long formula still breaks after "="), and never parted from the punctuation around it (a formula without a break point is wrapped with a comma, full stop, colon or bracket next to it in one nowrap span; a longer one gets word joiners) */
window.flGlueMath=function(root){var WJ='\u2060';(root||document.body).querySelectorAll('.katex').forEach(function(k){if(k.dataset.glued||k.closest('.katex-display'))return;k.dataset.glued='1';var bs=k.querySelectorAll(':scope>.katex-html>.base');for(var i=bs.length-2;i>=0;i--){var last=bs[i].lastElementChild;while(last&&last.classList.contains('mspace'))last=last.previousElementSibling;if(last&&last.classList.contains('mbin')&&/[\u22c5\u00d7]/.test(last.textContent)&&(bs[i].textContent+bs[i+1].textContent).length<=14){while(bs[i+1].firstChild)bs[i].appendChild(bs[i+1].firstChild);bs[i+1].remove();}}var n=k.nextSibling,p=k.previousSibling,a=n&&n.nodeType===3&&n.data.match(/^[,.;:!?)\]]+/),b=p&&p.nodeType===3&&p.data.match(/[(\[]$/);if(!a&&!b)return;if(k.querySelectorAll(':scope>.katex-html>.base').length===1){var w=document.createElement('span');w.className='math-glue';k.parentNode.insertBefore(w,k);if(b){p.data=p.data.slice(0,-1);w.appendChild(document.createTextNode(b[0]));}w.appendChild(k);if(a){n.data=n.data.slice(a[0].length);w.appendChild(document.createTextNode(a[0]));}}else{if(a)n.data=WJ+n.data;if(b)p.data=p.data+WJ;}});};</script>
<script src="vendor/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});flGlueMath(document.body)"></script>
<script src="lesson.js"></script>{{scripts}}
</body></html>
