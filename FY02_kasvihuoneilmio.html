<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kasvihuoneilmiö</title>
<link rel="stylesheet" href="simulaatio-theme.css" />
<style>
  :root{
    --ink:#3F3D39;
    --sun:#F2A81E;
    --sunEdge:#C4860E;
    --sunPale:#F8D189;
    --ir:#D84A62;
    --irEdge:#AE3A4E;
  }

  .card    { fill:none; stroke:#C7D4DD; stroke-width:2; }
  .landEdge{ fill:none; stroke:#4A6340; stroke-width:2.6; stroke-linecap:round; }
  .snow    { stroke:#5E7A8A; stroke-width:2.2; stroke-linejoin:round; }
  .haze    { stroke:#6E675C; stroke-opacity:.28; stroke-width:1.6; }
  .tube    { fill:#fff; stroke:var(--ink); stroke-width:2.6; }
  .tubeLine{ fill:none; stroke:var(--ink); stroke-width:2.6; }
  .tick    { stroke:var(--ink); stroke-width:1.6; opacity:.5; }
  .arrowSun{ stroke:var(--sunEdge); stroke-width:1.6; stroke-linejoin:round; }
  .arrowIr { stroke:var(--irEdge);  stroke-width:1.6; stroke-linejoin:round; }

  text{ fill:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .flowLabel{ font-size:19px; font-weight:600; }
  .tempBig  { font-size:38px; font-weight:700; text-anchor:middle; }
  .tickTxt  { font-size:15px; opacity:.65; }

  /* --- ohjaimet --- */
  .sim-controls{ flex-direction:column; gap:clamp(4px,0.9vw,9px); bottom:clamp(6px,1.4vw,14px); }
  .ctrl-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,2vw,22px); flex-wrap:wrap; }
  .ctrl-row label{ display:grid; gap:1px; font-size:clamp(11px,1.65vw,20px); justify-items:start; line-height:1.25; }
  .ctrl-row input[type="range"]{ width:min(190px,20vw); height:clamp(13px,1.9vw,20px); accent-color:var(--ink); }
  .sim-btn{ padding:clamp(3px,0.7vw,7px) clamp(9px,1.7vw,17px); font-size:clamp(12px,1.7vw,21px); }

  @media (max-width:560px){
    body.sim-body{ place-items:start center; height:auto; min-height:100%; }
    .sim-wrap{ width:100vw; height:auto; aspect-ratio:auto; }
    .sim-wrap > svg{ width:100%; height:auto; aspect-ratio:16/9; }
    .sim-controls{ position:static; left:auto; right:auto; bottom:auto;
      width:100%; padding:12px 12px 18px; gap:8px; }
    .ctrl-row input[type="range"]{ width:100%; }
    .ctrl-row label{ flex:1 1 45%; }
  }
</style>
</head>
<body class="sim-body">
<main class="sim-wrap" aria-label="Kasvihuoneilmiön simulaatio">
  <svg viewBox="0 0 960 540" role="img" aria-label="Kasvihuoneilmiö: säteilytasapaino, lumipeite ja maapallon lämpötila">
    <defs>
      <clipPath id="cardClip"><rect x="24" y="24" width="724" height="416" rx="18"/></clipPath>

      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#8FB6D4"/>
        <stop offset="0.38" stop-color="#C6DEED"/>
        <stop offset="0.78" stop-color="#DCEBF5"/>
        <stop offset="1"    stop-color="#E6F1F8"/>
      </linearGradient>

      <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#80A06B"/>
        <stop offset="1" stop-color="#5A7A4C"/>
      </linearGradient>

      <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#C6DDEC"/>
      </linearGradient>

      <radialGradient id="sunGlow">
        <stop offset="0"    stop-color="#F2A81E" stop-opacity="0.55"/>
        <stop offset="0.45" stop-color="#F2A81E" stop-opacity="0.22"/>
        <stop offset="1"    stop-color="#F2A81E" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="hazeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#7E7768" stop-opacity="0"/>
        <stop offset="0.3"  stop-color="#7E7768" stop-opacity="1"/>
        <stop offset="0.7"  stop-color="#7E7768" stop-opacity="1"/>
        <stop offset="1"    stop-color="#7E7768" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="mercGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#C6404F"/>
        <stop offset="0.4" stop-color="#E46074"/>
        <stop offset="1"   stop-color="#C6404F"/>
      </linearGradient>
    </defs>

    <!-- ============ MAISEMA ============ -->
    <g clip-path="url(#cardClip)">
      <rect x="24" y="24" width="724" height="416" fill="url(#skyGrad)"/>

      <!-- kasvihuonekaasukerros -->
      <g id="hazeG">
        <rect id="hazeFill" x="40" y="180" width="692" height="72" rx="30" fill="url(#hazeGrad)" opacity="0.2"/>
      </g>

      <!-- maapallon pinta ja lumipeite -->
      <path id="land"  fill="url(#landGrad)"/>
      <path id="crust" class="landEdge"/>
      <path id="snowL" class="snow" fill="url(#snowGrad)"/>
      <path id="snowR" class="snow" fill="url(#snowGrad)"/>

      <!-- aurinko -->
      <circle cx="70" cy="56" r="52" fill="url(#sunGlow)"/>
      <circle cx="70" cy="56" r="25" fill="#F2A81E" stroke="#C4860E" stroke-width="2.4"/>

      <!-- säteilyvirrat -->
      <path id="aSun"   class="arrowSun" fill="#F2A81E"/>
      <path id="aRefl"  class="arrowSun" fill="#F8D189"/>
      <path id="aSurf"  class="arrowIr"  fill="#D84A62"/>
      <path id="aSpace" class="arrowIr"  fill="#D84A62"/>
      <path id="aBack"  class="arrowIr"  fill="#D84A62"/>

      <text id="reflLbl" class="flowLabel" x="268" y="96" fill="#7A5206">Heijastus</text>
      <text class="flowLabel" x="360" y="46" text-anchor="middle" fill="#9C2F44">Avaruuteen</text>
      <text class="flowLabel" x="706" y="222" text-anchor="end" fill="#514B42">Ilmakehä</text>
      <text class="flowLabel" x="404" y="290" fill="#9C2F44">Maan lämpösäteily</text>
      <text id="backLbl" class="flowLabel" x="636" y="324" text-anchor="end" fill="#9C2F44">Takaisinsäteily</text>
    </g>
    <rect class="card" x="24" y="24" width="724" height="416" rx="18"/>

    <!-- ============ LÄMPÖMITTARI ============ -->
    <rect x="764" y="24" width="180" height="416" rx="18" fill="#FAFCFD"/>
    <rect class="card" x="764" y="24" width="180" height="416" rx="18"/>
    <g id="thermo">
      <text id="tempTxt" class="tempBig" x="854" y="90">+15 °C</text>
      <rect class="tube" x="810" y="130" width="30" height="250" rx="15"/>
      <rect id="merc" x="816" y="236" width="18" height="166" fill="url(#mercGrad)"/>
      <circle cx="825" cy="398" r="22" fill="url(#mercGrad)" stroke="#3F3D39" stroke-width="2.6"/>
      <rect class="tubeLine" x="810" y="130" width="30" height="250" rx="15"/>
      <g id="scaleTicks"></g>
    </g>
  </svg>

  <section class="sim-controls" aria-label="Säätimet">
    <div class="ctrl-row">
      <label><span id="epsLbl">Kasvihuonekaasut 78 %</span>
        <input id="eps" type="range" min="0" max="100" step="1" value="78" aria-label="Kasvihuonekaasut"></label>
      <label><span id="albLbl">Albedo 30 %</span>
        <input id="alb" type="range" min="0" max="60" step="1" value="30" aria-label="Albedo"></label>
      <button id="reset" class="sim-btn" type="button">Nykyinen maapallo</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const S0 = 1361;            // aurinkovakio, W/m²
  const SIGMA = 5.670e-8;     // Stefanin-Boltzmannin vakio
  const EPS0 = 78, ALB0 = 30; // nykyistä maapalloa vastaavat arvot

  // maapallon pinta: loiva kaari, jonka alla maa-aines
  const X0 = 24, X1 = 748, BOT = 440, EDGE_Y = 372, SAG = 34;
  const surfY = (x) => EDGE_Y - SAG * Math.sin(Math.PI * (x - X0) / (X1 - X0));
  const SNOW_H = 32;          // lumi- ja jääpeitteen paksuus, px

  // lämpömittarin asteikko
  const T_MIN = -60, T_MAX = 60, TY_BOT = 373, TY_TOP = 138;
  const ty = (t) => TY_BOT - (t - T_MIN) / (T_MAX - T_MIN) * (TY_BOT - TY_TOP);

  const PX_PER_W = 0.108;     // nuolen leveys: pikseliä per W/m²

  const $ = (id) => document.getElementById(id);
  const el = {
    land: $("land"), crust: $("crust"), snowL: $("snowL"), snowR: $("snowR"),
    hazeFill: $("hazeFill"), scaleTicks: $("scaleTicks"),
    aSun: $("aSun"), aRefl: $("aRefl"), aSurf: $("aSurf"), aSpace: $("aSpace"), aBack: $("aBack"),
    reflLbl: $("reflLbl"), backLbl: $("backLbl"),
    merc: $("merc"), tempTxt: $("tempTxt"),
    eps: $("eps"), alb: $("alb"), epsLbl: $("epsLbl"), albLbl: $("albLbl"), reset: $("reset")
  };

  const fmt = (x, d = 0) => x.toFixed(d).replace(".", ",");

  /* ---------------- staattinen grafiikka ---------------- */
  (function drawStatic() {
    const pts = [];
    for (let x = X0; x <= X1; x += 6) pts.push(`${x} ${surfY(x).toFixed(1)}`);
    pts.push(`${X1} ${surfY(X1).toFixed(1)}`);
    el.land.setAttribute("d", `M${X0} ${BOT} L${pts.join(" L")} L${X1} ${BOT} Z`);
    el.crust.setAttribute("d", `M${pts.join(" L")}`);

    let ticks = "";
    for (let t = T_MIN; t <= T_MAX; t += 20) {
      const y = ty(t).toFixed(1);
      ticks += `<line class="tick" x1="840" y1="${y}" x2="856" y2="${y}"/>`;
      ticks += `<text class="tickTxt" x="862" y="${(+y + 5).toFixed(1)}">${t > 0 ? "+" + t : t}</text>`;
    }
    el.scaleTicks.innerHTML = ticks;
  })();

  /* ---------------- lumipeite navoilta sisäänpäin ---------------- */
  function snowPaths(alb) {
    // kalotit eivät aivan kohtaa keskellä, jolloin kavennukset eivät mene
    // päällekkäin ja keskelle jää kapea sula vyöhyke
    const capW = Math.min(0.46, (alb / 0.6) * 0.46) * (X1 - X0);
    if (capW < 3) return ["", ""];
    // lumi- ja jääpeite lepää maan päällä ja kapenee sisäreunassa
    const wedge = (from, dir) => {
      const top = [], base = [];
      for (let k = 0; k <= 40; k++) {
        const u = k / 40;                           // 0 navalla, 1 sisäreunassa
        const x = from + dir * capW * u;
        const t = u < 0.82 ? 1 : (1 - u) / 0.18;    // tasapaksu, kapenee vasta lopussa
        top.push(`${x.toFixed(1)} ${(surfY(x) - SNOW_H * t).toFixed(1)}`);
        base.unshift(`${x.toFixed(1)} ${surfY(x).toFixed(1)}`);
      }
      return `M${top.join(" L")} L${base.join(" L")} Z`;
    };
    return [wedge(X0, 1), wedge(X1, -1)];
  }

  /* ---------------- kärjellinen nuoli, leveys = energiavirta ---------------- */
  function arrowPath(x1, y1, x2, y2, w) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    if (L < 1 || w < 0.8) return "";
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const hw = Math.max(w * 0.8, 8);               // kärjen puolileveys
    const hl = Math.min(30, L * 0.35);             // kärjen pituus
    const bx = x2 - ux * hl, by = y2 - uy * hl;
    const P = (px, py) => `${px.toFixed(1)} ${py.toFixed(1)}`;
    return `M${P(x1 + nx * w / 2, y1 + ny * w / 2)} L${P(bx + nx * w / 2, by + ny * w / 2)} `
         + `L${P(bx + nx * hw, by + ny * hw)} L${P(x2, y2)} L${P(bx - nx * hw, by - ny * hw)} `
         + `L${P(bx - nx * w / 2, by - ny * w / 2)} L${P(x1 - nx * w / 2, y1 - ny * w / 2)} Z`;
  }

  /* ---------------- yksikerroksinen ilmakehämalli ----------------
     Ilmakehä läpäisee auringon säteilyn mutta absorboi osuuden eps
     maasta lähtevästä lämpösäteilystä ja säteilee sen puoliksi ylös,
     puoliksi alas. Tasapainossa:
         sigma·Ts^4 = F / (1 - eps/2),   F = S0(1 - albedo)/4          */
  function model(eps, alb) {
    const inSun = S0 / 4;                  // ilmakehän ylärajalle tuleva
    const refl = alb * inSun;              // heijastuva
    const F = inSun - refl;                // absorboituva = avaruuteen palaava
    const surf = F / (1 - eps / 2);        // maanpinnan lämpösäteily
    const back = eps * surf / 2;           // takaisinsäteily
    const T = Math.pow(surf / SIGMA, 0.25) - 273.15;
    return { inSun, refl, F, surf, back, T };
  }

  /* ---------------- piirto ---------------- */
  function render() {
    const eps = parseFloat(el.eps.value) / 100;
    const alb = parseFloat(el.alb.value) / 100;
    const m = model(eps, alb);
    const w = (flux) => flux * PX_PER_W;

    const [sL, sR] = snowPaths(alb);
    el.snowL.setAttribute("d", sL);
    el.snowR.setAttribute("d", sR);

    el.aSun.setAttribute("d",   arrowPath(102, 92, 152, surfY(152) - 2, w(m.inSun)));
    el.aRefl.setAttribute("d",  arrowPath(176, surfY(176) - 2, 252, 58, w(m.refl)));
    el.aSurf.setAttribute("d",  arrowPath(360, surfY(360) - 2, 360, 252, w(m.surf)));
    el.aSpace.setAttribute("d", arrowPath(360, 180, 360, 52, w(m.F)));
    el.aBack.setAttribute("d",  arrowPath(660, 252, 660, surfY(660) - 2, w(m.back)));

    el.reflLbl.style.display = m.refl * PX_PER_W < 2 ? "none" : "";
    el.backLbl.style.display = m.back * PX_PER_W < 2 ? "none" : "";

    // utu tiivistyy kasvihuonekaasujen määrän mukana
    el.hazeFill.setAttribute("opacity", (0.06 + 0.46 * eps).toFixed(3));

    // lämpömittari
    const yT = ty(Math.max(T_MIN, Math.min(T_MAX, m.T)));
    el.merc.setAttribute("y", yT.toFixed(1));
    el.merc.setAttribute("height", (402 - yT).toFixed(1));
    el.tempTxt.textContent = `${m.T >= 0 ? "+" : "−"}${fmt(Math.abs(m.T), 0)} °C`;
  }

  /* ---------------- ohjaimet ---------------- */
  function onInput() {
    el.epsLbl.textContent = `Kasvihuonekaasut ${el.eps.value} %`;
    el.albLbl.textContent = `Albedo ${el.alb.value} %`;
    render();
  }
  el.eps.addEventListener("input", onInput);
  el.alb.addEventListener("input", onInput);
  el.reset.addEventListener("click", () => {
    el.eps.value = EPS0; el.alb.value = ALB0;
    onInput();
  });

  onInput();
})();
</script>
</body>
</html>
