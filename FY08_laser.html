<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laserin toiminta – pumppaus, miehitysinversio ja indusoitu emissio</title>

<style>
:root{
  --ink:#2f2f2f;
  --paper:#fff;
  --muted:#5f5f5f;
  --faint:#9a9a9a;
  --grid:#e8e7e4;
  --blue:#2d5bc7;
  --red:#e4433f;
  --mirror:#3c3c3c;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--paper);
  font-family:Arial, Helvetica, sans-serif;
  color:var(--ink);
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:1280px;
  padding:0 10px 20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

svg.stage{
  width:100%;
  height:auto;
  display:block;
  background:var(--paper);
}

.heading{font-size:15px;letter-spacing:1.6px;fill:var(--faint)}
.lbl{font-size:15px;fill:var(--muted)}
.lbl-s{font-size:13px;fill:var(--faint)}
.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lbl-i{font-size:15px;fill:var(--ink)}
.readout{font-size:19px;fill:var(--ink)}
.big{font-size:22px;fill:var(--ink)}

.controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:14px 26px;
  padding:4px 6px 0;
}

.field{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
}

.field input[type="range"]{
  width:min(260px, 40vw);
  accent-color:var(--ink);
  cursor:pointer;
}

.field .out{
  min-width:6ch;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
}

label{cursor:pointer}

button{
  font:inherit;
  font-size:16px;
  background:#fff;
  color:var(--ink);
  border:1.6px solid var(--ink);
  border-radius:999px;
  padding:7px 17px;
  cursor:pointer;
}
button:active{transform:translateY(1px)}

.sr{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

@media (max-width:760px){
  .controls{gap:10px 16px}
  .field{font-size:14px}
  button{font-size:14px;padding:6px 14px}
}
</style>
</head>

<body>

<script>
(() => {
"use strict";

/* ---------- mallin parametrit ---------- */
const NATOMS   = 36;
const TAU3     = 0.05;   // s, pumppaustason elinaika (säteilytön siirtymä)
const TAU2_LONG= 2.0;    // s, metastabiilin tilan elinaika
const TAU2_SHORT=0.12;   // s, tavallinen viritystila
const BSTIM    = 0.09;   // indusoidun emission ja absorption kerroin (1/(foton·s))
const BETA     = 0.10;   // osuus spontaaneista fotoneista ontelon moodiin
const RMAX     = 1.8;    // 1/s, suurin pumppausnopeus atomia kohti
const TRAV     = 0.28;   // s, fotonin kulkuaika ontelon läpi
const INTERNAL = 0.06;   // sisäinen häviö (absorptio, sironta) heijastusta kohti
const MAXP     = 110;    // piirrettävien ontelofotonien enimmäismäärä
const MAXFREE  = 34;     // piirrettävien spontaanien fotonien enimmäismäärä

/* ---------- geometria ---------- */
const MX_L = 112, MX_R = 900;         // peilien sisäpinnat
const LANE_TOP = 150, LANE_BOT = 214; // ontelon moodin leveys: fotonit kulkevat akselin suunnassa
const CAV = MX_R - MX_L;
const SPEED = CAV / TRAV;

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const atomLayer = $('atomLayer'), photonLayer = $('photonLayer'), freeLayer = $('freeLayer');
const pump = $('pump'), trans = $('trans'), meta = $('meta'), slow = $('slow');
const pumpOut = $('pumpOut'), transOut = $('transOut');
const playBtn = $('playBtn'), resetBtn = $('resetBtn');
const bar1 = $('bar1'), bar2 = $('bar2'), bar3 = $('bar3');
const n1text = $('n1text'), n2text = $('n2text'), n3text = $('n3text');
const dnText = $('dnText'), dnMarker = $('dnMarker'), thrLine = $('thrLine'), thrZone = $('thrZone');
const statusText = $('statusText'), detailText = $('detailText');
const beamGroup = $('beamGroup'), beam = $('beam'), beamTip = $('beamTip'), beamLabel = $('beamLabel');
const arrPump = $('arrPump'), arrDecay = $('arrDecay'), arrSpont = $('arrSpont'), arrStim = $('arrStim');
const pumpArrows = $('pumpArrows'), outCouplerFill = $('outCouplerFill');
const mirrorLabel = $('mirrorLabel'), metaCaption = $('metaCaption'), live = $('live');

const SVGNS = 'http://www.w3.org/2000/svg';
const fmt = (x, d=1) => x.toFixed(d).replace('.', ',');

/* ---------- atomit ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const atoms = [];
const atomEls = [];
const flashEls = [];

(function buildAtoms(){
  const rnd = mulberry32(20260827);
  for(let r=0; r<4; r++){
    for(let c=0; c<9; c++){
      const x = 175 + c*82.5 + (rnd()-0.5)*18;
      const y = 128 + r*40 + (rnd()-0.5)*14;
      atoms.push({x, y, state:0, flash:0});

      const flash = document.createElementNS(SVGNS,'circle');
      flash.setAttribute('cx', x); flash.setAttribute('cy', y);
      flash.setAttribute('r', 16); flash.setAttribute('fill','none');
      flash.setAttribute('stroke','var(--red)'); flash.setAttribute('stroke-width','1.9');
      flash.setAttribute('opacity','0');
      atomLayer.appendChild(flash); flashEls.push(flash);

      const el = document.createElementNS(SVGNS,'circle');
      el.setAttribute('cx', x); el.setAttribute('cy', y); el.setAttribute('r', 11);
      el.setAttribute('fill','#fff');
      el.setAttribute('stroke','var(--faint)');
      el.setAttribute('stroke-width','2.2');
      atomLayer.appendChild(el); atomEls.push(el);
    }
  }
})();

/* ---------- fotonipoolit ---------- */
const photons = [];
const photonEls = [];
for(let i=0;i<MAXP;i++){
  const p = document.createElementNS(SVGNS,'path');
  p.setAttribute('fill','none');
  p.setAttribute('stroke','var(--red)');
  p.setAttribute('stroke-width','2.4');
  p.setAttribute('stroke-linecap','round');
  p.setAttribute('opacity','0');
  photonLayer.appendChild(p); photonEls.push(p);
}

const frees = [];
const freeEls = [];
for(let i=0;i<MAXFREE;i++){
  const p = document.createElementNS(SVGNS,'path');
  p.setAttribute('fill','none');
  p.setAttribute('stroke','var(--red)');
  p.setAttribute('stroke-width','1.8');
  p.setAttribute('stroke-linecap','round');
  p.setAttribute('opacity','0');
  freeLayer.appendChild(p); freeEls.push(p);
}

// aaltopaketin muoto: 2,5 aallonpituutta, verhokäyrä keskellä
function packetPath(phase){
  let d = '';
  for(let s=0; s<=30; s+=2.5){
    const env = Math.exp(-Math.pow((s-15)/9, 2));
    const y = 7 * env * Math.sin(2*Math.PI*s/15 + phase);
    d += (s === 0 ? 'M' : 'L') + s.toFixed(1) + ' ' + y.toFixed(2) + ' ';
  }
  return d;
}
const PACKETS = [];
for(let k=0;k<12;k++) PACKETS.push(packetPath(k*Math.PI/6));
const packetFor = ph => PACKETS[((Math.round(ph/(Math.PI/6)) % 12) + 12) % 12];

/* ---------- tila ---------- */
let running = true;
let outRate = 0;         // ulostulevia fotoneja sekunnissa (liukuva keskiarvo)
let lasing = false;
// miehitysluvut ja fotonimäärä liukuvina keskiarvoina: yksittäisen atomin
// satunnainen siirtymä ei saa hypäyttää lukemia, vaikka atomit vilkkuvat
let avg1 = NATOMS, avg2 = 0, avg3 = 0, avgN = 0;
let pulse = {pump:0, decay:0, spont:0, stim:0};
let lastTime = 0, readoutTimer = 0, liveTimer = 0;

function tau2(){ return meta.checked ? TAU2_LONG : TAU2_SHORT; }
function pumpRate(){ return (parseFloat(pump.value)/100) * RMAX; }
function transmittance(){ return parseFloat(trans.value)/100; }
function lossRate(){ return (transmittance() + 2*INTERNAL) / (2*TRAV); }  // 1/s
function thresholdDN(){ return lossRate() / BSTIM; }

function counts(){
  let n1=0,n2=0,n3=0;
  for(const a of atoms){ if(a.state===0) n1++; else if(a.state===2) n2++; else n3++; }
  return {n1,n2,n3};
}

function nearestPhotonIndex(x){
  let best=-1, bd=Infinity;
  for(let i=0;i<photons.length;i++){
    const d = Math.abs(photons[i].x - x);
    if(d < bd){ bd = d; best = i; }
  }
  return best;
}

function spawnFree(a){
  if(frees.length >= MAXFREE) return;
  const ang = Math.random()*2*Math.PI;
  frees.push({x:a.x, y:a.y, vx:Math.cos(ang)*230, vy:Math.sin(ang)*230,
              phase:Math.random()*2*Math.PI, life:0.75, ang});
}

/* ---------- fysiikka-askel ---------- */
function step(dt){
  const R = pumpRate();
  const T = transmittance();
  const t2 = tau2();
  const n = photons.length;
  const pStim = 1 - Math.exp(-BSTIM*n*dt);
  const pPump = 1 - Math.exp(-R*dt);
  const pDecay3 = 1 - Math.exp(-dt/TAU3);
  const pSpont = 1 - Math.exp(-dt/t2);

  for(const a of atoms){
    if(a.state === 0){
      if(Math.random() < pPump){
        a.state = 3; pulse.pump = 1;
      } else if(n > 0 && Math.random() < pStim){
        // absorptio: foton häviää, atomi virittyy tasolle E₂
        const i = nearestPhotonIndex(a.x);
        if(i >= 0){ photons.splice(i,1); a.state = 2; a.flash = 0.35; }
      }
    } else if(a.state === 3){
      if(Math.random() < pDecay3){ a.state = 2; pulse.decay = 1; }
    } else if(a.state === 2){
      if(n > 0 && Math.random() < pStim){
        // indusoitu emissio: uusi foton on samanlainen kuin sen laukaissut
        const i = nearestPhotonIndex(a.x);
        if(i >= 0){
          const p = photons[i];
          a.state = 0; a.flash = 0.45; pulse.stim = 1;
          if(photons.length < MAXP){
            // uusi foton syntyy atomin kohdalla ja on samanlainen kuin laukaisija:
            // sama suunta ja sama vaihe -> koherenttia valoa
            let y = a.y + (p.y > a.y ? -14 : 14);
            y = Math.max(LANE_TOP, Math.min(LANE_BOT, y));
            photons.push({x:a.x, y, dir:p.dir, phase:p.phase});
          }
        }
      } else if(Math.random() < pSpont){
        a.state = 0; a.flash = 0.35; pulse.spont = 1;
        if(Math.random() < BETA && photons.length < MAXP){
          const y0 = Math.max(LANE_TOP, Math.min(LANE_BOT, a.y));
          photons.push({x:a.x, y:y0, dir:(Math.random()<0.5?-1:1), phase:Math.random()*2*Math.PI});
        } else {
          spawnFree(a);
        }
      }
    }
    if(a.flash > 0) a.flash = Math.max(0, a.flash - dt*1.6);
  }

  // ontelofotonit: liike, peiliheijastukset, häviöt
  let escaped = 0;
  for(let i=photons.length-1; i>=0; i--){
    const p = photons[i];
    p.x += p.dir * SPEED * dt;
    if(p.x >= MX_R){
      if(Math.random() < T){ photons.splice(i,1); escaped++; continue; }
      p.x = MX_R - (p.x - MX_R); p.dir = -1;
      if(Math.random() < INTERNAL){ photons.splice(i,1); continue; }
    } else if(p.x <= MX_L){
      p.x = MX_L + (MX_L - p.x); p.dir = 1;
      if(Math.random() < INTERNAL){ photons.splice(i,1); continue; }
    }
  }

  // spontaanit fotonit karkaavat sivuille
  for(let i=frees.length-1; i>=0; i--){
    const f = frees[i];
    f.x += f.vx*dt; f.y += f.vy*dt; f.life -= dt;
    if(f.life <= 0) frees.splice(i,1);
  }

  const inst = escaped/dt;
  const k = 1 - Math.exp(-dt/0.8);
  outRate += (inst - outRate)*k;

  const c = counts();
  const ka = 1 - Math.exp(-dt/0.8);
  avg1 += (c.n1 - avg1)*ka;
  avg2 += (c.n2 - avg2)*ka;
  avg3 += (c.n3 - avg3)*ka;
  avgN += (photons.length - avgN)*(1 - Math.exp(-dt/1.0));

  for(const key in pulse) pulse[key] = Math.max(0, pulse[key] - dt*3.2);
}

/* ---------- piirto ---------- */
const STATE_FILL = {0:'#fff', 2:'var(--red)', 3:'var(--blue)'};
const STATE_STROKE = {0:'var(--faint)', 2:'var(--red)', 3:'var(--blue)'};

function draw(){
  for(let i=0;i<atoms.length;i++){
    const a = atoms[i], el = atomEls[i], fl = flashEls[i];
    el.setAttribute('fill', STATE_FILL[a.state]);
    el.setAttribute('stroke', STATE_STROKE[a.state]);
    if(a.flash > 0){
      fl.setAttribute('opacity', (a.flash*1.6).toFixed(2));
      fl.setAttribute('r', (12 + (0.45-a.flash)*20).toFixed(1));
      fl.setAttribute('stroke', a.state === 2 ? 'var(--blue)' : 'var(--red)');
    } else {
      fl.setAttribute('opacity','0');
    }
  }

  for(let i=0;i<MAXP;i++){
    const el = photonEls[i];
    if(i < photons.length){
      const p = photons[i];
      el.setAttribute('d', packetFor(p.phase));
      el.setAttribute('transform',
        `translate(${(p.x - p.dir*15).toFixed(1)} ${p.y.toFixed(1)})` + (p.dir < 0 ? ' scale(-1,1)' : ''));
      el.setAttribute('opacity','0.92');
    } else if(el.getAttribute('opacity') !== '0'){
      el.setAttribute('opacity','0');
    }
  }

  for(let i=0;i<MAXFREE;i++){
    const el = freeEls[i];
    if(i < frees.length){
      const f = frees[i];
      el.setAttribute('d', packetFor(f.phase));
      el.setAttribute('transform',
        `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)}) rotate(${(f.ang*180/Math.PI).toFixed(1)})`);
      el.setAttribute('opacity', Math.max(0, Math.min(0.6, f.life)).toFixed(2));
    } else if(el.getAttribute('opacity') !== '0'){
      el.setAttribute('opacity','0');
    }
  }

  // ulostuleva säde näkyy vain, kun laser toimii
  const bright = Math.min(1, outRate/8);
  if(lasing && bright > 0.02){
    const h = 6 + 14*bright;
    beam.setAttribute('y', (185 - h/2).toFixed(1));
    beam.setAttribute('height', h.toFixed(1));
    beam.setAttribute('opacity', (0.35 + 0.55*bright).toFixed(2));
    const tip = 9 + 13*bright;
    beamTip.setAttribute('d', `M1206 ${185-tip} L1244 185 L1206 ${185+tip} z`);
    beamGroup.setAttribute('opacity','1');
    beamLabel.setAttribute('fill','var(--red)');
  } else {
    beamGroup.setAttribute('opacity','0');
    beamLabel.setAttribute('fill','var(--faint)');
  }

  // siirtymänuolten korostus
  arrPump.setAttribute('opacity',  (0.3 + 0.7*pulse.pump).toFixed(2));
  arrDecay.setAttribute('opacity', (0.3 + 0.7*pulse.decay).toFixed(2));
  arrSpont.setAttribute('opacity', (0.3 + 0.7*pulse.spont).toFixed(2));
  arrStim.setAttribute('opacity',  (0.3 + 0.7*pulse.stim).toFixed(2));

  pumpArrows.setAttribute('opacity', (0.15 + 0.85*(parseFloat(pump.value)/100)).toFixed(2));
}

function drawReadouts(){
  const m1 = Math.round(avg1), m2 = Math.round(avg2), m3 = Math.round(avg3);
  const dn = m2 - m1;
  const W = 378/NATOMS;
  bar1.setAttribute('width', (avg1*W).toFixed(1));
  bar2.setAttribute('width', (avg2*W).toFixed(1));
  bar3.setAttribute('width', (avg3*W).toFixed(1));
  n1text.textContent = 'N₁ = ' + m1;
  n2text.textContent = 'N₂ = ' + m2;
  n3text.textContent = 'N₃ = ' + m3;

  // inversiomittari: 950 = nolla, 6,9 px atomia kohti
  const px = v => 950 + Math.max(-36, Math.min(36, v))*6.9;
  const mx = px(dn);
  dnMarker.setAttribute('points', `${mx.toFixed(1)},600 ${(mx-8).toFixed(1)},586 ${(mx+8).toFixed(1)},586`);
  dnMarker.setAttribute('fill', dn > 0 ? 'var(--red)' : 'var(--faint)');
  dnText.textContent = 'ΔN = ' + (dn > 0 ? '+' : '') + dn;

  const thr = thresholdDN();
  const tx = px(thr);
  thrLine.setAttribute('x1', tx.toFixed(1)); thrLine.setAttribute('x2', tx.toFixed(1));
  thrZone.setAttribute('x', tx.toFixed(1));
  thrZone.setAttribute('width', Math.max(0, 1200 - tx).toFixed(1));

  // laser käy, kun ontelossa pysyy fotoneja ja miehitysinversio vallitsee;
  // hystereesi estää tekstin välkkymisen
  lasing = lasing ? (avgN > 2 && dn >= 0) : (avgN > 6 && dn > 0);

  if(lasing){
    statusText.textContent = 'Kynnys ylitetty – laser toimii';
    statusText.setAttribute('fill','var(--red)');
  } else if(dn > 0){
    statusText.textContent = 'Inversio syntynyt, mutta vahvistus < häviöt';
    statusText.setAttribute('fill','var(--ink)');
  } else {
    statusText.textContent = 'Ei miehitysinversiota – ei laservaloa';
    statusText.setAttribute('fill','var(--muted)');
  }

  detailText.textContent = 'Fotoneja ontelossa: ' + photons.length +
    ' · ulostuloteho: ' + fmt(outRate) + ' fotonia/s' +
    ' · kynnys ΔN = ' + fmt(thr);
}

/* ---------- animaatiosilmukka ---------- */
function frame(now){
  requestAnimationFrame(frame);
  if(!lastTime) lastTime = now;
  let dt = (now - lastTime)/1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  if(!running) dt = 0;

  if(dt > 0) step(dt * (slow.checked ? 0.2 : 1));
  draw();

  readoutTimer += (now - readoutTimer > 1e6 ? 0 : 0);
  if(now - liveTimer > 120){ drawReadouts(); liveTimer = now; }
}

/* ---------- ohjaimet ---------- */
function syncLabels(){
  pumpOut.textContent = pump.value + ' %';
  transOut.textContent = trans.value + ' %';
  mirrorLabel.textContent = 'peili, T = ' + trans.value + ' %';
  outCouplerFill.setAttribute('opacity', (0.85 - 0.7*(parseFloat(trans.value)/30)).toFixed(2));
  metaCaption.textContent = meta.checked
    ? 'metastabiili tila, pitkä elinaika'
    : 'tavallinen viritystila, lyhyt elinaika';
  announce();
}

let announceTimer = null;
function announce(){
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => {
    const m1 = Math.round(avg1), m2 = Math.round(avg2);
    live.textContent = 'Pumppausteho ' + pump.value + ' prosenttia, peilin läpäisy ' +
      trans.value + ' prosenttia. N1 = ' + m1 + ', N2 = ' + m2 +
      ', inversio ' + (m2 - m1) + '. ' + statusText.textContent + '.';
  }, 400);
}

function reset(){
  for(const a of atoms){ a.state = 0; a.flash = 0; }
  photons.length = 0;
  frees.length = 0;
  outRate = 0;
  lasing = false;
  avg1 = NATOMS; avg2 = 0; avg3 = 0; avgN = 0;
  for(const key in pulse) pulse[key] = 0;
  drawReadouts();
}

pump.addEventListener('input', syncLabels);
trans.addEventListener('input', syncLabels);
meta.addEventListener('change', syncLabels);

playBtn.addEventListener('click', () => {
  running = !running;
  playBtn.textContent = running ? 'Pysäytä' : 'Jatka';
  announce();
});

resetBtn.addEventListener('click', () => {
  pump.value = 70; trans.value = 8;
  meta.checked = true; slow.checked = false;
  running = true; playBtn.textContent = 'Pysäytä';
  syncLabels();
  reset();
});

syncLabels();
drawReadouts();
requestAnimationFrame(frame);
})();
</script>
