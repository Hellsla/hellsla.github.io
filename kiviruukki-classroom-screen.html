<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#012169">
<title>Kiviruukki Classroom Screen</title>
<link rel="stylesheet" href="lib/mathquill/mathquill.css">
<style>
:root{
  --navy:#012169;
  --pink:#fca5c7;
  --pink-strong:#f35f9f;
  --pink-track:#fde2ee;
  --white:#ffffff;
  --ink:#012169;
  --muted:#66718d;
  --panel:#ffffff;
  --surface:#f4f6fa;
  --line:rgba(1,33,105,.14);
  --shadow:0 14px 42px rgba(1,33,105,.10);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--surface)}
body{
  margin:0;
  min-height:100dvh;
  color:var(--ink);
  background:
    radial-gradient(circle at 92% 8%, rgba(252,165,199,.22), transparent 23rem),
    var(--surface);
  font-family:"Work Sans",Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,[contenteditable="true"]:focus-visible{outline:3px solid var(--pink-strong);outline-offset:3px}

.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  min-height:68px;
  padding:12px clamp(14px,2vw,28px);
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:flex-end;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;font-family:Lato,Arial,sans-serif;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:42px;color:var(--pink-strong)}
.brand small{display:block;font-family:"Work Sans",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.62;margin-top:1px}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toolbar-group{display:flex;align-items:center;gap:6px;padding:4px;background:#eef1f7;border-radius:999px}
button{
  border:0;
  border-radius:999px;
  padding:9px 14px;
  background:#eef1f7;
  color:var(--navy);
  cursor:pointer;
  font-weight:750;
}
button:hover{filter:brightness(.975)}
.toolbar-group button{background:transparent;padding:7px 11px;font-size:13px}
.toolbar-group button.on{background:var(--white);box-shadow:0 2px 8px rgba(1,33,105,.08)}
.primary{background:var(--navy);color:#fff}
.pink{background:var(--pink)}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}

.workspace{
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1.75fr) minmax(320px,.95fr);
  grid-template-rows:minmax(260px,.78fr) minmax(390px,1.22fr);
  grid-template-areas:"note clock" "note timer";
  gap:clamp(12px,1.6vw,22px);
  padding:clamp(12px,1.6vw,22px);
  min-height:0;
}
.widget{
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
.widget.hidden{display:none!important}
.widget-head{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  padding:0 18px;
  border-bottom:1px solid var(--line);
}
.widget-title{font-family:Lato,Arial,sans-serif;font-size:15px;font-weight:900;letter-spacing:.02em;text-transform:uppercase}
.widget-tools{display:flex;align-items:center;gap:6px}
.widget-tools button{padding:7px 10px;font-size:13px}

.note-widget{grid-area:note;display:flex;flex-direction:column}
.note-body{flex:1;min-height:0;position:relative;overflow:auto}
.editor{
  min-height:100%;
  padding:clamp(24px,4vw,58px);
  font-family:Lato,Arial,sans-serif;
  font-size:clamp(34px,5.1vw,76px);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-.035em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.editor:empty::before{content:attr(data-placeholder);color:rgba(1,33,105,.26)}
.editor p,.editor div{margin:.15em 0}
.note-footer{display:none;padding:8px 18px 14px;font-size:12px;color:#b3124f;font-weight:700}
.note-footer.warn{display:block}
.note-widget .widget-head{height:auto;min-height:54px;flex-wrap:wrap;padding:8px 18px}
.note-widget .widget-tools{flex-wrap:wrap;justify-content:flex-end}
.widget-tools button.on{background:var(--pink)}

/* --- Abitti-style math toolbar ------------------------------------------ */
.math-toolbar{display:none;flex-direction:column;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:#f8f9fc;max-height:42%;overflow:auto}
.math-toolbar.open,.note-widget.math-active .math-toolbar{display:flex}
.tb-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tb-row button{min-width:36px;height:36px;padding:0 8px;border-radius:10px;background:#fff;border:1px solid var(--line);font-family:"Times New Roman",Symbola,serif;font-size:19px;font-weight:400;line-height:1}
.tb-row button:hover{background:var(--pink-track);filter:none}
.tb-row .tb-more{font-family:"Work Sans",Arial,sans-serif;font-size:12px;font-weight:750}
.tb-extra{display:none}
.math-toolbar.more .tb-extra{display:flex}
.tb-basic{max-height:36px;overflow:hidden}
.math-toolbar.more .tb-basic{max-height:none}
.tb-eq{display:none}
.note-widget.math-active .tb-eq{display:flex}
.tb-eq button{height:42px;min-width:42px;padding:0 7px}
.tb-eq img{display:block;height:24px;width:auto;max-width:78px}
.tb-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* rendered equations and the inline equation editor */
.editor .math{display:inline-block;vertical-align:middle;letter-spacing:0;font-weight:400;cursor:pointer;border-radius:.12em;padding:0 .04em;white-space:nowrap}
.editor .math:hover{background:var(--pink-track)}
.editor .math.raw{font-family:ui-monospace,Consolas,monospace;font-size:.5em}
.editor .math .mq-math-mode,.math-editor .mq-math-mode{font-size:1em}
.editor .math-editor{display:inline-flex;flex-direction:column;gap:.12em;vertical-align:middle;max-width:100%;padding:.08em .16em .16em;margin:0 .05em;border:3px solid var(--pink-strong);border-radius:16px;background:#fff;letter-spacing:0;font-weight:400;white-space:normal}
.math-editor .mq-editable-field{min-width:1.2em;border:0!important;box-shadow:none!important;padding:.05em .1em}
.math-editor .mq-editable-field.mq-focused{box-shadow:none}
.math-editor textarea.latex-src{display:block;width:min(100%,40rem);min-width:16rem;min-height:2.6em;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font:15px/1.35 ui-monospace,Consolas,monospace;color:var(--navy);background:#f8f9fc}
.math-editor textarea.latex-src.error{border-color:#d11d5a;background:#fff0f5}
.math-editor .me-hint{font:600 11px/1.2 "Work Sans",Arial,sans-serif;color:var(--muted);letter-spacing:.02em}

/* pasted images */
.editor img{max-width:100%;height:auto;vertical-align:middle;border-radius:10px}
.editor img.selected{outline:4px solid var(--pink-strong);outline-offset:2px}
/* image resize handle */
.img-handle{position:absolute;z-index:7;display:none;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--pink-strong);border:4px solid #fff;box-shadow:0 2px 10px rgba(1,33,105,.3);cursor:nwse-resize;touch-action:none}
.img-handle.show{display:block}

/* pen tool */
.draw-canvas{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.note-widget.drawing .draw-canvas{pointer-events:auto;cursor:crosshair;touch-action:none}
.note-widget.drawing.erasing .draw-canvas{cursor:cell}
.pen-bar{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--line);background:#f8f9fc}
.note-widget.drawing .pen-bar{display:flex}
.pen-bar button{padding:6px 11px;font-size:13px;background:#fff;border:1px solid var(--line)}
.pen-bar button.on{background:var(--pink);border-color:var(--pink-strong)}
.pen-bar .swatch{width:30px;height:30px;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pen-bar .swatch.on{box-shadow:0 0 0 3px var(--navy)}
.pen-bar .size{width:34px;height:34px;padding:0;display:grid;place-items:center}
.pen-bar .size i{display:block;border-radius:50%;background:var(--navy)}
.img-bar{position:absolute;z-index:6;display:none;gap:6px;padding:6px;border-radius:999px;background:var(--navy);box-shadow:var(--shadow)}
.img-bar.show{display:flex}
.img-bar button{padding:6px 11px;font-size:13px;background:#fff}

/* --- Calculator (Abicus-style) ------------------------------------------ */
.calc{position:fixed;z-index:60;right:24px;bottom:24px;width:min(340px,calc(100vw - 32px));display:none;flex-direction:column;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(1,33,105,.25);overflow:hidden}
.calc.open{display:flex}
.calc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 16px;background:var(--navy);color:#fff;cursor:grab;touch-action:none;user-select:none}
.calc-head:active{cursor:grabbing}
.calc-head .widget-title{font-size:13px}
.calc-head button{padding:5px 10px;font-size:12px;background:rgba(255,255,255,.16);color:#fff}
.calc-head button.close{width:30px;height:30px;padding:0;font-size:16px}
.calc-history{height:130px;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px;background:#f8f9fc;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.calc-history:empty::before{content:"Laskuhistoria näkyy tässä. Klikkaa riviä käyttääksesi sitä uudelleen.";color:var(--muted);font-size:12px;margin:auto 0}
.calc-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.calc-row:hover{background:var(--pink-track)}
.calc-row .ex{color:var(--muted);overflow-wrap:anywhere}
.calc-row .res{font-weight:800;white-space:nowrap}
.calc-input-wrap{padding:10px 12px 4px}
.calc-input{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 11px;font:700 18px/1.2 ui-monospace,Consolas,monospace;color:var(--navy);background:#fff}
.calc-input::placeholder{font-size:14px;font-weight:500;color:#9aa3ba}
.calc-input:focus{border-color:var(--pink-strong);outline:none}
.calc-out{min-height:28px;padding:2px 14px 6px;text-align:right;font:900 20px/1.3 Lato,Arial,sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc-out.err{color:#d11d5a;font-size:13px;font-weight:700}
.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:4px 12px 12px}
.calc-keys button{padding:0;height:38px;border-radius:10px;font-size:14px;font-weight:700}
.calc-keys .fn{background:#e4e8f2;font-size:13px}
.calc-keys .op{background:var(--pink-track)}
.calc-keys .eq{background:var(--navy);color:#fff}
.calc-keys .clr{background:var(--pink)}

.clock-widget{grid-area:clock;display:flex;flex-direction:column}
.clock-body{flex:1;display:grid;place-items:center;text-align:center;padding:18px}
.clock-time{font-family:Lato,Arial,sans-serif;font-weight:900;font-size:clamp(62px,8vw,126px);line-height:.9;letter-spacing:-.065em;font-variant-numeric:tabular-nums lining-nums}
.clock-date{margin-top:12px;font-size:clamp(15px,1.7vw,24px);font-weight:650;color:var(--muted);text-transform:capitalize}
.clock-seconds{font-size:.38em;vertical-align:top;letter-spacing:-.02em;margin-left:.12em;color:var(--pink-strong)}

.timer-widget{grid-area:timer;display:flex;flex-direction:column}
.timer-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,.95fr) minmax(210px,.75fr);align-items:center;gap:10px;padding:14px 18px 18px}
.timer-visual{position:relative;aspect-ratio:1;width:min(100%,430px);justify-self:center}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring-track{stroke:var(--pink-track)}
.ring-progress{stroke:var(--pink-strong);stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.timer-center{position:absolute;inset:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2%}
.timer-widget .forge{width:72%;display:flex;flex-direction:column;align-items:center;line-height:0;margin-top:1%}
.timer-widget .rays{width:100%;height:auto;color:var(--pink);transform-origin:50% 100%;opacity:1}
.timer-widget .anvil{display:block;width:100%;height:auto;margin-top:-.4%;user-select:none;-webkit-user-drag:none}
.timer-time{margin-top:1%;font-family:Lato,Arial,sans-serif;font-size:clamp(42px,5.7vw,82px);font-weight:900;line-height:.9;letter-spacing:-.06em;font-variant-numeric:tabular-nums lining-nums;text-align:center;min-width:4.2ch}
.timer-status{margin-top:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.55;height:1.2em}
.timer-running .rays{animation:forgePulse 900ms ease-in-out infinite alternate}
.timer-finished .rays{animation:finishFlash 250ms ease-in-out 7 alternate}
@keyframes forgePulse{from{opacity:.3}to{opacity:1}}
@keyframes finishFlash{from{opacity:.18}to{opacity:1}}
.timer-controls{display:flex;flex-direction:column;align-items:stretch;gap:11px;padding-right:2px}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.preset-grid button{padding:9px 7px;font-size:13px}
.preset-grid button.active{background:var(--pink)}
.custom-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.custom-row label{font-size:12px;font-weight:800;color:var(--muted)}
.custom-row input{width:88px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--navy);background:#fff;text-align:center;font-weight:800}
.timer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer-actions .start{grid-column:1/-1;background:var(--navy);color:#fff;padding:11px}
.timer-actions button{font-size:13px}
.keyboard-hint{font-size:11px;line-height:1.4;color:var(--muted)}

body.bg-navy{--surface:#012169;--panel:#fff;--shadow:0 14px 42px rgba(0,0,0,.18)}
body.bg-navy{background:var(--navy)}
body.bg-navy .topbar{background:rgba(1,33,105,.92);color:#fff;border-bottom-color:rgba(255,255,255,.18)}
body.bg-navy .brand small{color:#fff}
body.bg-navy .toolbar-group{background:rgba(255,255,255,.14)}
body.bg-navy .toolbar-group button{color:#fff}
body.bg-navy .toolbar-group button.on{background:#fff;color:var(--navy)}
body.bg-pink{--surface:#fca5c7}
body.bg-pink{background:var(--pink)}

.focused .workspace{display:block;padding:clamp(12px,1.5vw,20px)}
.focused .widget{display:none!important;height:calc(100dvh - 108px)}
.focused .widget.focus-target{display:flex!important}
.focused .note-widget.focus-target{display:flex!important}
.focused .clock-widget.focus-target{display:flex!important}
.focused .timer-widget.focus-target{display:flex!important}
.focused .timer-widget .timer-body{grid-template-columns:minmax(380px,1.2fr) minmax(270px,.6fr);max-width:1100px;width:100%;margin:auto}
.focused .timer-widget .timer-visual{width:min(60dvh,560px)}
.focused .clock-time{font-size:clamp(120px,20vw,330px)}
.focused .clock-date{font-size:clamp(24px,3vw,46px)}
.focused .editor{font-size:clamp(58px,7vw,120px)}

.presentation .topbar{opacity:.06;transition:opacity .18s ease}
.presentation .topbar:hover,.presentation .topbar:focus-within{opacity:1}
.presentation .workspace{padding-top:6px}

body:fullscreen .app,body:-webkit-full-screen .app{min-height:100dvh}
body:fullscreen .topbar,body:-webkit-full-screen .topbar{opacity:.06;transition:opacity .18s ease}
body:fullscreen .topbar:hover,body:fullscreen .topbar:focus-within,body:-webkit-full-screen .topbar:hover,body:-webkit-full-screen .topbar:focus-within{opacity:1}

@media(max-width:980px){
  .workspace{grid-template-columns:1fr 1fr;grid-template-rows:minmax(360px,1.2fr) minmax(290px,.8fr);grid-template-areas:"note note" "clock timer"}
  .timer-body{grid-template-columns:1fr;overflow:auto}
  .timer-visual{width:min(54vw,310px)}
  .timer-controls{padding:0 10px 8px}
}
@media(max-width:700px){
  .topbar{align-items:flex-start}
  .brand small{display:none}
  .workspace{display:flex;flex-direction:column;min-height:auto}
  .widget{min-height:390px}
  .note-widget{min-height:56dvh}
  .clock-widget{min-height:330px}
  .timer-widget{min-height:700px}
  .timer-body{display:flex;flex-direction:column}
  .timer-visual{width:min(88vw,390px)}
  .toolbar-group.bg-group{display:none}
  .editor{font-size:clamp(32px,10vw,58px)}
}
@media(prefers-reduced-motion:reduce){.timer-running .rays,.timer-finished .rays{animation:none}.ring-progress{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="toolbar" aria-label="Näkymän asetukset">
      <div class="toolbar-group" aria-label="Näytä widgetit">
        <button class="widget-toggle on" data-widget="note">Teksti</button>
        <button class="widget-toggle on" data-widget="timer">Ajastin</button>
        <button class="widget-toggle on" data-widget="clock">Kello</button>
      </div>
      <div class="toolbar-group bg-group" aria-label="Taustaväri">
        <button class="bg-btn on" data-bg="light" title="Vaalea tausta">○</button>
        <button class="bg-btn" data-bg="navy" title="Yönsininen tausta">●</button>
        <button class="bg-btn" data-bg="pink" title="Marjapuuro-tausta">◉</button>
      </div>
      <button id="calcBtn" title="Avaa laskin (L)">Laskin</button>
      <button id="presentationBtn" title="Piilota työkalupalkki">Esitystila</button>
      <button class="pink" id="fullscreenBtn">Koko näyttö</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="widget note-widget" id="widget-note">
      <div class="widget-head">
        <div class="widget-tools">
          <button id="addMathBtn" title="Lisää kaava (Ctrl+E)">Σ Kaava</button>
          <button id="toolbarBtn" title="Näytä erikoismerkit ja kaavapainikkeet">Merkit</button>
          <button id="addImageBtn" title="Lisää kuva (tai liitä Ctrl+V)">Kuva</button>
          <button id="penBtn" title="Kynä: piirrä näytölle (P)">✎ Kynä</button>
          <input id="imageInput" type="file" accept="image/*" multiple hidden>
          <button id="textSmaller" title="Pienennä tekstiä">A−</button>
          <button id="textLarger" title="Suurenna tekstiä">A+</button>
          <button data-focus="note">Suurenna</button>
          <button id="clearText">Tyhjennä</button>
        </div>
      </div>
      <div class="math-toolbar" id="mathToolbar" aria-label="Erikoismerkit ja kaavat"></div>
      <div class="pen-bar" id="penBar" role="toolbar" aria-label="Kynän asetukset">
        <button class="swatch on" data-color="#012169" style="background:#012169" title="Tummansininen" aria-label="Tummansininen"></button>
        <button class="swatch" data-color="#f35f9f" style="background:#f35f9f" title="Pinkki" aria-label="Pinkki"></button>
        <button class="swatch" data-color="#e11d48" style="background:#e11d48" title="Punainen" aria-label="Punainen"></button>
        <button class="swatch" data-color="#16a34a" style="background:#16a34a" title="Vihreä" aria-label="Vihreä"></button>
        <button class="swatch" data-color="#2563eb" style="background:#2563eb" title="Sininen" aria-label="Sininen"></button>
        <button class="swatch" data-color="#f59e0b" style="background:#f59e0b" title="Oranssi" aria-label="Oranssi"></button>
        <span class="tb-sep"></span>
        <button class="size" data-size="3" title="Ohut" aria-label="Ohut"><i style="width:4px;height:4px"></i></button>
        <button class="size on" data-size="6" title="Keskikokoinen" aria-label="Keskikokoinen"><i style="width:8px;height:8px"></i></button>
        <button class="size" data-size="14" title="Paksu" aria-label="Paksu"><i style="width:14px;height:14px"></i></button>
        <span class="tb-sep"></span>
        <button id="eraserBtn" title="Pyyhekumi: pyyhi viivoja">Pyyhekumi</button>
        <button id="undoDrawBtn" title="Kumoa viimeisin viiva (Ctrl+Z)">Kumoa</button>
        <button id="clearDrawBtn" title="Poista kaikki piirrokset">Tyhjennä piirros</button>
        <button id="penDoneBtn" title="Lopeta piirtäminen (Esc)">Valmis</button>
      </div>
      <div class="note-body" id="noteBody">
        <div class="editor" id="editor" contenteditable="true" spellcheck="true" data-placeholder="Kirjoita tähän…" aria-label="Luokan näytölle kirjoitettava teksti"></div>
        <canvas class="draw-canvas" id="drawCanvas" aria-hidden="true"></canvas>
      </div>
      <div class="img-handle" id="imgHandle" title="Muuta kuvan kokoa vetämällä"></div>
      <div class="img-bar" id="imgBar" role="toolbar" aria-label="Kuvan koko">

<script>
(() => {
  'use strict';

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const app = $('#app');
  const editor = $('#editor');
  const workspace = $('#workspace');

  // --- Notes ---------------------------------------------------------------
  let editorSize = Number(localStorage.getItem('kiviruukki.editorSize') || 0);
  const savedNote = localStorage.getItem('kiviruukki.note');
  if (savedNote) editor.innerHTML = savedNote;

  function applyEditorSize(){
    const base = Math.max(26, Math.min(120, editorSize || 0));
    editor.style.fontSize = base ? `${base}px` : '';
  }
  $('#textLarger').addEventListener('click', () => {
    const current = parseFloat(getComputedStyle(editor).fontSize);
    editorSize = Math.min(120, current + 6);
    localStorage.setItem('kiviruukki.editorSize', String(editorSize));
    applyEditorSize();
  });
  $('#textSmaller').addEventListener('click', () => {
    const current = parseFloat(getComputedStyle(editor).fontSize);
    editorSize = Math.max(26, current - 6);
    localStorage.setItem('kiviruukki.editorSize', String(editorSize));
    applyEditorSize();
  });
  $('#clearText').addEventListener('click', () => {
    if (editor.textContent.trim() || editor.querySelector('img,.math') || strokes.length) {
      if (!confirm('Tyhjennetäänkö teksti, kaavat, kuvat ja piirrokset?')) return;
    }
    closeMath(false); hideImgBar(); clearDrawing();
    editor.innerHTML=''; localStorage.removeItem('kiviruukki.note'); editor.focus();
  });
  if (editorSize) applyEditorSize();

  // --- Saving ------------------------------------------------------------
  // Equations are stored as <span class="math" data-latex="…"> and rendered
  // again on load, so the saved HTML stays small and independent of MathQuill.
  const noteWidget = $('#widget-note');
  const noteFooter = $('#noteFooter');
  const footerText = '';
  let saveTimer = 0;
  function serialize(){
    const clone = editor.cloneNode(true);
    clone.querySelectorAll('.math-editor').forEach(w => {
      const latex = w.querySelector('.latex-src')?.value.trim() || '';

  const MAX_SIDE = 1600;
  function readAsDataURL(blob){
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  }
  async function imageToDataURL(file){
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') return readAsDataURL(file);
    try{
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size < 900 * 1024) return readAsDataURL(file);
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/webp', .85);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', .88);
      return url;
    }catch(_){ return readAsDataURL(file); }
  }

  // Pasted HTML is reduced to text, line breaks, images and equations.
  function sanitize(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const frag = document.createDocumentFragment();
    const BLOCK = /^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE|PRE|UL|OL|TABLE)$/;
    function walk(node, out){
      node.childNodes.forEach(n => {
        if (n.nodeType === 3){ out.append(n.data.replace(/\s+/g, ' ')); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName;
        if (/^(SCRIPT|STYLE|META|LINK|TITLE|NOSCRIPT|TEMPLATE)$/.test(tag)) return;
        if (tag === 'BR'){ out.append(document.createElement('br')); return; }
        if (tag === 'IMG'){
          const src = n.getAttribute('src') || '';
          if (/^(data:image\/|https?:)/i.test(src)){ const i = document.createElement('img'); i.src = src; i.alt = n.getAttribute('alt') || ''; out.append(i); }
          return;
        }
        if (n.classList.contains('math') && n.dataset.latex){ out.append(mathSpan(n.dataset.latex)); return; }
        if (BLOCK.test(tag)){ const d = document.createElement('div'); walk(n, d); if (d.childNodes.length) out.append(d); return; }
        walk(n, out);
      });
    }
    walk(doc.body, frag);
    return frag;
  }

  function formatTime(ms){

  function beep(){
    try{

      const t=audioCtx.currentTime;

        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(i===2?740:660,t+delay);
        g.gain.setValueAtTime(.0001,t+delay);
        g.gain.exponentialRampToValueAtTime(.13,t+delay+.015);
        g.gain.exponentialRampToValueAtTime(.0001,t+delay+.16);
        o.connect(g).connect(audioCtx.destination);
        o.start(t+delay); o.stop(t+delay+.18);

  const savedVisible = JSON.parse(localStorage.getItem('kiviruukki.visible') || '{}');
  Object.keys(widgets).forEach(k=>{
    if(savedVisible[k]===false){ widgets[k].classList.add('hidden'); const b=$(`.widget-toggle[data-widget="${k}"]`); if(b)b.classList.remove('on'); }
  });
  function saveVisible(){
    const state={}; Object.entries(widgets).forEach(([k,w])=>state[k]=!w.classList.contains('hidden'));
    localStorage.setItem('kiviruukki.visible',JSON.stringify(state));
  }
  toggleButtons.forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.widget; widgets[key].classList.toggle('hidden'); b.classList.toggle('on',!widgets[key].classList.contains('hidden')); saveVisible();
  }));

  let focusKey=null;
  $$('[data-focus]').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.focus;
    if(focusKey===key){
      document.body.classList.remove('focused'); widgets[key].classList.remove('focus-target'); b.textContent='Suurenna'; focusKey=null;
    }else{
      Object.values(widgets).forEach(w=>w.classList.remove('focus-target'));
      $$('[data-focus]').forEach(x=>x.textContent='Suurenna');
      focusKey=key; widgets[key].classList.add('focus-target'); document.body.classList.add('focused'); b.textContent='Palauta';
    }
  }));

  // --- Background, presentation and fullscreen ---------------------------
  const bgButtons=$$('.bg-btn');
  function setBg(bg){
    document.body.classList.remove('bg-navy','bg-pink');
    if(bg==='navy') document.body.classList.add('bg-navy');
    if(bg==='pink') document.body.classList.add('bg-pink');
    bgButtons.forEach(b=>b.classList.toggle('on',b.dataset.bg===bg));
    localStorage.setItem('kiviruukki.bg',bg);
  }
  bgButtons.forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.bg)));
  setBg(localStorage.getItem('kiviruukki.bg')||'light');

  $('#presentationBtn').addEventListener('click',()=>document.body.classList.toggle('presentation'));
  async function toggleFullscreen(){
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(_){ }
  }
  $('#fullscreenBtn').addEventListener('click',toggleFullscreen);

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey) && !e.altKey && e.key.toLowerCase()==='e' && (editor.contains(e.target)||e.target===editor)){
      e.preventDefault(); active ? closeMath(true) : openMath('');
      return;
    }
    if(noteWidget.classList.contains('drawing') && !e.target.closest('input,textarea')){
      if(e.key==='Escape'){ e.preventDefault(); setPen(false); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undoDrawing(); return; }
    }
    const typing=e.target.isContentEditable || e.target.closest('input,textarea,select,[contenteditable="true"],.math-editor');
    if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.code==='Space'){e.preventDefault();toggleTimer();}
    else if(e.key.toLowerCase()==='r') resetTimer();
    else if(e.key.toLowerCase()==='f') toggleFullscreen();
    else if(e.key.toLowerCase()==='l') toggleCalc();
    else if(e.key.toLowerCase()==='p' && !widgets.note.classList.contains('hidden')) setPen(!noteWidget.classList.contains('drawing'));
    else if(e.key==='Escape' && focusKey){
      document.body.classList.remove('focused'); widgets[focusKey].classList.remove('focus-target'); $$('[data-focus]').forEach(x=>x.textContent='Suurenna'); focusKey=null;
    }
  });

  // --- Pen tool ----------------------------------------------------------
  // Strokes are kept as vectors (CSS px in the text area's scroll content),
  // so they scroll with the text and are redrawn sharply after resizing.
  const canvas = $('#drawCanvas');
  const ctx = canvas.getContext('2d');
  const penBtn = $('#penBtn');
  const eraserBtn = $('#eraserBtn');
  let strokes = [];
  try{ strokes = JSON.parse(localStorage.getItem('kiviruukki.drawing') || '[]'); }catch(_){ strokes = []; }
  let penColor = localStorage.getItem('kiviruukki.penColor') || '#012169';
  let penSize = Number(localStorage.getItem('kiviruukki.penSize') || 6);
  let erasing = false;
  let current = null;

  function saveDrawing(){
    try{ localStorage.setItem('kiviruukki.drawing', JSON.stringify(strokes)); }
    catch(_){ noteFooter.textContent = 'Piirroksen tallennus ei onnistunut: selaimen muisti on täynnä.'; noteFooter.classList.add('warn'); }
  }
  function sizeCanvas(){
    const maxY = strokes.reduce((m, st) => Math.max(m, ...st.p.map(q => q[1] + st.w)), 0);
    const w = noteBody.clientWidth, h = Math.ceil(Math.max(noteBody.clientHeight, editor.offsetHeight, maxY + 20));
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function drawStroke(st){
    const pts = st.p;
    ctx.strokeStyle = st.c; ctx.fillStyle = st.c;
    ctx.lineWidth = st.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1){ ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], st.w / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.stroke();
  }
  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(drawStroke);
    if (current && !current.erase) drawStroke(current);
  }
  function clearDrawing(){ strokes = []; current = null; redraw(); saveDrawing(); }
  function pointFrom(e){
    const r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10];
  }
  function segDist(p, a, b){
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const t = dx || dy ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / (dx*dx + dy*dy))) : 0;
    return Math.hypot(p[0] - a[0] - t*dx, p[1] - a[1] - t*dy);
  }
  function eraseAt(pt){
    const before = strokes.length;
    strokes = strokes.filter(st => {
      const r = st.w / 2 + 12;
      if (st.p.length === 1) return Math.hypot(pt[0]-st.p[0][0], pt[1]-st.p[0][1]) > r;
      for (let i = 1; i < st.p.length; i++) if (segDist(pt, st.p[i-1], st.p[i]) <= r) return false;
      return true;
    });
    if (strokes.length !== before) redraw();
  }
  canvas.addEventListener('pointerdown', e => {
    if (!noteWidget.classList.contains('drawing') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const pt = pointFrom(e);
    const eraser = erasing || e.button === 5 || (e.buttons & 32);
    if (eraser){ current = {erase: true}; eraseAt(pt); return; }
    const w = e.pointerType === 'pen' && e.pressure ? penSize * (0.6 + e.pressure * 0.8) : penSize;
    current = {c: penColor, w: Math.round(w * 10) / 10, p: [pt]};
    redraw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (current.erase){ events.forEach(ev => eraseAt(pointFrom(ev))); return; }
    events.forEach(ev => {
      const pt = pointFrom(ev), last = current.p[current.p.length - 1];
      if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) >= 1.5) current.p.push(pt);
    });
    redraw();
  });
  function endStroke(){
    if (!current) return;
    if (!current.erase) strokes.push(current);
    current = null;
    redraw(); saveDrawing();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  function setPen(on){
    noteWidget.classList.toggle('drawing', on);
    penBtn.classList.toggle('on', on);
    if (on){ closeMath(false); hideImgBar(); editor.blur(); sizeCanvas(); }
    else setEraser(false);
  }
  function setEraser(on){
    erasing = on;
    eraserBtn.classList.toggle('on', on);
    noteWidget.classList.toggle('erasing', on);
  }
  function undoDrawing(){ if (strokes.length){ strokes.pop(); redraw(); saveDrawing(); } }
  penBtn.addEventListener('click', () => setPen(!noteWidget.classList.contains('drawing')));
  $('#penDoneBtn').addEventListener('click', () => setPen(false));
  eraserBtn.addEventListener('click', () => setEraser(!erasing));
  $('#undoDrawBtn').addEventListener('click', undoDrawing);
  $('#clearDrawBtn').addEventListener('click', () => { if (strokes.length && confirm('Poistetaanko kaikki piirrokset?')) clearDrawing(); });
  $$('#penBar .swatch').forEach(b => {
    b.classList.toggle('on', b.dataset.color === penColor);
    b.addEventListener('click', () => {
      penColor = b.dataset.color; localStorage.setItem('kiviruukki.penColor', penColor);
      $$('#penBar .swatch').forEach(x => x.classList.toggle('on', x === b));
      setEraser(false);
    });
  });
  $$('#penBar .size').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.size) === penSize);
    b.addEventListener('click', () => {
      penSize = Number(b.dataset.size); localStorage.setItem('kiviruukki.penSize', String(penSize));
      $$('#penBar .size').forEach(x => x.classList.toggle('on', x === b));
      setEraser(false);
    });
  });
  const canvasObserver = new ResizeObserver(() => sizeCanvas());
  canvasObserver.observe(noteBody);
  canvasObserver.observe(editor);
  sizeCanvas();

  // --- Calculator (Abicus-style) -----------------------------------------
  // A small expression calculator: decimal comma, implicit multiplication,
  // degrees/radians, ans and a clickable history. No eval().
  const calc = $('#calc');
  const calcInput = $('#calcInput');
  const calcOut = $('#calcOut');
  const calcHistory = $('#calcHistory');
  const angleBtn = $('#angleBtn');
  let degrees = localStorage.getItem('kiviruukki.calcAngle') !== 'rad';
  let ans = 0;
  let history = [];
  try{ history = JSON.parse(localStorage.getItem('kiviruukki.calcHistory') || '[]'); }catch(_){ history = []; }
  if (history.length) ans = history[history.length-1].value;
  let recall = -1;

  function tokenize(src){
    const s = src.replace(/[×·*⋅]/g,'*').replace(/[÷:]/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'');
    const out = [];
    let i = 0;
    while (i < s.length){
      const c = s[i];
      const num = /^(\d+(?:[.,]\d*)?|[.,]\d+)(?:[eE](?![a-zA-Z])[+-]?\d+)?/.exec(s.slice(i));
      if (num){ out.push({t:'num', v:parseFloat(num[0].replace(',', '.'))}); i += num[0].length; continue; }
      const id = /^[a-zA-Zπ√]+/.exec(s.slice(i));
      if (id){
        let w = id[0];
        // split things like "sin" + "x" is not needed; but allow "2pi", "pie" etc. by greedy known-name match
        while (w){
          const name = ['asin','acos','atan','arcsin','arccos','arctan','sinh','cosh','tanh','sin','cos','tan','sqrt','abs','exp','ln','log','lg','ans','pi','π','√','e'].find(n => w.toLowerCase().startsWith(n));
          if (!name) throw new Error('Tuntematon nimi: ' + w);
          out.push({t:'id', v:name}); w = w.slice(name.length); i += name.length;
        }
        continue;
      }
      if ('+-*/^()!%'.includes(c)){ out.push({t:'op', v:c}); i++; continue; }
      throw new Error('Tuntematon merkki: ' + c);
    }
    return out;
  }
  const FUNCS = {
    sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => {
      if (degrees && Math.abs(((x % 180) + 180) % 180 - 90) < 1e-12) throw new Error('tan ei ole määritelty');
      return Math.tan(toRad(x));
    },
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    sqrt: Math.sqrt, '√': Math.sqrt, abs: Math.abs, exp: Math.exp, ln: Math.log, log: Math.log10, lg: Math.log10
  };
  FUNCS.arcsin = FUNCS.asin; FUNCS.arccos = FUNCS.acos; FUNCS.arctan = FUNCS.atan;
  function toRad(x){ return degrees ? x * Math.PI / 180 : x; }
  function fromRad(x){ return degrees ? x * 180 / Math.PI : x; }
  function factorial(n){
    if (n < 0 || !Number.isInteger(n)) throw new Error('Kertoma vain luonnollisille luvuille');
    if (n > 170) return Infinity;
    let r = 1; for (let k = 2; k <= n; k++) r *= k; return r;
  }
  function evaluate(src){
    const tk = tokenize(src);
    let p = 0;
    const peek = () => tk[p];
    const isOp = v => peek() && peek().t === 'op' && peek().v === v;
    // implicit multiplication starts with a number, name or "("
    const startsFactor = () => peek() && (peek().t === 'num' || peek().t === 'id' || (peek().t === 'op' && peek().v === '('));
    function expr(){
      let v = term();
      while (isOp('+') || isOp('-')){ const o = tk[p++].v; const r = term(); v = o === '+' ? v + r : v - r; }
      return v;
    }
    function term(){
      let v = unary();
      for (;;){
        if (isOp('*') || isOp('/')){ const o = tk[p++].v; const r = unary(); v = o === '*' ? v * r : v / r; }
        else if (startsFactor()) v *= power();
        else return v;
      }
    }
    function unary(){
      if (isOp('-')){ p++; return -unary(); }
      if (isOp('+')){ p++; return unary(); }
      return power();
    }
    function power(){
      const b = postfix();
      if (isOp('^')){ p++; return Math.pow(b, unary()); }
      return b;
    }
    function postfix(){
      let v = primary();
      for (;;){
        if (isOp('!')){ p++; v = factorial(v); }
        else if (isOp('%')){ p++; v = v / 100; }
        else return v;
      }
    }
    function primary(){
      const t = tk[p++];
      if (!t) throw new Error('Lauseke loppuu kesken');
      if (t.t === 'num') return t.v;
      if (t.t === 'op' && t.v === '('){ const v = expr(); if (isOp(')')) p++; return v; } // missing ")" is forgiven
      if (t.t === 'id'){
        if (t.v === 'pi' || t.v === 'π') return Math.PI;
        if (t.v === 'e') return Math.E;
        if (t.v === 'ans') return ans;
        const f = FUNCS[t.v];
        if (isOp('(')) return f(primary());
        return f(power()); // e.g. √2, sin30
      }
      throw new Error('Odottamaton merkki: ' + t.v);
    }
    const v = expr();
    if (p < tk.length) throw new Error('Odottamaton merkki: ' + tk[p].v);
    if (Number.isNaN(v)) throw new Error('Ei määritelty');
    return v;
  }
  function fmt(v){
    if (!Number.isFinite(v)) return v > 0 ? '∞' : v < 0 ? '−∞' : 'Ei määritelty';
    if (v === 0) return '0';
    if (Math.abs(v) < 1e-12) v = 0;
    const a = Math.abs(v);
    let s;
    if (a !== 0 && (a >= 1e12 || a < 1e-6)){
      const [m, ex] = v.toExponential(9).split('e');
      s = m.replace(/\.?0+$/, '') + '·10^' + Number(ex);
    } else {
      s = String(Number(v.toPrecision(12)));
    }
    return s.replace('.', ',').replace(/-/g, '−');
  }
  function renderHistory(){
    calcHistory.innerHTML = '';
    history.slice(-50).forEach(h => {
      const row = document.createElement('div');
      row.className = 'calc-row';
      row.title = 'Käytä tulosta';
      const ex = document.createElement('span'); ex.className = 'ex'; ex.textContent = h.expr;
      const res = document.createElement('span'); res.className = 'res'; res.textContent = '= ' + fmt(h.value);
      row.append(ex, res);
      row.addEventListener('click', () => insertCalc(fmt(h.value).replace('−', '-')));
      calcHistory.append(row);
    });
    calcHistory.scrollTop = calcHistory.scrollHeight;
  }
  function runCalc(){
    const src = calcInput.value.trim();
    if (!src) return;
    try{
      const v = evaluate(src);
      ans = v;
      history.push({expr: src, value: v});
      if (history.length > 50) history = history.slice(-50);
      try{ localStorage.setItem('kiviruukki.calcHistory', JSON.stringify(history)); }catch(_){}
      calcOut.classList.remove('err');
      calcOut.textContent = '= ' + fmt(v);
      calcInput.value = '';
      recall = -1;
      renderHistory();
    }catch(err){
      calcOut.classList.add('err');
      calcOut.textContent = err.message || 'Virhe';
    }
  }
  function insertCalc(text){
    const a = calcInput.selectionStart ?? calcInput.value.length, b = calcInput.selectionEnd ?? a;
    // starting a new line with an operator continues from the previous result
    if (!calcInput.value && /^[+·*/^−-]/.test(text) && history.length && text !== '−') text = 'ans' + text;
    calcInput.setRangeText(text, a, b, 'end');
    calcInput.focus();
  }
  function setAngle(deg){
    degrees = deg;
    angleBtn.textContent = deg ? 'DEG' : 'RAD';
    angleBtn.title = deg ? 'Kulmat asteina – vaihda radiaaneihin' : 'Kulmat radiaaneina – vaihda asteisiin';
    localStorage.setItem('kiviruukki.calcAngle', deg ? 'deg' : 'rad');
  }
  setAngle(degrees);
  angleBtn.addEventListener('click', () => setAngle(!degrees));
  $('#calcKeys').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  $('#calcKeys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ins) insertCalc(b.dataset.ins);
    else if (b.dataset.act === 'eval') runCalc();
    else if (b.dataset.act === 'back'){
      const a = calcInput.selectionStart, z = calcInput.selectionEnd;
      if (a !== z) calcInput.setRangeText('', a, z, 'end');
      else if (a > 0) calcInput.setRangeText('', a - 1, a, 'end');
      calcInput.focus();
    }
    else if (b.dataset.act === 'clear'){
      if (!calcInput.value && !calcOut.textContent){ history = []; localStorage.removeItem('kiviruukki.calcHistory'); renderHistory(); }
      calcInput.value = ''; calcOut.textContent = ''; calcOut.classList.remove('err'); calcInput.focus();
    }
  });
  calcInput.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); runCalc(); }
    else if (e.key === 'Escape'){ toggleCalc(false); }
    else if (e.key === 'ArrowUp' && history.length){
      e.preventDefault();
      recall = recall < 0 ? history.length - 1 : Math.max(0, recall - 1);
      calcInput.value = history[recall].expr;
    } else if (e.key === 'ArrowDown' && recall >= 0){
      e.preventDefault();
      recall++;
      calcInput.value = recall < history.length ? history[recall].expr : '';
      if (recall >= history.length) recall = -1;
    }
  });

  const calcBtn = $('#calcBtn');
  function clampCalc(){
    const r = calc.getBoundingClientRect();
    const x = Math.min(Math.max(8, r.left), innerWidth - r.width - 8);
    const y = Math.min(Math.max(8, r.top), innerHeight - 60);
    calc.style.left = x + 'px'; calc.style.top = y + 'px'; calc.style.right = 'auto'; calc.style.bottom = 'auto';
  }
  function toggleCalc(force){
    const open = typeof force === 'boolean' ? force : !calc.classList.contains('open');
    calc.classList.toggle('open', open);
    calcBtn.classList.toggle('pink', open);
    localStorage.setItem('kiviruukki.calcOpen', open ? '1' : '0');
    if (open){
      if (calc.style.left) clampCalc();
      calcInput.focus();
    }
  }
  calcBtn.addEventListener('click', () => toggleCalc());
  $('#calcClose').addEventListener('click', () => toggleCalc(false));
  try{
    const pos = JSON.parse(localStorage.getItem('kiviruukki.calcPos') || 'null');
    if (pos){ calc.style.left = pos.x + 'px'; calc.style.top = pos.y + 'px'; calc.style.right = 'auto'; calc.style.bottom = 'auto'; }
  }catch(_){}
  const calcHead = $('#calcHead');
  calcHead.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = calc.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    calcHead.setPointerCapture(e.pointerId);
    const move = ev => {
      calc.style.left = Math.min(Math.max(0, ev.clientX - dx), innerWidth - r.width) + 'px';
      calc.style.top = Math.min(Math.max(0, ev.clientY - dy), innerHeight - 50) + 'px';
      calc.style.right = 'auto'; calc.style.bottom = 'auto';
    };
    const up = () => {
      calcHead.removeEventListener('pointermove', move);
      calcHead.removeEventListener('pointerup', up);
      calcHead.removeEventListener('pointercancel', up);
      localStorage.setItem('kiviruukki.calcPos', JSON.stringify({x: parseFloat(calc.style.left), y: parseFloat(calc.style.top)}));
    };
    calcHead.addEventListener('pointermove', move);
    calcHead.addEventListener('pointerup', up);
    calcHead.addEventListener('pointercancel', up);
  });
  window.addEventListener('resize', () => { if (calc.classList.contains('open') && calc.style.left) clampCalc(); });
  renderHistory();
  if (localStorage.getItem('kiviruukki.calcOpen') === '1'){ calc.classList.add('open'); calcBtn.classList.add('pink'); requestAnimationFrame(() => { if (calc.style.left) clampCalc(); }); }

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden || !running) return;
    remainingMs=Math.max(0,endAt-performance.now());
    if(remainingMs<=0) finishTimer(); else renderTimer();
  });
})();
</script>
</body>
</html>
