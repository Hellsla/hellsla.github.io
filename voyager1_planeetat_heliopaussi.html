<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voyager 1 – etäisyys Auringosta</title>
<style>
  :root{
    --ink:#2b2a28;
    --muted:#7a7772;
    --line:#bdb9b3;
    --accent:#d84a62;
    --sun:#ffd95a;
    --sun2:#f28c28;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
  body{display:grid;place-items:center;overflow:hidden}
  .sim{
    width:min(100vw,1280px);
    aspect-ratio:16/9;
    position:relative;
    background:#fff;
    padding:3.5% 5% 4.5%;
  }
  svg{width:100%;height:74%;display:block}
  .controls{
    height:26%;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:20px;
    padding:0 2%;
  }
  .year{
    font-size:clamp(18px,2.2vw,34px);
    font-weight:700;
    min-width:120px;
  }
  .readout{
    position:absolute;
    right:7%;
    top:8%;
    text-align:right;
    line-height:1.2;
  }
  .readout .small{
    font-size:clamp(14px,1.35vw,21px);
    color:var(--muted);
  }
  .readout .big{
    font-size:clamp(24px,3vw,48px);
    font-weight:700;
    margin-top:4px;
  }
  input[type=range]{
    width:100%;
    accent-color:var(--ink);
  }
  button{
    border:2px solid var(--ink);
    background:#fff;
    color:var(--ink);
    padding:9px 15px;
    border-radius:9px;
    font-size:clamp(14px,1.4vw,20px);
    cursor:pointer;
    box-shadow:2px 2px 0 #d8d5d0;
  }
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #d8d5d0}
  .sketch{stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:700px){
    .sim{padding:5% 4%}
    .controls{grid-template-columns:1fr auto;grid-template-rows:auto auto}
    .year{grid-column:1 / -1}
    .readout{right:6%;top:5%}
  }
</style>
</head>
<body>
<div class="sim">
  <div class="readout">
    <div class="small">Etäisyys Auringosta</div>
    <div class="big" id="distance">1,0 AU • 0,15 mrd km</div>
  </div>

  <svg viewBox="0 0 1200 520" aria-label="Voyager 1:n etäisyys Auringosta">
    <defs>
      <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#77736e" stroke-width="1" opacity=".22"/>
      </pattern>
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="1" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/>
      </filter>
    </defs>

    <!-- Aurinko -->
    <g transform="translate(105,274)" filter="url(#rough)">
      <circle r="47" fill="#ffd95a" stroke="#2b2a28" stroke-width="4"/>
      <circle r="39" fill="url(#hatch)" opacity=".55"/>
      <g stroke="#f28c28" stroke-width="4" class="sketch">
        <line x1="0" y1="-69" x2="0" y2="-88"/>
        <line x1="0" y1="69" x2="0" y2="88"/>
        <line x1="-69" y1="0" x2="-88" y2="0"/>
        <line x1="69" y1="0" x2="88" y2="0"/>
        <line x1="-49" y1="-49" x2="-63" y2="-63"/>
        <line x1="49" y1="-49" x2="63" y2="-63"/>
        <line x1="-49" y1="49" x2="-63" y2="63"/>
        <line x1="49" y1="49" x2="63" y2="63"/>
      </g>
    </g>

    <!-- Reitti -->
    <path d="M165 274 C380 257, 690 285, 1085 250"
          fill="none" stroke="#5a5753" stroke-width="3.5"
          stroke-dasharray="10 12" class="sketch"/>

    <!-- kevyt etäisyysviiva -->
    <line x1="165" y1="336" x2="1085" y2="336" stroke="#bdb9b3" stroke-width="2"/>
    <line id="distanceLine" x1="165" y1="336" x2="165" y2="336" stroke="#2b2a28" stroke-width="3"/>
    <circle cx="165" cy="336" r="4" fill="#2b2a28"/>
    <circle id="lineDot" cx="165" cy="336" r="5" fill="#2b2a28"/>


    <!-- Planeetat, keskietäisyys Auringosta (AU), sama visuaalinen asteikko kuin Voyagerilla -->
    <g id="planets" font-size="16" fill="#2b2a28">
      <g class="planet" data-au="0.39"><circle r="4" fill="#77736e"/><text y="22" text-anchor="middle">Merkurius</text></g>
      <g class="planet" data-au="0.72"><circle r="6" fill="#c9a46b"/><text y="-16" text-anchor="middle">Venus</text></g>
      <g class="planet" data-au="1.00"><circle r="6" fill="#2e86a6"/><text y="22" text-anchor="middle">Maa</text></g>
      <g class="planet" data-au="1.52"><circle r="5" fill="#c86a4a"/><text y="-16" text-anchor="middle">Mars</text></g>
      <g class="planet" data-au="5.20"><circle r="11" fill="#c99b72"/><text y="28" text-anchor="middle">Jupiter</text></g>
      <g class="planet" data-au="9.58"><circle r="9" fill="#d6c18a"/><ellipse rx="16" ry="4" fill="none" stroke="#77736e" stroke-width="1.5"/><text y="-18" text-anchor="middle">Saturnus</text></g>
      <g class="planet" data-au="19.2"><circle r="7" fill="#8fc9d8"/><text y="24" text-anchor="middle">Uranus</text></g>
      <g class="planet" data-au="30.1"><circle r="7" fill="#4c78b8"/><text y="-18" text-anchor="middle">Neptunus</text></g>
    </g>


    <!-- Heliopaussi: Voyager 1 siirtyi tähtienväliseen avaruuteen 25.8.2012, noin 122 AU -->
    <g id="heliopauseMarker">
      <line id="heliopauseLine" x1="0" y1="205" x2="0" y2="362"
            stroke="#d84a62" stroke-width="3" stroke-dasharray="7 7" class="sketch"/>
      <circle id="heliopauseDot" cx="0" cy="336" r="6" fill="#d84a62"/>
      <text id="heliopauseText" x="0" y="190" text-anchor="middle"
            font-size="18" font-weight="700" fill="#d84a62">Heliopaussi 2012</text>
      <text id="heliopauseSub" x="0" y="213" text-anchor="middle"
            font-size="15" fill="#7a7772">tähtienvälinen avaruus</text>
    </g>

    <!-- Voyager -->
    <g id="voyager" transform="translate(165,274)" filter="url(#rough)">
      <line x1="-4" y1="-5" x2="-30" y2="-30" stroke="#2b2a28" stroke-width="4"/>
      <line x1="-30" y1="-30" x2="-57" y2="-44" stroke="#2b2a28" stroke-width="3"/>
      <circle cx="2" cy="1" r="18" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
      <ellipse cx="5" cy="-4" rx="35" ry="12" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
      <ellipse cx="5" cy="-4" rx="29" ry="8" fill="url(#hatch)"/>
      <line x1="26" y1="4" x2="63" y2="31" stroke="#2b2a28" stroke-width="3"/>
      <line x1="60" y1="28" x2="83" y2="28" stroke="#2b2a28" stroke-width="3"/>
      <line x1="60" y1="31" x2="76" y2="47" stroke="#2b2a28" stroke-width="3"/>
      <rect x="-11" y="13" width="20" height="24" rx="2" fill="url(#hatch)" stroke="#2b2a28" stroke-width="3"/>
      <text x="-30" y="-58" font-size="22" font-weight="700" fill="#2b2a28">Voyager 1</text>
    </g>
  </svg>

  <div class="controls">
    <div class="year" id="yearText">Vuosi 1977</div>
    <input id="yearSlider" type="range" min="1977" max="2050" step="1" value="1977" aria-label="Vuosi">
    <button id="resetBtn">Nollaa</button>
  </div>
</div>

<script>
(() => {
  // NASA:n julkaisemista virstanpylväistä muodostettu opetuskäyttöön sopiva
  // pala palalta lineaarinen etäisyysmalli (etäisyys Auringosta, AU).
  const anchors = [
    [1977, 1.0],
    [1979, 5.2],
    [1980, 9.6],
    [1990, 40.0],
    [1998, 69.4],
    [2004, 94.0],
    [2006, 100.0],
    [2012, 121.7],
    [2026.64, 171.525]
  ];

  const AU_KM = 149597870.7;
  const FUTURE_AU_PER_YEAR = 3.5;

  const slider = document.getElementById('yearSlider');
  const yearText = document.getElementById('yearText');
  const distanceText = document.getElementById('distance');
  const voyager = document.getElementById('voyager');
  const distanceLine = document.getElementById('distanceLine');
  const lineDot = document.getElementById('lineDot');
  const resetBtn = document.getElementById('resetBtn');
  const planets = [...document.querySelectorAll('.planet')];
  const heliopauseLine = document.getElementById('heliopauseLine');
  const heliopauseDot = document.getElementById('heliopauseDot');
  const heliopauseText = document.getElementById('heliopauseText');
  const heliopauseSub = document.getElementById('heliopauseSub');

  const xMin = 165;
  const xMax = 1085;
  const maxShownAU = distanceAt(2050);

  function distanceAt(year){
    if (year <= anchors[0][0]) return anchors[0][1];

    for (let i = 0; i < anchors.length - 1; i++){
      const [y0, d0] = anchors[i];
      const [y1, d1] = anchors[i + 1];
      if (year <= y1){
        const t = (year - y0) / (y1 - y0);
        return d0 + t * (d1 - d0);
      }
    }

    const [lastYear, lastDist] = anchors[anchors.length - 1];
    return lastDist + (year - lastYear) * FUTURE_AU_PER_YEAR;
  }

  function fmt(n, digits=1){
    return n.toLocaleString('fi-FI', {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }


  function xForAU(au){
    const p = Math.log1p(au) / Math.log1p(maxShownAU);
    return xMin + p * (xMax - xMin);
  }


  function positionHeliopause(){
    const x = xForAU(121.7);
    heliopauseLine.setAttribute('x1', x);
    heliopauseLine.setAttribute('x2', x);
    heliopauseDot.setAttribute('cx', x);
    heliopauseText.setAttribute('x', x);
    heliopauseSub.setAttribute('x', x);
  }

  function positionPlanets(){
    planets.forEach((g, i) => {
      const au = Number(g.dataset.au);
      const x = xForAU(au);
      const y = 274 - 24 * (Math.log1p(au) / Math.log1p(maxShownAU));
      g.setAttribute('transform', `translate(${x},${y})`);
    });
  }

  function update(){
    const year = Number(slider.value);
    const au = distanceAt(year);
    const billionKm = au * AU_KM / 1e9;

    yearText.textContent = `Vuosi ${year}`;
    distanceText.textContent = `${fmt(au,1)} AU • ${fmt(billionKm,2)} mrd km`;

    // Logaritmimainen visualisointi, jotta alkuvuodetkin näkyvät selvästi.
    const p = Math.log1p(au) / Math.log1p(maxShownAU);
    const x = xForAU(au);
    const y = 274 - 24 * p + 12 * Math.sin(p * Math.PI * 2);

    voyager.setAttribute('transform', `translate(${x},${y})`);
    distanceLine.setAttribute('x2', x);
    lineDot.setAttribute('cx', x);
  }

  slider.addEventListener('input', update);
  resetBtn.addEventListener('click', () => {
    slider.value = 1977;
    update();
  });

  positionPlanets();
  positionHeliopause();
  update();
})();
</script>
</body>
</html>
