     "id": "fy1-1-L1-06",
     "number": "1-6",
     "level": 1,
     "html": "<p class=\"task\">Fysiikassa havainnot ja mallit ovat eri asioita. Esimerkiksi havainto on, että pudotettu kivi osuu maahan nopeammin kuin pudotettu höyhen. Mikä seuraavista erottaa fysikaalisen mallin pelkästä havainnosta?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Malli on teoria, jota ei voi enää muuttaa sen jälkeen, kun sen on kerran todettu toimivan.</span></label></li><li><label><span>Malli on ilmiön täydellinen kuvaus, ja jos mittaus poikkeaa siitä, mittaus on aina virheellinen.</span></label></li><li><label><span>Malli on havainto, joka on toistettu niin monta kertaa, että se pätee varmasti kaikissa oloissa.</span></label></li><li><label><span>Mallista voi päätellä ennusteen uuteen tilanteeseen, ja ennusteen voi testata mittauksella.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Mallista voi päätellä ennusteen uuteen tilanteeseen, ja ennusteen voi testata mittauksella."
    },

     "level": 3,
     "html": "<p class=\"task\">Voyager 2 ylitti heliopaussin 5. marraskuuta 2018 etäisyydellä <span><math><semantics><mrow><msub><mi>d</mi><mn>0</mn></msub><mo>=</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext></mrow></semantics></math></span> Auringosta, ja sen nopeus Aurinkoon nähden on <span class=\"math-glue\"><span><math><semantics><mrow><mi>v</mi><mo>=</mo><mn>15</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>341</mn> <mtext>km/s</mtext></mrow></semantics></math></span>.</span> Tasaisen liikkeen malli on <span><math><semantics><mrow><mi>d</mi><mo>=</mo><msub><mi>d</mi><mn>0</mn></msub><mo>+</mo><mi>v</mi><mi>t</mi></mrow></semantics></math></span>⁠.</p><p class=\"task more\">Oppilas laski mallin ennusteen helmikuulle 2026, jolloin heliopaussin ylityksestä on kulunut <span class=\"math-glue\"><span><math><semantics><mrow><mi>t</mi><mo>=</mo><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>25</mn> <mtext>a</mtext></mrow></semantics></math></span>.</span> Oppilaan ratkaisu: ”Matka on <span><math><semantics><mrow><mi>s</mi><mo>=</mo><mi>v</mi><mi>t</mi><mo>=</mo><mn>15</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>341</mn> <mtext>km/s</mtext><mo>⋅</mo><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>25</mn><mo>=</mo><mn>111</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>km</mtext></mrow></semantics></math></span>⁠. Etäisyys on <span><math><semantics><mrow><mi>d</mi><mo>=</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext><mo>+</mo><mn>111</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>km</mtext><mo>≈</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext></mrow></semantics></math></span>⁠. Voyager olisi siis lähes samassa paikassa kuin 2018, joten malli on väärä.”</p><p class=\"task more\">Käytä arvoja <span><math><semantics><mrow><mn>1</mn> <mtext>AU</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>496</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>km</mtext></mrow></semantics></math></span> ja <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn> <mtext>a</mtext><mo>=</mo><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>156</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>7</mn></msup> <mtext>s</mtext></mrow></semantics></math></span>.</span> Mittaus antoi helmikuussa 2026 arvon <span class=\"math-glue\"><span><math><semantics><mrow><mn>143</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>05</mn> <mtext>AU</mtext></mrow></semantics></math></span>.</span></p><p class=\"task more\">Etsi oppilaan virhe ja laske mallin oikea ennuste etäisyydelle <span><math><semantics><mrow><mi>d</mi></mrow></semantics></math></span> tähtitieteellisinä yksikköinä. Selitä, miksi mittaus tukee mallia mutta ei todista, että Voyager liikkuu samalla nopeudella aina.</p>",

     "number": "3-6",

     "html": "<p class=\"task\">Mikä seuraavista tilanteista on esimerkki systemaattisesta virheestä?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Oppilas katsoo asteikkoa milloin vasemmalta, milloin oikealta, ja lukemat vaihtelevat sen mukaan.</span></label></li><li><label><span>Oppilas kirjaa tuloksen <span><math><semantics><mrow><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>42</mn> <mtext>s</mtext></mrow></semantics></math></span> muistiin muodossa <span class=\"math-glue\"><span><math><semantics><mrow><mn>34</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>s</mtext></mrow></semantics></math></span>.</span></span></label></li><li><label><span>Käsikellon pysäytys osuu milloin liian aikaisin, milloin liian myöhään, joten ajat vaihtelevat kerrasta toiseen.</span></label></li><li><label><span>Lämpömittarin nollakohta on väärin, joten se näyttää jäävedessä joka kerralla noin <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <msup><mrow></mrow><mo>∘</mo></msup><mtext>C</mtext></mrow></semantics></math></span>.</span></span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",

     "level": 1,
     "html": "<p class=\"task\">Uima-altaaseen lasketaan vettä. Veden korkeus <span><math><semantics><mrow><mi>h</mi></mrow></semantics></math></span> ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona noudattaa mittausten mukaan suoraa <span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>50</mn> <mfrac><mtext>cm</mtext><mtext>min</mtext></mfrac><mo>⋅</mo><mi>t</mi><mo>+</mo><mn>12</mn> <mtext>cm</mtext></mrow></semantics></math></span>⁠. Kuinka korkealla veden pinta on, kun hanaa on pidetty auki 30 minuuttia? Anna vastaus senttimetreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>27</mn> <mtext>cm</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-03",
     "number": "4-3",
     "level": 1,
     "html": "<p class=\"task\">Nurmikon pituutta <span><math><semantics><mrow><mi>h</mi></mrow></semantics></math></span> seurattiin vuorokausien <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona, ja sovitettu suora on <span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>60</mn> <mfrac><mtext>cm</mtext><mtext>vrk</mtext></mfrac><mo>⋅</mo><mi>t</mi><mo>+</mo><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext></mrow></semantics></math></span>⁠. Monenako vuorokautena mittauksen alusta nurmikko on <span><math><semantics><mrow><mn>10</mn> <mtext>cm</mtext></mrow></semantics></math></span> pitkä? Anna vastaus vuorokausina.</p>",
     "answer": "<span><math><semantics><mrow><mn>10</mn> <mtext>vrk</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-04",
     "number": "4-4",
     "level": 1,
     "html": "<p class=\"task\">Kynttilä palaa tasaisesti. Mittauspisteisiin sovitettu suora kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>h</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>20</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>h</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>14</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta, kun <span><math><semantics><mrow><mi>y</mi></mrow></semantics></math></span>-akselilla on kynttilän pituus. Mikä on suoran kulmakerroin? Anna vastaus etumerkkeineen yksikössä cm/h.</p>",
     "answer": "<span><math><semantics><mrow><mo>−</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>cm/h</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-05",
     "number": "4-5",
     "level": 1,
     "html": "<p class=\"task scenario\">Kopiopaperipinon massa <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> on suoraan verrannollinen arkkien määrään <span class=\"math-glue\"><span><math><semantics><mrow><mi>N</mi></mrow></semantics></math></span>,</span> joten massa esitetään origon kautta kulkevalla suoralla. Kun <span class=\"math-glue\"><span><math><semantics><mrow><mi>N</mi><mo>=</mo><mn>250</mn></mrow></semantics></math></span>,</span> massa on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>kg</mtext></mrow></semantics></math></span>.</span></p><p class=\"task ask\">Kuinka suuri on yhden arkin massa? Anna vastaus grammoina.</p>",
     "answer": "<span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>g</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-06",
     "number": "4-6",
     "level": 1,
     "html": "<p class=\"task\">Kokeessa saatiin kuusi mittauspistettä, jotka asettuvat likimain suoralle mutta hajoavat sen ympärille mittausepävarmuuden vuoksi. Mikä seuraavista kuvaa oikein, miten pisteisiin sovitetaan suora?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Pisteet yhdistetään murtoviivaksi, koska jokainen mittaus on yhtä tärkeä.</span></label></li><li><label><span>Suora piirretään ensimmäisen ja viimeisen pisteen kautta, koska ne rajaavat mittausalueen.</span></label></li><li><label><span>Suora piirretään mahdollisimman monen pisteen kautta ja loput pisteet jätetään huomiotta.</span></label></li><li><label><span>Suora kulkee pisteiden joukon keskeltä ja pisteitä jää sen molemmille puolille.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Suora kulkee pisteiden joukon keskeltä ja pisteitä jää sen molemmille puolille."
    },
    {
     "id": "fy1-4-L1-07",
     "number": "4-7",
     "level": 1,
     "html": "<p class=\"task\">Saman metallin eri kokoisten kappaleiden massa <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> grammoina mitattiin tilavuuden <span><math><semantics><mrow><mi>V</mi></mrow></semantics></math></span> funktiona kuutiosenttimetreinä. Mittauspisteisiin sovitettu suora kulkee origon kautta, ja sen kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn></mrow></semantics></math></span>.</span> Mitä kulmakerroin kertoo?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <mtext>g</mtext></mrow></semantics></math></span> ja kertoo kappaleen massan, kun tilavuus on nolla.</span></label></li><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja kertoo, montako grammaa massaa on yhtä kuutiosenttimetriä kohti.</span></label></li><li><label><span>Kulmakerroin on pelkkä luku ilman yksikköä, koska se kertoo vain suoran jyrkkyyden.</span></label></li><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>cm</mtext><mn>3</mn></msup><mi mathvariant=\"normal\">/</mi><mtext>g</mtext></mrow></semantics></math></span> ja kertoo, kuinka suuren tilavuuden yksi gramma täyttää.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja kertoo, montako grammaa massaa on yhtä kuutiosenttimetriä kohti."
    },
    {
     "id": "fy1-4-L1-08",
     "number": "4-8",
     "level": 1,
     "html": "<p class=\"task\">Jousen pituus <span><math><semantics><mrow><mi>l</mi></mrow></semantics></math></span> mitattiin kuorman massan <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> funktiona. Mittauspisteisiin sovitettu suora kulkee pisteen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>kg</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta, ja sen kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mfrac><mtext>cm</mtext><mtext>kg</mtext></mfrac></mrow></semantics></math></span>.</span> Kuinka pitkä jousi on ilman kuormaa? Anna vastaus senttimetreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>cm</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L2-01",
     "number": "4-9",
     "level": 2,
     "html": "<p class=\"task\">Pyöräilijän kulkema matka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> mitattiin kilometreinä ja aika <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> minuutteina. Mittauspisteisiin sovitettu suora kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>min</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>30</mn> <mtext>km</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>10</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>min</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>50</mn> <mtext>km</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta. Mikä on suoran kulmakerroin yksikössä m/s?</p>",
     "answer": "<span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L2-02",
     "number": "4-10",
     "level": 2,
     "html": "<p class=\"task\">Kuvaajassa on tasaisesti liikkuvan kärryn kulkema matka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona kuudessa mittauksessa.</p><p class=\"task more\">Sovita pisteisiin silmämääräisesti suora (piirrä pisteet ruutupaperille tai aseta viivoitin kuvan päälle) ja arvioi sen avulla, kuinka pitkän matkan kärry on kulkenut hetkellä <span class=\"math-glue\"><span><math><semantics><mrow><mi>t</mi><mo>=</mo><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>,</span> kun liike jatkuu samanlaisena. Anna vastaus metreinä.</p><img alt=\"Kuvaaja mittakaavassa: kärryn kulkema matka s ajan t funktiona, kuusi mittauspistettä ilman sovitettua suoraa. Pisteet ovat (1 s; 0,6 m), (2 s; 0,8 m), (3 s; 1,6 m), (4 s; 2,1 m), (5 s; 2,4 m) ja (6 s; 2,9 m). Aika-akseli jatkuu 9 sekuntiin ja matka-akseli 4,5 metriin, ruudukon väli on 1 s ja 0,5 m.\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHAAAAKkCAIAAADna1+OAAAQAElEQVR4nOzdB2ATZR/H8SdJ96KT0ZZR9gbZijhf90JQWaKAooIKMkTcoqKCIFuQITJFQUFlKIiK7CF7QxltKXTvkSZp3qc9CKWUjmM1l+/nzVv+SZ4U4mXc7/53zzlZrVYBAAAAACg7vQAAAAAAqOIkys5qzTVmphqNGRZTjsWSYzGbLOYceaMAAAAAAHug0+kNTi4GJ2eDwcXg7OLq5uXq7i1vFGWkK/0ufzI1ZaYnZmemGLPSBAAAAABoi6u7j5uHj4eXv8xapXxIqQJVbq45NfFsekqM7RYXN09XN28nZ9f8VOciCxVhDgAAAABuCqs112wyyqaRvMhCNo1yjBm2e70qVPLxD9brDSX+nhIClfxr0pNjUpPOKnv0yd/r7lnBxU32wnQCAAAAALRCRp6c7PSsjOT0lFiRv0+gj18VL99KxbeOigtUMqvFRR+RcU3W7l5+vgFVS9/5AgAAAAB7JHNQcnxkVkaSrJ2cXYOC6xWTg64YqIzZafFnj1tzLc6uHn5B1V1cPQUAAAAAOAbZrUqKjzAZM3V6Q1CVOi5uXkUOKzpQZaTFJ8WekoWnT6BfUA0BAAAAAI4nMfZkZlqCLPwrhXl4BVw+oIhAlZmemBhzQhbeflUq+IcIAAAAAHBUKQlRacnnZOFfMczDu3CmKnx8lTE7TUlTFQJCSVMAAAAAHJwtGcluVU52eqF7LwlUFnNO/NnjsvDwDvT2rSwAAAAAwOF5+1VR9veLO3tMhqaCd10MVFZrblz0EWuuxcXN079iDQEAAAAAyOdfqYaLm5eMS3HRR5VzSikuBqqUhCizyWhwcgmsUlcAAAAAAC7SBVapI+OS2ZSdmnjGduv5QCX7Vukpcb      "html": "<p class=\"task\">Retkeilijä on kohdassa, joka on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>km</mtext></mrow></semantics></math></span>:</span>n päässä mökistä. Hän kävelee suoraa polkua mökistä poispäin tasaisesti nopeudella <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span> Kuinka kaukana mökistä hän on 10 minuutin kuluttua? Vastaa kilometreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn> <mtext>km</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-5-L2-04",
     "number": "5-12",
     "level": 2,
     "html": "<p class=\"task scenario\">Salaman jälkeen ukkosen jyrähdys kuuluu <span><math><semantics><mrow><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span> kuluttua. Ääni etenee ilmassa tasaisesti nopeudella <span class=\"math-glue\"><span><math><semantics><mrow><mn>343</mn> <mtext>m/s</mtext></mrow></semantics></math></span>,</span> ja valon kulkuaika on niin pieni, että se jätetään huomiotta.</p><p class=\"task ask\">Kuinka kaukana salama iski? Vastaa kilometreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>km</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-5-L2-05",
     "number": "5-13",
     "level": 2,
     "html": "<p class=\"task\">Kävelijän liikettä kuvattiin videolle, ja hänen paikkansa <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> lähtömerkistä mitattiin videoanalyysillä ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona. Kävelijä liikkuu tasaisesti, ja pisteet poikkeavat suorasta mittausepävarmuuden vuoksi.</p><p class=\"task more\">Piirrä pisteistä kuvaaja ja sovita pisteisiin suora. Määritä suoran kulmakertoimesta kävelijän nopeus ja ennusta sen avulla kävelijän paikka hetkellä <span class=\"math-glue\"><span><math><semantics><mrow><mn>12</mn> <mtext>s</mtext></mrow></semantics></math></span>.</span> Kuinka monta metriä lähtömerkistä hän silloin on? Perustele, miksi ennuste on mallin arvo eikä mittaus.</p><table class=\"exp-table ex-data\"><caption>Kävelijän paikka ajan funktiona</caption><thead><tr><th scope=\"col\"><span><math><semantics><mrow><mi>t</mi> <mo stretchy=\"false\">(</mo><mtext>s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th><th scope=\"col\"><span><math><semantics><mrow><mi>s</mi> <mo stretchy=\"false\">(</mo><mtext>m</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th></tr></thead><tbody><tr><td>0,0</td><td>1,2</td></tr><tr><td>1,0</td><td>2,7</td></tr><tr><td>2,0</td><td>3,9</td></tr><tr><td>3,0</td><td>5,5</td></tr><tr><td>4,0</td><td>6,7</td></tr><tr><td>5,0</td><td>8,3</td></tr></tbody></table>",
     "answer": "<span><math><semantics><mrow><mn>18</mn> <mtext>m</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-5-L2-06",
     "number": "5-14",
     "level": 2,
     "html": "<p class=\"task\">Kärry liikkuu tasaisesti radalla. Se on alussa kohdassa <span class=\"math-glue\"><span><math><semantics><mrow><msub><mi>s</mi><mn>0</mn></msub><mo>=</mo><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>,</span> ja hetkellä <span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span> se on kohdassa <span class=\"math-glue\"><span><math><semantics><mrow><mn>11</mn> <mtext>m</mtext></mrow></semantics></math></span>.</span> Oppilas päättelee: ”Kun aika kolminkertaistuu <span class=\"math-glue\"><span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>:</span>iin, paikka kolminkertaistuu, joten kärry on silloin kohdassa <span class=\"math-glue\"><span><math><semantics><mrow><mn>33</mn> <mtext>m</mtext></mrow></semantics></math></span>.</span>” Etsi oppilaan virhe ja laske kärryn oikea paikka hetkellä <span class=\"math-glue\"><span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>.</span></p>",
     "answer": "<span><math><semantics><mrow><mn>17</mn> <mtext>m</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-5-L2-07",
     "number": "5-15",
     "level": 2,
     "html": "<p class=\"task\">Leluauto ajaa tasaisesti nopeudella noin <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>80</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span> Auton kulkuaika mitataan käsin, ja ajanoton epävarmuus on noin <span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>s</mtext></mrow></semantics></math></span> riippumatta mitattavan ajan pituudesta.</p><p class=\"task more\">Suunnittelet nopeuden mittauksen, jossa ajan suhteellisen epävarmuuden pitää olla enintään <span class=\"math-glue\"><span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mi mathvariant=\"normal\">%</mi></mrow></semantics></math></span>.</span> Oleta, että matka mitataan niin tarkasti, ettei sen epävarmuus vaikuta tulokseen.</p><p class=\"task more\">Kuinka pitkän matkan auton on vähintään kuljettava mittauksen aikana? Selitä, miksi pitkä matka parantaa mittausta.</p>",
     "answer": "<span><math><semantics><mrow><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-5-L2-08",
     "number": "5-16",
     "level": 2,
     "html": "<p class=\"task\">Kävelijä seisoo ensin paikallaan <span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span> kohdassa, joka on <span class=\"math-glue\"><span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m</mtext></mrow></semantics></math></span>:</span>n päässä lähtöpisteestä. Sitten hän kävelee tasaisesti vauhdilla <span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m/s</mtext></mrow></semantics></math></span> suoraan takaisin kohti lähtöpistettä, kunnes on siinä. Paikka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> mitataan lähtöpisteestä.</p><p class=\"task more\">Mikä kuvaajista esittää kävelijän paikkaa <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona?</p><fieldset class=\"choice figures\"><ul class=\"choices\"><li><label><span>Kuvaaja D<img alt=\"Kuvaaja mittakaavassa: kuljettu matka Δs ajan t funktiona. Ruudukon väli on 1 s ja 2 m. Viiva on vaakasuora kohdassa Δs = 0 m aikavälillä 0–4 s ja nousee sitten suorana kohtaan Δs = 6 m hetkellä 10 s.\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb4AAAEkCAIAAADfEsObAAAQAElEQVR4nOzdB3wTZR8H8KfZSZPuQcumDNkbmQKypwtRwYEoIktBBRmCqICA7CGIIKDssqcMQUYZCshepbR0zzR7j/dJjzcUKEjaq2T8vuZTn7tcj6TX/vLc/e+e49ntdlIsdrvNqFMZjVqr2WS1mqwWs9ViojMJAID78fPjcHkCLo/P5Qq4fIFQJBWKZXQmKRY/V6OT5qNOIzfolEa9mgAAeDKhOEAkCZBIQ2iquvSNLkSnzWZRyTM0yiznHIHIXyiS8fjCgiwX0EaxIxwAoFTRfWKL2Ug7f/RBG7TzZzJqnc9KAyMDQqI5HO5Tru2popP+kxpFlio/g9kfp/+G2D9QIKJ9XT8CAOCZaKCZDBq9VqFRZpOCPfqA4ChpUOTTdAH/PTppQuek36QhTdtiaXBQaHlXe7YAAO6MppwiN0WvzadtuvccHl3jX1PuX6LTaFDnZty226x8oSQ4vKJA6E8AALwR7YHm5yabjTpaTwqPqiYQSZ+w8JOiU6vOzc9Oog3/gLDg8EoEAMDbybMTdeo82giJrCyRhj5uscdGp1aVm5+TRBuy4KjAkLIEAM      "number": "5-20",
     "level": 3,
     "html": "<p class=\"task\">Pyöräilijän paikka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> radan alusta mitattiin videoanalyysillä ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona. Piirrä pisteistä kuvaaja.</p><p class=\"task more\">Pyöräilijän nopeus muuttuu kesken matkan, joten liikettä ei voi mallintaa yhdellä suoralla. Etsi taulukosta hetki, jolloin nopeus muuttuu, ja mallinna liike kahtena tasaisena osana.</p><p class=\"task more\">Laske mallin avulla pyöräilijän keskinopeus aikavälillä <span><math><semantics><mrow><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext><mo>−</mo><mn>35</mn> <mtext>s</mtext></mrow></semantics></math></span>⁠, kun keskinopeus on aikavälillä kuljettu matka jaettuna aikavälin pituudella. Hetkeä <span><math><semantics><mrow><mn>35</mn> <mtext>s</mtext></mrow></semantics></math></span> ei ole taulukossa. Miksi keskinopeus ei ole osien nopeuksien keskiarvo?</p><table class=\"exp-table ex-data\"><caption>Pyöräilijän paikka ajan funktiona</caption><thead><tr><th scope=\"col\"><span><math><semantics><mrow><mi>t</mi> <mo stretchy=\"false\">(</mo><mtext>s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th><th scope=\"col\"><span><math><semantics><mrow><mi>s</mi> <mo stretchy=\"false\">(</mo><mtext>m</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span></th></tr></thead><tbody><tr><td>0,0</td><td>0,0</td></tr><tr><td>5,0</td><td>15,0</td></tr><tr><td>10,0</td><td>30,0</td></tr><tr><td>15,0</td><td>35,0</td></tr><tr><td>20,0</td><td>40,0</td></tr><tr><td>30,0</td><td>50,0</td></tr><tr><td>40,0</td><td>60,0</td></tr></tbody></table>",

     "level": 1,
     "html": "<p class=\"task\">Pallo päästetään putoamaan levosta, ja ilmanvastus jätetään huomiotta. Mikä on pallon nopeus, kun pudotuksen alusta on kulunut <span class=\"math-glue\"><span><math><semantics><mrow><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>?</span></p>",
     "answer": "<span><math><semantics><mrow><mn>29</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-02",
     "number": "6-2",
     "level": 1,
     "html": "<p class=\"task\">Omena irtoaa oksasta ja putoaa levosta maahan <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>80</mn> <mtext>s</mtext></mrow></semantics></math></span>:</span>ssa. Ilmanvastus jätetään huomiotta. Mikä on omenan nopeus maahan osuessa?</p>",
     "answer": "<span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-03",
     "number": "6-3",
     "level": 1,
     "html": "<p class=\"task\">Kuun pinnalla putoamiskiihtyvyys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>62</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Astronautti pudottaa kiven, joka putoaa levosta <span class=\"math-glue\"><span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>.</span> Mikä on kiven nopeus tämän ajan kuluttua?</p>",
     "answer": "<span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-04",
     "number": "6-4",
     "level": 1,
     "html": "<p class=\"task\">Vapaasti putoavan kappaleen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>v</mi><mo stretchy=\"false\">)</mo></mrow></semantics></math></span>-kuvaaja on suora, joka kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn> <mtext>s</mtext><mo separator=\"true\">;</mo> <mn>0</mn> <mtext>m/s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext><mo separator=\"true\">;</mo> <mn>49</mn> <mtext>m/s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta. Mikä on putoamiskiihtyvyys?</p>",
     "answer": "<span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-05",
     "number": "6-5",
     "level": 1,
     "html": "<p class=\"task\">Marsissa putoamiskiihtyvyys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>71</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Kappale putoaa Marsissa levosta <span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span> ilman ilmanvastusta. Mikä on kappaleen nopeus?</p>",
     "answer": "<span><math><semantics><mrow><mn>22</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-06",
     "number": "6-6",
     "level": 1,
     "html": "<p class=\"task\">Astronautti pudottaa Kuun pinnalla yhtä aikaa samalta korkeudelta levosta vasaran ja höyhenen. Kuussa ei ole ilmakehää. Mitä tapahtuu?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Höyhen osuu maahan ensin, koska se on kevyempi.</span></label></li><li><label><span>Vasara ja höyhen osuvat maahan yhtä aikaa.</span></label></li><li><label><span>Kumpikaan ei putoa, koska Kuussa ei ole ilmaa.</span></label></li><li><label><span>Vasara osuu maahan ensin, koska se on raskaampi.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Vasara ja höyhen osuvat maahan yhtä aikaa."
    },
    {
     "id": "fy1-6-L1-07",
     "number": "6-7",
     "level": 1,
     "html": "<p class=\"task\">Vapaasti putoavan kappaleen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>v</mi><mo stretchy=\"false\">)</mo></mrow></semantics></math></span>-kuvaaja on origon kautta kulkeva suora, jonka kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Mitä kulmakerroin kertoo?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Kappaleen nopeus on <span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span> vasta sekunnin kuluttua, ja sitä ennen se on nolla.</span></label></li><li><label><span>Kappale putoaa joka sekunti <span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m</mtext></mrow></semantics></math></span> lisää.</span></label></li><li><label><span>Nopeus kasvaa joka sekunti <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span></span></label></li><li><label><span>Kappaleen nopeus on koko ajan <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span></span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Nopeus kasvaa joka sekunti <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span>"
    },
    {
     "id": "fy1-6-L1-08",
     "number": "6-8",
     "level": 1,
     "html": "<p class=\"task\">Putoamiskiihtyvyys on Maan pinnalla <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>81</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Vapaasti putoavan kappaleen nopeus kasvaa siis joka sekunti <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>81</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span> Kuinka monta <span><math><semantics><mrow><mtext>km/h</mtext></mrow></semantics></math></span> nopeus kasvaa joka sekunti?</p>",
     "answer": "<span><math><semantics><mrow><mn>35</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>3</mn> <mtext>km/h</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L2-01",
     "number": "6-9",
     "level": 2,
     "html": "<p class=\"task\">Pallo päästetään putoamaan levosta, ja se osuu maahan nopeudella <span class=\"math-glue\"><span><math><semantics><mrow><mn>12</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span> Ilmanvastus jätetään huomiotta. Kuinka kauan pallo putosi?</p>",
     "answer": "<span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>22</mn> <mtext>s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L2-02",
     "number": "6-10",
     "level": 2,
     "html": "<p class=\"task scenario\">Kuvassa on kahdella ilmattomalla planeetalla levosta pudotettujen kappaleiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>v</mi><mo stretchy=\"false\">)</mo></mrow></semantics></math></span>-kuvaajat.</p><p class=\"task ask\">Kuinka monen sekunnin kuluttua pudotuksesta planeetan B kappaleella on sama nopeus kuin planeetan A kappaleella on <span class=\"math-glue\"><span><math><semantics><mrow><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>:</span>n kuluttua pudotuksesta?</p><img alt=\"(t,v)-kuvaaja mittakaavassa: kaksi suoraa origosta, planeetan A ja planeetan B pinnalla levosta pudotetun kappaleen nopeus v ajan t funktiona. Ruudukon väli on 1 s ja 5 m/s. Planeetan A suora kulkee ruudukon risteyksen (5 s; 20 m/s) kautta ja planeetan B suora risteyksen (5 s; 40 m/s) kautta. Aika-akseli ulottuu 6 sekuntiin.\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHAAAAKSCAIAAAA1SLs+AAAQAElEQVR4nOzdB3xTVRvH8ZPVvelij7K3rCLiVlQQZVNAxL0QZAru+ToYgiKKoAxZZYMsBVFUVtl7lw3dTdOd/d4SDBWSkpa0Tdvf137wJOe5QUtJ8s8597lKs9ksAAAAAACFJxcAAAAAgCJRisIzm03a7HStNsuo1xmNOqNBbzTopDsFAAAAAJQFMplcoXRTKFUKhZtC5ebu4ePu6SvdKQpJ5viWPyk1ZWem5mZrtDkZAgAAAADKF3dPPw8vPy+fIClrOXiIQ4HKZDKkp8ZlahKs97h5eLt7+CpV7ldTnZs0KEKYAwAAAIBSYTabDHqttGgkfUkDadFIp82yzvr4h/kFVZHLFbd8nFsEKum3yUxLSFfHWXb0SY/r6e3v5iGthckEAAAAAJQXUuTR5WbmZKVlahLF1T2BfoGVfQLCCl46KihQSVkt6coJKa5JY0+fwIBK1R1f+QIAAACAskjKQWnJF3Oy1NJYqXIPqdKggBxkN1BpczOS406bTUaVu1dgSE03d28BAAAAABWDtFqlTr6g12bL5IqQyvXcPHxsltkOVFkZyerEc9LA2y84MKSWAAAAAICKJzXxbHZGijQICqvt5VPp5gIbgSo7MzU14Yw08A2s7B9UVQAAAABARaVJuZSRFi8NgkJre/nemKluPL9Km5thSVP+laqRpgAAAABUcNZkJK1W6XIzb5j9T6AyGnTJcaelgZdvsG9AuAAAAACACs83sLJlv19S3CkpNOWfuh6ozGZT0pUTZpPRzcM7KLSWAAAAAABcFRRWy83DR4pLSVdOWq4pZXE9UGlSLhn0WoXSLbhyfQEAAAAAuE4WXLmeFJcM+tz01MvWe68FKmndKlOTJA0qhdVx5HrAAAAAAFChSEHJspUvQ5NoMuqv3Wn5V7r6ihBmDy8/e+3VAQAAAKCCc     {
     "id": "fy1-7-L1-01",
     "number": "7-1",
     "level": 1,
     "html": "<p class=\"task\">Kierrätyspisteellä punnitaan harmaa metallinen harkko. Sen massa on <span><math><semantics><mrow><mn>340</mn> <mtext>g</mtext></mrow></semantics></math></span> ja tilavuus <span class=\"math-glue\"><span><math><semantics><mrow><mn>30</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <msup><mtext>cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on harkon aineen tiheys? Anna vastaus yksikössä <span class=\"math-glue\"><span><math><semantics><mrow><msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span></p>",
     "answer": "<span><math><semantics><mrow><mn>11</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>3</mn> <mfrac><mtext>g</mtext><msup><mtext>cm</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-7-L1-02",
     "number": "7-2",
     "level": 1,
     "html": "<p class=\"task\">Alumiinilevyn tilavuus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>35</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <msup><mtext>cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>,</span> ja alumiinin tiheys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>70</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on levyn massa? Anna vastaus grammoina.</p>",
     "answer": "<span><math><semantics><mrow><mn>94</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>g</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-7-L1-03",
     "number": "7-3",
     "level": 1,
     "html": "<p class=\"task\">Kemian luokassa mitataan vaa'alla <span><math><semantics><mrow><mn>316</mn> <mtext>g</mtext></mrow></semantics></math></span> etanolia, jonka tiheys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>79</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on nesteen tilavuus? Anna vastaus kuutiosenttimetreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>400</mn> <msup><mtext>cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-7-L1-04",
     "number": "7-4",
     "level": 1,
     "html": "<p class=\"task\">Betonilaatan tilavuus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>75</mn> <msup><mtext>m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Betonin tiheys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>2400</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on laatan massa? Anna vastaus kilogrammoina.</p>",
     "answer": "<span><math><semantics><mrow><mn>1800</mn> <mtext>kg</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-7-L1-05",
     "number": "7-5",
     "level": 1,
     "html": "<p class=\"task\">Jäälohkon massa on <span><math><semantics><mrow><mn>36</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>kg</mtext></mrow></semantics></math></span> ja tilavuus <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0400</mn> <msup><mtext>m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on jään tiheys? Anna vastaus yksikössä <span class=\"math-glue\"><span><math><semantics><mrow><msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span></p>",
     "answer": "<span><math><semantics><mrow><mn>920</mn> <mfrac><mtext>kg</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mfrac></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-7-L1-06",
     "number": "7-6",
     "level": 1,
     "html": "<p class=\"task\">Tasalaatuinen alumiinipalikka sahataan kahteen yhtä suureen osaan. Mitä tapahtuu aineen tiheydelle?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Tiheys puolittuu, koska kappale on nyt puolta pienempi.</span></label></li><li><label><span>Tiheys kaksinkertaistuu, koska pala on tiiviimpi.</span></label></li><li><label><span>Tiheys riippuu siitä, miten pala on leikattu.</span></label></li><li><label><span>Tiheys on kummassakin osassa sama kuin alkuperäisessä palikassa.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Tiheys on kummassakin osassa sama kuin alkuperäisessä palikassa."
    },
    {
     "id": "fy1-7-L1-07",
     "number": "7-7",
     "level": 1,
     "html": "<p class=\"task\">Ruokaöljyä kaadetaan varovasti vesilasiin. Öljyn tiheys on <span><math><semantics><mrow><mn>920</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja veden <span class=\"math-glue\"><span><math><semantics><mrow><mn>1000</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Öljy ei sekoitu veteen. Mitä lasissa tapahtuu?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Öljy vajoaa pohjalle, jos öljyä on lasissa enemmän kuin vettä.</span></label></li><li><label><span>Öljy ja vesi sekoittuvat tasaisesti, koska ne ovat molemmat nesteitä.</span></label></li><li><label><span>Öljy vajoaa lasin pohjalle, koska öljy on sakeampaa.</span></label></li><li><label><span>Öljy jää veden päälle, koska öljyn tiheys on pienempi kuin veden.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Öljy jää veden päälle, koska öljyn tiheys on pienempi kuin veden."
    },
    {
     "id": "fy1-7-L1-08",
     "number": "7-8",
     "level": 1,
     "html": "<p class=\"task\">Onkikoukun lyijypainon tilavuus on <span class=\"math-glue\"><span><math><semantics><mrow><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>00</mn> <msup><mtext>cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Lyijyn tiheys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>11</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>3</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on painon massa? Anna vastaus grammoina.</p>",
     "answer": "<span><math><semantics><mrow><mn>56</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>g</mtext></mrow></semantics></math></span>"

    {
     "id": "fy1-7-L2-01",
     "number": "7-9",
     "level": 2,
     "html": "<p class=\"task\">Kultaharkon mitat ovat <span><math><semantics><mrow><mn>10</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo>⋅</mo><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo>⋅</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext></mrow></semantics></math></span>⁠. Kullan tiheys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>19</mn> <mn>300</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on harkon massa? Anna vastaus kilogrammoina.</p>",

    },

}
// Tehtävän tunnisteesta tehtävä ja sen luku, tai null.

function rlSheet_(name, head) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();

    sh.setFrozenRows(1);
    sh.getRange(2, 1, sh.getMaxRows() - 1, head.length).setNumberFormat('@');   // tekstinä: ei kaavoja, ei automaattimuunnoksia

/* ---------- palautustiedoston tarkistus ---------- */

 * Tarkistaa tiedoston tekstin. Palauttaa { data, answered: [id], empty: [id], sha } tai heittää virheen, jonka viesti

  if (data.version > RL_VERSION) throw rlError_('tiedostomuodon versio ' + data.version + ' on uudempi kuin tämä skripti tuntee');
  if (data.version !== RL_VERSION) throw rlError_('tuntematon tiedostomuodon versio');

  if (typeof data.content_sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(data.content_sha256)) throw rlError_('tarkistussumma puuttuu');

/* ---------- tuonti ---------- */

function rlFindColumn_(head, names) {

function rlResponses_() {

<script>

    chs.forEach(function (c) { var x = el('option', null, 'Luku ' + c.number + ' · ' + c.title); x.value = c.id; sel.append(x); });

  /* ---- arviointi ---- */
  function cur() { var e = S.entries[S.idx]; return e ? { entry: e, version: e.versions[S.ver] } : null; }

  // Pisteiden tallennus: pyyntö kantaa opiskelijan, palautusversion ja tehtävän, joten myöhässä tuleva vastaus ei voi

    if (S.saving) return S.saving.then(function () { return saveCurrent(); });
    if (p.value === (c.version.score === null || c.version.score === undefined ? '' : c.version.score)) return Promise.resolve(true);
    var target = c.version, req = { email: c.entry.email, sub: target.sub, task: S.task.id, value: p.value };
    setState('Tallennetaan…', 'busy');
    S.saving = call('rlSaveScore', req).then(function (r) {
      target.score = r.value;
      if (cur() && cur().version === target) setState(r.value === '' ? 'Tallennettu ✓ (arvioimaton)' : 'Tallennettu ✓', 'ok');
      return true;
    }, function (e) {
      if (cur() && cur().version === target) setState('Tallennus epäonnistui: ' + errText(e) + ' Pisteitä ei tallennettu.', 'no');
      return false;
    }).then(function (ok) { S.saving = null; return ok; });
    return S.saving;
  }
  // ↓/↑: tallennus ja siirtyminen. Viimeisellä ↓ tallentaa ja kertoo, että tehtävä on käyty läpi.
  function go(delta) {
    if (S.nav || !cur()) return;
    var to = S.idx + delta;
    if (to < 0) return;
    if (to >= S.entries.length) {
      saveCurrent().then(function (ok) { if (ok && cur()) setState('Tallennettu ✓ · tehtävän viimeinen palautus', 'ok'); });
      return;
    }
    S.nav = true; $('prev').disabled = $('next').disabled = true;
    saveCurrent().then(function (ok) {
      S.nav = false;
      if (!ok) { $('prev').disabled = S.idx === 0; $('next').disabled = S.idx === S.entries.length - 1; return; }   // virhe: pysytään paikallaan
      show(to, null);
    });
  }
  // →/←: +1 / −1 piste (rajat 0 ja max), tallentuu heti. Tyhjästä → antaa 1 ja ← antaa 0.
  function step(delta) {
    if ($('points').disabled || !cur()) return;
    var p = parsePoints($('points').value), base = p.ok && p.value !== '' ? p.value : 0;
    var v = Math.max(0, Math.min(max(), Math.round((base + delta) * 100) / 100));
    $('points').value = scoreText(v);
    saveCurrent();
  }
  function setPoints(text) {
    if ($('points').disabled || !cur()) return;
    $('points').value = text;
    saveCurrent();
  }
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('points').addEventListener('change', function () { if (!S.nav) saveCurrent(); });
  // Pistekentässä (esim. 0,5): Enter, ↓ ja ↑ tallentavat ja siirtyvät, ja kohdistin palaa näkymään, jotta nuolet toimivat
  // taas; ← ja → liikuttavat kohdistinta kentässä; Esc poistuu kentästä.
  $('points').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); $('points').blur(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); $('points').blur(); go(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); $('points').blur(); }
  });
  $('gVer').addEventListener('change', function () {
    var want = Number($('gVer').value);
    if (S.nav) { $('gVer').value = String(S.ver); return; }
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (ok) show(S.idx, want); else $('gVer').value = String(S.ver); });
  });
  document.addEventListener('keydown', function (e) {
    if ($('zoom').style.display === 'block') { if (e.key === 'Escape') $('zoom').style.display = 'none'; return; }
    if ($('grade').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;   // muokkauskentässä näppäimet toimivat normaalisti
    if (e.key === 'ArrowDown') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (/^[0-9]$/.test(e.key)) { e.preventDefault(); setPoints(e.key); }   // numero suoraan pisteiksi, tallentuu heti
    else if (e.key === ',' || e.key === '.') { e.preventDefault(); if (!$('points').disabled) { $('points').focus(); $('points').value = '0,'; } }   // desimaali: kenttään
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); setPoints(''); }
    else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A' && tag !== 'TR') { e.preventDefault(); go(1); }
  });
  $('back').addEventListener('click', function () {
    if (S.nav) return;
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (!ok) return; S.token++; $('grade').hidden = true; $('home').hidden = false; loadHome(); });
  });
  window.addEventListener('beforeunload', function (e) {
    var c = cur(); if (!c || $('grade').hidden) return;
    var p = parsePoints($('points').value);
    if (S.saving || !p.ok || p.value !== (c.version.score === null ? '' : c.version.score)) { e.preventDefault(); e.returnValue = ''; }
  });
  window.rlReload = loadHome;   // paikallinen arviointisivu päivittää näkymän tiedostojen lukemisen jälkeen
  loadHome();
})();
</script>
</body>
</html>
