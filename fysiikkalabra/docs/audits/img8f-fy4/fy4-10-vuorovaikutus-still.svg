<svg xmlns="http://www.w3.org/2000/svg" data-fig="vuorovaikutus" viewBox="0 0 600 340" role="img" aria-label="Kaavakuva, ei mittakaavassa: kaksi ilmatyynyradan vaunua törmäyksen aikana. Vaunujen väliin jäävä jousipuskuri on puristunut. Ylhäällä punaiset voimanuolet: vaunu 1 työntää vaunua 2 oikealle voimalla F, ja vaunu 2 työntää vaunua 1 vasemmalle yhtä suurella vastakkaissuuntaisella voimalla −F. Molemmat voimat vaikuttavat saman ajan Δt. Alhaalla violetit nuolet ovat liikemäärien muutokset: vaunun 1 muutos Δp1 = −FΔt osoittaa vasemmalle ja vaunun 2 muutos Δp2 = FΔt oikealle, yhtä pitkinä. Niiden summa on nolla."  style="max-width:100%;font-size:24px">
