# Fysiikkalabra QA for every course: build every lesson (drafts included), run the headless simulation and inquiry
# tests, check answer positions, carried reviews and the committed site. No AI task repeats these checks.
# This repository serves GitHub Pages from its root branch (the teacher's other sites). Ruukkilabra itself is published at
# https://ruukkilab.fi/ by .github/workflows/ruukkilabra-deploy.yml after this workflow has passed on main (teacher 2026-11-04).
# Since 2026-11-11 a push to main is scoped like a pull request (against the commit main had before the push), and a shared
# change tests a fixed sample of pages (ci_scope.py SMOKE) instead of the whole site; the whole site is tested weekly and by hand.
# On a pull request the three browser checks (simulations, inquiry tests, layout at eight widths) test only the pages the
# change can alter (scripts/ci_scope.py; teacher 2026-11-01); a change to anything shared runs them in full. Every other
# check, and the whole run on main, weekly and on a manual run, is full. A newer push to a pull request cancels its older run.
#
# Jobs (2026-11-11; the same commands, pages, widths and verdicts as the one job this workflow was until then):
#   plan                    which pages the browser checks test, and in how many jobs (scripts/ci_scope.py, ci_parallel.py plan)
#   checks-1, -2, -3        every check that is not one of the three browser checks, in their old order, in three jobs
#   sims, layout, inquiry   the browser checks: scripts/ci_parallel.py runs the unchanged test_sims.py, check_layout.py
#                           and test_inquiry.py page by page, two at a time (each browser keeps the cores it had
#                           when it ran alone); a full run has eight simulation jobs, two layout jobs for each
#                           width and four inquiry jobs
#   qa                      the required check: passes only when every job above passed and the browser jobs' reports
#                           show that every planned page was tested exactly once and passed (ci_parallel.py gate)
# The jobs that open a browser (checks-1 to -3, sims, inquiry, layout) run in Playwright's own container image, pinned to
# the version of the Python package they install (v1.65.0: Chromium 158, as before): Chromium and its system packages are
# in the image. Until 2026-11-11 every job ran `playwright install --with-deps chromium`, which downloads Ubuntu packages;
# when the runners could not resolve the package servers, 14 jobs of two pull requests died before any check ran. To move
# to a newer Playwright, change the image tag and the pip version together. The jobs' reports are written under the
# work space (ci-report), where the container and the upload step see the same path.
# The checks need about 20 core-hours for the whole site. As one job on one core a full run did not fit into the six
# hours a job may take, and a failing simulation kept every later check from running. Each job fails on its own now.
name: fysiikkalabra-ci
on:
  push:
    branches: [main]   # a pull request's branch is tested by its pull_request run (the required check qa)
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  pull_request:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  schedule: [{ cron: "0 19 * * 0" }]   # Sunday 21:00 Helsinki (winter time): weekly QA run
  workflow_dispatch: {}                 # a full run by hand (Actions -> fysiikkalabra-ci -> Run workflow)
permissions: { contents: read }
concurrency:
  group: fysiikkalabra-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { working-directory: fysiikkalabra, shell: "bash -e {0}" } }   # bash as before: a container job would otherwise run its steps with sh
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.scope.outputs.pages }}
      sims: ${{ steps.scope.outputs.sims }}
      layout: ${{ steps.scope.outputs.layout }}
      inquiry: ${{ steps.scope.outputs.inquiry }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # ci_scope.py compares with the base branch
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown playwright numpy
      - name: which pages the browser checks test (a pull request - the pages it can change, or full; scripts/ci_scope.py, teacher 2026-11-01)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then pages=$(python scripts/ci_scope.py "origin/${{ github.base_ref }}" 2> /tmp/scope.txt) || { pages=full; echo "scripts/ci_scope.py failed: full run" >> /tmp/scope.txt; }
          elif [ "${{ github.event_name }}" = push ] && [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2> /dev/null; then pages=$(python scripts/ci_scope.py "${{ github.event.before }}" 2> /tmp/scope.txt) || { pages=full; echo "scripts/ci_scope.py failed: full run" >> /tmp/scope.txt; }   # a push to main: what changed since the commit main had before it (every commit of the push); an unknown commit falls through to a full run
          else pages=full; echo "full run (${{ github.event_name }})" > /tmp/scope.txt; fi
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          python scripts/ci_parallel.py plan --pages "$pages" | tee -a "$GITHUB_OUTPUT"
          { echo "### Browser checks: ${pages:-no page changed}"; sed 's/^/    /' /tmp/scope.txt; } | tee -a "$GITHUB_STEP_SUMMARY"
  checks-1:   # the sources, the build and the built pages
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # reviews.py verify re-derives carried reviews from history, and the build reads the exercises' reviewed version from it
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - run: python scripts/lint_lesson.py --all
      - name: every worked example and exercise has a complete model solution (teacher 2026-10-27)
        run: python scripts/check_solutions.py --all
      - name: known physics errors are not taught as fact again (docs/physics-guardrails.md, teacher 2026-10-28)
        run: python scripts/test_physics_phrases.py
      - name: every vector is written with an overline in texts, figures, simulations and interface strings (rule 14, teacher 2026-10-29)
        run: python scripts/test_notation.py
      - name: learning goals complete their heading "Tällä tunnilla opit" / "you will learn to" (teacher 2026-10-29)
        run: python scripts/objectives.py && python scripts/test_objectives.py
      - name: every numeric exercise shows its model solution's rounded answer, and it agrees with the value the check accepts (teacher 2026-10-30)
        run: python scripts/answers_shown.py
      - name: Sovella itsenäisesti tasks (points, criteria, competencies, links, solutions, answers, translations) and their tests (teacher 2026-10-28)
        run: python scripts/practice.py check && python scripts/test_practice.py
      - name: experimental investigations (metadata, prerequisites, F/E levels, working-mode blocks, help links, figures; teacher 2026-10-30)
        run: python scripts/investigations.py check
      - name: TVT-ohjeet (fields, links to and from investigations, figures; teacher 2026-10-31)
        run: python scripts/guides.py check
      - name: course units of local courses (FY14 Road to Fusion; fields, chapters, inquiry, components, sources, figures; teacher 2026-11-01)
        run: python scripts/units.py check
      - name: the figure catalog is current and figures in tasks resolve, render and hash as they should (scripts/figcat.py)
        run: python scripts/figcat.py build --check && python scripts/test_figcat.py
      - name: assessment audits are current (docs/assessment/)
        run: python scripts/assessment.py --all --check
      - name: competency coverage reports are current (docs/coverage/)
        run: python scripts/coverage.py --all --check
      - run: python scripts/build.py --all
      - name: the browser checks' runner and gate (plan, shards, verdicts; a page not tested, tested twice or failed fails the gate; scripts/ci_parallel.py, 2026-11-11)
        run: python scripts/test_ci_parallel.py
      - name: built pages are accessible as static HTML (field names, aria references, unique ids, figure text alternatives, button names, page language; teacher 2026-10-30)
        run: python scripts/check_a11y.py site
      - name: a figure shown twice on a page has its own SVG ids (teacher 2026-10-29)
        run: python scripts/test_svgids.py && python scripts/svgids.py site
      - name: force diagrams obey their physics (scripts/fbd.py, docs/force-diagrams.md)
        run: python scripts/test_fbd.py
      - name: every "Voimakuvio" step of a model solution shows a drawn force diagram, and every ```voimakuvio spec draws with its physics checked (scripts/fbdspec.py, teacher 2026-10-30)
        run: python scripts/fbdspec.py check && python scripts/test_fbdspec.py
      - name: the simulations' physics models pass their tests (assets/sims/*/*/model.js, tests/models/, teacher 2026-10-30)
        run: python scripts/test_models.py
      - name: every lesson has Edellinen luku / Seuraava luku in the teaching order (teacher 2026-10-29)
        run: python scripts/test_chapter_nav.py site
      - name: front page and module pages list what each language published, one link per row, language links land on a note (teacher 2026-10-29)
        run: python scripts/test_home.py
      - name: Ahjo Makerspace pages (original logo, links, no equipment outside the list, safety draft, widths, keyboard; teacher 2026-11-08)
        run: python scripts/ahjo.py && python scripts/test_ahjo.py
      - name: Kilparobotiikka's team pages (five pages, links only to VEX/RECF, photos and quotes kept, safety roles, widths; teacher 2026-11-09)
        run: python scripts/kilparobo.py && python scripts/test_kilparobo.py
      - name: LUMA-tutor's pages (five parts, 23 · 75 min, workshop cards and filters, ten templates, nothing stored, print, widths; teacher 2026-11-09)
        run: python scripts/lumatutor.py && python scripts/test_lumatutor.py
  checks-2:   # the page components in a browser, the review rules, the inquiry engine
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # reviews.py verify re-derives carried reviews from history, and the build reads the exercises' reviewed version from it
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - run: python scripts/build.py --all
      - name: the solution editor under every exercise (Abitti's Digabi editor, loaded on the first click; copy for L'Math; teacher 2026-11-01)
        run: python scripts/test_writepad.py
      - name: submission and grading trial, FY3-1 (Lataa ratkaisut, Apps Script import and grading view against a mock; teacher 2026-11-05)
        run: python scripts/palautus_tasks.py --check && python scripts/test_palautus.py && python scripts/test_tehty.py && python scripts/test_koko.py
      - name: read aloud on every lesson page (browser voice, formulas as words, the sentence and word highlighted; teacher 2026-11-03)
        run: python scripts/test_readaloud.py
      - name: the progress bar of a lesson (sticky stage bar, stage on screen, done stages in localStorage, no JavaScript; teacher 2026-11-03)
        run: python scripts/test_progress.py
      - run: python scripts/test_reviews.py
      - run: python scripts/test_inquiry.py
      - name: the answer check reads typed numbers and accepts half a unit in the shown last digit (templates/lesson.js part 1, teacher 2026-11-10)
        run: python scripts/test_answer_check.py
  checks-3:   # carried reviews, the course and language pipelines, answer positions, the committed site, LaTeX
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # reviews.py verify re-derives carried reviews from history, and the build reads the exercises' reviewed version from it
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - run: python scripts/build.py --all
      - run: python scripts/reviews.py verify
      - name: a temporary FY4 course through the whole pipeline (nothing is published)
        run: python scripts/test_courses.py
      - name: the exercise bank's schema (multiple choice, data tables, kinds, minimum counts)
        run: python scripts/test_exercise_bank.py
      - name: every language has every text, and every translation keeps the Finnish lesson's numbers, formulas and structure
        run: python scripts/check_i18n.py
      - name: a trial English lesson through the language check, the reviews and the build into site/en/ (nothing is published)
        run: python scripts/test_i18n.py
      - name: a course unit's translation through translate_kit, the checks, the reviews and the build (nothing is published)
        run: python scripts/test_unit_i18n.py
      - name: which lessons this pull request touches, and which review each needs
        if: github.event_name == 'pull_request'
        run: python scripts/reviews.py impact "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: correct options are spread over the positions in every course (as the pages show them)
        run: python scripts/check_choices.py --all
      - name: committed site/ is exactly a fresh render of the reviewed sources and templates
        run: |
          python scripts/build.py
          if [ -n "$(git status --porcelain site/)" ]; then echo "site/ is not a fresh render of the reviewed sources (run build.py and commit):"; git status --short site/; exit 1; fi
      - name: the copy published at https://ruukkilab.fi/ (site/ at the root) names none of the teacher's other sites and has no broken relative link (scripts/deploy_site.py, teacher 2026-11-04)
        run: python scripts/deploy_site.py /tmp/ruukkilab
      - run: |
          for d in content/fi/*/*/; do
            case "$d" in *_gold*) continue;; esac
            python scripts/check_latex.py "$d"
          done

  sims:
    name: simulations ${{ matrix.shard }} (every page, or the pull request's pages)
    needs: plan
    if: needs.plan.outputs.pages != ''
    strategy: { fail-fast: false, matrix: { shard: "${{ fromJSON(needs.plan.outputs.sims) }}" } }
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the build reads the exercises' reviewed version from history
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - run: python scripts/build.py --all
      - name: simulations (scripts/test_sims.py page by page, two at a time; scripts/ci_parallel.py)
        env: { PAGES: "${{ needs.plan.outputs.pages }}" }
        run: python scripts/ci_parallel.py sims --pages "$PAGES" --shard "${{ matrix.shard }}" --report "$GITHUB_WORKSPACE/ci-report/sims-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "report-sims-${{ strategy.job-index }}", path: "ci-report", if-no-files-found: error, retention-days: 14 }
  inquiry:
    name: inquiry tests ${{ matrix.shard }} of every lesson with inquiry.json, or of the pull request's pages (gating, locks, reveal, options and feedback as rendered, navigation, 360 px)
    needs: plan
    if: needs.plan.outputs.pages != ''
    strategy: { fail-fast: false, matrix: { shard: "${{ fromJSON(needs.plan.outputs.inquiry) }}" } }
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the build reads the exercises' reviewed version from history
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - run: python scripts/build.py --all
      - name: inquiry tests (scripts/test_inquiry.py <id> lesson by lesson, two at a time, each worker in its own work tree; scripts/ci_parallel.py)
        env: { PAGES: "${{ needs.plan.outputs.pages }}" }
        run: python scripts/ci_parallel.py inquiry --pages "$PAGES" --shard "${{ matrix.shard }}" --report "$GITHUB_WORKSPACE/ci-report/inquiry-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "report-inquiry-${{ strategy.job-index }}", path: "ci-report", if-no-files-found: error, retention-days: 14 }
  layout:
    name: "layout ${{ matrix.job.name }}: every published page at eight widths (640 = 1280 px at 200 % zoom), closed, with hints and solutions open and with everything open; no overflow, overlap, empty column beside an opened card or a figure, cards out of order, over-long lines, small text or controls, or headings under the sticky navigation (NOTES.md §8)"
    needs: plan
    if: needs.plan.outputs.pages != ''
    strategy: { fail-fast: false, matrix: { job: "${{ fromJSON(needs.plan.outputs.layout) }}" } }
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright/python:v1.65.0-noble", options: "--ipc=host" }   # Chromium and its system packages preinstalled (see the header)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4   # the committed site/ is what this check opens (checks-3 fails unless it is a fresh render): no history, no build
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root; the checkout belongs to the runner's user
        working-directory: .
      - run: python --version && python -m pip --version && python -m pip install markdown numpy playwright==1.65.0   # the container's own Python 3.12 (actions/setup-python's build does not run in it); the browser and its system packages are in the image (same Playwright version)
      - name: layout (scripts/check_layout.py --site page by page, two at a time; scripts/ci_parallel.py)
        env: { PAGES: "${{ needs.plan.outputs.pages }}" }
        run: python scripts/ci_parallel.py layout --widths "${{ matrix.job.widths }}" --pages "$PAGES" --shard "${{ matrix.job.shard }}" --report "$GITHUB_WORKSPACE/ci-report/layout-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "report-layout-${{ strategy.job-index }}", path: "ci-report", if-no-files-found: error, retention-days: 14 }
  qa:   # the required check of a pull request, and the run ruukkilabra-deploy.yml waits for on main
    needs: [plan, checks-1, checks-2, checks-3, sims, inquiry, layout]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown
      - uses: actions/download-artifact@v4
        with: { pattern: "report-*", path: "${{ runner.temp }}/reports" }
      - name: every planned page was tested exactly once and passed (scripts/ci_parallel.py gate)
        env: { PAGES: "${{ needs.plan.outputs.pages }}", PLAN: "${{ needs.plan.result }}" }
        run: |
          [ "$PLAN" = success ] || { echo "::error::the plan job did not pass: nothing can be said about the browser checks"; exit 1; }
          mkdir -p "${{ runner.temp }}/reports"
          python scripts/ci_parallel.py gate "${{ runner.temp }}/reports" --pages "$PAGES"
      - name: every job passed (a browser job is skipped only when no page changed)
        if: always()
        env: { NEEDS: "${{ toJSON(needs) }}", PAGES: "${{ needs.plan.outputs.pages }}" }
        run: |
          python - <<'EOF'
          import json, os, sys
          needs, none = json.loads(os.environ["NEEDS"]), os.environ["PAGES"] == ""
          bad = [f"{k}: {v['result']}" for k, v in needs.items()
                 if v["result"] != "success" and not (none and k in ("sims", "inquiry", "layout") and v["result"] == "skipped" and needs["plan"]["result"] == "success")]
          print("\n".join(bad) or "every job passed")
          sys.exit(1 if bad else 0)
          EOF
