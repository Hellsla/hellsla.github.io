    {
     "id": "fy1-1-L1-06",
     "number": "1-6",
     "level": 1,
     "html": "<p class=\"task\">Fysiikassa havainnot ja mallit ovat eri asioita. Esimerkiksi havainto on, että pudotettu kivi osuu maahan nopeammin kuin pudotettu höyhen. Mikä seuraavista erottaa fysikaalisen mallin pelkästä havainnosta?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Malli on teoria, jota ei voi enää muuttaa sen jälkeen, kun sen on kerran todettu toimivan.</span></label></li><li><label><span>Malli on ilmiön täydellinen kuvaus, ja jos mittaus poikkeaa siitä, mittaus on aina virheellinen.</span></label></li><li><label><span>Malli on havainto, joka on toistettu niin monta kertaa, että se pätee varmasti kaikissa oloissa.</span></label></li><li><label><span>Mallista voi päätellä ennusteen uuteen tilanteeseen, ja ennusteen voi testata mittauksella.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Mallista voi päätellä ennusteen uuteen tilanteeseen, ja ennusteen voi testata mittauksella."
    },

     "level": 3,
     "html": "<p class=\"task\">Voyager 2 ylitti heliopaussin 5. marraskuuta 2018 etäisyydellä <span><math><semantics><mrow><msub><mi>d</mi><mn>0</mn></msub><mo>=</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext></mrow></semantics></math></span> Auringosta, ja sen nopeus Aurinkoon nähden on <span class=\"math-glue\"><span><math><semantics><mrow><mi>v</mi><mo>=</mo><mn>15</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>341</mn> <mtext>km/s</mtext></mrow></semantics></math></span>.</span> Tasaisen liikkeen malli on <span><math><semantics><mrow><mi>d</mi><mo>=</mo><msub><mi>d</mi><mn>0</mn></msub><mo>+</mo><mi>v</mi><mi>t</mi></mrow></semantics></math></span>⁠.</p><p class=\"task more\">Oppilas laski mallin ennusteen helmikuulle 2026, jolloin heliopaussin ylityksestä on kulunut <span class=\"math-glue\"><span><math><semantics><mrow><mi>t</mi><mo>=</mo><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>25</mn> <mtext>a</mtext></mrow></semantics></math></span>.</span> Oppilaan ratkaisu: ”Matka on <span><math><semantics><mrow><mi>s</mi><mo>=</mo><mi>v</mi><mi>t</mi><mo>=</mo><mn>15</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>341</mn> <mtext>km/s</mtext><mo>⋅</mo><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>25</mn><mo>=</mo><mn>111</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>km</mtext></mrow></semantics></math></span>⁠. Etäisyys on <span><math><semantics><mrow><mi>d</mi><mo>=</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext><mo>+</mo><mn>111</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>km</mtext><mo>≈</mo><mn>119</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>7</mn> <mtext>AU</mtext></mrow></semantics></math></span>⁠. Voyager olisi siis lähes samassa paikassa kuin 2018, joten malli on väärä.”</p><p class=\"task more\">Käytä arvoja <span><math><semantics><mrow><mn>1</mn> <mtext>AU</mtext><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>496</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup> <mtext>km</mtext></mrow></semantics></math></span> ja <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn> <mtext>a</mtext><mo>=</mo><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>156</mn><mo>⋅</mo><mn>1</mn><msup><mn>0</mn><mn>7</mn></msup> <mtext>s</mtext></mrow></semantics></math></span>.</span> Mittaus antoi helmikuussa 2026 arvon <span class=\"math-glue\"><span><math><semantics><mrow><mn>143</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>05</mn> <mtext>AU</mtext></mrow></semantics></math></span>.</span></p><p class=\"task more\">Etsi oppilaan virhe ja laske mallin oikea ennuste etäisyydelle <span><math><semantics><mrow><mi>d</mi></mrow></semantics></math></span> tähtitieteellisinä yksikköinä. Selitä, miksi mittaus tukee mallia mutta ei todista, että Voyager liikkuu samalla nopeudella aina.</p>",

     "html": "<p class=\"task\">Mikä seuraavista tilanteista on esimerkki systemaattisesta virheestä?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Oppilas katsoo asteikkoa milloin vasemmalta, milloin oikealta, ja lukemat vaihtelevat sen mukaan.</span></label></li><li><label><span>Oppilas kirjaa tuloksen <span><math><semantics><mrow><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>42</mn> <mtext>s</mtext></mrow></semantics></math></span> muistiin muodossa <span class=\"math-glue\"><span><math><semantics><mrow><mn>34</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>s</mtext></mrow></semantics></math></span>.</span></span></label></li><li><label><span>Käsikellon pysäytys osuu milloin liian aikaisin, milloin liian myöhään, joten ajat vaihtelevat kerrasta toiseen.</span></label></li><li><label><span>Lämpömittarin nollakohta on väärin, joten se näyttää jäävedessä joka kerralla noin <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <msup><mrow></mrow><mo>∘</mo></msup><mtext>C</mtext></mrow></semantics></math></span>.</span></span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",

     "level": 1,
     "html": "<p class=\"task\">Uima-altaaseen lasketaan vettä. Veden korkeus <span><math><semantics><mrow><mi>h</mi></mrow></semantics></math></span> ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona noudattaa mittausten mukaan suoraa <span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>50</mn> <mfrac><mtext>cm</mtext><mtext>min</mtext></mfrac><mo>⋅</mo><mi>t</mi><mo>+</mo><mn>12</mn> <mtext>cm</mtext></mrow></semantics></math></span>⁠. Kuinka korkealla veden pinta on, kun hanaa on pidetty auki 30 minuuttia? Anna vastaus senttimetreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>27</mn> <mtext>cm</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-03",
     "number": "4-3",
     "level": 1,
     "html": "<p class=\"task\">Nurmikon pituutta <span><math><semantics><mrow><mi>h</mi></mrow></semantics></math></span> seurattiin vuorokausien <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona, ja sovitettu suora on <span><math><semantics><mrow><mi>h</mi><mo>=</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>60</mn> <mfrac><mtext>cm</mtext><mtext>vrk</mtext></mfrac><mo>⋅</mo><mi>t</mi><mo>+</mo><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext></mrow></semantics></math></span>⁠. Monenako vuorokautena mittauksen alusta nurmikko on <span><math><semantics><mrow><mn>10</mn> <mtext>cm</mtext></mrow></semantics></math></span> pitkä? Anna vastaus vuorokausina.</p>",
     "answer": "<span><math><semantics><mrow><mn>10</mn> <mtext>vrk</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-04",
     "number": "4-4",
     "level": 1,
     "html": "<p class=\"task\">Kynttilä palaa tasaisesti. Mittauspisteisiin sovitettu suora kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>h</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>20</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>h</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>14</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta, kun <span><math><semantics><mrow><mi>y</mi></mrow></semantics></math></span>-akselilla on kynttilän pituus. Mikä on suoran kulmakerroin? Anna vastaus etumerkkeineen yksikössä cm/h.</p>",
     "answer": "<span><math><semantics><mrow><mo>−</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>cm/h</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-05",
     "number": "4-5",
     "level": 1,
     "html": "<p class=\"task scenario\">Kopiopaperipinon massa <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> on suoraan verrannollinen arkkien määrään <span class=\"math-glue\"><span><math><semantics><mrow><mi>N</mi></mrow></semantics></math></span>,</span> joten massa esitetään origon kautta kulkevalla suoralla. Kun <span class=\"math-glue\"><span><math><semantics><mrow><mi>N</mi><mo>=</mo><mn>250</mn></mrow></semantics></math></span>,</span> massa on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>2</mn> <mtext>kg</mtext></mrow></semantics></math></span>.</span></p><p class=\"task ask\">Kuinka suuri on yhden arkin massa? Anna vastaus grammoina.</p>",
     "answer": "<span><math><semantics><mrow><mn>4</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>g</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L1-06",
     "number": "4-6",
     "level": 1,
     "html": "<p class=\"task\">Kokeessa saatiin kuusi mittauspistettä, jotka asettuvat likimain suoralle mutta hajoavat sen ympärille mittausepävarmuuden vuoksi. Mikä seuraavista kuvaa oikein, miten pisteisiin sovitetaan suora?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Pisteet yhdistetään murtoviivaksi, koska jokainen mittaus on yhtä tärkeä.</span></label></li><li><label><span>Suora piirretään ensimmäisen ja viimeisen pisteen kautta, koska ne rajaavat mittausalueen.</span></label></li><li><label><span>Suora piirretään mahdollisimman monen pisteen kautta ja loput pisteet jätetään huomiotta.</span></label></li><li><label><span>Suora kulkee pisteiden joukon keskeltä ja pisteitä jää sen molemmille puolille.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Suora kulkee pisteiden joukon keskeltä ja pisteitä jää sen molemmille puolille."
    },
    {
     "id": "fy1-4-L1-07",
     "number": "4-7",
     "level": 1,
     "html": "<p class=\"task\">Saman metallin eri kokoisten kappaleiden massa <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> grammoina mitattiin tilavuuden <span><math><semantics><mrow><mi>V</mi></mrow></semantics></math></span> funktiona kuutiosenttimetreinä. Mittauspisteisiin sovitettu suora kulkee origon kautta, ja sen kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn></mrow></semantics></math></span>.</span> Mitä kulmakerroin kertoo?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <mtext>g</mtext></mrow></semantics></math></span> ja kertoo kappaleen massan, kun tilavuus on nolla.</span></label></li><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja kertoo, montako grammaa massaa on yhtä kuutiosenttimetriä kohti.</span></label></li><li><label><span>Kulmakerroin on pelkkä luku ilman yksikköä, koska se kertoo vain suoran jyrkkyyden.</span></label></li><li><label><span>Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>cm</mtext><mn>3</mn></msup><mi mathvariant=\"normal\">/</mi><mtext>g</mtext></mrow></semantics></math></span> ja kertoo, kuinka suuren tilavuuden yksi gramma täyttää.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Kulmakerroin on <span><math><semantics><mrow><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>9</mn> <msup><mtext>g/cm</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja kertoo, montako grammaa massaa on yhtä kuutiosenttimetriä kohti."
    },
    {
     "id": "fy1-4-L1-08",
     "number": "4-8",
     "level": 1,
     "html": "<p class=\"task\">Jousen pituus <span><math><semantics><mrow><mi>l</mi></mrow></semantics></math></span> mitattiin kuorman massan <span><math><semantics><mrow><mi>m</mi></mrow></semantics></math></span> funktiona. Mittauspisteisiin sovitettu suora kulkee pisteen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>kg</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>7</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>cm</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta, ja sen kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mfrac><mtext>cm</mtext><mtext>kg</mtext></mfrac></mrow></semantics></math></span>.</span> Kuinka pitkä jousi on ilman kuormaa? Anna vastaus senttimetreinä.</p>",
     "answer": "<span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>cm</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L2-01",
     "number": "4-9",
     "level": 2,
     "html": "<p class=\"task\">Pyöräilijän kulkema matka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> mitattiin kilometreinä ja aika <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> minuutteina. Mittauspisteisiin sovitettu suora kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>min</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>30</mn> <mtext>km</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>10</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>min</mtext><mo separator=\"true\">;</mo><mtext>&nbsp;</mtext><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>50</mn> <mtext>km</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta. Mikä on suoran kulmakerroin yksikössä m/s?</p>",
     "answer": "<span><math><semantics><mrow><mn>2</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>5</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-4-L2-02",
     "number": "4-10",
     "level": 2,
     "html": "<p class=\"task\">Kuvaajassa on tasaisesti liikkuvan kärryn kulkema matka <span><math><semantics><mrow><mi>s</mi></mrow></semantics></math></span> ajan <span><math><semantics><mrow><mi>t</mi></mrow></semantics></math></span> funktiona kuudessa mittauksessa.</p><p class=\"task more\">Sovita pisteisiin silmämääräisesti suora (piirrä pisteet ruutupaperille tai aseta viivoitin kuvan päälle) ja arvioi sen avulla, kuinka pitkän matkan kärry on kulkenut hetkellä <span class=\"math-glue\"><span><math><semantics><mrow><mi>t</mi><mo>=</mo><mn>8</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span>,</span> kun liike jatkuu samanlaisena. Anna vastaus metreinä.</p><img alt=\"Kuvaaja mittakaavassa: kärryn kulkema matka s ajan t funktiona, kuusi mittauspistettä ilman sovitettua suoraa. Pisteet ovat (1 s; 0,6 m), (2 s; 0,8 m), (3 s; 1,6 m), (4 s; 2,1 m), (5 s; 2,4 m) ja (6 s; 2,9 m). Aika-akseli jatkuu 9 sekuntiin ja matka-akseli 4,5 metriin, ruudukon väli on 1 s ja 0,5 m.\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHAAAAKkCAIAAADna1+OAAAQAElEQVR4nOzdB2ATZR/H8SdJ96KT0ZZR9gbZijhf90JQWaKAooIKMkTcoqKCIFuQITJFQUFlKIiK7CF7QxltKXTvkSZp3qc9CKWUjmM1l+/nzVv+SZ4U4mXc7/53zzlZrVYBAAAAACg7vQAAAAAAqOIkys5qzTVmphqNGRZTjsWSYzGbLOYceaMAAAAAAHug0+kNTi4GJ2eDwcXg7OLq5uXq7i1vFGWkK/0ufzI1ZaYnZmemGLPSBAAAAABoi6u7j5uHj4eXv8xapXxIqQJVbq45NfFsekqM7RYXN09XN28nZ9f8VOciCxVhDgAAAABuCqs112wyyqaRvMhCNo1yjBm2e70qVPLxD9brDSX+nhIClfxr0pNjUpPOKnv0yd/r7lnBxU32wnQCAAAAALRCRp6c7PSsjOT0lFiRv0+gj18VL99KxbeOigtUMqvFRR+RcU3W7l5+vgFVS9/5AgAAAAB7JHNQcnxkVkaSrJ2cXYOC6xWTg64YqIzZafFnj1tzLc6uHn5B1V1cPQUAAAAAOAbZrUqKjzAZM3V6Q1CVOi5uXkUOKzpQZaTFJ8WekoWnT6BfUA0BAAAAAI4nMfZkZlqCLPwrhXl4BVw+oIhAlZmemBhzQhbeflUq+IcIAAAAAHBUKQlRacnnZOFfMczDu3CmKnx8lTE7TUlTFQJCSVMAAAAAHJwtGcluVU52eqF7LwlUFnNO/NnjsvDwDvT2rSwAAAAAwOF5+1VR9veLO3tMhqaCd10MVFZrblz0EWuuxcXN079iDQEAAAAAyOdfqYaLm5eMS3HRR5VzSikuBqqUhCizyWhwcgmsUlcAAAAAAC7SBVapI+OS2ZSdmnjGduv5QCX7Vukpcb      "html": "<p class=\"task\">Vapaasti putoavan kappaleen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>v</mi><mo stretchy=\"false\">)</mo></mrow></semantics></math></span>-kuvaaja on suora, joka kulkee pisteiden <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn> <mtext>s</mtext><mo separator=\"true\">;</mo> <mn>0</mn> <mtext>m/s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> ja <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mn>5</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext><mo separator=\"true\">;</mo> <mn>49</mn> <mtext>m/s</mtext><mo stretchy=\"false\">)</mo></mrow></semantics></math></span> kautta. Mikä on putoamiskiihtyvyys?</p>",
     "answer": "<span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>"

    {
     "id": "fy1-6-L1-05",
     "number": "6-5",
     "level": 1,
     "html": "<p class=\"task\">Marsissa putoamiskiihtyvyys on <span class=\"math-glue\"><span><math><semantics><mrow><mn>3</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>71</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Kappale putoaa Marsissa levosta <span><math><semantics><mrow><mn>6</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0</mn> <mtext>s</mtext></mrow></semantics></math></span> ilman ilmanvastusta. Mikä on kappaleen nopeus?</p>",
     "answer": "<span><math><semantics><mrow><mn>22</mn> <mtext>m/s</mtext></mrow></semantics></math></span>"
    },
    {
     "id": "fy1-6-L1-06",
     "number": "6-6",
     "level": 1,
     "html": "<p class=\"task\">Astronautti pudottaa Kuun pinnalla yhtä aikaa samalta korkeudelta levosta vasaran ja höyhenen. Kuussa ei ole ilmakehää. Mitä tapahtuu?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Höyhen osuu maahan ensin, koska se on kevyempi.</span></label></li><li><label><span>Vasara ja höyhen osuvat maahan yhtä aikaa.</span></label></li><li><label><span>Kumpikaan ei putoa, koska Kuussa ei ole ilmaa.</span></label></li><li><label><span>Vasara osuu maahan ensin, koska se on raskaampi.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Vasara ja höyhen osuvat maahan yhtä aikaa."
    },
    {
     "id": "fy1-6-L1-07",
     "number": "6-7",
     "level": 1,
     "html": "<p class=\"task\">Vapaasti putoavan kappaleen <span><math><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>v</mi><mo stretchy=\"false\">)</mo></mrow></semantics></math></span>-kuvaaja on origon kautta kulkeva suora, jonka kulmakerroin on <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <msup><mtext>m/s</mtext><mn>2</mn></msup></mrow></semantics></math></span>.</span> Mitä kulmakerroin kertoo?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Kappaleen nopeus on <span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span> vasta sekunnin kuluttua, ja sitä ennen se on nolla.</span></label></li><li><label><span>Kappale putoaa joka sekunti <span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m</mtext></mrow></semantics></math></span> lisää.</span></label></li><li><label><span>Nopeus kasvaa joka sekunti <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span></span></label></li><li><label><span>Kappaleen nopeus on koko ajan <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span></span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Nopeus kasvaa joka sekunti <span class=\"math-glue\"><span><math><semantics><mrow><mn>9</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>m/s</mtext></mrow></semantics></math></span>.</span>"

     "html": "<p class=\"task\">Jäälohkon massa on <span><math><semantics><mrow><mn>36</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>8</mn> <mtext>kg</mtext></mrow></semantics></math></span> ja tilavuus <span class=\"math-glue\"><span><math><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>0400</mn> <msup><mtext>m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Kuinka suuri on jään tiheys? Anna vastaus yksikössä <span class=\"math-glue\"><span><math><semantics><mrow><msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span></p>",

    {
     "id": "fy1-7-L1-06",
     "number": "7-6",
     "level": 1,
     "html": "<p class=\"task\">Tasalaatuinen alumiinipalikka sahataan kahteen yhtä suureen osaan. Mitä tapahtuu aineen tiheydelle?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Tiheys puolittuu, koska kappale on nyt puolta pienempi.</span></label></li><li><label><span>Tiheys kaksinkertaistuu, koska pala on tiiviimpi.</span></label></li><li><label><span>Tiheys riippuu siitä, miten pala on leikattu.</span></label></li><li><label><span>Tiheys on kummassakin osassa sama kuin alkuperäisessä palikassa.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Tiheys on kummassakin osassa sama kuin alkuperäisessä palikassa."
    },
    {
     "id": "fy1-7-L1-07",
     "number": "7-7",
     "level": 1,
     "html": "<p class=\"task\">Ruokaöljyä kaadetaan varovasti vesilasiin. Öljyn tiheys on <span><math><semantics><mrow><mn>920</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span> ja veden <span class=\"math-glue\"><span><math><semantics><mrow><mn>1000</mn> <msup><mtext>kg/m</mtext><mn>3</mn></msup></mrow></semantics></math></span>.</span> Öljy ei sekoitu veteen. Mitä lasissa tapahtuu?</p><fieldset class=\"choice list\"><ul class=\"choices\"><li><label><span>Öljy vajoaa pohjalle, jos öljyä on lasissa enemmän kuin vettä.</span></label></li><li><label><span>Öljy ja vesi sekoittuvat tasaisesti, koska ne ovat molemmat nesteitä.</span></label></li><li><label><span>Öljy vajoaa lasin pohjalle, koska öljy on sakeampaa.</span></label></li><li><label><span>Öljy jää veden päälle, koska öljyn tiheys on pienempi kuin veden.</span></label></li></ul><div class=\"choice-actions\"></div><output></output></fieldset>",
     "answer": "Öljy jää veden päälle, koska öljyn tiheys on pienempi kuin veden."
    },

    } else if (typeof it.data !== 'string' || it.data.length > RL_LIMITS.image * 1.4) throw rlError_(where + ': kuva on liian suuri');

/**

/* ---------- tuonti ---------- */

function rlFindColumn_(head, names) {
  for (var i = 0; i < head.length; i++) {
    var h = String(head[i]).trim().toLowerCase();
    for (var j = 0; j < names.length; j++) if (h === names[j].toLowerCase()) return i;
  }

}
function rlResponses_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet(), fileNames = RL_CONFIG.HEADERS.file;
  var sh = RL_CONFIG.RESPONSES_SHEET ? ss.getSheetByName(RL_CONFIG.RESPONSES_SHEET) : null;
  if (RL_CONFIG.RESPONSES_SHEET && !sh) throw rlError_('Välilehteä "' + RL_CONFIG.RESPONSES_SHEET + '" ei löydy. Tarkista RL_CONFIG.RESPONSES_SHEET.');

      var n = all[i].getName();
      if (n === RL_CONFIG.SUBMISSIONS_SHEET || n === RL_CONFIG.SCORES_SHEET || all[i].getLastColumn() < 1) continue;
      if (rlFindColumn_(all[i].getRange(1, 1, 1, all[i].getLastColumn()).getValues()[0], fileNames) >= 0) sh = all[i];
    }

  if (!sh) throw rlError_('Lomakkeen vastausvälilehteä ei löydy: millään välilehdellä ei ole saraketta "' + fileNames.join('" / "') + '". Yhdistä lomake taulukkoon ja tarkista RL_CONFIG.HEADERS.file.');

  var col = { time: rlFindColumn_(head, RL_CONFIG.HEADERS.timestamp), email: rlFindColumn_(head, RL_CONFIG.HEADERS.email), file: rlFindColumn_(head, fileNames) };
  var missing = [];
  if (col.time < 0) missing.push('palautusaika (' + RL_CONFIG.HEADERS.timestamp.join(' / ') + ')');
  if (col.email < 0) missing.push('sähköposti (' + RL_CONFIG.HEADERS.email.join(' / ') + ')');
  if (missing.length) throw rlError_('Välilehdeltä "' + sh.getName() + '" puuttuu sarake: ' + missing.join(', ') + '. Otsikot ovat: ' + head.map(String).join(' | ').slice(0, 400) + '. Korjaa RL_CONFIG.HEADERS tai ota sähköpostien kerääminen käyttöön lomakkeessa.');

    if (time && isNaN(time.getTime())) time = null;
    var ids = String(v[col.file] || '').match(/(?:[?&]id=|\/d\/)([-\w]{20,})/g) || [];
    ids = ids.map(function (s) { return s.replace(/^(?:[?&]id=|\/d\/)/, ''); });

// Lukee ja tarkistaa yhden palautuksen. Palauttaa { status, reason, ... }; ei kirjoita mitään.

  if (RL_CONFIG.IDENTITY === 'name') { if (!resp.email) { out.reason = 'palauttajan nimi puuttuu tiedoston nimestä'; return out; } }
  else if (!resp.email || resp.email.indexOf('@') < 1) { out.reason = 'vahvistettu sähköpostiosoite puuttuu (ota sähköpostien kerääminen käyttöön lomakkeessa)'; return out; }

  if (resp.ids.length > 1) { out.reason = 'palautuksessa on useita tiedostoja (sallittu yksi)'; return out; }

  var lock = rlLock_(30000);

    var sh = rlSheet_(RL_CONFIG.SUBMISSIONS_SHEET, RL_SUB_HEAD);

  /* ---- Utilities ---- */

      if (fmt === 'd.M.yyyy') return Number(p.day) + '.' + Number(p.month) + '.' + p.year;

  /* ---- google.script.run: palvelinfunktio kutsutaan tässä selaimessa; tulos JSON-muunnettuna kuten Apps Scriptissä ---- */
  var runner = function (ok, no) {
    return new Proxy({}, { get: function (_, name) {

          if (name === 'rlAnswer' && !LOCAL.entries.length) { if (no) no(new Error('Valitse palautusten zip-tiedosto uudelleen ylhäältä (tiedostoja ei säilytetä sivun sulkemisen jälkeen).')); return; }
          try { r = window[name](a); } catch (e) { if (no) no(new Error(e && e.rlUser ? e.message : 'odottamaton virhe')); return; }
          if (/^rl(SaveScore|SetDecision)$/.test(name) && !saveSheets()) { if (no) no(new Error('Selain ei salli tallentamista (localStorage). Pisteitä ei tallennettu.')); return; }
          if (ok) ok(r === undefined ? null : JSON.parse(JSON.stringify(r)));
        }, 0);
      };
    } });
  };

  /* ---- zip (Driven lataama kansio): keskushakemisto ja deflate selaimen omalla DecompressionStreamilla ---- */
  function readZip(buf) {

    for (var i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }

  function inflate(e) {

  }
  // "fy3-1.ratkaisut - Aino Opiskelija.json" -> "Aino Opiskelija" (Forms lisää palauttajan nimen loppuun)
  function nameOf(path) {
    var base = path.split('/').pop().replace(/\.[^.]*$/, ''), i = base.lastIndexOf(' - ');
    return i > 0 ? base.slice(i + 3).trim() : '';

    var h = sha256(new TextEncoder().encode(path + '|' + size + '|' + time.getTime())), s = '';

  function addEntries(list) {
    list.forEach(function (e) {
      var id = idOf(e.path, e.size, e.time);
      if (LOCAL.files[id]) return;
      LOCAL.files[id] = { text: e.text, size: e.size };
      LOCAL.entries.push({ id: id, name: nameOf(e.path), time: e.time });
    });
    LOCAL.entries.sort(function (a, b) { return a.time - b.time; });
    var rows = [['Aikaleima', 'Sähköpostiosoite', 'Palauta vastaukset']].concat(LOCAL.entries.map(function (e) { return [e.time, e.name, 'https://drive.google.com/open?id=' + e.id]; }));
    var resp = ss.getSheetByName('Lomakevastaukset (paikallinen)') || ss.insertSheet('Lomakevastaukset (paikallinen)');
    resp.data = rows;
  }
  function readFiles(files) {
    var jobs = [].map.call(files, function (f) {
      return f.arrayBuffer().then(function (buf) {
        if (/\.zip$/i.test(f.name)) {
          return Promise.all(readZip(buf).filter(function (e) { return !/\/$/.test(e.name); }).map(function (e) {
            if (e.size > RL_LIMITS.file) return { path: e.name, size: e.size, time: e.time, text: '' };   // Code.gs merkitsee liian suureksi
            return inflate(e).then(function (t) { return { path: e.name, size: e.size, time: e.time, text: t }; }, function () { return { path: e.name, size: e.size, time: e.time, text: '' }; });
          }));
        }
        return [{ path: f.name, size: f.size, time: new Date(f.lastModified), text: f.size > RL_LIMITS.file ? '' : new TextDecoder('utf-8').decode(buf) }];
      });
    });
    return Promise.all(jobs).then(function (lists) { return [].concat.apply([], lists); });
  }

  /* ---- yläpalkki ---- */
  function el(tag, text) { var e = document.createElement(tag); if (text) e.textContent = text; return e; }
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  document.addEventListener('DOMContentLoaded', function () {
    RL_CONFIG.SUBMISSION_FOLDER_ID = 'local'; RL_CONFIG.IDENTITY = 'name';
    var bar = document.getElementById('localBar'); bar.hidden = false; bar.className = 'panel';
    // ryhmä: jokaisella ryhmällä oma lomake, oma zip ja oma tallennettu arviointi
    var gRow = el('p'); gRow.className = 'bar';
    var gLab = el('label'), gSel = el('select'); gSel.id = 'group'; gLab.append(el('b', 'Ryhmä: '), gSel);
    var gNew = el('input'); gNew.type = 'text'; gNew.id = 'newGroup'; gNew.placeholder = 'Uusi ryhmä, esim. FY3.2'; gNew.maxLength = 40; gNew.setAttribute('aria-label', 'Uuden ryhmän nimi');
    var gAdd = el('button', 'Lisää ryhmä'); gAdd.type = 'button'; gAdd.id = 'addGroup';
    gRow.append(gLab, gNew, gAdd);
    var lab = el('label'), pick = el('input'); pick.type = 'file'; pick.multiple = true; pick.accept = '.zip,.json,application/zip,application/json'; pick.id = 'pick';
    lab.append(el('b', 'Palautukset (zip): '), pick);
    var row = el('p'); row.className = 'bar';
    var csv = el('button', 'Vie pisteet (CSV)'), bak = el('button', 'Varmuuskopio'), res = el('button', 'Palauta varmuuskopio'), clr = el('button', 'Poista ryhmä');
    csv.id = 'csv'; bak.id = 'backup'; res.id = 'restore'; clr.id = 'clear';
    [csv, bak, res, clr].forEach(function (b) { b.type = 'button'; row.append(b); });
    var resFile = el('input'); resFile.type = 'file'; resFile.accept = '.json,application/json'; resFile.hidden = true;
    var msg = el('p'); msg.className = 'muted'; msg.id = 'localMsg'; msg.setAttribute('aria-live', 'polite');
    bar.append(gRow, lab, row, resFile, msg);
    var safe = function (g) { return g.replace(/[^0-9A-Za-zÅÄÖåäö._-]+/g, '_'); };
    function fillGroups() {
      var list = groups(); gSel.textContent = '';
      if (!list.length) { var o = el('option', '(ei ryhmiä: lisää ryhmä)'); o.value = ''; gSel.append(o); }
      list.forEach(function (g) { var o = el('option', g); o.value = g; gSel.append(o); });
      gSel.value = LOCAL.group;
      var none = !LOCAL.group;
      pick.disabled = csv.disabled = bak.disabled = res.disabled = clr.disabled = none; gSel.disabled = !list.length;
    }
    function choose(g) { useGroup(g); fillGroups(); window.rlReload(); }
    var start = '';
    try { start = localStorage.getItem(chosenKey()) || ''; } catch (e) {}
    if (groups().indexOf(start) < 0) start = groups()[0] || '';
    useGroup(start); fillGroups(); window.rlReload();
    if (!start) msg.textContent = 'Lisää ensin ryhmä (yksi jokaista Forms-lomaketta kohti).';
    gSel.addEventListener('change', function () { choose(gSel.value); msg.textContent = 'Ryhmä ' + gSel.value + '. Valitse ryhmän zip-tiedosto, niin vastaukset näkyvät.'; });
    gAdd.addEventListener('click', function () {
      var g = gNew.value.trim().replace(/\s+/g, ' '), list = groups();
      if (!g) { msg.textContent = 'Kirjoita ryhmän nimi.'; return; }
      if (list.indexOf(g) >= 0) { msg.textContent = 'Ryhmä ' + g + ' on jo olemassa.'; return; }
      list.push(g);
      if (!setGroups(list)) { msg.textContent = 'Selain ei salli tallentamista (localStorage). Ryhmää ei lisätty.'; return; }
      gNew.value = ''; choose(g); msg.textContent = 'Ryhmä ' + g + ' lisätty. Valitse ryhmän lomakkeen palautuskansion zip-tiedosto.';
    });
    gNew.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); gAdd.click(); } });

      if (!pick.files.length || !LOCAL.group) return;
      msg.textContent = 'Luetaan…';
      readFiles(pick.files).then(function (list) {
        pick.value = '';
        var forms = formsOf(list), other = LOCAL.forms.length ? forms.filter(function (f) { return LOCAL.forms.indexOf(f) < 0; }) : [];
        if (other.length) {   // toisen ryhmän lomake: ei lueta tähän ryhmään
          msg.textContent = 'Zip-tiedosto on lomakkeelta "' + other[0] + '", mutta ryhmän ' + LOCAL.group + ' palautukset on luettu lomakkeelta "' + LOCAL.forms[0] + '". Mitään ei luettu. Valitse oikea ryhmä tai oikean lomakkeen zip.';
          return;
        }
        forms.forEach(function (f) { if (LOCAL.forms.indexOf(f) < 0) LOCAL.forms.push(f); });
        addEntries(list);
        var r = rlImport_(); saveSheets();
        var c = r.counts;
        msg.textContent = 'Ryhmä ' + LOCAL.group + ': luettu ' + list.length + ' tiedostoa. Uusia palautuksia ' + r.added + ' (hyväksyttyjä ' + c['Hyväksytty'] + ', kaksoiskappaleita ' + c['Kaksoiskappale'] + ', tarkistettavia ' + c['Tarkistettava'] + ', virheellisiä ' + c['Virheellinen'] + ').';
        window.rlReload();
      }, function (e) { pick.value = ''; msg.textContent = 'Tiedostoja ei voitu lukea: ' + (e && e.message || e); });
    });
    csv.addEventListener('click', function () {
      var name = course() + '-' + safe(LOCAL.group) + '-pisteet.csv';
      download(name, rlScoresCsv(), 'text/csv;charset=utf-8'); msg.textContent = 'Pisteet viety tiedostoon ' + name + '. Avaa se Sheetsissä (Tiedosto → Tuo).';
    });
    bak.addEventListener('click', function () {
      if (!saveSheets()) { msg.textContent = 'Selain ei salli tallentamista (localStorage).'; return; }
      download(course() + '-' + safe(LOCAL.group) + '-arviointi-varmuuskopio.json', localStorage.getItem(key()) || '', 'application/json');
      msg.textContent = 'Varmuuskopio ladattu. Säilytä se koulun Drivessa, ei julkisesti.';
    });

    resFile.addEventListener('change', function () {
      var f = resFile.files[0]; resFile.value = ''; if (!f) return;
      f.text().then(function (t) {
        var st;
        try { st = JSON.parse(t); } catch (e) { st = null; }
        if (st && st.group && st.group !== LOCAL.group && !window.confirm('Varmuuskopio on ryhmältä ' + st.group + '. Korvataanko ryhmän ' + LOCAL.group + ' arviointi sillä?')) return;
        var before = LOCAL.sheets, forms = LOCAL.forms;
        try { loadSheets(t); } catch (e) { LOCAL.sheets = before; LOCAL.forms = forms; msg.textContent = 'Tiedosto ei ole tämän opintojakson arvioinnin varmuuskopio.'; return; }
        saveSheets(); msg.textContent = 'Varmuuskopio palautettu ryhmään ' + LOCAL.group + '.'; window.rlReload();

    });

      if (!window.confirm('Poistetaanko ryhmä ' + LOCAL.group + ' sekä sen tuonnit ja pisteet tästä selaimesta? Ota ensin varmuuskopio.')) return;
      var g = LOCAL.group;
      try { localStorage.removeItem(key()); } catch (e) {}
      setGroups(groups().filter(function (x) { return x !== g; }));
      choose(groups()[0] || '');
      msg.textContent = 'Ryhmä ' + g + ' poistettu.';
    });
  });
})();

<meta charset="utf-8">
<title>RuukkiLabra · arviointi</title>
<!-- Arviointinäkymä (Code.gs openReview). Ei ulkoisia skriptejä, tyylejä, fontteja eikä kuvia: opiskelijan vastaus
     rakennetaan DOM-elementteinä tekstinä (textContent), ja kuviksi kelpaavat vain tarkistetut PNG- ja JPEG-datat. -->
<style>
  :root { --ink:#1f2421; --ink2:#5b625d; --line:#d9d4c6; --soft:#ecf5ee; --accent:#14532d; --warn:#8a3b1a; --bg:#fbfaf6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 1280px; margin: 0 auto; padding: 12px 20px 90px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 18px 0 6px; }
  button { font: 600 15px system-ui, sans-serif; min-height: 38px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 999px; background: #fff; color: var(--accent); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--soft); } button:disabled { opacity: .45; cursor: default; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 14px; color: var(--ink2); }
  tr.task-row { cursor: pointer; } tr.task-row:hover { background: var(--soft); }
  .muted { color: var(--ink2); font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .bar .grow { flex: 1; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: 8px; }
  .head .pos { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .who { font-weight: 600; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
  .statement img.fig { max-width: min(100%, 640px); display: block; margin: 8px 0; }
  .statement table { width: auto; } .statement math { font-size: 1.1em; }
  .answer { font-size: 17px; line-height: 1.65; overflow-wrap: anywhere; }
  .answer .t { white-space: pre-wrap; }
  .answer img.math { vertical-align: middle; }
  .answer code.math { font: 14px ui-monospace, Menlo, Consolas, monospace; background: #f1eee5; padding: 1px 4px; border-radius: 4px; white-space: pre-wrap; }
  .answer img.shot { display: block; max-width: 100%; height: auto; margin: 8px 0; border: 1px solid var(--line); cursor: zoom-in; }
  .empty { color: var(--warn); font-weight: 600; }
  .score { position: sticky; bottom: 0; background: var(--bg); border-top: 2px solid var(--accent); padding: 10px 0; margin-top: 12px; }
  .score input { font: 700 20px system-ui, sans-serif; width: 5em; min-height: 40px; padding: 2px 8px; border: 2px solid #767676; border-radius: 8px; }
  .score input:focus { outline: 3px solid #2f7d4f; border-color: #2f7d4f; }
  .state { min-width: 14em; font-weight: 600; }
  .state[data-s=ok] { color: var(--accent); } .state[data-s=no] { color: var(--warn); } .state[data-s=busy] { color: var(--ink2); }
  .err { color: var(--warn); font-weight: 600; }
  .keys { margin: 6px 0 0; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.82); overflow: auto; display: none; z-index: 10; cursor: zoom-out; padding: 20px; }
  #zoom img { display: block; margin: 0 auto; max-width: none; background: #fff; }
  .tag { display: inline-block; font-size: 13px; padding: 0 8px; border-radius: 999px; background: #f1eee5; }
  details.ans > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  details.chapter { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
  details.chapter > summary { cursor: pointer; padding: 8px 12px; font-weight: 700; }
  details.chapter > summary .muted { font-weight: 400; }
  details.chapter table { border-top: 1px solid var(--line); }
  .wide { overflow-x: auto; }
  #summary { max-width: 760px; } #scope { max-width: 24em; }
  #summary th { text-transform: uppercase; letter-spacing: .03em; font-size: 13px; }
  #summary th.n, #summary td.n { text-align: center; white-space: nowrap; }
  #summary td { padding: 12px 10px; font-size: 18px; vertical-align: middle; }
  #summary td.n .v { font-weight: 600; } #summary td.n .of { color: #8a918c; }
  #summary tr.none td { color: var(--ink2); }
  #summary button.sort { border: 0; background: none; min-height: 0; padding: 2px 4px; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; border-radius: 4px; }
  #problems td:nth-child(2) { white-space: nowrap; }
</style>
</head>
<body>
<main>
  <section id="home">
    <div class="bar"><h1 id="title" class="grow">RuukkiLabra · arviointi</h1><button type="button" id="refresh">Päivitä</button></div>
    <div id="localBar" hidden></div>
    <p id="homeState" class="muted" aria-live="polite">Ladataan…</p>
    <div class="bar"><h2 class="grow">Kooste</h2><label id="scopeWrap"><select id="scope" aria-label="Luku"></select></label></div>
    <p id="noSummary" class="muted">Ei palautuksia.</p>
    <div class="wide"><table id="summary" hidden><thead></thead><tbody></tbody></table></div>
    <div class="bar"><h2 class="grow">Tehtävät</h2><label class="muted"><input type="checkbox" id="onlyOpen"> Vain arvioimattomat</label></div>
    <p class="muted" id="students" hidden></p>
    <div id="tasks" hidden></div>
    <section id="probSec" hidden>
      <h2>Tarkistettavat ja hylätyt palautukset</h2>
      <p id="noProblems" class="muted" hidden></p>
      <table id="problems" hidden><thead><tr><th>Tila</th><th>Luku</th><th>Opiskelija</th><th>Palautusaika</th><th>Tunniste</th><th>Syy</th><th>Päätös</th></tr></thead><tbody></tbody></table>
    </section>
  </section>

  <section id="grade" hidden>
    <div class="bar"><button type="button" id="back">← Tehtävälista</button><span class="muted" id="filterNote"></span></div>
    <div class="head"><h1 id="gTitle"></h1><span class="pos" id="gPos"></span></div>
    <div class="who" id="gEmail"></div>
    <div class="bar muted"><span id="gTime"></span><label id="gVerWrap" hidden>Palautusversio <select id="gVer"></select></label></div>
    <div class="panel"><h2>Tehtävänanto</h2><div class="statement" id="gStatement"></div>
      <details class="ans"><summary>Lyhyt mallivastaus</summary><div id="gModel"></div></details></div>
    <div class="panel"><div class="bar"><h2 class="grow">Opiskelijan vastaus</h2><label class="muted"><input type="checkbox" id="showTex"> Näytä kaavat LaTeX-muotoisina</label></div>
      <div class="answer" id="gAnswer" aria-live="polite"></div></div>
    <div class="score">
      <div class="bar">
        <label for="points"><b>Pisteet</b> <span class="muted" id="range"></span></label>
        <input id="points" type="text" inputmode="numeric" autocomplete="off" aria-describedby="range state">
        <span class="state" id="state" aria-live="polite"></span>
        <span class="grow"></span>
        <button type="button" id="prev">↑ Edellinen</button><button type="button" id="next">↓ Seuraava</button>
      </div>
      <p class="muted keys">↓ seuraava · ↑ edellinen · → +1 p · ← −1 p · 0,5: kirjoita kenttään + Enter</p>
    </div>
  </section>
</main>
<div id="zoom" role="dialog" aria-label="Suurennettu kuva"></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var S = { ov: null, task: null, chapter: null, entries: [], idx: 0, ver: 0, nav: false, saving: null, token: 0, cache: {}, onlyOpen: false, open: {}, scope: 'all', sort: { key: 'name', dir: 1 }, ready: false };
  var call = function (name, arg) {
    return new Promise(function (ok, no) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(e); });
      r[name](arg);
    });
  };
  var errText = function (e) { return (e && e.message ? e.message : String(e || '')).replace(/^(Exception|Error):\s*/, '') || 'tuntematon virhe'; };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
  var setState = function (text, s) { var n = $('state'); n.textContent = text; if (s) n.setAttribute('data-s', s); else n.removeAttribute('data-s'); };
  var B64 = /^[A-Za-z0-9+\/]+={0,2}$/;
  var max = function () { return S.ov ? S.ov.maxPoints : 0; };

  /* ---- aloitusnäkymä ---- */
  function loadHome() {
    $('homeState').textContent = 'Ladataan…';
    return call('rlOverview').then(function (ov) {
      S.ov = ov;
      $('title').textContent = 'RuukkiLabra · ' + ov.course + (ov.group ? ' · ryhmä ' + ov.group : '') + ' · arviointi';
      $('students').textContent = 'Hyväksyttyjä palauttajia ' + ov.students + '.';
      var box = $('tasks'); box.textContent = '';
      ov.chapters.forEach(function (c) {
        var scored = 0, all = 0;
        c.tasks.forEach(function (t) { scored += t.scored; all += t.submissions; });
        var d = el('details', 'chapter'); d.setAttribute('data-chapter', c.id);
        d.open = S.open[c.id] !== undefined ? S.open[c.id] : c.submissions > 0;   // palautetut luvut auki
        d.addEventListener('toggle', function () { S.open[c.id] = d.open; });
        var sm = el('summary', null, 'Luku ' + c.number + ' · ' + c.title + ' ');
        sm.append(el('span', 'muted', '· palautuksia ' + c.submissions + (c.submissions ? ' · arvioitu ' + scored + '/' + all : '')));
        var tb = el('tbody'), table = el('table'), head = el('thead'), hr = el('tr');
        ['Tehtävä', 'Taso', 'Palautuksia', 'Joista tyhjiä', 'Arvioitu'].forEach(function (h) { hr.append(el('th', null, h)); });
        head.append(hr); table.append(head, tb);
        c.tasks.forEach(function (t) {
          var tr = el('tr', 'task-row'); tr.tabIndex = 0;
          tr.append(el('td', null, 'Tehtävä ' + t.number), el('td', null, String(t.level)), el('td', null, String(t.submissions)), el('td', null, String(t.empty)), el('td', null, String(t.scored)));
          tr.addEventListener('click', function () { openTask(t.id); });
          tr.addEventListener('keydown', function (e) { if (e.key === 'Enter') openTask(t.id); });
          tb.append(tr);
        });
        d.append(sm, table); box.append(d);
      });
      box.hidden = false;
      renderSummary(ov);
      $('homeState').textContent = ov.students ? '' : (window.RL_LOCAL ? 'Valitse ryhmän palautukset (zip) ylhäältä.' : 'Ei palautuksia. RuukkiLabra → Tuo palautukset, sitten Päivitä.');
      var pb = $('problems').querySelector('tbody'); pb.textContent = '';
      ov.problems.forEach(function (p) {
        var tr = el('tr');
        var dc = el('td');
        tr.append(el('td', null, p.status), el('td', null, p.chapter), el('td', null, p.email), el('td', null, p.time), el('td', null, p.sub), el('td', null, p.reason), dc);
        if (p.status === 'Tarkistettava' || p.status === 'Hyväksytty') {   // opettajan päätös: Hyväksy / Hylkää / peru
          var want = p.decision ? '' : (p.status === 'Tarkistettava' ? 'Hyväksy' : 'Hylkää');
          var b = el('button', null, p.decision ? p.decision + ' · peru' : want); b.type = 'button';
          b.addEventListener('click', function () { b.disabled = true; call('rlSetDecision', { key: p.key, decision: want }).then(loadHome, function (e) { b.disabled = false; $('homeState').textContent = 'Päätöstä ei tallennettu: ' + errText(e); }); });
          dc.append(b);
        } else dc.textContent = p.decision;
        pb.append(tr);
      });
      $('problems').hidden = !ov.problems.length; $('probSec').hidden = !ov.problems.length;
    }, function (e) { $('homeState').textContent = 'Tietoja ei voitu ladata: ' + errText(e); $('homeState').className = 'err'; });
  }
  // Kooste (opettaja 5.11.2026): nimet vasemmalla; Tehty, Tarkistamatta ja Pisteet joko koko opintojaksosta (luvut,
  // joista ryhmällä on palautuksia) tai yhdestä luvusta. Järjestys sarakkeen otsikosta.
  var num = function (x) { return String(Math.round(x * 100) / 100).replace('.', ','); };
  function renderSummary(ov) {
    var chs = ov.chapters.filter(function (c) { return c.submissions > 0; });
    var sel = $('scope'), want = S.scope || 'all';
    sel.textContent = '';
    var o = el('option', null, 'Kaikki palautetut luvut'); o.value = 'all'; sel.append(o);
    chs.forEach(function (c) { var x = el('option', null, 'Luku ' + c.number + ' · ' + c.title); x.value = c.id; sel.append(x); });
    if (want !== 'all' && !chs.some(function (c) { return c.id === want; })) want = 'all';
    sel.value = S.scope = want;
    var scope = want === 'all' ? chs : chs.filter(function (c) { return c.id === want; });
    var nTasks = scope.reduce(function (n, c) { return n + c.tasks.length; }, 0), max = nTasks * ov.maxPoints;
    var rows = ov.summary.map(function (s) {
      var r = { name: s.email, answered: 0, unchecked: 0, points: 0, returned: 0 };
      scope.forEach(function (c) { var x = s.chapters[c.id]; if (x) { r.answered += x.answered; r.unchecked += x.unchecked; r.points += x.points; r.returned++; } });
      return r;
    });
    var key = S.sort.key, dir = S.sort.dir;
    rows.sort(function (a, b) { var byName = a.name.localeCompare(b.name, 'fi'); return key === 'name' ? byName * dir : ((a[key] - b[key]) * dir || byName); });
    var head = $('summary').querySelector('thead'), body = $('summary').querySelector('tbody');
    head.textContent = ''; body.textContent = '';
    var hr = el('tr');
    [['name', 'Opiskelija', ''], ['answered', 'Tehty', 'n'], ['unchecked', 'Tarkistamatta', 'n'], ['points', 'Pisteet', 'n']].forEach(function (h) {
      var th = el('th', h[2]), b = el('button', 'sort', h[1] + ' ' + (key === h[0] ? (dir > 0 ? '▲' : '▼') : '⇅'));
      b.type = 'button'; b.setAttribute('data-key', h[0]);
      th.setAttribute('aria-sort', key === h[0] ? (dir > 0 ? 'ascending' : 'descending') : 'none');
      b.addEventListener('click', function () { S.sort = { key: h[0], dir: key === h[0] ? -dir : (h[0] === 'name' ? 1 : -1) }; renderSummary(S.ov); });
      th.append(b); hr.append(th);
    });
    head.append(hr);
    rows.forEach(function (r) {
      var tr = el('tr'); if (!r.returned) { tr.className = 'none'; tr.title = 'Ei palautusta tästä luvusta'; }
      var part = function (v, of) { var td = el('td', 'n'); td.append(el('span', 'v', v)); if (of !== undefined) td.append(el('span', 'of', ' / ' + of)); return td; };
      tr.append(el('td', null, r.name), part(String(r.answered), nTasks), part(String(r.unchecked)), part(num(r.points), num(max)));
      body.append(tr);
    });
    $('summary').hidden = !rows.length; $('noSummary').hidden = !!rows.length; $('scopeWrap').hidden = !rows.length;
  }
  $('scope').addEventListener('change', function () { S.scope = $('scope').value; if (S.ov) renderSummary(S.ov); });
  $('refresh').addEventListener('click', loadHome);
  $('onlyOpen').addEventListener('change', function () { S.onlyOpen = $('onlyOpen').checked; });

  /* ---- arviointi ---- */
  function cur() { var e = S.entries[S.idx]; return e ? { entry: e, version: e.versions[S.ver] } : null; }
  function scoreText(v) { return v === '' || v === null || v === undefined ? '' : String(v).replace('.', ','); }
  function openTask(id) {
    S.ov.chapters.forEach(function (c) { c.tasks.forEach(function (t) { if (t.id === id) { S.task = t; S.chapter = c; } }); });
    $('home').hidden = true; $('grade').hidden = false;
    $('gTitle').textContent = S.ov.course + ' · Luku ' + S.chapter.number + ' · Tehtävä ' + S.task.number;
    $('gStatement').innerHTML = S.task.html;   // RuukkiLabran oma, generoitu tehtävänanto (Tehtavat.gs), ei opiskelijan dataa
    $('gModel').innerHTML = S.task.answer;
    $('range').textContent = '0–' + scoreText(max());
    $('gAnswer').textContent = 'Ladataan…'; $('gPos').textContent = ''; $('gEmail').textContent = ''; $('gTime').textContent = '';
    setState('');
    S.entries = []; lockUi(true);
    call('rlQueue', id).then(function (q) {
      S.entries = S.onlyOpen ? q.filter(function (e) { return scoreText(e.versions[e.versions.length - 1].score) === ''; }) : q;
      $('filterNote').textContent = S.onlyOpen ? 'Vain arvioimattomat (' + S.entries.length + ' / ' + q.length + ' palauttajaa)' : '';
      if (!S.entries.length) { $('gAnswer').textContent = S.onlyOpen ? 'Kaikki tämän tehtävän palautukset on arvioitu.' : 'Tästä luvusta ei ole hyväksyttyjä palautuksia.'; lockUi(false); $('points').disabled = true; return; }
      show(0, null);
    }, function (e) { $('gAnswer').textContent = ''; setState('Jonoa ei voitu ladata: ' + errText(e), 'no'); lockUi(false); });
  }
  function lockUi(on) { $('prev').disabled = $('next').disabled = on; $('points').disabled = on; $('gVer').disabled = on; }
  function show(idx, ver) {
    S.idx = idx; var e = S.entries[idx];
    S.ver = ver === null || ver === undefined ? e.versions.length - 1 : ver;   // oletuksena uusin hyväksytty versio
    var v = e.versions[S.ver];
    $('gPos').textContent = 'Opiskelija ' + (idx + 1) + '/' + S.entries.length;
    $('gEmail').textContent = e.email;
    $('gTime').textContent = 'Palautettu ' + v.time + ' · versio ' + (S.ver + 1) + '/' + e.versions.length + (S.ver === e.versions.length - 1 ? ' (uusin)' : ' (vanhempi)') + ' · tunniste ' + v.sub.slice(0, 8);
    var sel = $('gVer'); sel.textContent = '';
    e.versions.forEach(function (x, i) { var o = el('option', null, (i + 1) + ': ' + x.time + (scoreText(x.score) !== '' ? ' · ' + scoreText(x.score) + ' p' : '')); o.value = String(i); sel.append(o); });
    sel.value = String(S.ver); $('gVerWrap').hidden = e.versions.length < 2;
    $('points').value = scoreText(v.score);
    setState(scoreText(v.score) !== '' ? 'Tallennettu ✓' : 'Arvioimaton', scoreText(v.score) !== '' ? 'ok' : null);
    $('prev').disabled = idx === 0; $('next').disabled = idx === S.entries.length - 1;
    $('points').disabled = true; $('gVer').disabled = false;
    var token = ++S.token;
    $('gAnswer').textContent = 'Ladataan vastausta…';
    fetchAnswer(e, v).then(function (a) {
      if (token !== S.token) return;   // ehdittiin siirtyä toiseen opiskelijaan
      renderAnswer(a); $('points').disabled = false;
    }, function (err) {
      if (token !== S.token) return;
      $('gAnswer').textContent = ''; $('gAnswer').append(el('p', 'err', 'Vastausta ei voitu näyttää: ' + errText(err)));
      $('points').disabled = false;
    });
    var nx = S.entries[idx + 1]; if (nx) fetchAnswer(nx, nx.versions[nx.versions.length - 1]).catch(function () {});   // seuraava valmiiksi
  }
  function fetchAnswer(e, v) {
    var k = v.fileId + '|' + S.task.id;
    if (!S.cache[k]) S.cache[k] = call('rlAnswer', { email: e.email, fileId: v.fileId, sub: v.sub, task: S.task.id }).catch(function (err) { delete S.cache[k]; throw err; });
    return S.cache[k];
  }
  function renderAnswer(a) {
    var box = $('gAnswer'); box.textContent = '';
    if (a.status === 'empty' || !a.content.length) { box.append(el('p', 'empty', 'Opiskelija jätti tehtävän tyhjäksi (ei ratkaisua editorissa).')); return; }
    var tex = $('showTex').checked, p = el('div');
    a.content.forEach(function (it) {
      if (it.type === 'text') p.append(el('span', 't', it.text));
      else if (it.type === 'math') {
        if (!tex && typeof it.png === 'string' && B64.test(it.png)) {
          var m = el('img', 'math'); m.alt = it.latex; m.title = it.latex; m.src = 'data:image/png;base64,' + it.png;
          m.style.width = Math.round(it.w * 1.25) + 'px'; m.style.height = Math.round(it.h * 1.25) + 'px'; p.append(m);
        } else p.append(el('code', 'math', it.latex));
      } else if (it.type === 'image' && (it.mime === 'image/png' || it.mime === 'image/jpeg') && B64.test(it.data)) {
        var i = el('img', 'shot'); i.alt = 'Opiskelijan kuva (' + it.w + ' × ' + it.h + ' px), suurenna napsauttamalla'; i.src = 'data:' + it.mime + ';base64,' + it.data;
        i.addEventListener('click', function () { zoom(i.src); }); p.append(i);
      }
    });
    box.append(p);
  }
  $('showTex').addEventListener('change', function () { var c = cur(); if (c) fetchAnswer(c.entry, c.version).then(function (a) { if (cur() && cur().version === c.version) renderAnswer(a); }); });
  function zoom(src) {
    var z = $('zoom'); z.textContent = ''; var i = el('img'); i.src = src; i.alt = 'Opiskelijan kuva täysikokoisena'; z.append(i); z.style.display = 'block';
  }
  $('zoom').addEventListener('click', function () { $('zoom').style.display = 'none'; });

  // Pisteiden tallennus: pyyntö kantaa opiskelijan, palautusversion ja tehtävän, joten myöhässä tuleva vastaus ei voi
  // osua väärään opiskelijaan. Yksi tallennus kerrallaan; seuraava odottaa edellistä.
  // Pisteet 0–max, enintään kaksi desimaalia, pilkku tai piste (opettaja 5.11.2026: "vaikka 0,5").
  function parsePoints(s) {
    s = s.trim();
    if (s === '') return { ok: true, value: '' };
    if (!/^\d+(?:[.,]\d{1,2})?$/.test(s)) return { ok: false };
    var v = Number(s.replace(',', '.'));
    return v > max() ? { ok: false } : { ok: true, value: v };
  }
  var badPoints = function () { return 'Pisteet: 0–' + scoreText(max()) + ' (esim. 0,5) tai tyhjä. Ei tallennettu.'; };
  function saveCurrent() {
    var c = cur(); if (!c) return Promise.resolve(true);
    var p = parsePoints($('points').value);
    if (!p.ok) { setState(badPoints(), 'no'); return Promise.resolve(false); }
    if (S.saving) return S.saving.then(function () { return saveCurrent(); });
    if (p.value === (c.version.score === null || c.version.score === undefined ? '' : c.version.score)) return Promise.resolve(true);
    var target = c.version, req = { email: c.entry.email, sub: target.sub, task: S.task.id, value: p.value };
    setState('Tallennetaan…', 'busy');
    S.saving = call('rlSaveScore', req).then(function (r) {
      target.score = r.value;
      if (cur() && cur().version === target) setState(r.value === '' ? 'Tallennettu ✓ (arvioimaton)' : 'Tallennettu ✓', 'ok');
      return true;
    }, function (e) {
      if (cur() && cur().version === target) setState('Tallennus epäonnistui: ' + errText(e) + ' Pisteitä ei tallennettu.', 'no');
      return false;
    }).then(function (ok) { S.saving = null; return ok; });
    return S.saving;
  }
  // ↓/↑: tallennus ja siirtyminen. Viimeisellä ↓ tallentaa ja kertoo, että tehtävä on käyty läpi.
  function go(delta) {
    if (S.nav || !cur()) return;
    var to = S.idx + delta;
    if (to < 0) return;
    if (to >= S.entries.length) {
      saveCurrent().then(function (ok) { if (ok && cur()) setState('Tallennettu ✓ · tehtävän viimeinen palautus', 'ok'); });
      return;
    }
    S.nav = true; $('prev').disabled = $('next').disabled = true;
    saveCurrent().then(function (ok) {
      S.nav = false;
      if (!ok) { $('prev').disabled = S.idx === 0; $('next').disabled = S.idx === S.entries.length - 1; return; }   // virhe: pysytään paikallaan
      show(to, null);
    });
  }
  // →/←: +1 / −1 piste (rajat 0 ja max), tallentuu heti. Tyhjästä → antaa 1 ja ← antaa 0.
  function step(delta) {
    if ($('points').disabled || !cur()) return;
    var p = parsePoints($('points').value), base = p.ok && p.value !== '' ? p.value : 0;
    var v = Math.max(0, Math.min(max(), Math.round((base + delta) * 100) / 100));
    $('points').value = scoreText(v);
    saveCurrent();
  }
  function setPoints(text) {
    if ($('points').disabled || !cur()) return;
    $('points').value = text;
    saveCurrent();
  }
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('points').addEventListener('change', function () { if (!S.nav) saveCurrent(); });
  // Pistekentässä (esim. 0,5): Enter, ↓ ja ↑ tallentavat ja siirtyvät, ja kohdistin palaa näkymään, jotta nuolet toimivat
  // taas; ← ja → liikuttavat kohdistinta kentässä; Esc poistuu kentästä.
  $('points').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); $('points').blur(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); $('points').blur(); go(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); $('points').blur(); }
  });
  $('gVer').addEventListener('change', function () {
    var want = Number($('gVer').value);
    if (S.nav) { $('gVer').value = String(S.ver); return; }
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (ok) show(S.idx, want); else $('gVer').value = String(S.ver); });
  });
  document.addEventListener('keydown', function (e) {
    if ($('zoom').style.display === 'block') { if (e.key === 'Escape') $('zoom').style.display = 'none'; return; }
    if ($('grade').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;   // muokkauskentässä näppäimet toimivat normaalisti
    if (e.key === 'ArrowDown') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (/^[0-9]$/.test(e.key)) { e.preventDefault(); setPoints(e.key); }   // numero suoraan pisteiksi, tallentuu heti
    else if (e.key === ',' || e.key === '.') { e.preventDefault(); if (!$('points').disabled) { $('points').focus(); $('points').value = '0,'; } }   // desimaali: kenttään
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); setPoints(''); }
    else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A' && tag !== 'TR') { e.preventDefault(); go(1); }
  });
  $('back').addEventListener('click', function () {
    if (S.nav) return;
    S.nav = true;
    saveCurrent().then(function (ok) { S.nav = false; if (!ok) return; S.token++; $('grade').hidden = true; $('home').hidden = false; loadHome(); });
  });
  window.addEventListener('beforeunload', function (e) {
    var c = cur(); if (!c || $('grade').hidden) return;
    var p = parsePoints($('points').value);
    if (S.saving || !p.ok || p.value !== (c.version.score === null ? '' : c.version.score)) { e.preventDefault(); e.returnValue = ''; }
  });
  window.rlReload = loadHome;   // paikallinen arviointisivu päivittää näkymän tiedostojen lukemisen jälkeen
  loadHome();
})();
</script>
