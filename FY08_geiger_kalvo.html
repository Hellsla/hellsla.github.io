<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geiger-mittari (kalvoversio)</title>
<link rel="stylesheet" href="simulaatio-theme.css" />
<style>
  :root{
    --ink:#3F3D39;
    --blue:#2E86A6;
    --red:#D84A62;
    --orange:#F28C28;
    --yellow:#FFD95A;
    --gold:#C08A3E;
    --grey:#9A958C;
    --slate:#6E7A82;
    --muted:#6B675F;
    --faint:#9A958C;
    --line:#DDDAD4;
  }

  .scene{ width:100%; height:100%; }
  .scene text{ font-family:inherit; }

  .h    { font-size:14px; fill:var(--faint); letter-spacing:.12em; }
  .note { font-size:14px; fill:var(--muted); }
  .msg  { font-size:21px; fill:var(--muted); }
  .cap  { font-size:16px; fill:var(--muted); }
  .huge { font-size:52px; fill:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }
  .val  { font-size:24px; fill:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }
  .tag  { font-size:15px; font-weight:700; }
  .frame{ fill:none; stroke:var(--line); stroke-width:1.6; }

  .sim-tabs{
    position:absolute; right:2.1em; top:1.1em;
    display:flex; gap:.55em;
    font-size:15px;
  }
  .sim-tabs .sim-btn{
    font-size:1em; padding:.35em .9em;
    border-width:1.5px; border-color:#D8D4CC; color:var(--muted);
  }
  .sim-tabs .sim-btn[aria-selected="true"]{
    background:var(--ink); border-color:var(--ink); color:#fff;
  }

  .sim-controls{
    font-size:18px;
    left:2em; right:2em; bottom:1em;
    gap:.7em 1.1em;
  }
  .sim-controls[hidden]{ display:none; }
  .sim-controls .sim-btn{ font-size:.94em; padding:.36em .95em; border-width:1.6px; }
  .sim-controls .sim-btn.primary{ background:var(--ink); color:#fff; }
  .sim-controls .sim-sliderBox{ width:auto; gap:.6em; }
  .sim-controls .sim-sliderBox label{ font-size:.94em; }
  .sim-controls .sim-range{ width:8em; }
  .sim-controls .out{
    min-width:5ch; text-align:right; font-weight:700; color:var(--ink);
    font-size:.94em; font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body class="sim-body">
<main class="sim-wrap" aria-label="Geiger-mittarin simulaatio">

<svg class="scene" viewBox="0 0 960 540" role="img"
     aria-label="Geiger-Müller-putken toimintaperiaate ja säteilyn mittaaminen">

<defs>
  <clipPath id="tubeClip"><rect x="62" y="94" width="836" height="172" rx="18"/></clipPath>
  <clipPath id="graphClip"><rect x="422" y="302" width="476" height="92"/></clipPath>
  <clipPath id="stage2"><rect x="0" y="60" width="960" height="330"/></clipPath>
</defs>

<text id="msg" x="480" y="420" text-anchor="middle" class="msg">Lähetä ionisoivaa säteilyä putkeen.</text>

<!-- ================= 1 · TOIMINTAPERIAATE ================= -->
<g id="view1">

  <text x="60" y="76" class="h">GEIGER–MÜLLER-PUTKI, POIKKILEIKKAUS</text>

  <!-- putken runko = katodi -->
  <rect x="60" y="92" width="840" height="176" rx="20"
        fill="#F7F9FA" stroke="var(--ink)" stroke-width="3"/>
  <g clip-path="url(#tubeClip)">
    <g id="gas"></g>
    <g id="parts"></g>
  </g>

  <!-- ikkuna, josta säteily pääsee sisään -->
  <line x1="898" y1="128" x2="898" y2="232" stroke="var(--blue)" stroke-width="7"/>
  <text x="884" y="88" text-anchor="end" class="note">ohut ikkuna</text>

  <!-- anodilanka -->
  <line id="wire" x1="92" y1="180" x2="876" y2="180"
        stroke="var(--gold)" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="166" class="tag" fill="var(--gold)">ANODI +</text>
  <text x="104" y="256" class="tag" fill="var(--slate)">KATODI −  (putken seinämä)</text>

  <!-- vaiheiden nimilaput -->
  <text id="tagIon"  class="tag" fill="var(--red)"    opacity="0" text-anchor="middle">ionisaatio</text>
  <text id="tagAval" class="tag" fill="var(--orange)" opacity="0" text-anchor="middle">vyöry</text>

  <!-- johdotus laskurille -->
  <path d="M60 180 L34 180 L34 330 L60 330" fill="none" stroke="var(--gold)" stroke-width="2.6"/>
  <path d="M230 268 L230 300" fill="none" stroke="var(--slate)" stroke-width="2.6"/>
  <text id="volt" x="150" y="292" class="note">U = 450 V</text>

  <!-- laskuri ja kaiutin -->
  <rect id="cbox" x="60" y="300" width="320" height="96" rx="10"
        fill="#fff" stroke="var(--line)" stroke-width="1.6"/>
  <text x="78" y="324" class="h">PULSSEJA</text>
  <text id="count" x="78" y="372" class="huge">0</text>
  <g id="spk" transform="translate(300,348)">
    <path d="M-16 -9 L-6 -9 L6 -20 L6 20 L-6 9 L-16 9 Z" fill="var(--ink)"/>
    <path id="spk1" d="M12 -11 A15 15 0 0 1 12 11" fill="none"
          stroke="var(--ink)" stroke-width="2.4" opacity="0.18"/>
    <path id="spk2" d="M20 -19 A25 25 0 0 1 20 19" fill="none"
          stroke="var(--ink)" stroke-width="2.4" opacity="0.18"/>
  </g>

  <!-- virtapulssikaavio -->
  <text x="420" y="292" class="h">VIRTAPULSSI  I(t)</text>
  <rect x="420" y="300" width="480" height="96" class="frame"/>
  <g clip-path="url(#graphClip)">
    <polyline id="graph" fill="none" stroke="var(--orange)" stroke-width="2.4"
              stroke-linejoin="round" points=""/>
  </g>

  <g id="legend1">
    <circle cx="428" cy="278" r="0" fill="none"/>
  </g>
</g>

<!-- ================= 2 · ETÄISYYS JA SUOJAUS ================= -->
<g id="view2" style="display:none">

  <text x="40" y="76" class="h">SÄTEILYN VAIMENEMINEN</text>

  <g clip-path="url(#stage2)">
    <g id="rays"></g>
  </g>

  <rect id="box" x="636" y="60" width="288" height="120" rx="10"
        fill="#fff" stroke="var(--line)" stroke-width="1.6"/>
  <text x="658" y="88" class="h">PULSSEJA SEKUNNISSA</text>
  <text id="rate" x="658" y="150" class="huge">0</text>
  <text x="902" y="112" text-anchor="end" class="h">YHTEENSÄ</text>
  <text id="total" x="902" y="150" text-anchor="end" class="val">0</text>

  <path id="wire2" fill="none" stroke="var(--slate)" stroke-width="2.4"/>

  <g>
    <rect x="150" y="198" width="98" height="74" rx="7" fill="var(--slate)"/>
    <rect x="238" y="226" width="14" height="18" fill="#FBFAF8"/>
    <circle cx="196" cy="235" r="11" fill="var(--yellow)"/>
    <text x="199" y="292" text-anchor="middle" class="note">säteilylähde</text>
  </g>

  <g id="shield" opacity="0">
    <rect id="shieldPlate" x="254" y="186" width="15" height="98" rx="3" fill="var(--grey)"/>
    <text id="shieldName" x="261" y="176" text-anchor="middle" class="note">paperi</text>
  </g>

  <g id="tube2">
    <rect x="0" y="207" width="112" height="56" rx="9" fill="#FBFAF8"
          stroke="var(--ink)" stroke-width="2.6"/>
    <line x1="3" y1="212" x2="3" y2="258" stroke="var(--blue)" stroke-width="5"/>
    <line x1="16" y1="235" x2="98" y2="235" stroke="var(--slate)"
          stroke-width="2" stroke-dasharray="4 4"/>
    <text x="56" y="292" text-anchor="middle" class="note">GM-putki</text>
  </g>
  <circle id="hitFlash" cx="0" cy="235" r="10" fill="none"
          stroke="var(--yellow)" stroke-width="3" opacity="0"/>

  <g>
    <line x1="250" y1="332" x2="250" y2="348" stroke="var(--faint)" stroke-width="1.2"/>
    <line id="dimEnd" x1="0" y1="332" x2="0" y2="348" stroke="var(--faint)" stroke-width="1.2"/>
    <line id="dimLine" x1="250" y1="340" x2="0" y2="340" stroke="var(--faint)"
          stroke-width="1.2" stroke-dasharray="4 4"/>
    <text id="dimText" x="0" y="364" text-anchor="middle" class="note">12 cm</text>
  </g>
</g>

</svg>

<div class="sim-tabs" role="tablist" aria-label="Simulaation osat">
  <button class="sim-btn" type="button" role="tab" id="tab1" aria-controls="view1" aria-selected="true">1 · Toimintaperiaate</button>
  <button class="sim-btn" type="button" role="tab" id="tab2" aria-controls="view2" aria-selected="false">2 · Etäisyys ja suojaus</button>
</div>

<div class="sim-controls" id="ctrl1">
  <button class="sim-btn primary" type="button" id="fire1">Lähetä säteily</button>
  <button class="sim-btn" type="button" id="auto1">Jatkuva: pois</button>
  <div class="sim-sliderBox">
    <label for="hv">Jännite</label>
    <input class="sim-range" id="hv" type="range" min="100" max="600" step="10" value="450">
    <span class="out" id="hvOut">450 V</span>
  </div>
  <button class="sim-btn" type="button" id="reset1">Nollaa</button>
</div>

<div class="sim-controls" id="ctrl2" hidden>
  <div class="sim-sliderBox">
    <label for="dist">Etäisyys</label>
    <input class="sim-range" id="dist" type="range" min="2" max="30" step="1" value="12">
    <span class="out" id="distOut">12 cm</span>
  </div>
  <button class="sim-btn" type="button" id="type">Säteily: gamma</button>
  <button class="sim-btn" type="button" id="shieldBtn">Suoja: ei suojaa</button>
  <button class="sim-btn" type="button" id="sound">Ääni: pois</button>
  <button class="sim-btn" type="button" id="reset2">Nollaa</button>
</div>

</main>

<script>
(() => {
"use strict";

const NS = "http://www.w3.org/2000/svg";
const $  = id => document.getElementById(id);
const mk = (tag, attrs) => {
  const el = document.createElementNS(NS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
};
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);

const msgEl = $("msg");
const setMsg = t => { msgEl.textContent = t; };

/* napsahdusääni, jaettu molemmille näkymille */
let actx = null, soundOn = false, lastClick = 0;
function click(now){
  if(!soundOn || now - lastClick < 40) return;
  lastClick = now;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = 1500;
    g.gain.setValueAtTime(0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.03);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + 0.035);
  }catch(e){ /* ääni ei käytettävissä */ }
}

/* ==================== 1 · TOIMINTAPERIAATE ==================== */

const V1 = (() => {
  const X0 = 70, X1 = 890, Y0 = 100, Y1 = 260;   // putken sisätila
  const WIRE_Y = 180;
  const WIN_X = 896;                              // ikkuna oikeassa päädyssä
  const HV_KYNNYS = 300;                          // vyöryyn tarvittava jännite

  const gGas = $("gas"), gParts = $("parts");
  const tagIon = $("tagIon"), tagAval = $("tagAval");

  /* kaasuatomit taustalle */
  (function(){
    for(let i = 0; i < 70; i++){
      const x = rnd(X0 + 8, X1 - 8), y = rnd(Y0 + 6, Y1 - 6);
      if(Math.abs(y - WIRE_Y) < 12) continue;
      gGas.appendChild(mk("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3.6,
                                      fill: "#DDE3E6" }));
    }
  })();

  let rays = [], electrons = [], ions = [], flashes = [];
  let count = 0, auto = false, autoT = 0;
  let wireGlow = 0, spkGlow = 0, pulse = 0, sampleT = 0;
  const hist = new Array(120).fill(0);

  const hv = () => parseInt($("hv").value, 10);

  function addRay(){
    const y = rnd(Y0 + 20, Y1 - 20);
    const tx = rnd(260, 740);
    /* ionisaatiokohta ei aivan langan päälle, jotta matka näkyy */
    const ty = Math.random() < 0.5 ? rnd(Y0 + 10, WIRE_Y - 46) : rnd(WIRE_Y + 46, Y1 - 10);
    const dx = tx - WIN_X, dy = ty - y;
    const len = Math.hypot(dx, dy);
    const el = mk("path", {
      d: "M0 0 q 7 -7 14 0 t 14 0 t 14 0",
      fill: "none", stroke: "var(--yellow)", "stroke-width": 3.2, "stroke-linecap": "round"
    });
    gParts.appendChild(el);
    rays.push({ x: WIN_X, y, vx: dx / len * 460, vy: dy / len * 460,
                tx, ty, ang: Math.atan2(dy, dx) * 180 / Math.PI, el });
    setMsg("Ionisoiva säteily tulee putkeen ohuen ikkunan läpi.");
  }

  function addElectron(x, y, primary){
    const el = mk("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: primary ? 6 : 5,
                              fill: "var(--blue)" });
    gParts.appendChild(el);
    electrons.push({ x, y, vx: 0, vy: 0, primary, startedAbove: y < WIRE_Y, el });
  }

  function addIon(x, y){
    const g = mk("g", {});
    g.appendChild(mk("circle", { r: 7, fill: "var(--red)" }));
    const t = mk("text", { x: 0, y: 4, "text-anchor": "middle",
                           "font-size": 11, fill: "#fff", "font-weight": 700 });
    t.textContent = "+";
    g.appendChild(t);
    gParts.appendChild(g);
    const dir = y < WIRE_Y ? -1 : 1;         // ajautuu lähimmälle seinämälle
    ions.push({ x, y, vy: dir * 26, el: g, life: 0 });
  }

  function addFlash(x, y){
    const el = mk("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 5, fill: "none",
                              stroke: "var(--yellow)", "stroke-width": 3 });
    gParts.appendChild(el);
    flashes.push({ el, life: 0, max: 0.45 });
  }

  function ionize(x, y){
    addFlash(x, y);
    addElectron(x, y, true);
    addIon(x, y);
    tagIon.setAttribute("x", x.toFixed(1));
    tagIon.setAttribute("y", (y < WIRE_Y ? y - 18 : y + 26).toFixed(1));
    tagIon.setAttribute("opacity", "1");
    setMsg("Säteily ionisoi kaasuatomin: syntyy vapaa elektroni ja positiivinen ioni.");
  }

  function avalanche(x, ionAbove){
    tagAval.setAttribute("x", clamp(x - 95, 130, 830).toFixed(1));
    tagAval.setAttribute("y", ionAbove ? "224" : "142");
    tagAval.setAttribute("opacity", "1");
    const n = 12;
    for(let i = 0; i < n; i++){
      const ex = clamp(x + rnd(-52, 52), X0 + 6, X1 - 6);
      const ey = WIRE_Y + (Math.random() < 0.5 ? -1 : 1) * rnd(20, 48);
      addElectron(ex, ey, false);
      if(i % 3 === 0) addIon(ex, ey);
    }
    setMsg("Elektroni kiihtyy anodia kohti ja irrottaa lisää elektroneja — syntyy vyöry.");
  }

  function registerPulse(now){
    count++;
    pulse = 1;
    wireGlow = 0.35;
    spkGlow = 0.35;
    $("count").textContent = count;
    click(now);
    setMsg("Vyöryn elektronit osuvat anodiin: putkessa kulkee virtapulssi, jonka laskuri rekisteröi.");
  }

  function step(dt, now){
    const U = hv();
    $("hvOut").textContent = U + " V";
    $("volt").textContent = "U = " + U + " V";

    if(auto){
      autoT -= dt;
      if(autoT <= 0){ autoT = rnd(1.1, 2.2); addRay(); }
    }

    /* säteily kohti ionisaatiopistettä */
    for(let i = rays.length - 1; i >= 0; i--){
      const r = rays[i];
      r.x += r.vx * dt; r.y += r.vy * dt;
      r.el.setAttribute("transform",
        "translate(" + r.x.toFixed(1) + "," + r.y.toFixed(1) + ") rotate(" + r.ang.toFixed(1) + ")");
      if((r.vx < 0 && r.x <= r.tx) || (r.vx >= 0 && r.x >= r.tx)){
        gParts.removeChild(r.el);
        rays.splice(i, 1);
        ionize(r.tx, r.ty);
      }
    }

    /* elektronit kiihtyvät anodille, kenttä voimistuu langan lähellä */
    for(let i = electrons.length - 1; i >= 0; i--){
      const e = electrons[i];
      const dy = WIRE_Y - e.y;
      const r = Math.max(Math.abs(dy), 8);
      const a = (70 + 900 / Math.max(r, 14)) * (U / 450);
      e.vy += Math.sign(dy) * a * dt;
      e.vx *= 0.96;
      e.y += e.vy * dt;
      e.x += e.vx * dt;

      if(e.primary && U >= HV_KYNNYS && Math.abs(WIRE_Y - e.y) < 26 && !e.done){
        e.done = true;
        avalanche(e.x, e.startedAbove);
      }

      if(Math.abs(WIRE_Y - e.y) < 5){
        if(e.primary){
          if(U >= HV_KYNNYS) registerPulse(now);
          else setMsg("Jännite on liian pieni: elektroni ei kiihdy tarpeeksi eikä vyöryä synny.");
          tagIon.setAttribute("opacity", "0");
        }
        gParts.removeChild(e.el);
        electrons.splice(i, 1);
        continue;
      }
      e.el.setAttribute("cx", e.x.toFixed(1));
      e.el.setAttribute("cy", e.y.toFixed(1));
    }

    /* positiiviset ionit ajautuvat hitaasti seinämälle */
    for(let i = ions.length - 1; i >= 0; i--){
      const p = ions[i];
      p.y += p.vy * dt;
      p.life += dt;
      p.el.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
      if(p.y < Y0 + 4 || p.y > Y1 - 4){
        p.el.setAttribute("opacity", clamp(1 - (p.life - 0) * 0, 0, 1));
        gParts.removeChild(p.el); ions.splice(i, 1);
      }
    }

    for(let i = flashes.length - 1; i >= 0; i--){
      const f = flashes[i];
      f.life += dt;
      if(f.life >= f.max){ gParts.removeChild(f.el); flashes.splice(i, 1); continue; }
      const k = f.life / f.max;
      f.el.setAttribute("r", (5 + k * 26).toFixed(1));
      f.el.setAttribute("opacity", (1 - k).toFixed(2));
    }

    if(!electrons.length && !rays.length) tagAval.setAttribute("opacity", "0");

    /* anodin välähdys, kaiutin ja pulssikaavio */
    wireGlow = Math.max(0, wireGlow - dt);
    spkGlow  = Math.max(0, spkGlow - dt);
    $("wire").setAttribute("stroke", wireGlow > 0 ? "var(--yellow)" : "var(--gold)");
    $("wire").setAttribute("stroke-width", wireGlow > 0 ? 7 : 4);
    const sg = spkGlow > 0 ? 1 : 0.18;
    $("spk1").setAttribute("opacity", sg);
    $("spk2").setAttribute("opacity", sg);

    pulse *= Math.exp(-dt / 0.075);
    sampleT += dt;
    if(sampleT >= 0.04){
      sampleT = 0;
      hist.push(pulse); hist.shift();
      let pts = "";
      for(let i = 0; i < hist.length; i++){
        const x = 424 + i / (hist.length - 1) * 472;
        const y = 388 - clamp(hist[i], 0, 1) * 76;
        pts += x.toFixed(1) + "," + y.toFixed(1) + " ";
      }
      $("graph").setAttribute("points", pts.trim());
    }
  }

  function reset(){
    [...rays, ...electrons, ...flashes].forEach(p => gParts.removeChild(p.el));
    ions.forEach(p => gParts.removeChild(p.el));
    rays = []; electrons = []; ions = []; flashes = [];
    count = 0; pulse = 0; wireGlow = 0; spkGlow = 0; autoT = 0;
    hist.fill(0);
    $("count").textContent = "0";
    $("graph").setAttribute("points", "");
    tagIon.setAttribute("opacity", "0");
    tagAval.setAttribute("opacity", "0");
    setMsg("Lähetä ionisoivaa säteilyä putkeen ja seuraa, miten siitä syntyy sähkövirta.");
  }

  $("fire1").addEventListener("click", addRay);
  $("reset1").addEventListener("click", reset);
  $("auto1").addEventListener("click", () => {
    auto = !auto; autoT = 0;
    $("auto1").textContent = "Jatkuva: " + (auto ? "päällä" : "pois");
  });

  return { step, reset };
})();

/* ==================== 2 · ETÄISYYS JA SUOJAUS ==================== */

const V2 = (() => {
  const SRC_X = 250, SRC_Y = 235;
  const PXCM  = 550 / 28;
  const WIN_H = 28;
  const CONE  = 15 * Math.PI / 180;
  const SPEED = 620;
  const EMIT  = 100;
  const BG    = 0.7;
  const ALPHA_RANGE = 4 * PXCM;

  const TYPES = [
    { id: "alfa",  name: "alfa",  color: "var(--red)",
      trans: { ei: 1, paperi: 0,    alumiini: 0,    lyijy: 0    } },
    { id: "beeta", name: "beeta", color: "var(--blue)",
      trans: { ei: 1, paperi: 0.85, alumiini: 0.08, lyijy: 0    } },
    { id: "gamma", name: "gamma", color: "var(--orange)",
      trans: { ei: 1, paperi: 0.99, alumiini: 0.75, lyijy: 0.12 } }
  ];
  const SHIELDS = [
    { id: "ei",       name: "ei suojaa", fill: null },
    { id: "paperi",   name: "paperi",    fill: "#E8E0CE" },
    { id: "alumiini", name: "alumiini",  fill: "#C4C9CD" },
    { id: "lyijy",    name: "lyijy",     fill: "#5C666D" }
  ];

  let typeIdx = 2, shieldIdx = 0;
  let total = 0, hits = [], rays = [], flashUntil = 0, emitAcc = 0, bgAcc = 0;

  const gRays = $("rays"), tube = $("tube2"), hitFlash = $("hitFlash");
  const tubeX = () => SRC_X + parseInt($("dist").value, 10) * PXCM;
  const T = () => TYPES[typeIdx];
  const S = () => SHIELDS[shieldIdx];

  function count(now){
    total++; hits.push(now); flashUntil = now + 130; click(now);
  }

  function emit(){
    const cosT = 1 - Math.random() * (1 - Math.cos(CONE));
    const th = Math.acos(clamp(cosT, -1, 1));
    const ang = th * (Math.random() < 0.5 ? 1 : -1);
    const gap = tubeX() - SRC_X;
    const willHit = gap * Math.tan(th) < WIN_H;
    const tr = T().trans[S().id];
    const blocked = Math.random() >= tr;
    const stopX = blocked ? 261 : (T().id === "alfa" ? SRC_X + ALPHA_RANGE : Infinity);

    const el = mk("circle", { cx: SRC_X, cy: SRC_Y, r: 4, fill: T().color });
    gRays.appendChild(el);
    rays.push({ x: SRC_X, y: SRC_Y, vx: Math.cos(ang) * SPEED, vy: Math.sin(ang) * SPEED,
                el, hit: willHit, stopX, fade: 0 });
  }

  function step(dt, now){
    const tx = tubeX();
    emitAcc += dt * EMIT;
    while(emitAcc >= 1){ emitAcc -= 1; emit(); }
    bgAcc += dt * BG;
    while(bgAcc >= 1){ bgAcc -= 1; count(now); }

    for(let i = rays.length - 1; i >= 0; i--){
      const p = rays[i];
      if(p.fade > 0){
        p.fade -= dt;
        p.el.setAttribute("opacity", clamp(p.fade / 0.25, 0, 1).toFixed(2));
        if(p.fade <= 0){ gRays.removeChild(p.el); rays.splice(i, 1); }
        continue;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;

      if(p.x >= p.stopX){
        p.x = p.stopX; p.fade = 0.25;
        p.el.setAttribute("cx", p.x.toFixed(1));
        p.el.setAttribute("cy", p.y.toFixed(1));
        continue;
      }
      if(p.hit && p.x >= tx){
        count(now);
        gRays.removeChild(p.el); rays.splice(i, 1);
        continue;
      }
      if(p.x > 950 || p.y < 60 || p.y > 390){
        gRays.removeChild(p.el); rays.splice(i, 1);
        continue;
      }
      p.el.setAttribute("cx", p.x.toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
    }

    while(hits.length && now - hits[0] > 5000) hits.shift();
    $("rate").textContent = Math.round(hits.length / 5);
    $("total").textContent = total;

    const on = now < flashUntil;
    hitFlash.setAttribute("opacity", on ? "0.95" : "0");
    $("box").setAttribute("stroke", on ? "var(--yellow)" : "var(--line)");
    $("box").setAttribute("stroke-width", on ? "3" : "1.6");
  }

  function layout(){
    const r = parseInt($("dist").value, 10);
    const tx = tubeX();
    tube.setAttribute("transform", "translate(" + tx.toFixed(1) + ",0)");
    hitFlash.setAttribute("cx", tx.toFixed(1));
    $("wire2").setAttribute("d",
      "M" + (tx + 96).toFixed(1) + " 207 C " + (tx + 110).toFixed(1) + " 172, 740 205, 780 182");
    $("dimEnd").setAttribute("x1", tx.toFixed(1));
    $("dimEnd").setAttribute("x2", tx.toFixed(1));
    $("dimLine").setAttribute("x2", tx.toFixed(1));
    $("dimText").setAttribute("x", ((SRC_X + tx) / 2).toFixed(1));
    $("dimText").textContent = r + " cm";
    $("distOut").textContent = r + " cm";

    const sh = S();
    $("type").textContent = "Säteily: " + T().name;
    $("shieldBtn").textContent = "Suoja: " + sh.name;
    $("shield").setAttribute("opacity", sh.fill ? "1" : "0");
    if(sh.fill){
      $("shieldPlate").setAttribute("fill", sh.fill);
      $("shieldName").textContent = sh.name;
    }

    const tr = T().trans[sh.id];
    const iso = s => s.charAt(0).toUpperCase() + s.slice(1);
    let m;
    if(T().id === "alfa" && r >= 4)
      m = "Alfahiukkaset pysähtyvät jo muutamaan senttimetriin ilmaa — jäljelle jää taustasäteily.";
    else if(tr === 0)          m = iso(sh.name) + " pysäyttää " + T().name + "säteilyn kokonaan.";
    else if(tr < 0.5)          m = iso(sh.name) + " vaimentaa " + T().name + "säteilyä voimakkaasti.";
    else                       m = "Kaksinkertainen etäisyys neljännestää pulssit. Pulssit tulevat satunnaisesti.";
    setMsg(m);
  }

  function reset(){
    total = 0; hits = []; emitAcc = 0; bgAcc = 0; flashUntil = 0;
    rays.forEach(p => gRays.removeChild(p.el));
    rays = [];
    $("rate").textContent = "0";
    $("total").textContent = "0";
    layout();
  }

  $("dist").addEventListener("input", layout);
  $("type").addEventListener("click", () => { typeIdx = (typeIdx + 1) % TYPES.length; layout(); });
  $("shieldBtn").addEventListener("click", () => { shieldIdx = (shieldIdx + 1) % SHIELDS.length; layout(); });

  return { step, reset };
})();

/* ==================== VÄLILEHDET JA PÄÄSILMUKKA ==================== */

$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound").textContent = "Ääni: " + (soundOn ? "päällä" : "pois");
});

const VIEWS = [
  { view: $("view1"), ctrl: $("ctrl1"), tab: $("tab1"), mod: V1 },
  { view: $("view2"), ctrl: $("ctrl2"), tab: $("tab2"), mod: V2 }
];

let active = 0;

function select(i){
  active = i;
  VIEWS.forEach((v, k) => {
    v.view.style.display = k === i ? "" : "none";
    v.ctrl.hidden = k !== i;
    v.tab.setAttribute("aria-selected", k === i ? "true" : "false");
  });
  VIEWS[i].mod.reset();
}
VIEWS.forEach((v, i) => v.tab.addEventListener("click", () => select(i)));

const wrapEl = document.querySelector(".sim-wrap");
const tabsEl = document.querySelector(".sim-tabs");
const ctrlEls = document.querySelectorAll(".sim-controls");
function scaleChrome(){
  const w = wrapEl.getBoundingClientRect().width;
  if(!w) return;
  const k = w / 960;
  tabsEl.style.fontSize = (k * 15).toFixed(2) + "px";
  ctrlEls.forEach(el => { el.style.fontSize = (k * 18).toFixed(2) + "px"; });
}
if(typeof ResizeObserver === "function") new ResizeObserver(scaleChrome).observe(wrapEl);
window.addEventListener("resize", scaleChrome);
scaleChrome();

select(0);

let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  VIEWS[active].mod.step(dt, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
