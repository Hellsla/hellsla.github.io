<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kvanttimekaaninen tunneloituminen</title>
  <style>
    :root{
      --bg:#FFFFFF;
      --ink:#2C2B29;
      --soft:#8F8B84;
      --grid:#ECEBE8;
      --wave:#2E86A6;
      --accent:#D84A62;
      --barrier:#F4F4F4;
      --hatch:#D8D6D1;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      overflow:hidden;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .wrap{
      width:100%;
      max-width:1280px;
      aspect-ratio:16/9;
      position:relative;
      background:#fff;
    }
    svg{
      width:100%;
      height:100%;
      display:block;
    }
    .controls{
      position:absolute;
      left:7.5%;
      right:7.5%;
      bottom:5.8%;
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:24px;
      align-items:end;
    }
    .control{
      min-width:0;
    }
    .labelrow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:17px;
      margin-bottom:8px;
      white-space:nowrap;
    }
    input[type="range"]{
      width:100%;
      accent-color:var(--ink);
      cursor:pointer;
    }
    button{
      border:1.6px solid var(--ink);
      background:#fff;
      color:var(--ink);
      padding:8px 15px;
      border-radius:999px;
      font-size:16px;
      cursor:pointer;
    }
    button:active{
      transform:translateY(1px);
    }
    @media (max-width:760px){
      .controls{
        grid-template-columns:1fr 1fr;
        gap:14px 18px;
        bottom:4%;
      }
      button{grid-column:1/-1; justify-self:end}
      .labelrow{font-size:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 1280 720" role="img" aria-label="Kvanttimekaanisen tunneloitumisen simulaatio">
    <defs>
      <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
        <line x1="0" y1="0" x2="0" y2="11" stroke="var(--hatch)" stroke-width="2"/>
      </pattern>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
      </filter>
    </defs>

    <!-- energia-akseli -->
    <line x1="95" y1="540" x2="1180" y2="540" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="95" y1="540" x2="95" y2="120" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- energiaeste -->
    <rect id="barrierFill" x="555" y="180" width="170" height="360" fill="var(--barrier)"/>
    <rect id="barrierHatch" x="555" y="180" width="170" height="360" fill="url(#hatch)" opacity="0.95"/>
    <path id="barrierOutline" d="M555 540 L555 180 L725 180 L725 540"
          fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" filter="url(#rough)"/>

    <!-- estekorkeuden viite -->
    <line x1="95" y1="180" x2="555" y2="180" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <text x="108" y="167" font-size="18" fill="var(--ink)">U = 6,0 eV</text>

    <!-- hiukkasen energia -->
    <line id="energyLine" x1="95" y1="310" x2="1180" y2="310"
          stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="8 8" opacity="0.9"/>
    <text id="energyText" x="108" y="296" font-size="18" fill="var(--accent)">E = 4,0 eV</text>

    <!-- saapuva aalto -->
    <path id="incomingWave" d="" fill="none" stroke="var(--wave)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>

    <!-- esteen sisäinen vaimeneva aalto -->
    <path id="insideWave" d="" fill="none" stroke="var(--wave)" stroke-width="3.4"
          stroke-linecap="round" opacity="0.78"/>

    <!-- läpäissyt aalto -->
    <path id="transmittedWave" d="" fill="none" stroke="var(--wave)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>

    <!-- liikkuva hiukkasmainen havainto -->
    <circle id="particle" cx="180" cy="540" r="8.5" fill="var(--ink)" opacity="0"/>
    <circle id="detectorFlash" cx="1010" cy="430" r="18" fill="none" stroke="var(--accent)" stroke-width="2.2" opacity="0"/>

    <!-- minimaalinen lukema -->
    <text id="probText" x="1010" y="150" text-anchor="middle" font-size="22" fill="var(--ink)">T = 8 %</text>
  </svg>

  <div class="controls">
    <div class="control">
      <div class="labelrow">
        <span>Energia</span>
        <span id="energyReadout">E = 4,0 eV</span>
      </div>
      <input id="energy" type="range" min="1.0" max="5.8" step="0.1" value="4.0" />
    </div>

    <div class="control">
      <div class="labelrow">
        <span>Esteen leveys</span>
        <span id="widthReadout">a = 0,35 nm</span>
      </div>
      <input id="width" type="range" min="0.12" max="0.80" step="0.01" value="0.35" />
    </div>

    <button id="reset">Nollaa</button>
  </div>
</div>

<script>
(() => {
  const U = 6.0; // eV
  const electronMass = 9.1093837e-31; // kg
  const hbar = 1.054571817e-34;       // J s
  const eV = 1.602176634e-19;         // J

  const energy = document.getElementById('energy');
  const width = document.getElementById('width');
  const energyLine = document.getElementById('energyLine');
  const energyText = document.getElementById('energyText');
  const energyReadout = document.getElementById('energyReadout');
  const widthReadout = document.getElementById('widthReadout');
  const probText = document.getElementById('probText');
  const incomingWave = document.getElementById('incomingWave');
  const insideWave = document.getElementById('insideWave');
  const transmittedWave = document.getElementById('transmittedWave');
  const particle = document.getElementById('particle');
  const detectorFlash = document.getElementById('detectorFlash');
  const barrierFill = document.getElementById('barrierFill');
  const barrierHatch = document.getElementById('barrierHatch');
  const barrierOutline = document.getElementById('barrierOutline');
  const reset = document.getElementById('reset');

  let phase = 0;
  let lastDetection = 0;
  let detectionVisibleUntil = 0;
  let particleState = null;

  const baseline = 540;
  const leftX = 110;
  const barrierCenter = 640;
  const rightX = 1160;

  const fmt = (n, d=1) => n.toFixed(d).replace('.', ',');

  function transmission(E, aNm){
    if (E >= U) return 1;
    const deltaJ = (U - E) * eV;
    const kappa = Math.sqrt(2 * electronMass * deltaJ) / hbar;
    const aM = aNm * 1e-9;
    // rectangular-barrier estimate: dominant exponential behavior
    return Math.exp(-2 * kappa * aM);
  }

  function barrierGeometry(aNm){
    const minPx = 90, maxPx = 270;
    const t = (aNm - 0.12) / (0.80 - 0.12);
    const wPx = minPx + t * (maxPx - minPx);
    const x = barrierCenter - wPx / 2;
    return {x, wPx};
  }

  function energyY(E){
    // U=6 eV -> y=180; E=1 eV -> near 455
    return 510 - (E / U) * 330;
  }

  function makeWavePath(x0, x1, amp, wavelength, centerY, envelope=true, decay=0){
    const pts = [];
    const step = 4;
    const center = (x0 + x1) / 2;
    const sigma = Math.max(70, (x1 - x0) * 0.30);
    for(let x=x0; x<=x1; x+=step){
      let env = 1;
      if(envelope){
        env = Math.exp(-Math.pow((x-center)/sigma, 2));
      }
      if(decay > 0){
        env *= Math.exp(-decay * (x-x0));
      }
      const y = centerY + amp * env * Math.sin((x / wavelength) * Math.PI * 2 + phase);
      pts.push((pts.length ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1));
    }
    return pts.join(' ');
  }

  function updateStatic(){
    const E = parseFloat(energy.value);
    const a = parseFloat(width.value);
    const T = transmission(E, a);
    const geom = barrierGeometry(a);
    const yE = energyY(E);

    energyLine.setAttribute('y1', yE);
    energyLine.setAttribute('y2', yE);
    energyText.setAttribute('y', yE - 14);
    energyText.textContent = `E = ${fmt(E)} eV`;
    energyReadout.textContent = `E = ${fmt(E)} eV`;
    widthReadout.textContent = `a = ${fmt(a,2)} nm`;

    barrierFill.setAttribute('x', geom.x);
    barrierFill.setAttribute('width', geom.wPx);
    barrierHatch.setAttribute('x', geom.x);
    barrierHatch.setAttribute('width', geom.wPx);
    barrierOutline.setAttribute('d',
      `M${geom.x} 540 L${geom.x} 180 L${geom.x+geom.wPx} 180 L${geom.x+geom.wPx} 540`);

    const pct = Math.max(0.01, Math.min(99.9, T*100));
    probText.textContent = `T = ${pct < 1 ? fmt(pct,2) : fmt(pct,1)} %`;
    probText.dataset.t = T;
    probText.dataset.bx = geom.x;
    probText.dataset.bw = geom.wPx;
    probText.dataset.ye = yE;
  }

  function maybeLaunchParticle(now, T, bx, bw){
    if (particleState) return;
    if (now - lastDetection < 900) return;
    lastDetection = now;

    // visual sampling; amplified gently so rare events are still occasionally visible
    const visualChance = Math.min(0.65, Math.max(0.015, Math.pow(T, 0.55)));
    if (Math.random() < visualChance){
      particleState = {
        start: now,
        duration: 1100,
        x0: 165,
        x1: 1010,
        y: 430
      };
      particle.setAttribute('opacity','1');
    }
  }

  function animate(now){
    phase += 0.08;

    const E = parseFloat(energy.value);
    const T = parseFloat(probText.dataset.t || '0');
    const bx = parseFloat(probText.dataset.bx || '555');
    const bw = parseFloat(probText.dataset.bw || '170');

    const ampIn = 44;
    const ampOut = 44 * Math.max(0.12, Math.sqrt(T));
    const decay = 0.014 + (U-E)*0.0022;

    incomingWave.setAttribute('d',
      makeWavePath(leftX, bx-4, ampIn, 42, 430, true, 0));

    insideWave.setAttribute('d',
      makeWavePath(bx+2, bx+bw-2, ampIn*0.80, 42, 430, false, decay));

    transmittedWave.setAttribute('d',
      makeWavePath(bx+bw+4, rightX, ampOut, 42, 430, true, 0));

    maybeLaunchParticle(now, T, bx, bw);

    if (particleState){
      const p = Math.min(1, (now - particleState.start)/particleState.duration);
      const x = particleState.x0 + (particleState.x1-particleState.x0)*p;
      particle.setAttribute('cx', x);
      particle.setAttribute('cy', particleState.y);

      if (p >= 1){
        particle.setAttribute('opacity','0');
        particleState = null;
        detectionVisibleUntil = now + 260;
      }
    }

    const flashOn = now < detectionVisibleUntil;
    detectorFlash.setAttribute('opacity', flashOn ? '0.85' : '0');

    requestAnimationFrame(animate);
  }

  energy.addEventListener('input', updateStatic);
  width.addEventListener('input', updateStatic);

  reset.addEventListener('click', () => {
    energy.value = '4.0';
    width.value = '0.35';
    particleState = null;
    particle.setAttribute('opacity','0');
    detectorFlash.setAttribute('opacity','0');
    updateStatic();
  });

  updateStatic();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
