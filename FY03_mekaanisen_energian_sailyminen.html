<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mekaanisen energian säilyminen</title>
<link rel="stylesheet" href="simulaatio-theme.css" />
<style>
  :root{
    --ink:#3F3D39;
    --blue:#2E86A6;   /* liike-energia */
    --red:#D84A62;    /* potentiaalienergia */
    --orange:#F28C28; /* häviöt */
    --soft:#f4f4f4;
    --muted:#bfb7aa;
  }

  /* --- SVG-tyylit (koot SVG-yksikköinä, skaalautuvat viewBoxin mukana) --- */
  .sketch{ fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; }
  .thin { stroke-width:1.6; }
  .mid  { stroke-width:2.6; }
  .thick{ stroke-width:4.4; }

  .ground{ stroke:var(--ink); stroke-width:3; stroke-linecap:round; }
  .hatch { stroke:var(--ink); stroke-width:1.2; opacity:.28; }
  .guide { stroke:var(--muted); stroke-width:1.6; stroke-dasharray:6 7; fill:none; }

  .bodyFill{ fill:#f8fbff; stroke:var(--ink); stroke-width:2.6; }
  .bodyTrim{ fill:var(--blue); stroke:var(--ink); stroke-width:2; }
  .pivot   { fill:var(--ink); }
  .rod     { stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; }

  text{ fill:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .segLabel   { font-size:25px; font-weight:600; fill:#fff; text-anchor:middle; }
  .barTag     { font-size:25px; font-weight:600; }
  .barEdge    { stroke:var(--ink); stroke-width:1.6; }

  /* --- ohjaimet --- */
  .sim-controls{ flex-direction:column; gap:clamp(4px,0.9vw,9px); bottom:clamp(6px,1.4vw,14px); }
  .ctrl-row{ display:flex; align-items:center; justify-content:center; gap:clamp(8px,1.7vw,16px); flex-wrap:wrap; }
  .ctrl-row label{ display:grid; gap:1px; font-size:clamp(10px,1.35vw,16px); justify-items:start; line-height:1.25; }
  .ctrl-row input[type="range"]{ width:min(180px,19vw); height:clamp(12px,1.7vw,18px); accent-color:var(--ink); }
  .sim-btn{ padding:clamp(2px,0.6vw,6px) clamp(8px,1.5vw,15px); font-size:clamp(11px,1.45vw,18px); }
  .sim-btn.is-active{ background:var(--ink); color:#fff; }
  #lossBox[data-hidden="true"]{ visibility:hidden; pointer-events:none; }
  /* napit pysyvät keskellä, vaikka kitkasäädin näkyy vain kourussa */
  .ctrl-main{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    column-gap:clamp(8px,1.7vw,16px); width:100%; }
  .ctrl-main #lossBox{ justify-self:end; }
  .ctrl-buttons{ display:flex; gap:clamp(8px,1.7vw,16px); }

  /* Kapealla näytöllä 16:9-kehys jää matalaksi, joten ohjaimet siirretään
     kuvan alapuolelle normaaliin dokumenttivirtaan. */
  @media (max-width:560px){
    body.sim-body{ place-items:start center; height:auto; min-height:100%; }
    .sim-wrap{ width:100vw; height:auto; aspect-ratio:auto; }
    .sim-wrap > svg{ width:100%; height:auto; aspect-ratio:16/9; }
    .sim-controls{ position:static; left:auto; right:auto; bottom:auto;
      width:100%; padding:12px 12px 18px; gap:8px; }
    .ctrl-row{ gap:8px; }
    .ctrl-row input[type="range"]{ width:100%; }
    .ctrl-row label{ flex:1 1 45%; }
    .ctrl-row .sim-btn{ flex:0 0 auto; }
    .ctrl-main{ display:flex; flex-wrap:wrap; justify-content:center; }
    .ctrl-main #lossBox[data-hidden="true"]{ display:none; }
    .ctrl-main > [aria-hidden="true"]{ display:none; }
  }
</style>
</head>
<body class="sim-body">
<main class="sim-wrap" aria-label="Mekaanisen energian säilymisen simulaatio">
  <svg viewBox="0 0 960 540" role="img" aria-label="Mekaanisen energian säilyminen: liike-energia, potentiaalienergia ja häviöt">
    <defs>
      <marker id="tickArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#bfb7aa"/>
      </marker>
    </defs>

    <!-- ============ NÄYTTÄMÖ ============ -->
    <g id="scene">
      <!-- maanpinta (vapaa pudotus / heiluri) -->
      <g id="groundG">
        <line class="ground" x1="40" y1="380" x2="648" y2="380"/>
        <g id="groundHatch"></g>
      </g>

      <!-- vapaa pudotus -->
      <g id="sceneFall">
        <line id="fallGuide" class="guide" x1="320" y1="120" x2="320" y2="380" marker-start="url(#tickArrow)" marker-end="url(#tickArrow)"/>
        <circle id="fallBall" class="bodyFill" cx="320" cy="120" r="16"/>
      </g>

      <!-- heiluri -->
      <g id="scenePend">
        <path id="pendArc" class="guide" d=""/>
        <line id="pendVert" class="guide" x1="330" y1="92" x2="330" y2="356"/>
        <line id="pendRod" class="rod" x1="330" y1="92" x2="330" y2="380"/>
        <circle class="pivot" cx="330" cy="92" r="6"/>
        <circle id="pendBob" class="bodyFill" cx="330" cy="380" r="17"/>
        <line id="pendRef" class="guide" x1="60" y1="356" x2="620" y2="356"/>
        <line id="pendLevel" class="guide" x1="60" y1="200" x2="620" y2="200"/>
      </g>

      <!-- kouru (kaksi kaltevaa tasoa) -->
      <g id="sceneRamp">
        <path id="rampPath" class="sketch thick" d=""/>
        <g id="rampHatch"></g>
        <line id="rampLevel" class="guide" x1="60" y1="200" x2="620" y2="200"/>
        <g id="rampBlock">
          <rect class="bodyFill" x="-18" y="-13" width="36" height="26" rx="5"/>
          <rect class="bodyTrim" x="-11" y="-8" width="22" height="6" rx="2"/>
        </g>
      </g>

    </g>

    <!-- ============ ENERGIAPANEELI ============ -->
    <g id="panel">
      <!-- E0-taso -->
      <line x1="700" y1="92" x2="912" y2="92" stroke="#3F3D39" stroke-width="1.8" stroke-dasharray="7 6" opacity=".6"/>
      <text class="barTag" x="694" y="100" text-anchor="end">E<tspan baseline-shift="sub" font-size="0.72em">0</tspan></text>

      <!-- pylväs -->
      <rect x="740" y="92" width="120" height="280" fill="#efeae3" rx="5"/>
      <rect id="barLoss" x="740" y="92"  width="120" height="0" fill="#F28C28"/>
      <rect id="barPe"   x="740" y="272" width="120" height="0" fill="#D84A62"/>
      <rect id="barKe"   x="740" y="372" width="120" height="0" fill="#2E86A6"/>
      <rect x="740" y="92" width="120" height="280" fill="none" class="barEdge" rx="5"/>

      <!-- osien nimet palkkien sisällä -->
      <text id="keTxt"   class="segLabel" x="800" y="360">E<tspan baseline-shift="sub" font-size="0.72em">k</tspan></text>
      <text id="peTxt"   class="segLabel" x="800" y="240">E<tspan baseline-shift="sub" font-size="0.72em">p</tspan></text>
      <text id="lossTxt" class="segLabel" x="800" y="130">häviöt</text>

      <!-- mekaanisen energian taso -->
      <g id="mekMark">
        <line id="mekLine" x1="730" y1="372" x2="870" y2="372" stroke="#3F3D39" stroke-width="2.6"/>
        <text id="mekTag" class="barTag" x="878" y="379">E<tspan baseline-shift="sub" font-size="0.72em">mek</tspan></text>
      </g>
    </g>
  </svg>

  <section class="sim-controls" aria-label="Säätimet">
    <div class="ctrl-row" role="group" aria-label="Tilanne">
      <button id="modeFall" class="sim-btn is-active" type="button">Vapaa pudotus</button>
      <button id="modePend" class="sim-btn" type="button">Heiluri</button>
      <button id="modeRamp" class="sim-btn" type="button">Kouru</button>
    </div>
    <div class="ctrl-row ctrl-main">
      <label id="lossBox"><span id="lossLbl">Kitkakerroin μ 0,00</span>
        <input id="loss" type="range" min="0" max="0.6" step="0.01" value="0" aria-label="Kitkakerroin"></label>
      <div class="ctrl-buttons">
        <button id="play" class="sim-btn" type="button">Käynnistä</button>
        <button id="reset" class="sim-btn" type="button">Nollaa</button>
      </div>
      <div aria-hidden="true"></div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const g = 9.81;
  const GROUND = 380;          // maanpinnan y SVG-yksikköinä
  const BAR_TOP = 92, BAR_BOT = 372, BAR_H = BAR_BOT - BAR_TOP;
  const PEND_LOW = 356;        // heilurin alin kohta = vertailutaso h = 0

  const $ = (id) => document.getElementById(id);
  const el = {
    groundG: $("groundG"), groundHatch: $("groundHatch"),
    sceneFall: $("sceneFall"), fallBall: $("fallBall"), fallGuide: $("fallGuide"),
    scenePend: $("scenePend"), pendRod: $("pendRod"), pendBob: $("pendBob"), pendArc: $("pendArc"),
    pendLevel: $("pendLevel"),
    sceneRamp: $("sceneRamp"), rampPath: $("rampPath"), rampHatch: $("rampHatch"),
    rampBlock: $("rampBlock"), rampLevel: $("rampLevel"),
    barKe: $("barKe"), barPe: $("barPe"), barLoss: $("barLoss"),
    keTxt: $("keTxt"), peTxt: $("peTxt"), lossTxt: $("lossTxt"),
    mekLine: $("mekLine"), mekMark: $("mekMark"), mekTag: $("mekTag"),
    loss: $("loss"), lossLbl: $("lossLbl"), lossBox: $("lossBox"),
    play: $("play"), reset: $("reset"),
    modeFall: $("modeFall"), modePend: $("modePend"), modeRamp: $("modeRamp")
  };

  const fmt = (x, d = 1) => x.toFixed(d).replace(".", ",");

  /* ---------------- tilanteiden asetukset ----------------
     Kiinteät lähtöarvot: kalvolla säädetään vain kourun kitkaa. */
  const MASS = 2.0;                       // kg
  const MODES = {
    fall: { start: 4.0, friction: false },  // lähtökorkeus 4,0 m
    pend: { start: 60,  friction: false },  // lähtökulma 60°
    ramp: { start: 2.5, friction: true  }   // lähtökorkeus 2,5 m
  };

  let mode = "fall";
  let running = false;
  const m = MASS;
  let startVal = MODES.fall.start, lossK = 0.0;

  /* ---------------- geometria ---------------- */
  // vapaa pudotus
  const FALL_X = 320, FALL_SC = 58;               // px / m
  // heiluri
  const PIV_X = 330, PIV_Y = 92, PEND_L = 2.2;
  const PEND_SC = (PEND_LOW - PIV_Y) / PEND_L;    // px / m
  // kouru: 45° rampit, tasainen pohja 2·W
  const R_H = 3.0, R_W = 0.5, R_CX = 344, R_SC = 82;
  const rampPts = [
    [-(R_W + R_H), R_H], [-R_W, 0], [R_W, 0], [R_W + R_H, R_H]
  ];
  const rx = (xm) => R_CX + xm * R_SC;
  const ry = (ym) => GROUND - ym * R_SC;

  // radan segmentit (kaarenpituusparametrisointi, u = 0 vasemman rampin huipulta)
  const segs = [];
  let rampTotal = 0;
  for (let i = 0; i < rampPts.length - 1; i++) {
    const [x0, y0] = rampPts[i], [x1, y1] = rampPts[i + 1];
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    segs.push({ x0, y0, ux: dx / len, uy: dy / len, len, u0: rampTotal });
    rampTotal += len;
  }
  function trackAt(u) {
    u = Math.max(0, Math.min(rampTotal, u));
    let i = 0;
    while (i < segs.length - 1 && u > segs[i].u0 + segs[i].len) i++;
    const s = segs[i], t = u - s.u0;
    return { x: s.x0 + s.ux * t, y: s.y0 + s.uy * t, ux: s.ux, uy: s.uy };
  }

  /* ---------------- staattinen grafiikka ---------------- */
  (function drawStatic() {
    // maanpinnan viivoitus
    let d = "";
    for (let x = 46; x < 648; x += 22) d += `M${x} ${GROUND} l-10 12 `;
    el.groundHatch.innerHTML = `<path class="hatch" d="${d}"/>`;

    // kourun rata
    let path = `M${rx(rampPts[0][0])} ${ry(rampPts[0][1])}`;
    for (let i = 1; i < rampPts.length; i++) path += ` L${rx(rampPts[i][0])} ${ry(rampPts[i][1])}`;
    el.rampPath.setAttribute("d", path);

    // radan alapuolinen viivoitus (materiaali)
    let hd = "";
    for (let u = 0.16; u < rampTotal; u += 0.19) {
      const t = trackAt(u);
      // suunta: pinnan normaali materiaaliin päin + pieni kallistus
      const dx = t.uy * 12 - t.ux * 3, dy = t.ux * 12 + t.uy * 3;
      hd += `M${rx(t.x).toFixed(1)} ${ry(t.y).toFixed(1)} l${dx.toFixed(1)} ${dy.toFixed(1)} `;
    }
    el.rampHatch.innerHTML = `<path class="hatch" d="${hd}"/>`;
  })();

  /* ---------------- tila ---------------- */
  const st = { y: 0, v: 0, th: 0, om: 0, u: 0, dir: 1, wf: 0, done: false };
  let E0 = 1;

  function resetState() {
    running = false;
    el.play.textContent = "Käynnistä";
    st.done = false;
    if (mode === "fall") {
      st.y = startVal; st.v = 0;
      E0 = m * g * st.y;
    } else if (mode === "pend") {
      st.th = startVal * Math.PI / 180; st.om = 0;
      E0 = m * g * PEND_L * (1 - Math.cos(st.th));
    } else {
      st.u = (R_H - startVal) * Math.SQRT2;   // vasemmalla rampilla korkeudella startVal
      st.v = 0; st.dir = 1; st.wf = 0;
      E0 = m * g * startVal;
    }
    if (E0 < 1e-6) E0 = 1e-6;
    render();
  }

  /* ---------------- fysiikka ---------------- */
  function stepFall(dt) {
    if (st.done) return;
    const a = -g - lossK * st.v;
    const vNew = st.v + a * dt;
    const yNew = st.y + 0.5 * (st.v + vNew) * dt;
    if (yNew <= 0) {
      // otetaan vain se osa askeleesta, jolla kappale ehtii maahan
      const frac = st.y > 0 ? st.y / (st.y - yNew) : 0;
      st.v = st.v + a * dt * frac;
      st.y = 0;
    } else {
      st.v = vNew;
      st.y = yNew;
    }
    if (st.y <= 0) {
      st.done = true; running = false;
      el.play.textContent = "Uudelleen";
    }
  }

  function stepPend(dt) {
    const alpha = -(g / PEND_L) * Math.sin(st.th) - lossK * st.om;
    st.om += alpha * dt;
    st.th += st.om * dt;
  }

  // Kourun liike ratkaistaan suoraan energiataseesta E0 = E_p + E_k + kitkatyö.
  // Näin rata ei voi tuottaa energiaa taitekohdissa, ja pylväs pysyy tarkalleen
  // E0:n korkuisena myös useiden edestakaisten heilahdusten jälkeen.
  function stepRamp(dt) {
    if (st.done) return;
    const tr = trackAt(st.u);
    const sinT = Math.abs(tr.uy), cosT = Math.abs(tr.ux);
    const Ek = E0 - m * g * tr.y - st.wf;

    if (Ek <= 0) {
      // liike-energia loppui: kääntyy alamäkeen tai jää paikalleen
      if (sinT < 1e-9 || lossK * cosT >= sinT) {
        st.done = true; running = false;
        el.play.textContent = "Uudelleen";
        return;
      }
      st.dir = tr.uy < 0 ? 1 : -1;
      st.u += st.dir * 0.004;   // irrotus kääntöpisteestä
      return;
    }

    const du = st.dir * Math.sqrt(2 * Ek / m) * dt;
    st.wf += lossK * m * g * cosT * Math.abs(du);
    st.u += du;
    if (st.u < 0) { st.u = 0; st.dir = 1; }
    if (st.u > rampTotal) { st.u = rampTotal; st.dir = -1; }
  }

  /* ---------------- energiat ---------------- */
  function energies() {
    if (mode === "ramp") {
      // kourussa kitkatyö on laskettu suoraan, ja E_k saadaan energiataseesta
      const Ep = m * g * trackAt(st.u).y;
      const Eloss = Math.min(st.wf, E0);
      return { Ek: Math.max(0, E0 - Ep - Eloss), Ep, Eloss };
    }
    let Ek, Ep;
    if (mode === "fall") {
      Ek = 0.5 * m * st.v * st.v;
      Ep = m * g * st.y;
    } else {
      const v = PEND_L * st.om;
      Ek = 0.5 * m * v * v;
      Ep = m * g * PEND_L * (1 - Math.cos(st.th));
    }
    // häviöt = se osa alkuenergiasta, joka ei ole enää mekaanista energiaa
    return { Ek, Ep, Eloss: Math.max(0, E0 - Ek - Ep) };
  }

  /* ---------------- piirto ---------------- */
  function render() {
    const { Ek, Ep, Eloss } = energies();

    let h = 0;
    if (mode === "fall") h = st.y;
    else if (mode === "pend") h = PEND_L * (1 - Math.cos(st.th));
    else h = trackAt(st.u).y;

    // näyttämö
    el.sceneFall.style.display = mode === "fall" ? "" : "none";
    el.scenePend.style.display = mode === "pend" ? "" : "none";
    el.sceneRamp.style.display = mode === "ramp" ? "" : "none";
    el.groundG.style.display = mode === "ramp" ? "none" : "";

    if (mode === "fall") {
      const cy = GROUND - st.y * FALL_SC - 16;
      el.fallBall.setAttribute("cy", cy);
      el.fallGuide.setAttribute("y1", Math.min(GROUND - 2, cy + 16));
      el.fallGuide.setAttribute("y2", GROUND);
      el.fallGuide.style.display = st.y > 0.25 ? "" : "none";
    } else if (mode === "pend") {
      const R = PEND_L * PEND_SC;
      const bx = PIV_X + R * Math.sin(st.th), by = PIV_Y + R * Math.cos(st.th);
      el.pendRod.setAttribute("x2", bx);
      el.pendRod.setAttribute("y2", by);
      el.pendBob.setAttribute("cx", bx);
      el.pendBob.setAttribute("cy", by);
      const yLevel = GROUND - h * PEND_SC;
      el.pendLevel.setAttribute("y1", yLevel);
      el.pendLevel.setAttribute("y2", yLevel);
    } else {
      const tr = trackAt(st.u);
      const ang = Math.atan2(-tr.uy, tr.ux) * 180 / Math.PI;
      el.rampBlock.setAttribute("transform",
        `translate(${rx(tr.x)},${ry(tr.y)}) rotate(${ang}) translate(0,-14)`);
      const yLevel = GROUND - h * R_SC;
      el.rampLevel.setAttribute("y1", yLevel);
      el.rampLevel.setAttribute("y2", yLevel);
    }

    // energiapylväs
    let hk = Math.min(BAR_H, Math.max(0, (Ek / E0) * BAR_H));
    let hp = Math.min(BAR_H - hk, Math.max(0, (Ep / E0) * BAR_H));
    const hl = Math.min(BAR_H - hk - hp, Math.max(0, (Eloss / E0) * BAR_H));
    el.barKe.setAttribute("y", BAR_BOT - hk); el.barKe.setAttribute("height", Math.max(0, hk));
    el.barPe.setAttribute("y", BAR_BOT - hk - hp); el.barPe.setAttribute("height", Math.max(0, hp));
    el.barLoss.setAttribute("y", BAR_BOT - hk - hp - hl); el.barLoss.setAttribute("height", Math.max(0, hl));

    // nimet piirretään palkkien sisään, kun palkki on kyllin korkea
    segLabel(el.keTxt,   BAR_BOT - hk, hk);
    segLabel(el.peTxt,   BAR_BOT - hk - hp, hp);
    segLabel(el.lossTxt, BAR_BOT - hk - hp - hl, hl);

    // E_mek-taso näkyy vasta kun häviöitä on: muuten se on sama kuin E0-viiva
    const yMek = BAR_BOT - hk - hp;
    el.mekLine.setAttribute("y1", yMek); el.mekLine.setAttribute("y2", yMek);
    el.mekTag.setAttribute("y", yMek + 8);
    el.mekMark.style.display = hl > 8 ? "" : "none";
  }

  function segLabel(t, top, height) {
    if (height < 36) { t.style.display = "none"; return; }
    t.style.display = "";
    t.setAttribute("y", top + height / 2 + 9);
  }

  function drawPendArc() {
    const R = PEND_L * PEND_SC;
    const th0 = startVal * Math.PI / 180;
    let d = "";
    const N = 48;
    for (let i = 0; i <= N; i++) {
      const t = -th0 + (2 * th0) * (i / N);
      const x = PIV_X + R * Math.sin(t), y = PIV_Y + R * Math.cos(t);
      d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    el.pendArc.setAttribute("d", d);
  }

  /* ---------------- animaatio ---------------- */
  let last = performance.now();
  function tick(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    if (running) {
      const sub = 8, h = dt / sub;              // aliaskellus vakauden vuoksi
      for (let i = 0; i < sub && running; i++) {
        if (mode === "fall") stepFall(h);
        else if (mode === "pend") stepPend(h);
        else stepRamp(h);
      }
      render();
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- ohjaimet ---------------- */
  function applyModeConfig() {
    const c = MODES[mode];
    startVal = c.start;
    // kitka on säädettävissä vain kourussa; muissa tilanteissa liike on häviötön
    lossK = c.friction ? parseFloat(el.loss.value) : 0;
    el.lossBox.dataset.hidden = c.friction ? "false" : "true";
    el.lossLbl.textContent = `Kitkakerroin μ ${fmt(lossK, 2)}`;
    el.modeFall.classList.toggle("is-active", mode === "fall");
    el.modePend.classList.toggle("is-active", mode === "pend");
    el.modeRamp.classList.toggle("is-active", mode === "ramp");
    drawPendArc();
    resetState();
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    applyModeConfig();
  }

  el.modeFall.addEventListener("click", () => setMode("fall"));
  el.modePend.addEventListener("click", () => setMode("pend"));
  el.modeRamp.addEventListener("click", () => setMode("ramp"));

  el.loss.addEventListener("input", () => {
    lossK = parseFloat(el.loss.value);
    el.lossLbl.textContent = `Kitkakerroin μ ${fmt(lossK, 2)}`;
    render();
  });

  el.play.addEventListener("click", () => {
    if (st.done) { resetState(); }
    running = !running;
    if (running) last = performance.now();
    el.play.textContent = running ? "Pysäytä" : "Jatka";
  });

  el.reset.addEventListener("click", resetState);

  applyModeConfig();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
