# Publish Ruukkilabra at https://ruukkilab.fi/ (teacher 2026-11-04).
# The source stays here; the public repository Hellsla/ruukkilabra only holds the published copy, served by its GitHub
# Pages (branch main, folder /, custom domain ruukkilab.fi). This workflow runs after fysiikkalabra-ci has passed on an
# approved (merged) main commit and pushes the site that CI run built and tested (its `site` artifact; work queue 0g PR 2,
# 2026-11-22) to the root of the publishing repository, plus the read-aloud models under models/ (Hellsla/ruukkilabra-models) and the recorded voice's mp3 files under
# audio/fi/ (Hellsla/ruukkilabra-audio, teacher 2026-11-15; its manifests are in site/). Pull requests never publish.
# A manual run (Actions -> ruukkilabra-deploy -> Run workflow) publishes the newest main commit whose CI passed, or,
# with "now" ticked, the newest main commit at once without waiting for CI (the teacher's call as admin; the privacy
# and link gates of scripts/deploy_site.py still run; teacher 2026-11-04). A manual run builds the site itself from that commit
# (scripts/build.py), and with the input `sha` it publishes that older commit (a rollback; the build is deterministic from
# the sources and their history), or revert in Hellsla/ruukkilabra. The artifact of a CI run is kept 14 days, which a rollback does not need.
# The published repository's .source-sha file names the commit that is live. A commit is not published when the live one is
# newer (a descendant of it), so two CI runs finishing out of order never publish the older site over the newer.
# Needs the repository secret RUUKKILABRA_DEPLOY_KEY: the private half of an SSH deploy key that has write access to
# Hellsla/ruukkilabra and nothing else (fysiikkalabra/README.md, "Julkaisu osoitteeseen ruukkilab.fi").
# The other sites of this repository are untouched: GitHub Pages keeps serving them from this repository as before.
name: ruukkilabra-deploy
on:
  workflow_run:
    workflows: [fysiikkalabra-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      now:
        description: "Julkaise mainin uusin versio heti, odottamatta CI:tä (yksityisyys- ja linkkitarkistus ajetaan silti)"
        type: boolean
        default: false
      sha:
        description: "Palautus: julkaise tämä main-commit (rakennetaan siitä); tyhjä = uusin"
        type: string
        default: ""
permissions: { contents: read, actions: read }
concurrency: { group: ruukkilabra-deploy, cancel-in-progress: false }
jobs:
  deploy:
    # only a passed CI run of a main commit of this repository (push, weekly or manual run), never a pull request's
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: which commit to publish
        id: pick
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "${{ inputs.sha }}" ]; then
            sha=$(gh api "repos/${{ github.repository }}/commits/${{ inputs.sha }}" --jq .sha)   # a rollback: any commit of this repository, built again below
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.now }}" = true ]; then
            sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/fysiikkalabra-ci.yml/runs?branch=main&status=success&per_page=30" \
                  --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha')
            [ -n "$sha" ] && [ "$sha" != null ] || { echo "::error::no passed fysiikkalabra-ci run on main"; exit 1; }
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "publishing $sha" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: { ref: "${{ steps.pick.outputs.sha }}", path: src, fetch-depth: "${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}" }   # a manual run builds: the build reads the exercises' reviewed version from history
      - uses: actions/checkout@v4
        with: { repository: Hellsla/ruukkilabra, ssh-key: "${{ secrets.RUUKKILABRA_DEPLOY_KEY }}", path: out, persist-credentials: true }
      - name: a newer site is not overwritten by an older one (.source-sha of the published repository)
        id: fresh
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ steps.pick.outputs.sha }}", ROLLBACK: "${{ inputs.sha }}" }
        run: |
          live=$(cat out/.source-sha 2> /dev/null || true)
          if [ -z "$live" ] || [ -n "$ROLLBACK" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi   # nothing live yet, or a rollback the teacher asked for
          st=$(gh api "repos/${{ github.repository }}/compare/$live...$SHA" --jq .status 2> /dev/null || echo unknown)
          case "$st" in
            behind) echo "the live site ($live) is newer than $SHA: not published" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "go=1" >> "$GITHUB_OUTPUT"; echo "live $live, publishing $SHA ($st)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.fresh.outputs.go
        with: { repository: Hellsla/ruukkilabra-models, path: models-src }
      - uses: actions/checkout@v4
        if: steps.fresh.outputs.go
        continue-on-error: true          # the recordings are an addition: a missing audio repository publishes the pages with the other voices
        with: { repository: Hellsla/ruukkilabra-audio, path: audio-src }
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.go
        with: { python-version: "3.12" }
      - name: the site that CI built and tested (artifact `site` of the run that has just passed)
        if: steps.fresh.outputs.go && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with: { name: site, path: built-site, run-id: "${{ github.event.workflow_run.id }}", github-token: "${{ github.token }}" }
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.go && github.event_name == 'workflow_dispatch'
        with: { node-version: "22" }
      - name: a manual run builds the site from that commit (the same scripts/build.py as CI)
        if: steps.fresh.outputs.go && github.event_name == 'workflow_dispatch'
        working-directory: src/fysiikkalabra
        run: |
          python -m pip install -q -r requirements-ci.txt
          python scripts/build.py
          mv site ../../built-site
      - name: assemble the published copy (privacy and link gates; scripts/deploy_site.py)
        if: steps.fresh.outputs.go
        run: |
          audio=""; [ -d audio-src/fi ] && audio="--audio audio-src"
          python src/fysiikkalabra/scripts/deploy_site.py out --site built-site --models models-src $audio
          echo "${{ steps.pick.outputs.sha }}" > out/.source-sha
      - name: push to Hellsla/ruukkilabra
        if: steps.fresh.outputs.go
        working-directory: out
        run: |
          git config user.name "Ruukkilabra"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -q -m "Ruukkilabra $(TZ=Europe/Helsinki date '+%Y-%m-%d %H.%M')"
          git push origin HEAD:main
          git diff --stat HEAD~1 HEAD | tail -1 | tee -a "$GITHUB_STEP_SUMMARY" || true
