<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erilaisia liikkeitä · FY05</title>
<style>
  /* ---------- yhteinen ulkoasu (sama kaikissa FY05-simulaatioissa) ----------
     Mitoitus on tehty luokkahuoneen näyttöä varten: peruskoko seuraa ikkunan kokoa
     (16:9-upotuksessa noin 4 % korkeudesta) ja kaikki mitat ovat em-yksiköissä,
     joten koko käyttöliittymä skaalautuu kuin kalvo. ?koko=1,2 suurentaa kaiken 20 %. */
  :root{
    --bg:#ffffff; --panel:#f6f6f3;
    --ink:#2b2e33; --ink-2:#555a61; --ink-3:#858a91;
    --line:#e2e2de; --line-2:#c6c6c0;
    --accent:#2f6f9f; --accent-soft:#e3edf6;
    --c-blue:#2a7aab; --c-red:#c2404f; --c-orange:#d8761f; --c-green:#35895a; --c-violet:#7a62b0;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --koko:1;
  }
  *{box-sizing:border-box}
  html{font-size:calc(clamp(12px,min(2.75vw,4vh),60px) * var(--koko))}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);font-size:1rem;line-height:1.3}
  .app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
  .app.is-bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    user-select:none;-webkit-user-select:none}
  .panel{width:13.4em;background:var(--panel);border-left:1px solid var(--line);
    padding:.55em .7em .5em;display:flex;flex-direction:column;gap:.35em;overflow:hidden}
  .app.is-bottom .panel{width:auto;font-size:.92em;border-left:0;border-top:1px solid var(--line);flex-direction:row;
    flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.35em 1.2em;padding:.4em 1em .5em}
  .group{display:flex;flex-direction:column;gap:.15em;min-width:0}
  .ctl{display:flex;flex-direction:column;gap:0}
  .ctl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 .5em;font-size:.88em;line-height:1.2;color:var(--ink-2);white-space:nowrap}
  .ctl-head b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
  .sym{font-style:italic}
  sub{font-size:.72em;line-height:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.3em;margin:0;background:transparent;
    cursor:pointer;font-size:inherit;--p:50%}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px;border-radius:.4em}
  input[type=range]::-webkit-slider-runnable-track{height:.28em;border-radius:.2em;
    background:linear-gradient(to right,var(--accent) 0 var(--p),var(--line-2) var(--p) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.05em;height:1.05em;margin-top:-.385em;border-radius:50%;
    background:#fff;border:.1em solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
  input[type=range]::-moz-range-track{height:.28em;border-radius:.2em;background:var(--line-2)}
  input[type=range]::-moz-range-progress{height:.28em;border-radius:.2em;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:.95em;height:.95em;border-radius:50%;background:#fff;border:.1em solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .chk{display:flex;align-items:center;gap:.45em;font-size:.9em;line-height:1.2;cursor:pointer;user-select:none;min-height:1.5em;white-space:nowrap}
  .chk input{font-size:inherit;width:1.05em;height:1.05em;margin:0;accent-color:var(--accent);cursor:pointer;flex:none}
  .chk.wrap{white-space:normal;align-items:flex-start}
  .chk.wrap input{margin-top:.1em}
  .btns{display:flex;gap:.3em;flex-wrap:wrap}
  .btns .btn{flex:1 1 0}
  .btn{font:inherit;font-size:.9em;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:.35em;
    min-height:2.05em;padding:0 .55em;border-radius:.5em;border:1px solid var(--line-2);background:#fff;color:var(--ink);
    cursor:pointer;touch-action:manipulation;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn:active{background:#f1f1ee}
  .btn svg{width:1em;height:1em;flex:none}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#1c1f23}
  .btn.wide{width:100%}
  .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:default}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:.5em;overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:.9em;border:0;background:transparent;padding:0 .7em;min-height:2.0em;color:var(--ink-2);
    cursor:pointer;touch-action:manipulation}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .key{display:inline-block;width:1.4em;height:.7em;flex:none;position:relative}
  .key::before{content:"";position:absolute;left:0;right:.35em;top:calc(50% - .08em);height:.16em;background:var(--c)}
  .key::after{content:"";position:absolute;right:0;top:calc(50% - .3em);border-left:.5em solid var(--c);
    border-top:.3em solid transparent;border-bottom:.3em solid transparent}
  .key.none{visibility:hidden}
  .legend{display:flex;flex-direction:column;gap:.15em;font-size:.85em;line-height:1.25;color:var(--ink-2)}
  .legend span{display:flex;align-items:center;gap:.5em}
  .legend[hidden]{display:none}
  @media (max-aspect-ratio:4/5),(max-width:560px){      /* puhelin pystyasennossa: säätimet kuvan alla */
    html{font-size:calc(clamp(13px,3.7vw,18px) * var(--koko))}
    html,body{overflow:auto}
    .app{position:static;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
    .stage{height:58vh;min-height:300px}
    .app .panel,.app.is-bottom .panel{width:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
  }

  /* ---------- tämän simulaation omat ---------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.3em}
  .grid2 .btn{padding:0 .3em}
  .lbl{font-size:.82em;color:var(--ink-2);line-height:1.2}
  .hint{margin:0;font-size:.8em;line-height:1.3;color:var(--ink-3)}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Erilaisia liikkeitä: suoraviivainen liike, heittoliike, karuselli, pyöräilijä velodromilla ja polkimen liike. Kappaleen rata piirtyy, ja x- ja y-koordinaatin muutoksia voi seurata kuvaajasta."></canvas>
  </div>

  <div class="panel" aria-label="Säätimet">
    <span class="lbl">Liike</span>
    <div class="grid2" id="motions" role="group" aria-label="Liike">
      <button class="btn" type="button" data-m="carousel">Karuselli</button>
      <button class="btn" type="button" data-m="cyclist">Pyöräilijä</button>
      <button class="btn" type="button" data-m="pedal">Poljin</button>
      <button class="btn" type="button" data-m="line">Suora</button>
      <button class="btn" type="button" data-m="throw">Heitto</button>
    </div>
    <button class="btn primary wide" id="play" type="button"></button>
    <button class="btn wide" id="reset" type="button" title="Kappale lähtöpaikkaan ja rata tyhjäksi">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 8.2a4.7 4.7 0 1 0 1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2.6 2.4v3.4H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Alusta</button>
    <div class="group">
      <label class="chk"><input type="checkbox" id="showPath" checked><span class="key" style="--c:var(--c-blue)"></span>Näytä rata</label>
      <label class="chk"><input type="checkbox" id="showXY"><span class="key none"></span>Näytä koordinaatit</label>
      <label class="chk"><input type="checkbox" id="showCirc"><span class="key" style="--c:var(--c-orange)"></span>Korosta ympyrärata</label>
    </div>
    <p class="hint">Koordinaatit näyttävät, muuttuuko paikka yhdessä vai kahdessa ulottuvuudessa.</p>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   Yhteiset apufunktiot
   ===================================================================== */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MINUS = '−', NBSP = ' ';
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'), line: css('--line'), line2: css('--line-2'),
  blue: css('--c-blue'), red: css('--c-red'), orange: css('--c-orange'), green: css('--c-green'), violet: css('--c-violet') };

/** Luku suomalaisittain: desimaalipilkku, oikea miinusmerkki, ei "−0,0". */
function fmt(x, d = 1) {
  if (!Number.isFinite(x)) return '–';
  const s = Math.abs(x).toFixed(d);
  const neg = x < 0 && +s !== 0;
  let [ip, fp] = s.split('.');
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? MINUS : '') + ip + (fp ? ',' + fp : '');
}
/** Luku n merkitsevällä numerolla (esim. 160, 32,0, 2,67, 0,100). */
function fmtSig(x, n = 3) {
  if (!Number.isFinite(x)) return '–';
  if (x === 0) return '0';
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)) + 1e-9));
  return fmt(x, Math.min(d, 6));
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* Pieni merkintäkieli kanvastekstille:
   {F} = kursiivinen suureen tunnus, {->v} = vektori (kursiivi + nuoli),
   _1 tai _{ab} = alaindeksi, ^2 tai ^{ab} = yläindeksi. */
const richCache = new Map();
function rich(src) {
  let out = richCache.get(src);
  if (out) return out;
  out = []; let buf = '';
  const flush = () => { if (buf) { out.push({ t: buf }); buf = ''; } };
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === '{') {
      const j = src.indexOf('}', i), body = src.slice(i + 1, j);
      flush();
      out.push(body.startsWith('->') ? { t: body.slice(2), it: true, vec: true } : { t: body, it: true });
      i = j;
    } else if ((c === '_' || c === '^') && i + 1 < src.length) {
      flush();
      let body;
      if (src[i + 1] === '{') { const j = src.indexOf('}', i + 1); body = src.slice(i + 2, j); i = j; }
      else { body = src[i + 1]; i++; }
      out.push(c === '_' ? { t: body, sub: true } : { t: body, sup: true });
    } else buf += c;
  }
  flush();
  richCache.set(src, out);
  return out;
}
/** Piirtää rikastetun tekstin; palauttaa leveyden. */
function drawRich(ctx, src, x, y, o = {}) {
  const size = o.size || 15, parts = rich(src), weight = o.weight || 400;
  const fontOf = (p) => `${p.it ? 'italic ' : ''}${weight} ${(p.sub || p.sup) ? Math.round(size * 0.72) : size}px ${FONT}`;
  let w = 0;
  const ws = parts.map((p) => { ctx.font = fontOf(p); const pw = ctx.measureText(p.t).width + (p.it ? size * 0.06 : 0); w += pw; return pw; });
  if (o.measure) return w;
  let cx = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  parts.forEach((p, k) => {
    ctx.font = fontOf(p);
    const dy = p.sub ? size * 0.3 : p.sup ? -size * 0.36 : 0;
    if (o.halo) {
      ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.strokeStyle = typeof o.halo === 'string' ? o.halo : 'rgba(255,255,255,0.92)';
      ctx.strokeText(p.t, cx, y + dy);
    }
    ctx.fillStyle = o.color || COL.ink;
    ctx.fillText(p.t, cx, y + dy);
    if (p.vec) {                                   // vektorinuoli kirjaimen yläpuolelle
      const ax0 = cx + size * 0.12, ax1 = cx + ws[k] + size * 0.02, ay = y - size * 0.62;
      ctx.strokeStyle = o.color || COL.ink; ctx.lineWidth = Math.max(1, size / 13);
      ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1, ay);
      ctx.moveTo(ax1 - size * 0.2, ay - size * 0.12); ctx.lineTo(ax1, ay); ctx.lineTo(ax1 - size * 0.2, ay + size * 0.12);
      ctx.stroke();
    }
    cx += ws[k];
  });
  return w;
}
/** Vektorinuoli (ohut varsi, kapea kärki). */
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const w = o.width || 2.4, L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 0.5) return;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const hl = Math.min(o.head || 10 + w * 1.2, L * 0.8), hw = hl * 0.58;
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(bx + ux, by + uy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(bx - uy * hw, by + ux * hw); ctx.lineTo(bx + uy * hw, by - ux * hw); ctx.closePath(); ctx.fill();
}
/** ?koko=1,2 (tai ?scale=) suurentaa koko käyttöliittymän: luokan näytölle voi valita sopivan koon. */
(() => {
  const q = new URLSearchParams(location.search), raw = q.get('koko') || q.get('scale') || q.get('zoom');
  const k = raw ? parseFloat(raw.replace(',', '.')) : NaN;
  if (k >= 0.5 && k <= 3) document.documentElement.style.setProperty('--koko', String(k));
})();
/** Kanvas, joka seuraa elementin kokoa ja näytön tarkkuutta.
    Piirtäminen tehdään loogisina pikseleinä: u = sivun peruskoko / 15 px. Kun ikkuna kasvaa
    (esim. luokan näyttö), myös tekstit, viivat ja merkit suurenevat samassa suhteessa.
    Kuvapuskuri on vähintään 2-kertainen, jotta kuva pysyy terävänä, kun esitysohjelma
    (esim. Slides.com) suurentaa upotuksen koko ruudulle. */
function setupCanvas(cv, onResize) {
  const view = { ctx: cv.getContext('2d'), W: 1, H: 1, dpr: 1, u: 1 };
  const resize = () => {
    const r = cv.getBoundingClientRect();
    const base = parseFloat(getComputedStyle(document.documentElement).fontSize) || 15;
    const boost = r.width * r.height <= 1.2e6 ? 2 : 1.5;
    const dev = Math.min(3, Math.max(window.devicePixelRatio || 1, boost));
    view.u = base / 15;
    view.W = Math.max(1, r.width / view.u); view.H = Math.max(1, r.height / view.u);
    view.dpr = dev * view.u;                       // looginen pikseli → laitepikseli
    cv.width = Math.round(r.width * dev); cv.height = Math.round(r.height * dev);
    if (onResize) onResize(view);
  };
  /** Osoittimen paikka loogisina pikseleinä. */
  view.pt = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / view.u, y: (e.clientY - r.top) / view.u }; };
  new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);       // peruskoko voi muuttua, vaikka kanvaksen koko ei muuttuisi
  resize();
  return view;
}
/** Liukusäädin + arvonäyttö. */
function bindRange(id, show, onInput) {
  const el = document.getElementById(id), out = document.querySelector(`[data-for="${id}"]`);
  const paint = () => {
    const v = +el.value, a = +el.min, b = +el.max;
    el.style.setProperty('--p', ((v - a) / (b - a) * 100) + '%');
    if (out) out.textContent = show(v);
  };
  el.addEventListener('input', () => { paint(); onInput(+el.value); });
  paint();
  return { el, set(v) { el.value = v; paint(); }, get v() { return +el.value; }, repaint: paint };
}
/** Kiinteän aika-askeleen silmukka: fysiikka ei riipu näytön virkistystaajuudesta. */
function startLoop({ dt, step, draw, running }) {
  let last = performance.now(), acc = 0;
  const frame = (ts) => {
    requestAnimationFrame(frame);
    const real = clamp((ts - last) / 1000, 0, 0.1);   // pitkä tauko (esim. välilehti piilossa) ei aiheuta hyppyä
    last = ts;
    if (running()) {
      acc += real;
      let n = 0;
      while (acc >= dt && n++ < 1000) { step(dt); acc -= dt; }
    }
    draw();
  };
  requestAnimationFrame(frame);
}

/* =====================================================================
   Erilaisia liikkeitä: rata ja paikan koordinaatit
   Kappaleen paikka (x, y) lasketaan suoraan ajan funktiona:
     Karuselli:  ympyrä, r = 1,5 m, T = 4,0 s          x = r cos(2πt/T),  y = r sin(2πt/T)
     Pyöräilijä: velodromi, suorat 4,0 m ja kaarteet (puoliympyrät, r = 1,5 m), vauhti 3,0 m/s
     Poljin:     kampi r = 0,17 m, T = 2,0 s (myötäpäivään, pyörä kulkee oikealle)
     Suora:      x = vt, y = 0, v = 2,0 m/s (8 m, sitten alusta)
     Heitto:     v₀ = 10 m/s, 60°: x = v₀ cos 60° · t, y = v₀ sin 60° · t − ½gt²
   Suoraviivaisessa liikkeessä vain x muuttuu (yksi ulottuvuus); ympyräliikkeessä ja heitossa
   muuttuvat sekä x että y (tasoliike, kaksi ulottuvuutta).
   ===================================================================== */
const TAU = 2 * Math.PI, g = 9.81;
const SL = 4, SR = 1.5, LT = 2 * SL + TAU * SR, VC = 3;            // velodromin suorat, kaarteen säde, kierroksen pituus, vauhti
const VX = 10 * Math.cos(Math.PI / 3), VY = 10 * Math.sin(Math.PI / 3), TF = 2 * VY / g;   // heitto
const mod = (a, b) => ((a % b) + b) % b;
/** Velodromin keskiviiva matkan s funktiona (vastapäivään, alkaa alasuoran vasemmasta päästä). */
function stadium(s) {
  s = mod(s, LT);
  if (s < SL) return { x: -SL / 2 + s, y: -SR, curve: false };
  s -= SL;
  if (s < Math.PI * SR) { const a = -Math.PI / 2 + s / SR; return { x: SL / 2 + SR * Math.cos(a), y: SR * Math.sin(a), curve: true }; }
  s -= Math.PI * SR;
  if (s < SL) return { x: SL / 2 - s, y: SR, curve: false };
  s -= SL;
  const a = Math.PI / 2 + s / SR;
  return { x: -SL / 2 + SR * Math.cos(a), y: SR * Math.sin(a), curve: true };
}
const MOTIONS = {
  carousel: { box: [-2.1, 2.1, -2.1, 2.1], vr: [-1.7, 1.7], period: 4, pos: (t) => ({ x: 1.5 * Math.cos(TAU * t / 4), y: 1.5 * Math.sin(TAU * t / 4) }),
    status: () => 'Ympyräliike: rata on ympyrä' },
  cyclist: { box: [-SL / 2 - SR - 0.55, SL / 2 + SR + 0.55, -SR - 0.6, SR + 0.6], vr: [-3.7, 3.7], period: LT / VC, pos: (t) => stadium(VC * t),
    status: (p) => (p.curve ? 'Kaarteessa ympyräliike' : 'Suoralla suoraviivainen liike') },
  pedal: { box: [-0.24, 0.24, -0.24, 0.24], vr: [-0.2, 0.2], period: 2, pos: (t) => ({ x: 0.17 * Math.cos(-TAU * t / 2), y: 0.17 * Math.sin(-TAU * t / 2) }),
    status: () => 'Ympyräliike: rata on ympyrä' },
  line: { box: [-0.6, 8.6, -1.2, 1.2], vr: [-1, 9], wrap: 4.6, pos: (t) => ({ x: 2 * Math.min(mod(t, 4.6), 4), y: 0 }),
    status: () => 'Suoraviivainen liike: vain x muuttuu' },
  throw: { box: [-0.6, 9.6, -0.7, 4.4], vr: [-1, 10], wrap: 2.6, pos: (t) => { const s = Math.min(mod(t, 2.6), TF); return { x: VX * s, y: VY * s - g * s * s / 2 }; },
    status: () => 'Tasoliike, mutta rata ei ole ympyrä' },
};
const CX = COL.red, CY = COL.green, CPATH = COL.blue, CCIRC = COL.orange;
const S = { m: 'carousel', t: 0, running: false, show: { path: true, xy: false, circ: false } };

function step(dt) { if (S.running) S.t += dt; }

/* =====================================================================
   Piirtäminen
   ===================================================================== */
const cv = document.getElementById('cv');
let L = {};
const view = setupCanvas(cv, (v) => {
  const fs = clamp(Math.min(v.W / 30, v.H / 16), 12, 18);
  L = { W: v.W, H: v.H, fs, pad: fs * 1.1, band: 10 + fs * 1.6 };
});

function draw() {
  const { ctx, dpr } = view, { W, H, fs, pad, band } = L, mo = MOTIONS[S.m], t = S.t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // alueet: liike ylhäällä, kuvaaja alhaalla (kun koordinaatit näytetään)
  const gh = S.show.xy ? clamp(H * 0.3, fs * 4.5, fs * 9) : 0;
  const sx0 = pad, sx1 = W - pad, sy0 = band, sy1 = H - pad * 0.6 - (gh ? gh + fs * 1.2 : 0);
  const [bx0, bx1, by0, by1] = mo.box;
  const s = Math.min((sx1 - sx0) / (bx1 - bx0), (sy1 - sy0) / (by1 - by0));
  const ox = (sx0 + sx1) / 2 - (bx0 + bx1) / 2 * s, oy = (sy0 + sy1) / 2 + (by0 + by1) / 2 * s;
  const X = (x) => ox + x * s, Y = (y) => oy - y * s;
  const p = mo.pos(t), P = { x: X(p.x), y: Y(p.y) };

  // ruudukko ja akselit
  const range = Math.max(bx1 - bx0, by1 - by0), gs = [0.05, 0.1, 0.2, 0.5, 1, 2].find((d) => range / d <= 12);
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.ceil(bx0 / gs) * gs; x <= bx1 + 1e-9; x += gs) { ctx.moveTo(X(x), Y(by0)); ctx.lineTo(X(x), Y(by1)); }
  for (let y = Math.ceil(by0 / gs) * gs; y <= by1 + 1e-9; y += gs) { ctx.moveTo(X(bx0), Y(y)); ctx.lineTo(X(bx1), Y(y)); }
  ctx.stroke();

  drawScene(ctx, X, Y, s, t, p);

  arrow(ctx, X(bx0), Y(0), X(bx1), Y(0), COL.ink3, { width: 1.4, head: 8 });
  arrow(ctx, X(0), Y(by0), X(0), Y(by1), COL.ink3, { width: 1.4, head: 8 });
  drawRich(ctx, '{x}', X(bx1) - fs * 0.2, Y(0) + fs * 0.85, { size: fs, color: COL.ink2, align: 'right', halo: true });
  drawRich(ctx, '{y}', X(0) + fs * 0.55, Y(by1) + fs * 0.4, { size: fs, color: COL.ink2, halo: true });

  // ympyrärata korostettuna
  if (S.show.circ) {
    ctx.strokeStyle = CCIRC; ctx.fillStyle = CCIRC;
    const dot = (x, y) => { ctx.beginPath(); ctx.arc(X(x), Y(y), 3.5, 0, TAU); ctx.fill(); };
    if (S.m === 'carousel' || S.m === 'pedal') {
      const r = S.m === 'carousel' ? 1.5 : 0.17;
      ctx.lineWidth = 6; ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(X(0), Y(0), r * s, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; dot(0, 0);
    } else if (S.m === 'cyclist') {
      for (const c of [-1, 1]) {
        const cx = X(c * SL / 2), cy = Y(0), a0 = c > 0 ? -Math.PI / 2 : Math.PI / 2;
        ctx.lineWidth = 6; ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(cx, cy, SR * s, a0, a0 + Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.lineWidth = 1.4; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.arc(cx, cy, SR * s, a0 + Math.PI, a0 + TAU); ctx.stroke(); ctx.setLineDash([]);
        dot(c * SL / 2, 0);
      }
    }
  }

  // rata: kuljettu reitti (jaksollisissa viimeisin kierros, muissa tämä suoritus)
  if (S.show.path) {
    const tA = mo.period ? Math.max(0, t - 0.985 * mo.period) : Math.floor(t / mo.wrap) * mo.wrap, n = 180;
    ctx.strokeStyle = CPATH; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = 0; i <= n; i++) { const q = mo.pos(tA + (t - tA) * i / n); if (i) ctx.lineTo(X(q.x), Y(q.y)); else ctx.moveTo(X(q.x), Y(q.y)); }
    if (t > tA) ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // koordinaatit: projektiot akseleille ja lukemat
  const dec = range < 1 ? 2 : 1;
  if (S.show.xy) {
    ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
    ctx.strokeStyle = CX; ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(P.x, Y(0)); ctx.stroke();
    ctx.strokeStyle = CY; ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(X(0), P.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = CX; ctx.beginPath(); ctx.arc(P.x, Y(0), 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = CY; ctx.beginPath(); ctx.arc(X(0), P.y, 4.5, 0, TAU); ctx.fill();
  }

  // kappale
  ctx.fillStyle = '#222'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(P.x, P.y, fs * 0.5, 0, TAU); ctx.fill(); ctx.stroke();

  if (S.show.xy) {
    const xt = `{x} = ${fmt(p.x, dec)}${NBSP}m`, yt = `{y} = ${fmt(p.y, dec)}${NBSP}m`, sz = fs * 0.95;
    const wy = drawRich(ctx, yt, 0, 0, { size: sz, measure: true }), wx = drawRich(ctx, xt, 0, 0, { size: sz, measure: true });
    // lukemat kulkevat kappaleen mukana akselin sillä puolella, jolla kappale ei ole (eivät peitä kappaletta)
    const xx = clamp(P.x, sx0 + wx / 2, sx1 - wx / 2), yy = clamp(P.y, sy0 + fs * 0.6, sy1 - fs * 0.6);
    const below = P.y <= Y(0) + 1, ylft = (P.x >= X(0) - 1 || X(0) + fs * 0.6 + wy > W - 2) && X(0) - wy - fs * 0.6 >= 2;
    drawRich(ctx, xt, xx, Y(0) + (below ? fs * 0.95 : -fs * 0.95), { size: sz, color: CX, align: 'center', halo: true });
    drawRich(ctx, yt, ylft ? X(0) - fs * 0.6 : X(0) + fs * 0.6, yy, { size: sz, color: CY, align: ylft ? 'right' : 'left', halo: true });
    drawGraph(ctx, mo, t, pad, H - gh - pad * 0.6, W - pad, H - pad * 0.6);
  }

  // tila ylhäällä
  if (S.show.circ) drawRich(ctx, mo.status(p), 14, 10 + fs * 0.7, { size: fs, color: CCIRC, halo: true, weight: 600 });
}

/** Liikkeen taustakuva (karuselli, velodromi, ketjuratas ja kampi, tie, maa) maailman koordinaateissa. */
function drawScene(ctx, X, Y, s, t, p) {
  if (S.m === 'carousel') {
    const a = TAU * t / 4;
    ctx.fillStyle = 'rgba(53,137,90,0.16)'; ctx.strokeStyle = '#35895a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(X(0), Y(0), 1.85 * s, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#9aa3ab'; ctx.lineWidth = Math.max(2, 0.06 * s); ctx.lineCap = 'round'; ctx.beginPath();
    for (let k = 0; k < 4; k++) { const b = a + Math.PI / 4 + k * Math.PI / 2; ctx.moveTo(X(0.3 * Math.cos(b)), Y(0.3 * Math.sin(b))); ctx.lineTo(X(1.7 * Math.cos(b)), Y(1.7 * Math.sin(b))); }
    ctx.stroke(); ctx.lineCap = 'butt';
    ctx.fillStyle = '#8a8f96'; ctx.beginPath(); ctx.arc(X(0), Y(0), 0.2 * s, 0, TAU); ctx.fill();
  } else if (S.m === 'cyclist') {
    const track = (off) => {                                       // velodromin ääriviiva etäisyydellä off keskiviivasta
      const r = SR + off;
      ctx.beginPath(); ctx.moveTo(X(-SL / 2), Y(-r)); ctx.lineTo(X(SL / 2), Y(-r));
      ctx.arc(X(SL / 2), Y(0), r * s, Math.PI / 2, -Math.PI / 2, true); ctx.lineTo(X(-SL / 2), Y(r));
      ctx.arc(X(-SL / 2), Y(0), r * s, -Math.PI / 2, Math.PI / 2, true); ctx.closePath();
    };
    ctx.lineJoin = 'round';
    track(0); ctx.strokeStyle = '#ecdcbc'; ctx.lineWidth = 1.0 * s; ctx.stroke();
    track(-0.6); ctx.strokeStyle = '#8dbde3'; ctx.lineWidth = 0.22 * s; ctx.stroke();
    ctx.strokeStyle = '#c9b48f'; ctx.lineWidth = 1.2; track(0.5); ctx.stroke(); track(-0.5); ctx.stroke();
  } else if (S.m === 'pedal') {
    ctx.fillStyle = '#3a3d42'; ctx.strokeStyle = '#3a3d42'; ctx.lineWidth = Math.max(1.5, 0.012 * s);
    ctx.beginPath();
    for (let k = 0; k < 32; k++) { const b = k * TAU / 32; ctx.moveTo(X(0.108 * Math.cos(b)), Y(0.108 * Math.sin(b))); ctx.lineTo(X(0.124 * Math.cos(b)), Y(0.124 * Math.sin(b))); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(X(0), Y(0), 0.11 * s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5b6067'; ctx.beginPath(); ctx.arc(X(0), Y(0), 0.07 * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1f2226'; ctx.lineWidth = 0.032 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(p.x), Y(p.y)); ctx.stroke(); ctx.lineCap = 'butt';
    ctx.fillStyle = '#c7cbd0'; ctx.beginPath(); ctx.arc(X(0), Y(0), 0.022 * s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a4e54'; ctx.fillRect(X(p.x) - 0.05 * s, Y(p.y) - 0.016 * s, 0.1 * s, 0.032 * s);   // poljin pysyy vaakasuorassa
  } else if (S.m === 'line') {
    ctx.fillStyle = '#e7e7e3'; ctx.fillRect(X(-0.6), Y(0.45), 9.2 * s, 0.9 * s);
    ctx.strokeStyle = '#c9c9c3'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(X(-0.6), Y(0.45)); ctx.lineTo(X(8.6), Y(0.45)); ctx.moveTo(X(-0.6), Y(-0.45)); ctx.lineTo(X(8.6), Y(-0.45)); ctx.stroke();
  } else if (S.m === 'throw') {
    ctx.strokeStyle = '#8b6b45'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(X(-0.6), Y(0)); ctx.lineTo(X(9.6), Y(0)); ctx.stroke();
    ctx.strokeStyle = '#b9a184'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -0.6; x < 9.6; x += 0.3) { ctx.moveTo(X(x), Y(0) + 1); ctx.lineTo(X(x - 0.2), Y(0) + Math.min(10, 0.25 * s)); }
    ctx.stroke();
  }
}

/** x(t) ja y(t) viimeisten 8 sekunnin ajalta. */
function drawGraph(ctx, mo, t, x0, y0, x1, y1) {
  const { fs } = L, span = 8, tA = Math.max(0, t - span), [v0, v1] = mo.vr;
  const lx = x0 + fs * 2.2, rx = x1 - fs * 1.4;
  const TX = (tt) => lx + (tt - tA) / span * (rx - lx), VY = (v) => y1 - fs * 0.3 - (v - v0) / (v1 - v0) * (y1 - y0 - fs * 0.6);
  ctx.fillStyle = '#fafaf8'; ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, y1 - y0 - 1);
  // akselit: aika vaakasuoraan, paikka pystysuoraan
  ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(lx, y0 + fs * 0.3); ctx.lineTo(lx, y1 - fs * 0.3); ctx.stroke();
  arrow(ctx, lx, VY(0), rx + fs * 0.6, VY(0), COL.ink3, { width: 1.2, head: 7 });
  drawRich(ctx, '{t}', rx + fs * 0.7, VY(0) - fs * 0.6, { size: fs * 0.85, color: COL.ink2, align: 'center' });
  drawRich(ctx, '0', lx - fs * 0.3, VY(0), { size: fs * 0.75, color: COL.ink3, align: 'right' });
  const st = v1 - v0 < 1 ? 0.05 : 0.5, dec = st < 0.1 ? 2 : 1;           // asteikko: pyöreä arvo alueen sisältä
  for (const v of [v0, v1]) { const vv = Math.sign(v) * Math.floor(Math.abs(v) * 0.95 / st) * st; if (Math.abs(VY(vv) - VY(0)) > fs) {
    ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(lx, VY(vv)); ctx.lineTo(rx, VY(vv)); ctx.stroke();
    drawRich(ctx, `${fmt(vv, dec)}${NBSP}m`, lx - fs * 0.3, VY(vv), { size: fs * 0.7, color: COL.ink3, align: 'right' }); } }
  if (t <= 0) return;
  const n = 220, line = (key, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i <= n; i++) { const tt = tA + (t - tA) * i / n, q = mo.pos(tt); if (i) ctx.lineTo(TX(tt), VY(q[key])); else ctx.moveTo(TX(tt), VY(q[key])); }
    ctx.stroke();
  };
  line('x', CX); line('y', CY);
  const q = mo.pos(t), ex = TX(t) + fs * 0.45, yx = VY(q.x), yy = VY(q.y), sep = Math.abs(yx - yy) < fs ? (yx < yy ? -fs / 2 : fs / 2) : 0;
  drawRich(ctx, '{x}', ex, yx + sep, { size: fs * 0.9, color: CX, halo: true });
  drawRich(ctx, '{y}', ex, yy - sep, { size: fs * 0.9, color: CY, halo: true });
}

/* =====================================================================
   Käyttöliittymä
   ===================================================================== */
const mBtns = [...document.querySelectorAll('#motions button')];
function setMotion(m) { S.m = m; S.t = 0; for (const b of mBtns) b.setAttribute('aria-pressed', String(b.dataset.m === m)); }
for (const b of mBtns) b.addEventListener('click', () => setMotion(b.dataset.m));
const playBtn = document.getElementById('play');
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.6v10.8l9-5.4z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/><rect x="9.3" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/></svg>';
function paintPlay() { playBtn.innerHTML = S.running ? ICON_PAUSE + 'Tauko' : ICON_PLAY + 'Käynnistä'; }
playBtn.addEventListener('click', () => { S.running = !S.running; paintPlay(); });
document.getElementById('reset').addEventListener('click', () => { S.t = 0; S.running = false; paintPlay(); });
for (const [id, key] of [['showPath', 'path'], ['showXY', 'xy'], ['showCirc', 'circ']]) {
  const el = document.getElementById(id);
  S.show[key] = el.checked;
  el.addEventListener('change', () => { S.show[key] = el.checked; });
}
/* ?liike=karuselli | pyorailija | poljin | suora | heitto valitsee aloitusliikkeen. */
(() => {
  const map = { karuselli: 'carousel', pyorailija: 'cyclist', 'pyöräilijä': 'cyclist', poljin: 'pedal', suora: 'line', heitto: 'throw' };
  const q = (new URLSearchParams(location.search).get('liike') || '').toLowerCase();
  setMotion(map[q] || 'carousel');
})();
paintPlay();
startLoop({ dt: 1 / 240, step, draw, running: () => S.running });
})();
</script>
