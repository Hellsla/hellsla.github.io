# Fysiikkalabra QA: build every lesson (drafts included) and run the headless simulation tests.
# This repository serves GitHub Pages from its root branch, so there is no Pages deploy job here;
# publishing is a separate decision (see fysiikkalabra/README.md).
name: fysiikkalabra-ci
on:
  push:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  pull_request:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  schedule: [{ cron: "0 19 * * 0" }]   # Sunday 21:00 Helsinki (winter time): weekly QA run
permissions: { contents: read }
jobs:
  qa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fysiikkalabra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install markdown playwright && playwright install --with-deps chromium
      - run: python scripts/lint_lesson.py --all
      - run: python scripts/build.py --all
      # The committed site/ must be exactly what the committed sources, templates and assets render to. A change to
      # templates/ or a lesson that was not rebuilt and committed (or a stale/extra file in site/) fails here.
      # A green result only proves consistency; it is not review approval of the content or of shared assets.
      - name: rebuild site/ and require no difference
        run: |
          python scripts/build.py
          git add -N site
          git diff --exit-code --stat -- site || { echo "::error::site/ is out of date: run python scripts/build.py and commit site/"; exit 1; }
      - name: phone-width layout of the published pages (known issues in tests/layout-known.json)
        run: python scripts/check_layout.py --dir site
      - run: python scripts/test_gate.py
      - run: python scripts/gate.py --verify
      - run: python scripts/test_sims.py
      - run: |
          for d in content/*/*/; do
            case "$d" in *_gold*) continue;; esac
            python scripts/check_latex.py "$d"
          done
