<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Kaltevalla tasolla olevaan kappaleeseen vaikuttavat paino, tukivoima ja kitkavoima">
  <defs>
    <marker id="karki-sini" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#012169"/>
    </marker>
    <marker id="karki-vihrea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7a52"/>
    </marker>
    <marker id="karki-oranssi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8863a"/>
    </marker>
  </defs>

  <!-- kalteva taso -->
  <path d="M40 220 L330 80 L330 220 Z" fill="#012169" fill-opacity="0.07"/>
  <path d="M40 220 L330 80 L330 220 Z" fill="none" stroke="#012169" stroke-width="3" stroke-linejoin="round"/>

  <!-- maanpinta -->
  <line x1="20" y1="220" x2="380" y2="220" stroke="#012169" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#8f887a" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="228" x2="22" y2="238"/><line x1="60" y1="228" x2="52" y2="238"/>
    <line x1="90" y1="228" x2="82" y2="238"/><line x1="120" y1="228" x2="112" y2="238"/>
    <line x1="150" y1="228" x2="142" y2="238"/><line x1="180" y1="228" x2="172" y2="238"/>
    <line x1="210" y1="228" x2="202" y2="238"/><line x1="240" y1="228" x2="232" y2="238"/>
    <line x1="270" y1="228" x2="262" y2="238"/><line x1="300" y1="228" x2="292" y2="238"/>
    <line x1="330" y1="228" x2="322" y2="238"/><line x1="360" y1="228" x2="352" y2="238"/>
  </g>

  <!-- kaltevuuskulma -->
  <path d="M96 220 A 56 56 0 0 0 90 193" fill="none" stroke="#3a3530" stroke-width="2"/>
  <text x="102" y="213" font-family="Karla, system-ui, sans-serif" font-size="17" font-style="italic" fill="#3a3530">α</text>

  <!-- kappale -->
  <rect x="150" y="117" width="56" height="34" rx="5"
        fill="#fca5c7" stroke="#012169" stroke-width="3"
        transform="rotate(-25.8 178 134)"/>

  <!-- paino: massakeskipisteestä alaspäin -->
  <line x1="178" y1="134" x2="178" y2="207" stroke="#012169" stroke-width="3.5" marker-end="url(#karki-sini)"/>
  <text x="186" y="202" font-family="Karla, system-ui, sans-serif" font-size="19" font-style="italic" font-weight="700" fill="#012169">G</text>

  <!-- tukivoima: alkaa kosketuskohdasta, kohtisuoraan tasosta poispäin -->
  <line x1="185" y1="149.5" x2="158" y2="93" stroke="#5f7a52" stroke-width="3.5" marker-end="url(#karki-vihrea)"/>
  <text x="128" y="86" font-family="Karla, system-ui, sans-serif" font-size="19" font-style="italic" font-weight="700" fill="#5f7a52">N</text>

  <!-- kitkavoima: tason suuntaisesti, kärki kappaleessa -->
  <line x1="108" y1="181" x2="157.5" y2="157" stroke="#e8863a" stroke-width="3.5" marker-end="url(#karki-oranssi)"/>
  <text x="58" y="178" font-family="Karla, system-ui, sans-serif" font-size="19" font-style="italic" font-weight="700" fill="#e8863a">F<tspan font-size="13" baseline-shift="-4">μ</tspan></text>
</svg>
