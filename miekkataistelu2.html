<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miekkainsultti — Suomalainen Miekkataistelu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    #game {
      width: min(800px, 100vw);
      height: min(600px, 75vw);
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* ── SCENE (top 62%) ── */
    #scene {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 62%;
      overflow: hidden;
    }

    #sky {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 150% 120% at 20% 0%,
        #183070 0%, #0c1e50 20%, #06102e 50%, #020c20 75%, #000510 100%);
    }

    #landscape {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      shape-rendering: crispEdges;
    }

    /* ── FIGHTERS ── */
    #fighters-wrap {
      position: absolute;
      bottom: 15%;
      width: 68%;
      height: 76%;
      transition: left 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    #fighters-svg {
      width: 100%; height: 100%;
      overflow: visible;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      shape-rendering: crispEdges;
    }

    /* ── SPARK ── */
    #spark {
      position: absolute;
      left: 50%; top: 43%;
      width: clamp(14px, 3vw, 28px);
      height: clamp(14px, 3vw, 28px);
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 8;
    }
    @keyframes spark-pop {
      0%   { transform: translate(-50%,-50%) scale(0.15); opacity: 1; }
      28%  { transform: translate(-50%,-50%) scale(1.6);  opacity: 1; }
      70%  { transform: translate(-50%,-50%) scale(0.9);  opacity: 0.6; }
      100% { transform: translate(-50%,-50%) scale(0.4);  opacity: 0; }
    }
    #spark.flash { animation: spark-pop 0.42s ease forwards; }

    /* ── POS BAR ── */
    #pos-bar {
      position: absolute;
      top: 5px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center;
      gap: clamp(2px, 0.5vw, 5px);
      z-index: 5;
    }
    .pip {
      width: clamp(10px, 2.2vw, 18px);
      height: clamp(5px, 1.1vw, 9px);
      background: #08102a;
      border: 1px solid #1a3070;
    }
    .pip.won { background: #1e4ab0; }
    .pip.cur {
      background: #fff;
      border-radius: 50%;
      width: clamp(7px, 1.5vw, 13px);
      height: clamp(7px, 1.5vw, 13px);
    }

    /* ── DIALOG ── */
    #dialog {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 38%;
      background: #00040e;
      border-top: 3px solid #1a2c70;
      display: flex; flex-direction: column;
      padding: clamp(6px,1.2vw,14px) clamp(12px,2.2vw,24px);
      gap: clamp(3px,0.7vw,7px);
    }

    #insult-text {
      font-family: 'Special Elite', serif;
      font-size: clamp(7.5px, 1.4vw, 13px);
      color: #d8e8ff;
      line-height: 1.55;
      font-style: italic;
      border-bottom: 1px solid #1a2560;
      padding-bottom: clamp(3px,0.6vw,7px);
      flex-shrink: 0;
    }

    #options {
      display: flex; flex-direction: column;
      gap: clamp(1px,0.3vw,4px);
      flex: 1; overflow: hidden;
    }

    .opt {
      font-family: 'Special Elite', serif;
      font-size: clamp(6.5px, 1.2vw, 11px);
      color: #7a9fd4;
      background: transparent; border: none;
      text-align: left;
      padding: clamp(1px,0.3vw,3px) 0;
      cursor: pointer; line-height: 1.5;
      transition: color 0.1s;
      flex-shrink: 0;
    }
    .opt:hover:not(:disabled) { color: #eef4ff; }
    .opt.correct { color: #3de87a; }
    .opt.wrong   { color: #e84030; }

    #status {
      font-family: 'VT323', monospace;
      font-size: clamp(10px, 1.9vw, 18px);
      color: #556688;
      text-align: center;
      min-height: 1.3em;
      letter-spacing: 1px;
    }

    /* ── OVERLAY ── */
    #overlay {
      position: absolute; inset: 0;
      background: rgba(0,2,15,0.93);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(10px,2.2vw,24px);
      z-index: 30; padding: 20px; text-align: center;
    }
    #ov-title {
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 3.8vw, 38px);
      color: #ffdd44; letter-spacing: 3px;
      text-shadow: 3px 3px #000, 0 0 18px #ff880055;
    }
    #ov-sub {
      font-family: 'Special Elite', serif;
      font-size: clamp(8px, 1.5vw, 14px);
      color: #6688aa; max-width: 74%; line-height: 1.9;
    }
    #ov-btn {
      font-family: 'VT323', monospace;
      font-size: clamp(13px, 2.6vw, 26px);
      letter-spacing: 2px;
      background: transparent; color: #ffdd44;
      border: 2px solid #ffdd44;
      padding: clamp(6px,1.2vw,12px) clamp(16px,3vw,32px);
      cursor: pointer; transition: background 0.18s, color 0.18s;
    }
    #ov-btn:hover { background: #ffdd44; color: #000; }

    /* ── MOON ── */
    #moon {
      position: absolute; top: 7%; right: 14%;
      width: clamp(26px, 5.5%, 50px); aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 34%, #fffde4, #ffd54f 55%, #b08020);
      box-shadow: 0 0 clamp(6px,1.8vw,18px) #ffd54f99;
    }
  </style>
</head>

const MAX_POS = 8;
let queue = [], qIdx = 0, pos = 4, locked = false;
let opts = [], correctIdx = 0;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

/* ── START ── */
function startGame() {
  queue = shuffle(duels);
  qIdx = 0; pos = 4; locked = false;
  document.getElementById('overlay').style.display = 'none';
  buildPips();
  placeFighters(false);
  loadDuel();
}

/* ── PIPS ── */
function buildPips() {
  const bar = document.getElementById('pos-bar');
  bar.innerHTML = '';
  for (let i = 0; i <= MAX_POS; i++) {
    const d = document.createElement('div');
    d.className = 'pip'; d.id = 'pip' + i;
    bar.appendChild(d);
  }
  refreshPips();
}

function refreshPips() {
  for (let i = 0; i <= MAX_POS; i++) {
    const d = document.getElementById('pip' + i);
    if (!d) continue;
    d.className = 'pip';
    if (i < pos)   d.classList.add('won');
    if (i === pos) d.classList.add('cur');
  }
}

/* ── FIGHTER POSITION ── */
function placeFighters(instant) {
  const fw = document.getElementById('fighters-wrap');
  if (instant) fw.style.transition = 'none';
  fw.style.left = (pos / MAX_POS * 32) + '%';
  if (instant) setTimeout(() => fw.style.transition = '', 20);
}

/* ── LOAD DUEL ── */
function loadDuel() {
  const d = queue[qIdx % queue.length];
  opts = shuffle([
    { t: d.correct, ok: true },
    { t: d.wrong[0], ok: false },
    { t: d.wrong[1], ok: false }
  ]);
  correctIdx = opts.findIndex(o => o.ok);

  document.getElementById('insult-text').textContent = d.insult;
  document.getElementById('status').textContent = '';

  ['opt0','opt1','opt2'].forEach((id, i) => {
    const b = document.getElementById(id);
    b.textContent = (i + 1) + '.  ' + opts[i].t;
    b.className = 'opt';
    b.disabled = false;
  });
  locked = false;
}

/* ── CHOICE ── */
function choose(i) {
  if (locked) return;
  locked = true;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);

  const won = opts[i].ok;
  document.getElementById('opt' + i).classList.add(won ? 'correct' : 'wrong');
  if (!won) document.getElementById('opt' + correctIdx).classList.add('correct');

  showSpark(won);

  if (won) {
    pos = Math.min(MAX_POS, pos + 1);
    document.getElementById('status').textContent = '— HYVIN SANOTTU! Vihollinen perääntyy! —';
    animChar('p-char', 'p-adv');
    animChar('e-char', 'e-ret');
  } else {
    pos = Math.max(0, pos - 1);
    document.getElementById('status').textContent = '— VÄÄRIN! Vihollinen etenee naureskellen! —';
    animChar('p-char', 'p-ret');
    animChar('e-char', 'e-adv');
  }

  refreshPips();
  setTimeout(() => placeFighters(false), 180);

  setTimeout(() => {
    if (pos >= MAX_POS) return endGame(true);
    if (pos <= 0)       return endGame(false);
    qIdx++;
    if (qIdx >= queue.length) { queue = shuffle(duels); qIdx = 0; }
    loadDuel();
  }, 2000);
}

/* ── SPARK ── */
function showSpark(won) {
  const sp = document.getElementById('spark');
  sp.style.background = won
    ? 'radial-gradient(circle, #fff 8%, #ffff44 35%, #ffcc00 65%, transparent 100%)'
    : 'radial-gradient(circle, #fff 8%, #ff8800 35%, #ff4400 65%, transparent 100%)';
  sp.className = '';
  void sp.offsetWidth;
  sp.className = 'flash';
}

/* ── CHARACTER ANIMATIONS ── */
const charAnims = {
  'p-adv': `@keyframes p-adv{0%{transform:translateX(0)}35%{transform:translateX(5px)}100%{transform:translateX(0)}}`,
  'p-ret': `@keyframes p-ret{0%{transform:translateX(0)}22%{transform:translateX(-9px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}100%{transform:translateX(0)}}`,
  'e-ret': `@keyframes e-ret{0%{transform:translateX(0)}35%{transform:translateX(-5px)}100%{transform:translateX(0)}}`,
  'e-adv': `@keyframes e-adv{0%{transform:translateX(0)}22%{transform:translateX(9px)}55%{transform:translateX(-4px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}}`
};

/* inject keyframes once */
const styleEl = document.createElement('style');
styleEl.textContent = Object.values(charAnims).join('') +
  `#p-char.p-adv{animation:p-adv 0.48s ease forwards}
   #p-char.p-ret{animation:p-ret 0.44s ease forwards}
   #e-char.e-ret{animation:e-ret 0.48s ease forwards}
   #e-char.e-adv{animation:e-adv 0.44s ease forwards}`;
document.head.appendChild(styleEl);

function animChar(id, cls) {
  const el = document.getElementById(id);
  const all = ['p-adv','p-ret','e-ret','e-adv'];
  all.forEach(c => el.classList.remove(c));
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 520);
}

/* ── END ── */
function endGame(won) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  document.getElementById('ov-title').textContent = won ? '⚔ VOITTO!' : '💀 TAPPIO!';
  document.getElementById('ov-sub').textContent = won
    ? 'Olet karkoittanut vihollisen! Suomen miekkainsulttikilpailun mestari!'
    : 'Olet hävinnyt! Harjoittele sanontoja enemmän ennen seuraavaa kohtaamista...';
  document.getElementById('ov-btn').textContent = 'UUSI TAISTELU!';
}

/* ── STARS ── */
window.addEventListener('load', () => {
  const scene = document.getElementById('scene');
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    const big = Math.random() < 0.1;
    const sz = big ? Math.random() * 1.5 + 2 : Math.random() + 0.4;
    s.style.cssText = `position:absolute;border-radius:50%;
      width:${sz}px;height:${sz}px;background:#ffffff;
      top:${Math.random() * 65}%;left:${Math.random() * 100}%;
      opacity:${big ? 0.7 + Math.random() * 0.3 : 0.25 + Math.random() * 0.55};
      ${big ? 'box-shadow:0 0 2px #fff9;' : ''}`;
    scene.insertBefore(s, scene.firstChild.nextSibling);
  }
});
</script>
</body>
