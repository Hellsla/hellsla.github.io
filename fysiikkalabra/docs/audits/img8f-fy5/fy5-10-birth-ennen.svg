<svg viewBox="0 0 600 420" role="img" aria-label="Kaavakuva: narun pää alkaa heilua ylös ja alas, ja narusta on piirretty neljä kuvaa allekkain hetkillä neljäsosa jaksonajasta, puolet, kolme neljäsosaa ja koko jaksonaika. Katkoviiva näyttää, mihin asti aalto on kunakin hetkenä edennyt: neljäsosan aallonpituudesta, puolet, kolme neljäsosaa ja koko aallonpituuden. Alimman kuvan alla mittajana näyttää, että yhden jaksonajan aikana aalto on edennyt yhden aallonpituuden. Rintaman takana naru on levossa." style="max-width:100%;font-size:24px">
