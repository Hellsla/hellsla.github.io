<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#012169">
<title>Kiviruukki Classroom Screen</title>
<link rel="stylesheet" href="lib/mathquill/mathquill.css">
<style>
:root{
  --navy:#012169;
  --pink:#fca5c7;
  --pink-strong:#f35f9f;
  --pink-track:#fde2ee;
  --white:#ffffff;
  --ink:#012169;
  --muted:#66718d;
  --panel:#ffffff;
  --surface:#f4f6fa;
  --line:rgba(1,33,105,.14);
  --shadow:0 14px 42px rgba(1,33,105,.10);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--surface)}
body{
  margin:0;
  min-height:100dvh;
  color:var(--ink);
  background:
    radial-gradient(circle at 92% 8%, rgba(252,165,199,.22), transparent 23rem),
    var(--surface);
  font-family:"Work Sans",Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,[contenteditable="true"]:focus-visible{outline:3px solid var(--pink-strong);outline-offset:3px}

.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  min-height:68px;
  padding:12px clamp(14px,2vw,28px);
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:flex-end;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;font-family:Lato,Arial,sans-serif;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:42px;color:var(--pink-strong)}
.brand small{display:block;font-family:"Work Sans",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.62;margin-top:1px}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toolbar-group{display:flex;align-items:center;gap:6px;padding:4px;background:#eef1f7;border-radius:999px}
button{
  border:0;
  border-radius:999px;
  padding:9px 14px;
  background:#eef1f7;
  color:var(--navy);
  cursor:pointer;
  font-weight:750;
}
button:hover{filter:brightness(.975)}
.toolbar-group button{background:transparent;padding:7px 11px;font-size:13px}
.toolbar-group button.on{background:var(--white);box-shadow:0 2px 8px rgba(1,33,105,.08)}
.primary{background:var(--navy);color:#fff}
.pink{background:var(--pink)}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}

.workspace{
  flex:1;
  position:relative;
  display:flex;
  padding:clamp(12px,1.6vw,22px);
  min-height:0;
}
.widget{
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
.widget.hidden{display:none!important}
.widget-head{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  padding:0 18px;
  border-bottom:1px solid var(--line);
}
.widget-title{font-family:Lato,Arial,sans-serif;font-size:15px;font-weight:900;letter-spacing:.02em;text-transform:uppercase}
.widget-tools{display:flex;align-items:center;gap:6px}
.widget-tools button{padding:7px 10px;font-size:13px}

.note-widget{flex:1;display:flex;flex-direction:column}
.note-body{flex:1;min-height:0;position:relative;overflow:auto}
.editor{
  min-height:100%;
  display:flow-root;
  padding:clamp(24px,4vw,58px);
  font-family:Lato,Arial,sans-serif;
  font-size:clamp(34px,5.1vw,76px);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-.035em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.editor:empty::before{content:attr(data-placeholder);color:rgba(1,33,105,.26)}
.editor p,.editor div{margin:.15em 0}
.note-footer{display:none;padding:8px 18px 14px;font-size:12px;color:#b3124f;font-weight:700}
.note-footer.warn{display:block}
.note-widget .widget-head{height:auto;min-height:54px;flex-wrap:wrap;padding:8px 18px}
.note-widget .widget-head{justify-content:flex-start}
.note-widget .widget-tools{flex-wrap:wrap;justify-content:flex-start}
.widget-tools button.on{background:var(--pink)}

/* --- Abitti-style math toolbar ------------------------------------------ */
.math-toolbar{display:none;flex-direction:column;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:#f8f9fc;max-height:42%;overflow:auto}
.math-toolbar.open,.note-widget.math-active .math-toolbar{display:flex}
.tb-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tb-row button{min-width:36px;height:36px;padding:0 8px;border-radius:10px;background:#fff;border:1px solid var(--line);font-family:"Times New Roman",Symbola,serif;font-size:19px;font-weight:400;line-height:1}
.tb-row button:hover{background:var(--pink-track);filter:none}
.tb-row .tb-more{font-family:"Work Sans",Arial,sans-serif;font-size:12px;font-weight:750}
.tb-extra{display:none}
.math-toolbar.more .tb-extra{display:flex}
.tb-basic{max-height:36px;overflow:hidden}
.math-toolbar.more .tb-basic{max-height:none}
.tb-eq{display:none}
.note-widget.math-active .tb-eq{display:flex}
.tb-eq button{height:42px;min-width:42px;padding:0 7px}
.tb-eq img{display:block;height:24px;width:auto;max-width:78px}
.tb-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* rendered equations and the inline equation editor */
.editor .math{display:inline-block;vertical-align:middle;letter-spacing:0;font-weight:400;cursor:pointer;border-radius:.12em;padding:0 .04em;white-space:nowrap}
.editor .math:hover{background:var(--pink-track)}
.editor .math.raw{font-family:ui-monospace,Consolas,monospace;font-size:.5em}
.editor .math .mq-math-mode,.math-editor .mq-math-mode{font-size:1em}
.editor .math-editor{display:inline-flex;flex-direction:column;gap:.12em;vertical-align:middle;max-width:100%;padding:.08em .16em .16em;margin:0 .05em;border:3px solid var(--pink-strong);border-radius:16px;background:#fff;letter-spacing:0;font-weight:400;white-space:normal}
.math-editor .mq-editable-field{min-width:1.2em;border:0!important;box-shadow:none!important;padding:.05em .1em}
.math-editor .mq-editable-field.mq-focused{box-shadow:none}
.math-editor textarea.latex-src{display:block;width:min(100%,40rem);min-width:16rem;min-height:2.6em;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font:15px/1.35 ui-monospace,Consolas,monospace;color:var(--navy);background:#f8f9fc}
.math-editor textarea.latex-src.error{border-color:#d11d5a;background:#fff0f5}
.math-editor .me-hint{font:600 11px/1.2 "Work Sans",Arial,sans-serif;color:var(--muted);letter-spacing:.02em}

/* pasted images */
.editor img{max-width:100%;height:auto;vertical-align:middle;border-radius:10px}
.editor .img-wrap{position:relative;display:inline-block;vertical-align:middle;max-width:100%;line-height:1.1;letter-spacing:0;container-type:inline-size;white-space:normal}
.editor .img-wrap>img{display:block;width:100%;height:auto}
.editor .img-wrap.selected{outline:4px solid var(--pink-strong);outline-offset:2px;border-radius:10px}
.editor .img-wrap{float:left;margin:.1em .45em .15em 0}
.editor .img-wrap.inline{float:none;margin:.05em 0}
.editor .img-wrap.float-right{float:right;margin:.1em 0 .15em .45em}
.editor .img-wrap.own-line{float:none;display:block;margin:.15em auto;clear:both}
.img-label{position:absolute;transform:translate(-50%,-50%);max-width:96%;font-family:Lato,Arial,sans-serif;font-size:7cqw;font-weight:900;line-height:1.1;color:var(--navy);text-align:center;white-space:pre-wrap;text-shadow:0 0 .08em #fff,0 0 .08em #fff,0 0 .15em #fff,0 0 .25em #fff}
.img-label .lbl-text{display:block;min-width:.6em;padding:.05em .2em;border-radius:.15em;outline:none;cursor:text}
.img-label .lbl-text:empty::before{content:"Kirjoita…";opacity:.45}
.img-label .lbl-text div{margin:0}
.img-label.boxed .lbl-text{background:rgba(255,255,255,.88);text-shadow:none}
.img-wrap.selected .img-label .lbl-text{outline:2px dashed rgba(243,95,159,.9)}
.img-label .lbl-grip{display:none;position:absolute;left:-13px;top:-13px;width:22px;height:22px;border-radius:50%;background:var(--navy);border:3px solid #fff;cursor:move;touch-action:none;box-shadow:0 2px 8px rgba(1,33,105,.3)}
.img-wrap.selected .img-label .lbl-grip{display:block}
/* image resize handle */
.img-handle{position:absolute;z-index:7;display:none;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--pink-strong);border:4px solid #fff;box-shadow:0 2px 10px rgba(1,33,105,.3);cursor:nwse-resize;touch-action:none}
.img-handle.show{display:block}

/* pen tool */
.draw-canvas{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.note-widget.drawing .draw-canvas{pointer-events:auto;cursor:crosshair;touch-action:none}
.note-widget.drawing.erasing .draw-canvas{cursor:cell}
.pen-bar{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--line);background:#f8f9fc}
.note-widget.drawing .pen-bar{display:flex}
.pen-bar button{padding:6px 11px;font-size:13px;background:#fff;border:1px solid var(--line)}
.pen-bar button.on{background:var(--pink);border-color:var(--pink-strong)}
.pen-bar .swatch{width:30px;height:30px;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pen-bar .swatch.on{box-shadow:0 0 0 3px var(--navy)}
.pen-bar .size{width:34px;height:34px;padding:0;display:grid;place-items:center}
.pen-bar .size i{display:block;border-radius:50%;background:var(--navy)}
.img-bar{position:absolute;z-index:6;display:none;flex-wrap:wrap;align-items:center;gap:5px;max-width:calc(100% - 16px);padding:6px;border-radius:22px;background:var(--navy);box-shadow:var(--shadow)}
.img-bar.show{display:flex}
.img-bar button{padding:6px 10px;font-size:13px;background:#fff}
.img-bar button.on{background:var(--pink)}
.img-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.3)}
.img-bar .lbl-only{display:none}
.img-bar.has-labels .lbl-only{display:inline-block}

.timer-bar{display:none}

/* --- Floating cards (clock, timer, calculator) on top of the text ------ */
.card{position:absolute;z-index:20;display:flex;flex-direction:column;min-width:0;min-height:0;cursor:grab;touch-action:none;box-shadow:0 14px 42px rgba(1,33,105,.16)}
.card.hidden{display:none!important}
.card.dragging{cursor:grabbing;box-shadow:0 26px 60px rgba(1,33,105,.3)}
.card.dragging,.card.dragging *{user-select:none}
.card button,.card input{cursor:pointer;touch-action:manipulation}
.card input{cursor:text}
.card-bar{position:absolute;top:0;left:0;right:0;z-index:5;height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px 0 16px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(rgba(255,255,255,.97),rgba(255,255,255,.75));opacity:0;transition:opacity .15s;user-select:none}
.card:hover .card-bar,.card.dragging .card-bar,.card:focus-within .card-bar{opacity:1}
@media(hover:none){.card-bar{opacity:1}}
.card-grip{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-close{width:26px;height:26px;padding:0;font-size:15px;line-height:1}
.card-resize{position:absolute;right:0;bottom:0;z-index:6;width:26px;height:26px;cursor:nwse-resize;touch-action:none;border-bottom-right-radius:var(--radius);background:linear-gradient(135deg,transparent 55%,rgba(1,33,105,.28) 55%,rgba(1,33,105,.28) 62%,transparent 62%,transparent 72%,rgba(1,33,105,.28) 72%,rgba(1,33,105,.28) 79%,transparent 79%)}
.calc{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.calc .card-bar{position:static;opacity:1;height:auto;padding:8px 10px 8px 16px;border-radius:0;background:var(--navy);color:#fff;cursor:grab}
.calc .card-grip{color:#fff}
.calc .card-close{background:rgba(255,255,255,.16);color:#fff}
.calc.dragging .calc-frame{pointer-events:none}

.calc-frame{display:block;width:100%;flex:1;min-height:0;border:0;background:#f5f5f5}

.clock-widget{container-type:size}
.clock-body{flex:1;display:grid;place-items:center;text-align:center;padding:4cqh 3cqw}
.clock-time{font-family:Lato,Arial,sans-serif;font-weight:900;font-size:min(25cqw,58cqh);line-height:.9;letter-spacing:-.065em;font-variant-numeric:tabular-nums lining-nums}
.clock-date{margin-top:5cqh;font-size:min(6cqw,12cqh);font-weight:650;color:var(--muted);text-transform:capitalize}
.clock-seconds{font-size:.38em;vertical-align:top;letter-spacing:-.02em;margin-left:.12em;color:var(--pink-strong)}

.timer-widget{container:timer/size}
.timer-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:5cqw;padding:5cqh 5cqw}
.timer-visual{position:relative;aspect-ratio:1;flex:0 0 auto;width:min(52cqw,90cqh);container-type:inline-size}
.timer-controls{flex:1 1 0;max-width:300px;min-width:0}

.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring-track{stroke:var(--pink-track)}
.ring-progress{stroke:var(--pink-strong);stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.timer-center{position:absolute;inset:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2%}
.timer-widget .forge{width:72%;display:flex;flex-direction:column;align-items:center;line-height:0;margin-top:1%}
.timer-widget .rays{width:100%;height:auto;color:var(--pink);transform-origin:50% 100%;opacity:1}
.timer-widget .anvil{display:block;width:100%;height:auto;margin-top:-.4%;user-select:none;-webkit-user-drag:none}
.timer-time{margin-top:1%;font-family:Lato,Arial,sans-serif;font-size:21cqw;font-weight:900;line-height:.9;letter-spacing:-.06em;font-variant-numeric:tabular-nums lining-nums;text-align:center;min-width:4.2ch}
.timer-status{margin-top:3cqw;font-size:max(9px,3.6cqw);letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.55;height:1.2em}
.timer-running .rays{animation:forgePulse 900ms ease-in-out infinite alternate}
.timer-finished .rays{animation:finishFlash 250ms ease-in-out 7 alternate}
@keyframes forgePulse{from{opacity:.3}to{opacity:1}}
@keyframes finishFlash{from{opacity:.18}to{opacity:1}}
.timer-controls{display:flex;flex-direction:column;align-items:stretch;gap:9px}
.timer-adjust{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer-adjust button{font-size:15px;padding:10px 6px}
.timer-set{display:grid;grid-template-columns:1fr auto;gap:8px}
.timer-set input{min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 12px;color:var(--navy);background:#fff;text-align:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.timer-set button{font-size:13px}
.timer-controls .start{background:var(--navy);color:#fff;padding:12px;font-size:15px}
.timer-controls .reset{font-size:13px}
/* small timer cards: fewer controls, ring above the start button when narrow */
@container timer (max-height:300px){
  .timer-set,.timer-controls .reset{display:none}
}
@container timer (max-width:380px){
  .timer-body{flex-direction:column;gap:8px;padding:30px 10px 10px}
  .timer-visual{width:min(86cqw,calc(100cqh - 136px))}
  .timer-controls{flex:0 0 auto;width:100%;max-width:none;gap:6px}
  .timer-set,.timer-controls .reset{display:none}
  .timer-adjust button{padding:7px 4px;font-size:13px}
  .timer-controls .start{padding:9px}
}

body.bg-navy{--surface:#012169;--panel:#fff;--shadow:0 14px 42px rgba(0,0,0,.18)}
body.bg-navy{background:var(--navy)}
body.bg-navy .topbar{background:rgba(1,33,105,.92);color:#fff;border-bottom-color:rgba(255,255,255,.18)}
body.bg-navy .brand small{color:#fff}
body.bg-navy .toolbar-group{background:rgba(255,255,255,.14)}
body.bg-navy .toolbar-group button{color:#fff}
body.bg-navy .toolbar-group button.on{background:#fff;color:var(--navy)}
body.bg-pink{--surface:#fca5c7}
body.bg-pink{background:var(--pink)}

.presentation .topbar{opacity:.06;transition:opacity .18s ease}
.presentation .topbar:hover,.presentation .topbar:focus-within{opacity:1}
.presentation .workspace{padding-top:6px}

body:fullscreen .app,body:-webkit-full-screen .app{min-height:100dvh}
body:fullscreen .topbar,body:-webkit-full-screen .topbar{opacity:.06;transition:opacity .18s ease}
body:fullscreen .topbar:hover,body:fullscreen .topbar:focus-within,body:-webkit-full-screen .topbar:hover,body:-webkit-full-screen .topbar:focus-within{opacity:1}

@media(max-width:700px){
  .topbar{align-items:flex-start}
  .toolbar-group.bg-group{display:none}
  .editor{font-size:clamp(32px,10vw,58px)}
}
@media(prefers-reduced-motion:reduce){.timer-running .rays,.timer-finished .rays{animation:none}.ring-progress{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="toolbar" aria-label="Näkymän asetukset">
      <div class="toolbar-group" aria-label="Näytä widgetit">
        <button class="widget-toggle on" data-widget="timer">Ajastin</button>
        <button class="widget-toggle on" data-widget="clock">Kello</button>
      </div>
      <div class="toolbar-group bg-group" aria-label="Taustaväri">
        <button class="bg-btn on" data-bg="light" title="Vaalea tausta">○</button>
        <button class="bg-btn" data-bg="navy" title="Yönsininen tausta">●</button>
        <button class="bg-btn" data-bg="pink" title="Marjapuuro-tausta">◉</button>
      </div>
      <button class="widget-toggle" data-widget="calc" title="Laskin (L)">Laskin</button>
      <button id="presentationBtn" title="Piilota työkalupalkki">Esitystila</button>
      <button class="pink" id="fullscreenBtn">Koko näyttö</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="widget note-widget" id="widget-note">
      <div class="widget-head">
        <div class="widget-tools">
          <button id="addMathBtn" title="Lisää kaava (Ctrl+E)">Σ Kaava</button>
          <button id="toolbarBtn" title="Näytä erikoismerkit ja kaavapainikkeet">Merkit</button>
          <button id="addImageBtn" title="Lisää kuva (tai liitä Ctrl+V)">Kuva</button>
          <button id="penBtn" title="Kynä: piirrä näytölle (P)">✎ Kynä</button>
          <input id="imageInput" type="file" accept="image/*" multiple hidden>
          <button id="textSmaller" title="Pienennä tekstiä">A−</button>
          <button id="textLarger" title="Suurenna tekstiä">A+</button>
          <button id="clearText">Tyhjennä</button>
        </div>
      </div>
      <div class="math-toolbar" id="mathToolbar" aria-label="Erikoismerkit ja kaavat"></div>
      <div class="pen-bar" id="penBar" role="toolbar" aria-label="Kynän asetukset">
        <button class="swatch on" data-color="#012169" style="background:#012169" title="Tummansininen" aria-label="Tummansininen"></button>
        <button class="swatch" data-color="#f35f9f" style="background:#f35f9f" title="Pinkki" aria-label="Pinkki"></button>
        <button class="swatch" data-color="#e11d48" style="background:#e11d48" title="Punainen" aria-label="Punainen"></button>
        <button class="swatch" data-color="#16a34a" style="background:#16a34a" title="Vihreä" aria-label="Vihreä"></button>
        <button class="swatch" data-color="#2563eb" style="background:#2563eb" title="Sininen" aria-label="Sininen"></button>
        <button class="swatch" data-color="#f59e0b" style="background:#f59e0b" title="Oranssi" aria-label="Oranssi"></button>
        <span class="tb-sep"></span>
        <button class="size" data-size="3" title="Ohut" aria-label="Ohut"><i style="width:4px;height:4px"></i></button>
        <button class="size on" data-size="6" title="Keskikokoinen" aria-label="Keskikokoinen"><i style="width:8px;height:8px"></i></button>
        <button class="size" data-size="14" title="Paksu" aria-label="Paksu"><i style="width:14px;height:14px"></i></button>
        <span class="tb-sep"></span>
        <button id="eraserBtn" title="Pyyhekumi: pyyhi viivoja">Pyyhekumi</button>
        <button id="undoDrawBtn" title="Kumoa viimeisin viiva (Ctrl+Z)">Kumoa</button>
        <button id="clearDrawBtn" title="Poista kaikki piirrokset">Tyhjennä piirros</button>
        <button id="penDoneBtn" title="Lopeta piirtäminen (Esc)">Valmis</button>
      </div>
      <div class="note-body" id="noteBody">
        <div class="editor" id="editor" contenteditable="true" spellcheck="true" data-placeholder="Kirjoita tähän…" aria-label="Luokan näytölle kirjoitettava teksti"></div>
        <canvas class="draw-canvas" id="drawCanvas" aria-hidden="true"></canvas>
      </div>

<script>
(() => {
  'use strict';

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const app = $('#app');
  const editor = $('#editor');
  const workspace = $('#workspace');

  // --- Notes ---------------------------------------------------------------
  let editorSize = Number(localStorage.getItem('kiviruukki.editorSize') || 0);
  const savedNote = localStorage.getItem('kiviruukki.note');
  if (savedNote) editor.innerHTML = savedNote;

  function applyEditorSize(){
    const base = Math.max(26, Math.min(120, editorSize || 0));
    editor.style.fontSize = base ? `${base}px` : '';
  }
  $('#textLarger').addEventListener('click', () => {
    const current = parseFloat(getComputedStyle(editor).fontSize);
    editorSize = Math.min(120, current + 6);
    localStorage.setItem('kiviruukki.editorSize', String(editorSize));
    applyEditorSize();
  });
  $('#textSmaller').addEventListener('click', () => {
    const current = parseFloat(getComputedStyle(editor).fontSize);
    editorSize = Math.max(26, current - 6);
    localStorage.setItem('kiviruukki.editorSize', String(editorSize));
    applyEditorSize();
  });
  $('#clearText').addEventListener('click', () => {
    if (editor.textContent.trim() || editor.querySelector('img,.math') || strokes.length) {
      if (!confirm('Tyhjennetäänkö teksti, kaavat, kuvat ja piirrokset?')) return;
    }
    closeMath(false); hideImgBar(); clearDrawing();
    editor.innerHTML=''; localStorage.removeItem('kiviruukki.note'); editor.focus();
  });
  if (editorSize) applyEditorSize();

  // --- Saving ------------------------------------------------------------
  // Equations are stored as <span class="math" data-latex="…"> and rendered
  // again on load, so the saved HTML stays small and independent of MathQuill.
  const noteWidget = $('#widget-note');
  const noteFooter = $('#noteFooter');
  const footerText = '';
  let saveTimer = 0;
  function serialize(){
    const clone = editor.cloneNode(true);
    clone.querySelectorAll('.math-editor').forEach(w => {
      const latex = w.querySelector('.latex-src')?.value.trim() || '';
      if (latex) w.replaceWith(mathSpan(latex, false)); else w.remove();
    });
    clone.querySelectorAll('.math').forEach(m => { m.textContent = ''; m.className = 'math'; });
    clone.querySelectorAll('.selected').forEach(i => i.classList.remove('selected'));
    return clone.innerHTML;
  }
  function saveNow(){
    clearTimeout(saveTimer);
    try{
      localStorage.setItem('kiviruukki.note', serialize());
      noteFooter.textContent = footerText; noteFooter.classList.remove('warn');
    }catch(_){
      noteFooter.textContent = 'Tallennus ei onnistunut: kuvat vievät liikaa tilaa selaimen muistista. Poista tai pienennä kuvia.';
      noteFooter.classList.add('warn');
    }
  }
  function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
  editor.addEventListener('input', save);
  window.addEventListener('beforeunload', saveNow);

  // --- Equations (Abitti-style: MathQuill + LaTeX source side by side) ----
  const MQ = window.MathQuill ? window.MathQuill.getInterface(2) : null;
  const MATH = window.ABITTI_MATH || {chars:{BASIC:[],ALGEBRA:[],GEOMETRY:[],SET_THEORY:[]},shortcuts:[]};
  let active = null; // {wrap, mq, ta}

  function renderMath(span){
    const latex = span.dataset.latex || '';
    span.textContent = '';
    span.classList.remove('raw');
    if (MQ){
      const inner = document.createElement('span');
      span.appendChild(inner);
      MQ.StaticMath(inner).latex(latex);
    } else {
      span.textContent = latex; span.classList.add('raw');
    }
  }
  function mathSpan(latex, render = true){
    const s = document.createElement('span');
    s.className = 'math';
    s.contentEditable = 'false';
    s.dataset.latex = latex;
    s.title = 'Muokkaa kaavaa klikkaamalla';
    if (render) renderMath(s);
    return s;
  }
  editor.querySelectorAll('.math').forEach(s => { s.contentEditable = 'false'; renderMath(s); });

  function editorRange(){
    const sel = getSelection();
    if (sel.rangeCount){
      const r = sel.getRangeAt(0);
      if (editor.contains(r.commonAncestorContainer) && !r.commonAncestorContainer.closest?.('.math-editor')) return r;
    }
    const r = document.createRange();
    r.selectNodeContents(editor); r.collapse(false);
    return r;
  }
  function caretAfter(node){
    let next = node.nextSibling;
    if (!next || next.nodeType !== 3){ next = document.createTextNode('​'); node.after(next); }
    const r = document.createRange();
    r.setStart(next, next.data.startsWith('​') ? 1 : 0); r.collapse(true);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }

  function openMath(latex = '', replaceNode = null){
    if (!MQ){ noteFooter.textContent = 'Kaavaeditori ei latautunut (lib/mathquill puuttuu).'; noteFooter.classList.add('warn'); return; }
    closeMath(false);
    const wrap = document.createElement('span');
    wrap.className = 'math-editor';
    wrap.contentEditable = 'false';
    const field = document.createElement('span');
    const ta = document.createElement('textarea');
    ta.className = 'latex-src';
    ta.spellcheck = false;
    ta.placeholder = 'LaTeX';
    ta.setAttribute('aria-label', 'Kaavan LaTeX-koodi');
    const hint = document.createElement('span');
    hint.className = 'me-hint';
    hint.textContent = 'Enter = uusi kaavarivi · Esc = valmis · muokkaa kaavaa ylhäällä tai LaTeXia tässä';
    wrap.append(field, ta, hint);

    if (replaceNode) replaceNode.replaceWith(wrap);
    else {
      const r = editorRange();
      const selected = r.toString();
      if (!latex && selected) latex = selected;
      r.deleteContents();
      r.insertNode(wrap);
    }

    const mq = MQ.MathField(field, {
      spaceBehavesLikeTab: false,
      autoCommands: 'pi sqrt sum int nthroot',
      autoOperatorNames: 'sin cos tan arcsin arccos arctan sinh cosh tanh ln log lg exp lim max min det',
      handlers: {
        edit(f){ if (field.contains(document.activeElement)){ ta.value = f.latex(); ta.classList.remove('error'); } },
        enter(){ mathEnter(); }
      }
    });
    mq.latex(latex);
    ta.value = latex;
    ta.addEventListener('input', () => {
      mq.latex(ta.value);
      ta.classList.toggle('error', mq.latex() === '' && ta.value.trim() !== '');
      save();
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); closeMath(true); }
      else if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); mathEnter(); }
    });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Escape' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e')){ e.preventDefault(); closeMath(true); }
      e.stopPropagation();
    });
    active = {wrap, mq, ta};
    noteWidget.classList.add('math-active');

  }

  // --- Images: paste (Ctrl+V), drag & drop, or file picker ----------------
  const MAX_SIDE = 1600;
  function readAsDataURL(blob){
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  }
  async function imageToDataURL(file){
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') return readAsDataURL(file);
    try{
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size < 900 * 1024) return readAsDataURL(file);
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/webp', .85);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', .88);
      return url;
    }catch(_){ return readAsDataURL(file); }
  }
  function insertNodeAtCaret(node, range){
    const r = range || editorRange();

  function wrapImage(img){

  }
  function fitWrap(wrap){
    const img = wrap.querySelector('img');
    wrap.style.width = '60%';
    const set = () => { if (img.naturalWidth) wrap.style.width = Math.min(100, Math.round(img.naturalWidth / editorContentWidth() * 100)) + '%'; };

  async function insertImages(files, range){

      insertNodeAtCaret(wrap, r.cloneRange());
      r.setStartAfter(wrap); r.collapse(true);

  // Pasted HTML is reduced to text, line breaks, images and equations.
  function sanitize(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const frag = document.createDocumentFragment();
    const BLOCK = /^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE|PRE|UL|OL|TABLE)$/;
    function walk(node, out){
      node.childNodes.forEach(n => {
        if (n.nodeType === 3){ out.append(n.data.replace(/\s+/g, ' ')); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName;
        if (/^(SCRIPT|STYLE|META|LINK|TITLE|NOSCRIPT|TEMPLATE)$/.test(tag)) return;
        if (tag === 'BR'){ out.append(document.createElement('br')); return; }
        if (tag === 'IMG'){
          const src = n.getAttribute('src') || '';
          if (/^(data:image\/|https?:)/i.test(src)){ const i = document.createElement('img'); i.src = src; i.alt = n.getAttribute('alt') || ''; out.append(i); }
          return;
        }
        if (n.classList.contains('math') && n.dataset.latex){ out.append(mathSpan(n.dataset.latex)); return; }
        if (BLOCK.test(tag)){ const d = document.createElement('div'); walk(n, d); if (d.childNodes.length) out.append(d); return; }
        walk(n, out);
      });
    }
    walk(doc.body, frag);
    return frag;
  }

  function clipboardImages(dt){
    let files = [...(dt.files || [])].filter(f => f.type.startsWith('image/'));
    if (!files.length) files = [...(dt.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
    return files;
  }

  editor.addEventListener('paste', e => {

  // Image toolbar: size, placement next to text, and text labels on the image
  const imgBar = $('#imgBar');

  function hideImgBar(){ if (selectedImg) selectedImg.classList.remove('selected'); selectedImg = null; imgBar.classList.remove('show'); imgHandle.classList.remove('show'); }

    imgBar.style.left = Math.max(8, Math.min(i.left - w.left + 8, w.width - imgBar.offsetWidth - 8)) + 'px';

  function editorContentWidth(){

  function dragWith(el, e, move, done){
    el.setPointerCapture(e.pointerId);

  function addLabel(wrap, x = 50, y = 50){

  // --- Clock ---------------------------------------------------------------
  const clockTime = $('#clockTime');

  const dateFmt = new Intl.DateTimeFormat('fi-FI', {weekday:'long', day:'numeric', month:'long'});
  function updateClock(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    const ss = String(d.getSeconds()).padStart(2,'0');

  // --- Timer ---------------------------------------------------------------
  const timerWidget = $('#widget-timer');
  const timerTime = $('#timerTime');
  const timerStatus = $('#timerStatus');
  const progress = $('#progress');
  const timerBar = $('#timerBar');
  const startPauseBtn = $('#startPause');
  const resetTimerBtn = $('#resetTimer');
  const timeInput = $('#timeInput');
  const radius = 164;
  const circumference = 2 * Math.PI * radius;
  progress.style.strokeDasharray = `${circumference} ${circumference}`;

  let durationMs = Number(localStorage.getItem('kiviruukki.timerMinutes') || 5) * 60000;
  if (!Number.isFinite(durationMs) || durationMs <= 0) durationMs = 5 * 60000;
  let setMs = durationMs; // what Nollaa returns to
  let remainingMs = durationMs;
  let running = false;
  let endAt = 0;
  let raf = 0;
  const soundOn = true;
  let audioCtx = null;

  function formatTime(ms){
    const total = Math.max(0, Math.ceil(ms/1000));
    const mins = Math.floor(total/60);
    const secs = total%60;
    return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }
  function renderTimer(){
    timerTime.textContent = formatTime(remainingMs);
    const ratio = durationMs ? Math.max(0, Math.min(1, remainingMs/durationMs)) : 0;
    progress.style.strokeDashoffset = String(circumference * (1-ratio));
    timerBar.style.width = (ratio * 100).toFixed(2) + '%';
  }
  const MAX_MS = 180 * 60000;
  // "5" = 5 min, "2:30" = 2 min 30 s, "1,5" = 1.5 min
  function parseTime(text){
    const t = String(text).trim().replace(',', '.');
    const m = /^(\d+):(\d{1,2})$/.exec(t);
    if (m) return (Number(m[1]) * 60 + Number(m[2])) / 60;
    return Number(t);
  }
  function setDuration(minutes){
    if (running) pauseTimer();
    const safe = Math.max(10/60, Math.min(180, Number(minutes) || 5));
    durationMs = Math.round(safe * 60) * 1000;
    setMs = durationMs;
    remainingMs = durationMs;
    timeInput.value = formatTime(durationMs);
    localStorage.setItem('kiviruukki.timerMinutes', String(durationMs / 60000));
    timerWidget.classList.remove('timer-finished');
    timerStatus.textContent='Valmis';
    startPauseBtn.textContent='Käynnistä';
    renderTimer();
  }
  function tick(now){
    if (!running) return;
    remainingMs = Math.max(0, endAt-now);
    renderTimer();
    if (remainingMs<=0){ finishTimer(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startTimer(){
    if (running || remainingMs<=0) return;
    running=true;
    endAt=performance.now()+remainingMs;
    timerWidget.classList.add('timer-running');
    timerWidget.classList.remove('timer-finished');
    timerStatus.textContent='Ahjo käy';
    startPauseBtn.textContent='Tauko';
    raf=requestAnimationFrame(tick);
  }
  function pauseTimer(){
    if(!running) return;
    remainingMs=Math.max(0,endAt-performance.now());
    running=false;
    cancelAnimationFrame(raf);
    timerWidget.classList.remove('timer-running');
    timerStatus.textContent='Tauko';
    startPauseBtn.textContent='Jatka';
    renderTimer();
  }
  function resetTimer(){
    running=false;
    cancelAnimationFrame(raf);
    durationMs=setMs;
    remainingMs=durationMs;
    timerWidget.classList.remove('timer-running','timer-finished');
    timerStatus.textContent='Valmis';
    startPauseBtn.textContent='Käynnistä';
    renderTimer();
  }
  function toggleTimer(){
    if(remainingMs<=0) resetTimer();
    running ? pauseTimer() : startTimer();
  }
  function finishTimer(){
    running=false;
    remainingMs=0;
    cancelAnimationFrame(raf);
    timerWidget.classList.remove('timer-running');
    timerWidget.classList.add('timer-finished');
    timerStatus.textContent='Aika';
    startPauseBtn.textContent='Käynnistä';
    renderTimer();
    if(soundOn) beep();
  }
  function beep(){
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const t=audioCtx.currentTime;
      [0,.22,.44].forEach((delay,i)=>{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(i===2?740:660,t+delay);
        g.gain.setValueAtTime(.0001,t+delay);
        g.gain.exponentialRampToValueAtTime(.13,t+delay+.015);
        g.gain.exponentialRampToValueAtTime(.0001,t+delay+.16);
        o.connect(g).connect(audioCtx.destination);
        o.start(t+delay); o.stop(t+delay+.18);
      });
    }catch(_){ }
  }
  // +/− one minute. Before the timer has started (or after it has finished)
  // this changes the set time; while running or paused it changes the time left.
  function adjustTime(deltaMs){
    const now = performance.now();
    if (running) remainingMs = Math.max(0, endAt - now);
    const fresh = !running && (remainingMs === durationMs || remainingMs <= 0);
    if (fresh){
      setDuration(Math.max(60000, Math.min(MAX_MS, (remainingMs <= 0 ? 0 : remainingMs) + deltaMs)) / 60000);
      return;
    }
    remainingMs = Math.max(0, Math.min(MAX_MS, remainingMs + deltaMs));
    durationMs = Math.max(durationMs, remainingMs);
    if (running){
      endAt = now + remainingMs;
      if (remainingMs <= 0){ finishTimer(); return; }
    }
    renderTimer();
  }
  function applyTimeInput(){
    const v = parseTime(timeInput.value);
    if (Number.isFinite(v) && v > 0) setDuration(v); else timeInput.value = formatTime(durationMs);
  }
  startPauseBtn.addEventListener('click',toggleTimer);
  resetTimerBtn.addEventListener('click',resetTimer);
  $('#plusMin').addEventListener('click',()=>adjustTime(60000));
  $('#minusMin').addEventListener('click',()=>adjustTime(-60000));
  $('#setTime').addEventListener('click',applyTimeInput);
  timeInput.addEventListener('keydown',e=>{if(e.key==='Enter'){applyTimeInput();timeInput.blur();}});
  timeInput.addEventListener('focus',()=>timeInput.select());
  timeInput.value=formatTime(durationMs);
  renderTimer();

  // --- Floating cards: clock, timer and calculator on top of the text ---
  // Position and size are stored in % of the workspace so the layout carries
  // over between a laptop and the classroom projector.
  const calcFrame = $('#calcFrame');
  const cardEls = {clock:$('#widget-clock'), timer:$('#widget-timer'), calc:$('#calc')};
  const CARD_DEFAULTS = {
    clock:{x:73, y:11, w:25, h:26, open:true},
    timer:{x:67, y:40, w:31, h:38, open:true},
    calc:{x:46, y:11, w:24, h:86, open:false}
  };
  const CARD_MIN = {clock:[170,100], timer:[170,240], calc:[384,420]};
  let cardState = {};
  try{ cardState = JSON.parse(localStorage.getItem('kiviruukki.cards') || '{}'); }catch(_){ cardState = {}; }
  Object.keys(cardEls).forEach(k => { cardState[k] = Object.assign({}, CARD_DEFAULTS[k], cardState[k]); });
  let zTop = 20;
  function saveCards(){ try{ localStorage.setItem('kiviruukki.cards', JSON.stringify(cardState)); }catch(_){} }
  function applyCard(k){
    const el = cardEls[k], st = cardState[k];
    const W = workspace.clientWidth, H = workspace.clientHeight;
    el.classList.toggle('hidden', !st.open);
    $(`.widget-toggle[data-widget="${k}"]`)?.classList.toggle('on', st.open);
    if (!st.open) return;
    const w = Math.min(W, Math.max(CARD_MIN[k][0], st.w / 100 * W));
    const h = Math.min(H, Math.max(CARD_MIN[k][1], st.h / 100 * H));
    const x = Math.min(Math.max(0, st.x / 100 * W), W - w);
    const y = Math.min(Math.max(0, st.y / 100 * H), H - h);
    Object.assign(el.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
    if (k === 'calc' && !calcFrame.src) calcFrame.src = calcFrame.dataset.src; // load Abicus on first open
  }
  function storeCard(k){
    const el = cardEls[k], W = workspace.clientWidth, H = workspace.clientHeight;
    Object.assign(cardState[k], {x: el.offsetLeft / W * 100, y: el.offsetTop / H * 100, w: el.offsetWidth / W * 100, h: el.offsetHeight / H * 100});
    saveCards();
  }
  function raiseCard(k){ cardEls[k].style.zIndex = ++zTop; }
  function setCard(k, open){
    cardState[k].open = open;
    applyCard(k); saveCards();
    if (open){
      raiseCard(k);
      if (k === 'calc') setTimeout(() => { try{ calcFrame.contentWindow.focus(); }catch(_){} }, 50);
    }
  }
  function toggleCard(k){ setCard(k, !cardState[k].open); }
  $$('.widget-toggle').forEach(b => b.addEventListener('click', () => toggleCard(b.dataset.widget)));
  Object.entries(cardEls).forEach(([k, el]) => {
    el.querySelector('.card-close').addEventListener('click', () => setCard(k, false));
    // Drag from anywhere on the card except its controls
    el.addEventListener('pointerdown', e => {
      raiseCard(k);
      if (e.button !== 0 || e.target.closest('button,input,textarea,select,iframe,.card-resize')) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      const W = workspace.clientWidth, H = workspace.clientHeight;
      el.classList.add('dragging');
      dragWith(el, e, ev => {
        el.style.left = Math.min(Math.max(0, ox + ev.clientX - sx), W - el.offsetWidth) + 'px';
        el.style.top = Math.min(Math.max(0, oy + ev.clientY - sy), H - el.offsetHeight) + 'px';
      }, () => { el.classList.remove('dragging'); storeCard(k); });
    });
    const grip = el.querySelector('.card-resize');
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      raiseCard(k);
      const sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
      const W = workspace.clientWidth, H = workspace.clientHeight;
      el.classList.add('dragging');
      dragWith(grip, e, ev => {
        el.style.width = Math.min(W - el.offsetLeft, Math.max(CARD_MIN[k][0], ow + ev.clientX - sx)) + 'px';
        el.style.height = Math.min(H - el.offsetTop, Math.max(CARD_MIN[k][1], oh + ev.clientY - sy)) + 'px';
      }, () => { el.classList.remove('dragging'); storeCard(k); });
    });
  });
  function layoutCards(){ Object.keys(cardEls).forEach(applyCard); }
  layoutCards();
  new ResizeObserver(layoutCards).observe(workspace);

  // --- Background, presentation and fullscreen ---------------------------
  const bgButtons=$$('.bg-btn');
  function setBg(bg){
    document.body.classList.remove('bg-navy','bg-pink');
    if(bg==='navy') document.body.classList.add('bg-navy');
    if(bg==='pink') document.body.classList.add('bg-pink');
    bgButtons.forEach(b=>b.classList.toggle('on',b.dataset.bg===bg));
    localStorage.setItem('kiviruukki.bg',bg);
  }
  bgButtons.forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.bg)));
  setBg(localStorage.getItem('kiviruukki.bg')||'light');

  $('#presentationBtn').addEventListener('click',()=>document.body.classList.toggle('presentation'));
  async function toggleFullscreen(){
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(_){ }
  }
  $('#fullscreenBtn').addEventListener('click',toggleFullscreen);

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey) && !e.altKey && e.key.toLowerCase()==='e' && (editor.contains(e.target)||e.target===editor) && !e.target.closest('.img-label')){
      e.preventDefault(); active ? closeMath(true) : openMath('');
      return;
    }
    if(noteWidget.classList.contains('drawing') && !e.target.closest('input,textarea')){
      if(e.key==='Escape'){ e.preventDefault(); setPen(false); return; }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undoDrawing(); return; }
    }
    const typing=e.target.isContentEditable || e.target.closest('input,textarea,select,[contenteditable="true"],.math-editor');
    if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.code==='Space'){e.preventDefault();toggleTimer();}
    else if(e.key.toLowerCase()==='r') resetTimer();
    else if(e.key.toLowerCase()==='f') toggleFullscreen();
    else if(e.key.toLowerCase()==='l') toggleCard('calc');
    else if(e.key==='+') adjustTime(60000);
    else if(e.key==='-') adjustTime(-60000);
    else if(e.key.toLowerCase()==='p') setPen(!noteWidget.classList.contains('drawing'));
  });

  // --- Pen tool ----------------------------------------------------------
  // Strokes are kept as vectors (CSS px in the text area's scroll content),
  // so they scroll with the text and are redrawn sharply after resizing.
  const canvas = $('#drawCanvas');
  const ctx = canvas.getContext('2d');
  const penBtn = $('#penBtn');
  const eraserBtn = $('#eraserBtn');
  let strokes = [];
  try{ strokes = JSON.parse(localStorage.getItem('kiviruukki.drawing') || '[]'); }catch(_){ strokes = []; }
  let penColor = localStorage.getItem('kiviruukki.penColor') || '#012169';
  let penSize = Number(localStorage.getItem('kiviruukki.penSize') || 6);
  let erasing = false;
  let current = null;

  function saveDrawing(){
    try{ localStorage.setItem('kiviruukki.drawing', JSON.stringify(strokes)); }
    catch(_){ noteFooter.textContent = 'Piirroksen tallennus ei onnistunut: selaimen muisti on täynnä.'; noteFooter.classList.add('warn'); }
  }
  function sizeCanvas(){
    const maxY = strokes.reduce((m, st) => Math.max(m, ...st.p.map(q => q[1] + st.w)), 0);
    const w = noteBody.clientWidth, h = Math.ceil(Math.max(noteBody.clientHeight, editor.offsetHeight, maxY + 20));
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function drawStroke(st){
    const pts = st.p;
    ctx.strokeStyle = st.c; ctx.fillStyle = st.c;
    ctx.lineWidth = st.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1){ ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], st.w / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.stroke();
  }
  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(drawStroke);
    if (current && !current.erase) drawStroke(current);
  }
  function clearDrawing(){ strokes = []; current = null; redraw(); saveDrawing(); }
  function pointFrom(e){
    const r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10];
  }
  function segDist(p, a, b){
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const t = dx || dy ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / (dx*dx + dy*dy))) : 0;
    return Math.hypot(p[0] - a[0] - t*dx, p[1] - a[1] - t*dy);
  }
  function eraseAt(pt){
    const before = strokes.length;
    strokes = strokes.filter(st => {
      const r = st.w / 2 + 12;
      if (st.p.length === 1) return Math.hypot(pt[0]-st.p[0][0], pt[1]-st.p[0][1]) > r;
      for (let i = 1; i < st.p.length; i++) if (segDist(pt, st.p[i-1], st.p[i]) <= r) return false;
      return true;
    });
    if (strokes.length !== before) redraw();
  }
  canvas.addEventListener('pointerdown', e => {
    if (!noteWidget.classList.contains('drawing') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const pt = pointFrom(e);
    const eraser = erasing || e.button === 5 || (e.buttons & 32);
    if (eraser){ current = {erase: true}; eraseAt(pt); return; }
    const w = e.pointerType === 'pen' && e.pressure ? penSize * (0.6 + e.pressure * 0.8) : penSize;
    current = {c: penColor, w: Math.round(w * 10) / 10, p: [pt]};
    redraw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (current.erase){ events.forEach(ev => eraseAt(pointFrom(ev))); return; }
    events.forEach(ev => {
      const pt = pointFrom(ev), last = current.p[current.p.length - 1];
      if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) >= 1.5) current.p.push(pt);
    });
    redraw();
  });
  function endStroke(){
    if (!current) return;
    if (!current.erase) strokes.push(current);
    current = null;
    redraw(); saveDrawing();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  function setPen(on){
    noteWidget.classList.toggle('drawing', on);
    penBtn.classList.toggle('on', on);
    if (on){ closeMath(false); hideImgBar(); editor.blur(); sizeCanvas(); }
    else setEraser(false);
  }
  function setEraser(on){
    erasing = on;
    eraserBtn.classList.toggle('on', on);
    noteWidget.classList.toggle('erasing', on);
  }
  function undoDrawing(){ if (strokes.length){ strokes.pop(); redraw(); saveDrawing(); } }
  penBtn.addEventListener('click', () => setPen(!noteWidget.classList.contains('drawing')));
  $('#penDoneBtn').addEventListener('click', () => setPen(false));
  eraserBtn.addEventListener('click', () => setEraser(!erasing));
  $('#undoDrawBtn').addEventListener('click', undoDrawing);
  $('#clearDrawBtn').addEventListener('click', () => { if (strokes.length && confirm('Poistetaanko kaikki piirrokset?')) clearDrawing(); });
  $$('#penBar .swatch').forEach(b => {
    b.classList.toggle('on', b.dataset.color === penColor);
    b.addEventListener('click', () => {
      penColor = b.dataset.color; localStorage.setItem('kiviruukki.penColor', penColor);
      $$('#penBar .swatch').forEach(x => x.classList.toggle('on', x === b));
      setEraser(false);
    });
  });
  $$('#penBar .size').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.size) === penSize);
    b.addEventListener('click', () => {
      penSize = Number(b.dataset.size); localStorage.setItem('kiviruukki.penSize', String(penSize));
      $$('#penBar .size').forEach(x => x.classList.toggle('on', x === b));
      setEraser(false);
    });
  });
  const canvasObserver = new ResizeObserver(() => sizeCanvas());
  canvasObserver.observe(noteBody);
  canvasObserver.observe(editor);
  sizeCanvas();

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden || !running) return;
    remainingMs=Math.max(0,endAt-performance.now());
    if(remainingMs<=0) finishTimer(); else renderTimer();
  });
})();
</script>
</body>
</html>
