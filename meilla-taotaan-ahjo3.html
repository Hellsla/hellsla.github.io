<title>Meillä taotaan – Ahjo 3 | Kiviruukin lukio</title>
<!--
  Kiviruukin sloganianimaatio Ahjon kanssa iframe-upotukseen, esim. Slides.com-
  esitykseen: "Meillä taotaan" ja vaihtuva vaaleanpunainen sana Yönsinisellä
  pohjalla, oikeassa alakulmassa Marjapuuro-muoto ja sen sisällä dian
  alareunalla seisova Yönsininen Ahjo. Alasin hytkähtää kuin siihen isketään,
  valkoiset säteet välähtävät ja iskusta syntyy uusi sana.
  Sama kuin meilla-taotaan.html, mutta Ahjon kanssa. Teksti ja muoto skaalautuvat
  upotuksen korkeuden mukaan samassa suhteessa kuin kiviruukki.html-sivun
  hero-osassa; leveämmässä upotuksessa niiden väliin jää enemmän tilaa.

    <iframe src="https://hellsla.github.io/meilla-taotaan-ahjo3.html"
            width="960" height="540" style="border:0"></iframe>

  URL-parametrit:
    (oletus)              Meillä taotaan tulevaisuuksia. / ideoita. / prototyyppejä. / ratkaisuja. / yhdessä.
    ?lang=en              We forge futures. / knowledge. / ideas. / prototypes. / together.
    ?words=a,b,c          omat vaihtuvat sanat (pilkulla erotettuina)
    ?lead=Meillä%20taotaan  oma valkoinen alkuosa
    ?s=4                  sanan vaihtoväli sekunteina (oletus 2.8)
    ?kipinat              lisää iskuun valkoiset kipinät
    ?kerran (tai ?once)   sanat käydään läpi yhden kerran, ja animaatio pysähtyy
                          takaisin ensimmäiseen sanaan (oletuksena tulevaisuuksia.);
                          viimeisen iskun jälkeen Ahjo häipyy säteiden mukana
-->

<style>
  :root{
    /* Kiviruukin lukion ensisijainen ilme */
    --navy:#012169;
    --pink:#fca5c7;
    --white:#ffffff;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }

  body{
    position:relative;
    overflow:hidden;
    background:var(--navy);
    font-family:"Lato", Arial, sans-serif;
  }

  /* Muoto on rajattu kuten graafisen ohjeiston kansisivulla, ja sen alue
     on aina 1,6 × korkeus (heron mittasuhde), jotta muodon ja tekstin
     koko pysyvät samassa suhteessa upotuksen muodosta riippumatta. */
  .cloud{
    position:absolute;
    right:0;
    bottom:0;
    width:160vh;
    height:100vh;
    fill:var(--pink);
  }

  /* Sijoittelu ja mittasuhteet kuten kiviruukki.html-sivun hero-osassa:
     tekstin yläpuolelle ja alle jää tilaa. */
  .slogan{
    position:absolute;
    left:6vh;
    top:26vh;
    color:var(--white);
    font-weight:900;
    font-size:64px;              /* fit() asettaa oikean koon */
    line-height:1;
    letter-spacing:-0.02em;
    white-space:nowrap;
    visibility:hidden;
  }

  .slogan.is-ready{ visibility:visible; }

  .line{
    display:block;
    height:1em;
  }

  .changing{
    height:1.08em;
    overflow:hidden;
    color:var(--pink);
  }

  .word{
    display:inline-block;
    transition:transform .42s cubic-bezier(.2,.7,.2,1), opacity .42s ease;
  }

  .word.is-out{
    transform:translateY(-.55em);
    opacity:0;
    transition-duration:.18s;
    transition-timing-function:ease-in;
  }
  .word.is-in{ transform:translateY(.55em); opacity:0; transition:none; }

  /* Pysty- ja neliömäisissä upotuksissa teksti ylös, muoto alaosaan. */
  @media (max-aspect-ratio:1/1){
    .cloud{ width:100vw; height:58vh; }
    .slogan{ left:6%; top:16%; }
  }

  /* Vähennetty liike: sana vaihtuu pelkällä häivytyksellä. */
  @media (prefers-reduced-motion:reduce){
    .word.is-out,
    .word.is-in{ transform:none; }
  }

  /* Ahjo: kohtaus on 230 × 208 yksikköä kuten ahjo-animaatio.html:ssä.
     Alasin, ahjon suu ja säteet ovat maskeja, joten värit tulevat näistä
     muuttujista. placeAhjo() asettaa koon ja paikan. */
  :root{
    --ahjo-body:var(--navy);     /* alasin */
    --ahjo-glow:var(--white);    /* ahjon suu, säteet ja kipinät */
  }

  .ahjo{
    position:absolute;
    left:0;
    top:0;
    width:230px;
    height:208px;
    pointer-events:none;
    visibility:hidden;
  }

  .ahjo.is-ready{ visibility:visible; }

  .forge{
    position:absolute;
    inset:0;
    transform-origin:50% 100%;
  }

  .rays,
  .anvil{
    position:absolute;
    left:0;
    width:100%;
  }

<span class="probe" id="probe" aria-hidden="true"></span>

<div class="ahjo" id="ahjo" aria-hidden="true">
  <div class="forge" id="forge">
    <div class="rays" id="rays"></div>
    <div class="anvil"><div class="anvil-body"></div><div class="anvil-hearth" id="hearth"></div></div>
    <div class="sparks">
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var params = new URLSearchParams(location.search);
  // Graafisen ohjeiston elävä slogan Ahjon sanoin.
  var lead = "Meillä taotaan";
  var words = ["tulevaisuuksia.", "ideoita.", "prototyyppejä.", "ratkaisuja.", "yhdessä."];

  if ((params.get("lang") || "").toLowerCase() === "en"){
    document.documentElement.lang = "en";
    lead = "We forge";
    words = ["futures.", "knowledge.", "ideas.", "prototypes.", "together."];
  }
  if (params.get("lead")) lead = params.get("lead");
  if (params.get("words")){
    var own = params.get("words").split(",").map(function(w){ return w.trim(); }).filter(Boolean);
    if (own.length) words = own;
  }
  var lively = params.has("kipinat");
  if (lively) document.documentElement.classList.add("ahjo-kipinat");
  var once = params.has("kerran") || params.has("once");
  var seconds = parseFloat(params.get("s"));
  if (!(seconds >= 1)) seconds = 2.8;

  var slogan = document.getElementById("slogan");
  var leadEl = document.getElementById("lead");
  var word = document.getElementById("word");
  var probe = document.getElementById("probe");
  leadEl.textContent = lead;
  word.textContent = words[0];
  word.classList.add("is-in");                       // ensimmäinen sana syntyy ensimmäisestä iskusta
  slogan.setAttribute("aria-label", lead + " " + words[0]);

  var cloud = document.querySelector(".cloud");
  var shape = cloud.querySelector("path");

  // Missä kohtaa muoto alkaa vasemmalta pystyvälillä y0–y1 (px)?
  function cloudEdge(x0, y0, y1, w, h){
    var edge = w;
    try {
      var pt = cloud.createSVGPoint();
      var inv = shape.getScreenCTM().inverse();
      var stepY = Math.max(2, h / 80), stepX = Math.max(2, w / 240);
      for (var y = Math.max(0, y0); y <= Math.min(h, y1); y += stepY){
        for (var x = x0; x < edge; x += stepX){
          pt.x = x; pt.y = y;
          if (shape.isPointInFill(pt.matrixTransform(inv))){ edge = x; break; }
        }
      }
    } catch (e) {
      edge = w * 0.55;
    }
    return edge;
  }

  // Fonttikoko heron mittasuhteilla (n. 10,7 % korkeudesta); pienennetään
  // vain, jos pisin sana ulottuisi muotoon asti.
  function fit(){
    var w = window.innerWidth, h = window.innerHeight;
    var tall = h >= w;
    var widest = 0;
    [lead].concat(words).forEach(function(t){
      probe.textContent = t;
      widest = Math.max(widest, probe.getBoundingClientRect().width / 100);
    });
    var size = tall ? Math.min(h * 0.07, w * 0.86 / widest)
                    : Math.min(h * 0.107, w * 0.9 / widest);
    for (var k = 0; k < 4; k++){
      slogan.style.fontSize = size.toFixed(1) + "px";
      var box = slogan.getBoundingClientRect();
      var gap = size * 0.18;
      var room = cloudEdge(box.left, box.top - gap, box.bottom + gap, w, h) - box.left - gap;
      if (widest * size <= room) break;
      size = Math.max(8, room / widest);
    }
    slogan.classList.add("is-ready");
    placeAhjo(w, h);
  }

  // Ahjo seisoo dian alareunalla muodon sisällä: suurin koko (enintään 40 %
  // dian korkeudesta), jolla alasin ja säteet mahtuvat kokonaan muotoon.
  // Ääriviiva on kaksi suorakulmiota: koko levyinen alasin ja alimmat säteet
  // (alin 42 %) sekä kapeampi säteiden viuhka (keskimmäinen 76 %).
  var ahjo = document.getElementById("ahjo");
  var sceneW = 0;
  function placeAhjo(w, h){
    var cell = Math.max(3, Math.round(Math.min(w, h) / 120));
    var cols = Math.ceil(w / cell), rows = Math.ceil(h / cell), W = cols + 1;
    var sum = new Int32Array(W * (rows + 1));
    try {
      var pt = cloud.createSVGPoint();
      var inv = shape.getScreenCTM().inverse();
      for (var r = 0; r < rows; r++){
        var run = 0;
        for (var c = 0; c < cols; c++){
          pt.x = (c + 0.5) * cell; pt.y = (r + 0.5) * cell;
          if (shape.isPointInFill(pt.matrixTransform(inv))) run++;
          sum[(r + 1) * W + c + 1] = sum[r * W + c + 1] + run;
        }
      }
    } catch (e) {
      ahjo.classList.remove("is-ready");
      return;
    }
    function inside(c0, r0, c1, r1){
      if (c0 < 0 || r0 < 0 || c1 > cols || r1 > rows) return false;
      return sum[r1 * W + c1] - sum[r0 * W + c1] - sum[r1 * W + c0] + sum[r0 * W + c0] === (c1 - c0) * (r1 - r0);
    }
    var pad = Math.ceil(Math.min(w, h) * 0.03 / cell);
    function fitsAt(c0, r0, sw, sh){
      var mid = r0 + Math.round(sh * 0.58), side = Math.round(sw * 0.12);
      return inside(c0 - pad, mid, c0 + sw + pad, rows) &&
             inside(c0 + side - pad, r0 - pad, c0 + sw - side + pad, mid);
    }
    var tall = h >= w;
    var maxW = Math.floor(h * (tall ? 0.3 : 0.4) * 230 / 208 / cell);
    var minW = Math.ceil(Math.min(w, h) * 0.12 / cell);
    for (var sw = maxW; sw >= minW; sw--){
      var sh = Math.ceil(sw * 208 / 230), r0 = rows - sh, fits = [];
      for (var c0 = 0; c0 + sw <= cols; c0++){
        if (fitsAt(c0, r0, sw, sh)) fits.push(c0);
      }
      if (!fits.length) continue;
      var c = fits[Math.floor(fits.length / 2)];      // keskimmäinen sopiva kohta
      sceneW = sw * cell;
      ahjo.style.left = c * cell + "px";
      ahjo.style.top = (h - sceneW * 208 / 230) + "px";
      ahjo.style.width = sceneW + "px";
      ahjo.style.height = sceneW * 208 / 230 + "px";
      ahjo.classList.add("is-ready");
      return;
    }
    ahjo.classList.remove("is-ready");
  }

  // Isku: alasin painuu kokoon kuin siihen lyötäisiin; iskun hetkellä säteet
  // välähtävät ja vanha sana lähtee, uusi sana syntyy. ?kipinat lisää kipinät.
  var forge = document.getElementById("forge");
  var rays = document.getElementById("rays");
  var anvil = forge.querySelector(".anvil");
  var sparks = forge.querySelectorAll(".spark");
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var IMPACT = 90;                                    // ms iskun alusta osumaan
  var rayAnim = null, first = true, finale = false, i = 0;

  function changeWord(){
    if (first){                                       // ensimmäinen sana: vain esiin
      first = false;
      word.classList.remove("is-in");
      return;
    }
    if (words.length < 2) return;
    word.classList.add("is-out");
    setTimeout(function(){
      i = (i + 1) % words.length;
      word.textContent = words[i];
      word.classList.remove("is-out");
      word.classList.add("is-in");
      void word.offsetWidth;
      word.classList.remove("is-in");
    }, 180);
  }

  function impact(){
    if (rays.animate){
      if (rayAnim) rayAnim.cancel();
      rayAnim = rays.animate([
        { opacity: 0, easing: "linear" },
        { opacity: 1, offset: 0.04 },
        { opacity: 1, offset: 0.3, easing: "ease-out" },
        { opacity: 0, offset: 0.9 },
        { opacity: 0 }
      ], { duration: seconds * 1000, fill: "both" });
      if (finale){                                    // ?kerran: viimeisen iskun jälkeen alasin häipyy säteiden mukana
        anvil.animate([
          { opacity: 1 },
          { opacity: 1, offset: 0.3, easing: "ease-out" },
          { opacity: 0, offset: 0.9 },
          { opacity: 0 }
        ], { duration: seconds * 1000, fill: "forwards" });
      }
      if (lively && !calm){
        var reach = sceneW * 0.2;
        for (var k = 0; k < sparks.length; k++){
          var a = -165 + Math.random() * 150;
          var dx = Math.cos(a * Math.PI / 180) * reach, dy = Math.sin(a * Math.PI / 180) * reach;
          sparks[k].animate([
            { opacity: 1, transform: "translate(-50%, 0) rotate(" + a + "deg)" },
            { opacity: 0, transform: "translate(calc(-50% + " + dx.toFixed(1) + "px), " + dy.toFixed(1) + "px) rotate(" + a + "deg)" }
          ], { duration: 720, easing: "ease-out" });
        }
      }
    }
    changeWord();
  }

  function strike(){
    if (calm || !forge.animate){ impact(); return; }
    forge.animate([
      { transform: "scale(1, 1)", easing: "ease-in" },
      { transform: "scale(1.035, 0.93)", offset: 0.15, easing: "ease-out" },
      { transform: "scale(0.985, 1.03)", offset: 0.42 },
      { transform: "scale(1, 1)" }
    ], { duration: 600 });
    setTimeout(impact, IMPACT);
  }

  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(fit);
    // Varmistus, jos fonttia ei saada ladattua.
    setTimeout(fit, 1500);
  }
  fit();

  setTimeout(function(){
    strike();
    if (words.length < 2) return;
    var left = once ? words.length : Infinity;       // ?kerran: yksi kierros takaisin ensimmäiseen sanaan
    var timer = setInterval(function(){
      if (--left <= 0){ clearInterval(timer); finale = true; }
      strike();
    }, seconds * 1000);
  }, 700);
})();
</script>
</body>
</html>
