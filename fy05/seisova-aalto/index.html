<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seisova aalto · FY05</title>
<style>
  /* ---------- yhteinen ulkoasu (sama kaikissa FY05-simulaatioissa) ---------- */
  :root{
    --bg:#ffffff; --panel:#f8f8f6;
    --ink:#2f3237; --ink-2:#5c6168; --ink-3:#8f949a;
    --line:#e4e4e0; --line-2:#cfcfca;
    --accent:#2f6f9f; --accent-soft:#e7eff6;
    --c-blue:#2e7fae; --c-red:#c4485c; --c-orange:#d9822b; --c-green:#3f8f62; --c-violet:#7a62b0;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
  .app.is-bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    user-select:none;-webkit-user-select:none}
  .panel{width:clamp(212px,24vw,262px);background:var(--panel);border-left:1px solid var(--line);
    padding:12px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .app.is-bottom .panel{width:auto;border-left:0;border-top:1px solid var(--line);flex-direction:row;
    flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 26px;padding:9px 18px 11px}
  .group{display:flex;flex-direction:column;gap:6px;min-width:0}
  .ctl{display:flex;flex-direction:column;gap:0}
  .ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .ctl-head > span:first-child{white-space:normal;min-width:0}
  .ctl-head b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sym{font-style:italic}
  sub{font-size:.72em;line-height:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;--p:50%}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px;border-radius:6px}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(to right,var(--accent) 0 var(--p),var(--line-2) var(--p) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;
    background:#fff;border:1.5px solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none;min-height:26px;white-space:nowrap}
  .chk input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;flex:none}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink);
    cursor:pointer;touch-action:manipulation;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn:active{background:#f1f1ee}
  .btn svg{width:14px;height:14px;flex:none}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:13px;border:0;background:transparent;padding:0 12px;min-height:30px;color:var(--ink-2);cursor:pointer;touch-action:manipulation}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  @media (max-height:500px),(max-width:700px){        /* pienet upotukset: tiiviimmät säätimet */
    .panel{padding:8px 10px;gap:7px}
    .app.is-bottom .panel{padding:6px 12px 8px;gap:5px 14px}
    .group{gap:2px}
    .ctl-head{font-size:12px}
    input[type=range]{height:20px}
    .btn{min-height:28px;padding:0 9px;font-size:12.5px}
    .seg button{min-height:26px;padding:0 9px;font-size:12.5px}
    .chk{min-height:21px;font-size:12.5px}
  }
  @media (max-aspect-ratio:4/5),(max-width:560px){
    html,body{overflow:auto}
    .app{position:static;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
    .stage{height:58vh;min-height:300px}
    .panel,.app.is-bottom .panel{width:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
  }

  /* ---------- tämän simulaation omat ---------- */
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#1f2226}
  .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:default}
  .app.is-bottom .panel{display:grid;grid-template-columns:auto 1fr 1fr 1fr;align-items:end;gap:8px 22px;padding:10px 18px 11px}
  .row-btns{display:flex;gap:6px;align-items:center}
  .opt{display:flex;flex-direction:column;gap:3px}
  .opt > span{font-size:12px;color:var(--ink-2)}
  .row2{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
  .row2 .grp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  @media (max-width:820px){
    .app.is-bottom .panel{grid-template-columns:1fr 1fr 1fr}
    .row-btns{grid-column:1 / -1}
  }
  @media (max-aspect-ratio:4/5),(max-width:560px){
    .app.is-bottom .panel{grid-template-columns:1fr}
  }
  .fwrap{position:relative}
  .fticks{position:absolute;left:9px;right:9px;bottom:-3px;height:6px;pointer-events:none}
  .fticks i{position:absolute;top:0;width:2px;height:6px;margin-left:-1px;background:var(--c-red);border-radius:1px;opacity:.8}
  .fticks[hidden]{display:none}
  .harm{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
  .harm button{font:inherit;font-size:13px;border:0;background:transparent;width:30px;min-height:30px;color:var(--ink-2);cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}
  .harm button+button{border-left:1px solid var(--line-2)}
  .harm button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .harm button:disabled{color:var(--line-2);cursor:default}
</style>
</head>
<body>
<div class="app is-bottom">
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Lanka, jossa kaksi vastakkaisiin suuntiin etenevää aaltoa muodostaa seisovan aallon. Solmut ja kuvut on merkitty."></canvas>
  </div>

  <div class="panel" aria-label="Säätimet">
    <div class="row-btns">
      <button class="btn primary" id="play" type="button"></button>
      <button class="btn" id="reset" type="button" title="Aloita alusta">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 8.2a4.7 4.7 0 1 0 1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2.6 2.4v3.4H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Alusta</button>
      <button class="btn" id="slow" type="button" aria-pressed="false" title="Animaatio neljäsosanopeudella">Hidastus</button>
    </div>
    <label class="ctl fwrap"><span class="ctl-head"><span>Taajuus <span class="sym">f</span></span><b data-for="f"></b></span>
      <input id="f" type="range" min="0.1" max="5" step="0.01" value="1" aria-label="Taajuus">
      <span class="fticks" id="fticks" hidden></span></label>
    <label class="ctl"><span class="ctl-head"><span>Aallon nopeus <span class="sym">v</span></span><b data-for="v"></b></span>
      <input id="v" type="range" min="1" max="4" step="0.1" value="2" aria-label="Aallon nopeus"></label>
    <label class="ctl"><span class="ctl-head"><span>Langan pituus <span class="sym">L</span></span><b data-for="L"></b></span>
      <input id="L" type="range" min="1" max="4" step="0.1" value="2" aria-label="Langan pituus"></label>

    <div class="row2">
      <label class="chk"><input type="checkbox" id="fixed"> Molemmat päät kiinnitetty</label>
      <div class="grp"><span>Harmoninen <span class="sym">n</span></span>
        <div class="harm" role="group" aria-label="Harmoninen värähtelymuoto">
          <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button><button type="button" data-n="4">4</button><button type="button" data-n="5">5</button>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="comp"> Näytä komponenttiaallot</label>
      <label class="chk"><input type="checkbox" id="marks" checked> Solmut ja kuvut</label>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   Yhteiset apufunktiot
   ===================================================================== */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MINUS = '−', NBSP = ' ';
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'), line: css('--line'), line2: css('--line-2'),
  blue: css('--c-blue'), red: css('--c-red'), orange: css('--c-orange'), green: css('--c-green'), violet: css('--c-violet') };

/** Luku suomalaisittain: desimaalipilkku, oikea miinusmerkki, ei "−0,0". */
function fmt(x, d = 1) {
  if (!Number.isFinite(x)) return '–';
  const s = Math.abs(x).toFixed(d);
  const neg = x < 0 && +s !== 0;
  let [ip, fp] = s.split('.');
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? MINUS : '') + ip + (fp ? ',' + fp : '');
}
/** Luku n merkitsevällä numerolla (esim. 160, 32,0, 2,67, 0,100). */
function fmtSig(x, n = 3) {
  if (!Number.isFinite(x)) return '–';
  if (x === 0) return '0';
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)) + 1e-9));
  return fmt(x, Math.min(d, 6));
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* Pieni merkintäkieli kanvastekstille:
   {F} = kursiivinen suureen tunnus, {->v} = vektori (kursiivi + nuoli),
   _1 tai _{ab} = alaindeksi, ^2 tai ^{ab} = yläindeksi. */
const richCache = new Map();
function rich(src) {
  let out = richCache.get(src);
  if (out) return out;
  out = []; let buf = '';
  const flush = () => { if (buf) { out.push({ t: buf }); buf = ''; } };
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === '{') {
      const j = src.indexOf('}', i), body = src.slice(i + 1, j);
      flush();
      out.push(body.startsWith('->') ? { t: body.slice(2), it: true, vec: true } : { t: body, it: true });
      i = j;
    } else if ((c === '_' || c === '^') && i + 1 < src.length) {
      flush();
      let body;
      if (src[i + 1] === '{') { const j = src.indexOf('}', i + 1); body = src.slice(i + 2, j); i = j; }
      else { body = src[i + 1]; i++; }
      out.push(c === '_' ? { t: body, sub: true } : { t: body, sup: true });
    } else buf += c;
  }
  flush();
  richCache.set(src, out);
  return out;
}
/** Piirtää rikastetun tekstin; palauttaa leveyden. */
function drawRich(ctx, src, x, y, o = {}) {
  const size = o.size || 15, parts = rich(src), weight = o.weight || 400;
  const fontOf = (p) => `${p.it ? 'italic ' : ''}${weight} ${(p.sub || p.sup) ? Math.round(size * 0.72) : size}px ${FONT}`;
  let w = 0;
  const ws = parts.map((p) => { ctx.font = fontOf(p); const pw = ctx.measureText(p.t).width + (p.it ? size * 0.06 : 0); w += pw; return pw; });
  if (o.measure) return w;
  let cx = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  parts.forEach((p, k) => {
    ctx.font = fontOf(p);
    const dy = p.sub ? size * 0.3 : p.sup ? -size * 0.36 : 0;
    if (o.halo) {
      ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.strokeStyle = typeof o.halo === 'string' ? o.halo : 'rgba(255,255,255,0.92)';
      ctx.strokeText(p.t, cx, y + dy);
    }
    ctx.fillStyle = o.color || COL.ink;
    ctx.fillText(p.t, cx, y + dy);
    if (p.vec) {                                   // vektorinuoli kirjaimen yläpuolelle
      const ax0 = cx + size * 0.12, ax1 = cx + ws[k] + size * 0.02, ay = y - size * 0.62;
      ctx.strokeStyle = o.color || COL.ink; ctx.lineWidth = Math.max(1, size / 13);
      ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1, ay);
      ctx.moveTo(ax1 - size * 0.2, ay - size * 0.12); ctx.lineTo(ax1, ay); ctx.lineTo(ax1 - size * 0.2, ay + size * 0.12);
      ctx.stroke();
    }
    cx += ws[k];
  });
  return w;
}
/** Vektorinuoli (ohut varsi, kapea kärki). */
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const w = o.width || 2.4, L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 0.5) return;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const hl = Math.min(o.head || 10 + w * 1.2, L * 0.8), hw = hl * 0.58;
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(bx + ux, by + uy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(bx - uy * hw, by + ux * hw); ctx.lineTo(bx + uy * hw, by - ux * hw); ctx.closePath(); ctx.fill();
}
/** Kanvas, joka seuraa elementin kokoa ja näytön tarkkuutta. */
function setupCanvas(cv, onResize) {
  const view = { ctx: cv.getContext('2d'), W: 1, H: 1, dpr: 1 };
  const resize = () => {
    const r = cv.getBoundingClientRect();
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.W = Math.max(1, r.width); view.H = Math.max(1, r.height);
    cv.width = Math.round(view.W * view.dpr); cv.height = Math.round(view.H * view.dpr);
    if (onResize) onResize(view);
  };
  new ResizeObserver(resize).observe(cv);
  resize();
  return view;
}
/** Liukusäädin + arvonäyttö. */
function bindRange(id, show, onInput) {
  const el = document.getElementById(id), out = document.querySelector(`[data-for="${id}"]`);
  const paint = () => {
    const v = +el.value, a = +el.min, b = +el.max;
    el.style.setProperty('--p', ((v - a) / (b - a) * 100) + '%');
    if (out) out.textContent = show(v);
  };
  el.addEventListener('input', () => { paint(); onInput(+el.value); });
  paint();
  return { el, set(v) { el.value = v; paint(); }, get v() { return +el.value; }, repaint: paint };
}
/** Kiinteän aika-askeleen silmukka: fysiikka ei riipu näytön virkistystaajuudesta. */
function startLoop({ dt, step, draw, running }) {
  let last = performance.now(), acc = 0;
  const frame = (ts) => {
    requestAnimationFrame(frame);
    const real = clamp((ts - last) / 1000, 0, 0.1);   // pitkä tauko (esim. välilehti piilossa) ei aiheuta hyppyä
    last = ts;
    if (running()) {
      acc += real;
      let n = 0;
      while (acc >= dt && n++ < 1000) { step(dt); acc -= dt; }
    }
    draw();
  };
  requestAnimationFrame(frame);
}

/* =====================================================================
   Fysiikka: seisova aalto
   1) Kaksi vastakkaisiin suuntiin etenevää aaltoa (oletustila):
        y₁ = A·sin(ωt − kx)        (oikealle)
        y₂ = −A·sin(ωt + kx)       (vasemmalle)
        y = y₁ + y₂ = −2A·sin(kx)·cos(ωt)   → seisova aalto, solmut x = mλ/2.
      Alussa aallot tulevat langan päistä ja kohtaavat (rintamat etenevät nopeudella v).
   2) Molemmat päät kiinnitetty: lankaa värähdytetään vasemmasta päästä hyvin pienellä
      amplitudilla a, ja aalto heijastuu kiinteästä oikeasta päästä (heijastus −1).
      Vasemmasta päästä palaava aalto heijastuu takaisin pienin häviöin (kerroin ρ < 1).
      Jatkuvuustilassa oikealle etenevän aallon kompleksinen amplitudi on
        F = a / (1 − ρ·e^(−i·2kL)),
      joten aallot vahvistavat toisiaan vain, kun 2kL = n·2π eli L = n·λ/2:
        λₙ = 2L/n,  fₙ = n·v/(2L).
      Muilla taajuuksilla heijastuneet aallot kumoavat toisiaan eikä suurta seisovaa aaltoa synny.
   ===================================================================== */
const A2 = 0.25;              // kummankin aallon amplitudi tilassa 1, m
const RHO = 0.85;             // heijastuskerroin värähdyttäjän päässä (häviöt)
const A_D = 2 * A2 * (1 - RHO) / 2;   // värähdyttäjän amplitudi: resonanssissa kuvut = 2·A2
const S = {
  f: 1.0, v: 2.0, L: 2.0,
  th: 0, t: 0,                 // th = ∫ω dt (vaihe), t = aika alusta (aaltorintamat)
  playing: true, slow: false,
  fixed: false, comp: false, marks: true,
  harm: 0,                     // valittu harmoninen (0 = ei valintaa)
  Fr: 0, Fi: 0,                // tilan 2 näytetty kompleksinen amplitudi (pehmeä asettuminen)
};
const kOf = () => 2 * Math.PI * S.f / S.v;     // aaltoluku k = 2π/λ = ω/v
const fn = (n) => n * S.v / (2 * S.L);

/** Tilan 2 jatkuvuustilan amplitudi F = a / (1 − ρ e^(−i2kL)). */
function targetF() {
  const ph = 2 * kOf() * S.L, dr = 1 - RHO * Math.cos(ph), di = RHO * Math.sin(ph), q = dr * dr + di * di;
  return [A_D * dr / q, -A_D * di / q];
}
/** Langan poikkeama ja komponentit kohdassa x (m). */
function yParts(x) {
  const k = kOf(), th = S.th;
  if (!S.fixed) {
    const front = S.v * S.t;
    const y1 = x <= front ? A2 * Math.sin(th - k * x) : 0;
    const y2 = (S.L - x) <= front ? -A2 * Math.sin(th + k * x) : 0;
    return [y1, y2];
  }
  // y₁ = Re[F e^{i(θ − kx)}],  y₂ = Re[−F e^{i(θ − k(2L − x))}]
  const a1 = th - k * x, a2 = th - k * (2 * S.L - x);
  const y1 = S.Fr * Math.cos(a1) - S.Fi * Math.sin(a1);
  const y2 = -(S.Fr * Math.cos(a2) - S.Fi * Math.sin(a2));
  return [y1, y2];
}
/** Kuinka lähellä resonanssia ollaan (0…1). */
function resonance() {
  const [fr, fi] = targetF();
  return Math.hypot(fr, fi) * (1 - RHO) / A_D;
}

/* =====================================================================
   Piirtäminen
   ===================================================================== */
const cv = document.getElementById('cv');
let L = {};
const view = setupCanvas(cv, (v) => {
  const fs = clamp(Math.min(v.W / 62, v.H / 30), 12, 16);
  const m = Math.max(54, v.W * 0.07);
  // 4,0 m:n lanka mahtuu leveyteen ja kuvut (2A) sekä asteikko korkeuteen
  const s = Math.min((v.W - 2 * m) / 4.0, (v.H - fs * 7.2) / (4.4 * A2));
  const y0 = clamp(v.H * 0.55, fs * 4.4 + 2 * A2 * s, v.H - fs * 2.8 - 2.2 * A2 * s);
  L = { W: v.W, H: v.H, fs, s, y0 };
});
const X = (x) => L.W / 2 + (x - S.L / 2) * L.s;      // lanka keskitetään vaakasuunnassa
const Yp = (y) => L.y0 - y * L.s;

function draw() {
  const { ctx, dpr } = view, { W, H, fs, y0 } = L;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const xl = X(0), xr = X(S.L), N = Math.max(60, Math.round((xr - xl) / 2));
  const res = resonance();

  // tasapainoasema
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
  ctx.beginPath(); ctx.moveTo(xl, y0); ctx.lineTo(xr, y0); ctx.stroke(); ctx.setLineDash([]);

  // päät
  if (S.fixed) {
    const yl = Yp(yParts(0)[0] + yParts(0)[1]);
    clamp2(ctx, xl, yl, -1); clamp2(ctx, xr, y0, 1);
  } else {                                          // jatkuu kuva-alueen ulkopuolelle
    for (const [xe, dir] of [[xl, -1], [xr, 1]]) {
      const ye = Yp((([a, b]) => a + b)(yParts(dir < 0 ? 0 : S.L)));
      const g = ctx.createLinearGradient(xe, 0, xe + dir * 40, 0);
      g.addColorStop(0, 'rgba(60,65,72,0.8)'); g.addColorStop(1, 'rgba(60,65,72,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xe, ye); ctx.lineTo(xe + dir * 40, y0 + (ye - y0) * 0.3); ctx.stroke();
    }
  }

  // verhokäyrä, solmut ja kuvut
  const k = kOf(), lam = 2 * Math.PI / k;
  const showMarks = S.marks && (!S.fixed || res > 0.5) && (S.fixed || S.v * S.t >= S.L);
  if (showMarks) {
    const amp = S.fixed ? 2 * Math.hypot(S.Fr, S.Fi) : 2 * A2;
    const env = (x) => amp * Math.abs(S.fixed ? Math.sin(k * (S.L - x)) : Math.sin(k * x));
    ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    for (const sg of [1, -1]) {
      ctx.beginPath();
      for (let i = 0; i <= N; i++) { const x = S.L * i / N, px = X(x), py = Yp(sg * env(x)); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // solmut: tila 1 → x = mλ/2 vasemmasta päästä, tila 2 → x = L − mλ/2 oikeasta päästä
    const nodes = [], anti = [];
    for (let m = 0; m <= 60; m++) {
      const xn = S.fixed ? S.L - m * lam / 2 : m * lam / 2, xa = S.fixed ? S.L - (m + 0.5) * lam / 2 : (m + 0.5) * lam / 2;
      if (xn >= -1e-6 && xn <= S.L + 1e-6) nodes.push(xn);
      if (xa >= 0 && xa <= S.L) anti.push(xa);
    }
    ctx.lineWidth = 1.6;
    for (const xn of nodes) {
      ctx.strokeStyle = COL.ink; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(X(xn), y0, 4.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      drawRich(ctx, 'S', X(xn), y0 + fs * 1.15, { size: fs * 0.75, color: COL.ink2, align: 'center', halo: true });
    }
    for (const xa of anti) {
      const a = env(xa), px = X(xa);
      ctx.strokeStyle = COL.green; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(px, Yp(a)); ctx.lineTo(px, Yp(-a));
      ctx.moveTo(px - 4, Yp(a)); ctx.lineTo(px + 4, Yp(a)); ctx.moveTo(px - 4, Yp(-a)); ctx.lineTo(px + 4, Yp(-a)); ctx.stroke();
      drawRich(ctx, 'K', px, Yp(a) - fs * 0.75, { size: fs * 0.75, color: COL.green, align: 'center', halo: true });
    }
  }

  // komponenttiaallot
  if (S.comp) {
    for (const [idx, col] of [[0, COL.blue], [1, COL.orange]]) {
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) { const x = S.L * i / N, px = X(x), py = Yp(yParts(x)[idx]); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const ly = fs * 1.2;
    drawRich(ctx, '→ oikealle etenevä', W - 14, ly, { size: fs * 0.88, color: COL.blue, align: 'right' });
    drawRich(ctx, '← vasemmalle etenevä', W - 14, ly + fs * 1.45, { size: fs * 0.88, color: COL.orange, align: 'right' });
    drawRich(ctx, 'summa', W - 14, ly + fs * 2.9, { size: fs * 0.88, color: COL.ink, align: 'right', weight: 600 });
  }

  // summa-aalto
  ctx.strokeStyle = '#2f3339'; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i <= N; i++) { const x = S.L * i / N, [a, b] = yParts(x), px = X(x), py = Yp(a + b); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
  ctx.stroke();

  // pituusasteikko
  const ya = Yp(-2.2 * A2) + fs * 0.4;
  ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xl, ya); ctx.lineTo(xr, ya);
  for (let m = 0; m <= S.L + 1e-9; m += 0.5) { const px = X(m); ctx.moveTo(px, ya); ctx.lineTo(px, ya + (Math.abs(m - Math.round(m)) < 1e-9 ? 6 : 3.5)); }
  ctx.moveTo(xr, ya); ctx.lineTo(xr, ya + 6);
  ctx.stroke();
  for (let m = 0; m <= S.L + 1e-9; m++) drawRich(ctx, String(m), X(m), ya + fs * 0.95, { size: fs * 0.78, color: COL.ink3, align: 'center' });
  drawRich(ctx, `{L} = ${fmt(S.L, 1)}${NBSP}m`, (xl + xr) / 2, ya + fs * 2.1, { size: fs * 0.85, color: COL.ink2, align: 'center' });

  drawInfo(res, lam);
}

/** Kiinnityspiste (seinä). dir = −1 vasen, +1 oikea. */
function clamp2(ctx, x, y, dir) {
  const h = 0.5 * L.s;
  ctx.fillStyle = '#ecebe7'; ctx.strokeStyle = COL.ink2; ctx.lineWidth = 1.2;
  const bx = dir > 0 ? x + 1 : x - 11;
  ctx.fillRect(bx, L.y0 - h / 2, 10, h);
  ctx.beginPath(); ctx.moveTo(dir > 0 ? x + 1 : x - 1, L.y0 - h / 2); ctx.lineTo(dir > 0 ? x + 1 : x - 1, L.y0 + h / 2); ctx.stroke();
  ctx.strokeStyle = COL.ink3; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let yy = L.y0 - h / 2 + 3; yy < L.y0 + h / 2 - 2; yy += 8) { ctx.moveTo(bx + 1, yy + 6); ctx.lineTo(bx + 9, yy); }
  ctx.stroke();
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();
}

function drawInfo(res, lam) {
  const { ctx } = view, { fs } = L, f = fs * 0.92, x0 = 14;
  let y = fs * 1.2;
  if (!S.fixed) {
    drawRich(ctx, `λ = {v}/{f} = ${fmt(lam, 2)}${NBSP}m`, x0, y, { size: f, color: COL.ink2 });
    drawRich(ctx, `solmujen väli λ/2 = ${fmt(lam / 2, 2)}${NBSP}m`, x0, y + f * 1.5, { size: f, color: COL.ink2 });
    return;
  }
  const n = Math.round(2 * S.L * S.f / S.v);
  if (res > 0.5 && n >= 1) {
    drawRich(ctx, `{n} = ${n}`, x0, y, { size: f, color: COL.ink, weight: 600 });
    drawRich(ctx, `λ_${n} = 2{L}/${n} = ${fmt(2 * S.L / n, 2)}${NBSP}m`, x0, y + f * 1.5, { size: f, color: COL.ink2 });
    drawRich(ctx, `{f}_${n} = ${n}{v}/(2{L}) = ${fmt(fn(n), 2)}${NBSP}Hz`, x0, y + f * 3.0, { size: f, color: COL.ink2 });
  } else {
    const list = [1, 2, 3, 4, 5].map((m) => fmt(fn(m), 2)).join(' · ');
    drawRich(ctx, 'Ei ominaistaajuus: pysyvää seisovaa aaltoa ei synny', x0, y, { size: f, color: COL.red });
    drawRich(ctx, `{f}_{n} = {n}{v}/(2{L}):  ${list}${NBSP}Hz`, x0, y + f * 1.5, { size: f, color: COL.ink2 });
  }
}

/* =====================================================================
   Käyttöliittymä
   ===================================================================== */
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.6v10.8l9-5.4z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/><rect x="9.3" y="2.6" width="3.2" height="10.8" rx=".8" fill="currentColor"/></svg>';
const playBtn = document.getElementById('play');
const paintPlay = () => { playBtn.innerHTML = S.playing ? ICON_PAUSE + 'Tauko' : ICON_PLAY + 'Käynnistä'; };
playBtn.addEventListener('click', () => { S.playing = !S.playing; paintPlay(); });
document.getElementById('reset').addEventListener('click', () => { S.t = 0; S.th = 0; S.Fr = 0; S.Fi = 0; });
const slowBtn = document.getElementById('slow');
slowBtn.addEventListener('click', () => { S.slow = !S.slow; slowBtn.setAttribute('aria-pressed', String(S.slow)); });

const fR = bindRange('f', (x) => fmt(x, 2) + NBSP + 'Hz', (x) => { S.f = x; S.harm = 0; paintHarm(); });
bindRange('v', (x) => fmt(x, 1) + NBSP + 'm/s', (x) => { S.v = x; follow(); });
bindRange('L', (x) => fmt(x, 1) + NBSP + 'm', (x) => { S.L = x; follow(); });
/** Jos harmoninen on valittu, taajuus seuraa ominaistaajuutta v:n ja L:n muuttuessa. */
function follow() {
  if (S.harm) { let f = fn(S.harm); if (f > 5) { S.harm = 0; f = 5; } setF(f); }
  paintHarm(); paintTicks();
}
const fOut = document.querySelector('[data-for="f"]');
/** Asettaa taajuuden tarkasti (säätimen askel ei pyöristä ominaistaajuutta). */
function setF(x) { S.f = x; fR.set(x); fOut.textContent = fmt(x, 2) + NBSP + 'Hz'; }
document.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => {
  const n = +b.dataset.n;
  S.harm = n; setF(fn(n));
  if (S.fixed) { const [fr, fi] = targetF(); S.Fr = fr; S.Fi = fi; }   // värähtelymuoto näkyy heti
  paintHarm();
}));
function paintHarm() {
  document.querySelectorAll('[data-n]').forEach((b) => {
    const n = +b.dataset.n;
    b.disabled = fn(n) > 5 + 1e-9;
    b.setAttribute('aria-pressed', String(S.harm === n));
  });
}
const ticks = document.getElementById('fticks');
function paintTicks() {                               // ominaistaajuudet merkitään taajuussäätimeen
  ticks.hidden = !S.fixed;
  ticks.innerHTML = [1, 2, 3, 4, 5].filter((n) => fn(n) <= 5).map((n) => `<i style="left:${((fn(n) - 0.1) / 4.9 * 100).toFixed(2)}%"></i>`).join('');
}
document.getElementById('fixed').addEventListener('change', (e) => {
  S.fixed = e.target.checked; S.Fr = 0; S.Fi = 0; S.t = 0; paintTicks();
});
document.getElementById('comp').addEventListener('change', (e) => { S.comp = e.target.checked; });
document.getElementById('marks').addEventListener('change', (e) => { S.marks = e.target.checked; });

paintPlay(); paintHarm(); paintTicks();
startLoop({
  dt: 1 / 240,
  step: (dt) => {
    const h = dt * (S.slow ? 0.25 : 1);
    S.t += h;
    S.th += 2 * Math.PI * S.f * h;
    if (S.fixed) {                                  // amplitudi asettuu pehmeästi uuteen arvoon (τ ≈ 0,5 s)
      const [fr, fi] = targetF(), a = 1 - Math.exp(-h / 0.5);
      S.Fr += (fr - S.Fr) * a; S.Fi += (fi - S.Fi) * a;
    }
  },
  draw,
  running: () => S.playing,
});
})();
</script>
