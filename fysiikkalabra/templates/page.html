<!doctype html>
<html lang="{{t:format.html_lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — {{t:site.name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{t:site.name}}">
<meta property="og:locale" content="{{t:format.og_locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="theme-color" content="#f7f3ec">
<link rel="icon" href="brand/ruukkilabra-symboli.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/ruukkilabra-180.png">
<link rel="stylesheet" href="site.css">
</head><body>
<div class="page">
<header class="top">
  <a class="brand" href="index.html" aria-label="{{t:site.home_aria}}"><img class="brand-mark" src="brand/ruukkilabra-symboli.svg" alt="" width="40" height="40"><span class="brand-name">{{t:site.name}}<small>{{t:site.subtitle}}</small></span></a>
  <nav aria-label="{{t:site.main_menu}}"><a href="index.html#moduulit">{{t:site.modules}}</a><a class="pill" href="{{home}}">{{t:site.portfolio}}</a>{{languages}}</nav>
</header>
<nav class="crumbs" aria-label="{{t:site.breadcrumb}}">{{crumbs}}</nav>
<main class="{{main_class}}">{{body}}</main>
<footer class="bottom"><span>{{t:site.footer}}</span><a href="{{home}}">{{t:site.back_to_portfolio}}</a></footer>
</div>
</body></html>
