# Fysiikkalabra QA for every course: build every lesson (drafts included), run the headless simulation and inquiry
# tests, check answer positions, carried reviews and the committed site. No AI task repeats these checks.
# This repository serves GitHub Pages from its root branch, so there is no Pages deploy job here;
# publishing is a separate decision (see fysiikkalabra/README.md).
name: fysiikkalabra-ci
on:
  push:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  pull_request:
    paths: ["fysiikkalabra/**", ".github/workflows/fysiikkalabra-ci.yml"]
  schedule: [{ cron: "0 19 * * 0" }]   # Sunday 21:00 Helsinki (winter time): weekly QA run
permissions: { contents: read }
jobs:
  qa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fysiikkalabra } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # reviews.py verify re-derives carried reviews from history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install markdown playwright && playwright install --with-deps chromium
      - run: python scripts/lint_lesson.py --all
      - run: python scripts/build.py --all
      - run: python scripts/test_reviews.py
      - run: python scripts/test_inquiry.py
      - run: python scripts/reviews.py verify
      - name: a temporary FY4 course through the whole pipeline (nothing is published)
        run: python scripts/test_courses.py
      - name: which lessons this pull request touches, and which review each needs
        if: github.event_name == 'pull_request'
        run: python scripts/reviews.py impact "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python scripts/test_sims.py
      - name: inquiry tests of every lesson with inquiry.json (gating, locks, reveal, options and feedback as rendered, navigation, 360 px)
        run: |
          fail=0
          for f in content/*/*/inquiry.json; do
            id=$(basename "$(dirname "$f")")
            if python scripts/test_inquiry.py "$id" > "/tmp/inquiry-$id.txt" 2>&1; then tail -1 "/tmp/inquiry-$id.txt" | sed "s/^/$id: /"
            else fail=1; echo "::error::inquiry tests failed for $id"; grep -E "^FAIL" "/tmp/inquiry-$id.txt" || tail -20 "/tmp/inquiry-$id.txt"; fi
          done
          exit $fail
      - name: correct options are spread over the positions in every course (as the pages show them)
        run: python scripts/check_choices.py --all
      - name: committed site/ is exactly a fresh render of the reviewed sources and templates
        run: |
          python scripts/build.py
          if [ -n "$(git status --porcelain site/)" ]; then echo "site/ is not a fresh render of the reviewed sources (run build.py and commit):"; git status --short site/; exit 1; fi
      - name: every published page fits a 360 px phone, its figure labels do not collide, and the wide layout keeps its columns and line length at 1280 and 1920 px
        run: python scripts/check_layout.py --site && python scripts/check_layout.py --site --width 1280 && python scripts/check_layout.py --site --width 1920
      - run: |
          for d in content/*/*/; do
            case "$d" in *_gold*) continue;; esac
            python scripts/check_latex.py "$d"
          done
