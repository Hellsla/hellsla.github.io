<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Täysin kimmoton törmäys</title>
<style>
:root{
  --ink:#3F3D39;
  --muted:#7A7771;
  --paper:#FFFFFF;
  --grid:#E9E7E2;
  --frame:#CFCCC6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{overflow:hidden}
.sim{width:100vw;height:100vh;min-height:320px;display:grid;grid-template-rows:1fr auto;background:#fff}
.stage{position:relative;min-height:0}
svg{display:block;width:100%;height:100%}

.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 18px 14px}
button{
  appearance:none;border:1.8px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:999px;padding:7px 15px;cursor:pointer;
  font:600 clamp(13px,1.8vh,18px)/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button:hover:not(:disabled){background:#F7F7F5}
button:disabled{opacity:.4;cursor:default}

@media (max-width:820px){ .controls{gap:9px;padding:5px 10px 12px} }
/* Varsinainen puhelinasettelu vasta selvästi kapeammalla, jottei tavallinen
   700 px:n upotus muutu vierivaksi sivuksi. */
@media (max-width:560px){
  body{overflow:auto}
  .sim{height:auto;min-height:100vh;grid-template-rows:auto auto}
  .stage{height:min(58vw,470px);min-height:250px}
  .controls{padding:8px 10px 16px}
  button{font-size:14px;padding:6px 12px}
}
</style>
</head>
<body>
<main class="sim" aria-label="Täysin kimmottoman törmäyksen simulaatio">
  <div class="stage">
    <svg viewBox="0 0 960 540" role="img"
         aria-label="Auto törmää levossa olevaan kuorma-autoon ja ne jatkavat matkaa yhdessä">
      <defs>
        <linearGradient id="carPaint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#E7B98A"/>
          <stop offset="100%" stop-color="#B87D45"/>
        </linearGradient>
        <linearGradient id="cabPaint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#E8533F"/>
          <stop offset="100%" stop-color="#B3231A"/>
        </linearGradient>
        <linearGradient id="boxPaint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#D5D3CE"/>
          <stop offset="100%" stop-color="#9E9B95"/>
        </linearGradient>
        <marker id="vHead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#3F3D39"/>
        </marker>
        <clipPath id="clipScene"><rect x="40" y="92" width="880" height="378"/></clipPath>
      </defs>

      <text x="480" y="56" text-anchor="middle" font-size="38" font-weight="700" fill="#3F3D39">Täysin kimmoton törmäys</text>

      <g stroke="var(--grid)" stroke-width="1.3">
        <line x1="186" y1="92" x2="186" y2="470"/><line x1="333" y1="92" x2="333" y2="470"/>
        <line x1="480" y1="92" x2="480" y2="470"/><line x1="626" y1="92" x2="626" y2="470"/>
        <line x1="773" y1="92" x2="773" y2="470"/>
        <line x1="40" y1="218" x2="920" y2="218"/>
      </g>
      <rect x="40" y="92" width="880" height="378" fill="none" stroke="var(--frame)" stroke-width="1.8"/>
      <text id="pTxt" x="902" y="126" text-anchor="end" font-size="20" font-weight="650" fill="#7A7771"></text>
      <line x1="40" y1="400" x2="920" y2="400" stroke="#3F3D39" stroke-width="3"/>

      <g clip-path="url(#clipScene)">
        <!-- henkilöauto, nokka oikealle; origo vasen alakulma maassa -->
        <g id="car">
          <path d="M5,-7 L5,-17 C5,-22 9,-25 15,-26 L31,-27
                   C37,-36 45,-40 57,-40 C69,-40 78,-36 85,-28
                   L98,-25 C105,-23 108,-19 108,-11 L108,-7 Z"
                fill="url(#carPaint)" stroke="#3F3D39" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M36,-28 C40,-34 46,-37 55,-37 L55,-28 Z" fill="#CFE4EC" stroke="#3F3D39" stroke-width="1.1"/>
          <path d="M60,-37 C68,-37 75,-34 80,-28 L60,-28 Z" fill="#CFE4EC" stroke="#3F3D39" stroke-width="1.1"/>
          <circle cx="28" cy="-9.5" r="9.5" fill="#33312E" stroke="#3F3D39" stroke-width="1.3"/>
          <circle cx="28" cy="-9.5" r="3.6" fill="#D8D6D1"/>
          <circle cx="88" cy="-9.5" r="9.5" fill="#33312E" stroke="#3F3D39" stroke-width="1.3"/>
          <circle cx="88" cy="-9.5" r="3.6" fill="#D8D6D1"/>
        </g>
        <!-- kuorma-auto, nokka vasemmalle; origo vasen alakulma maassa -->
        <g id="truck">
          <rect x="8" y="-20" width="176" height="9" fill="#4A4742"/>
          <rect x="58" y="-64" width="126" height="46" rx="3"
                fill="url(#boxPaint)" stroke="#3F3D39" stroke-width="1.6"/>
          <g stroke="#6E6B65" stroke-width="1.6">
            <line x1="76" y1="-60" x2="76" y2="-22"/><line x1="97" y1="-60" x2="97" y2="-22"/>
            <line x1="118" y1="-60" x2="118" y2="-22"/><line x1="139" y1="-60" x2="139" y2="-22"/>
            <line x1="160" y1="-60" x2="160" y2="-22"/>
          </g>
          <path d="M6,-18 L6,-44 C6,-50 9,-54 15,-56 L20,-70 L52,-70 L52,-18 Z"
                fill="url(#cabPaint)" stroke="#3F3D39" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M23,-66 L49,-66 L49,-52 L14,-52 C14,-56 16,-60 23,-66 Z"
                fill="#CFE4EC" stroke="#3F3D39" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="28" cy="-14" r="14" fill="#33312E" stroke="#3F3D39" stroke-width="1.4"/>
          <circle cx="28" cy="-14" r="5.4" fill="#D8D6D1"/>
          <circle cx="124" cy="-14" r="14" fill="#33312E" stroke="#3F3D39" stroke-width="1.4"/>
          <circle cx="124" cy="-14" r="5.4" fill="#D8D6D1"/>
          <circle cx="158" cy="-14" r="14" fill="#33312E" stroke="#3F3D39" stroke-width="1.4"/>
          <circle cx="158" cy="-14" r="5.4" fill="#D8D6D1"/>
        </g>
      </g>

      <g font-size="22" font-weight="700" text-anchor="middle" fill="#3F3D39">
        <text id="vTxt1" y="316"></text><text id="vTxt2" y="272"></text>
      </g>
      <line id="vArr1" y1="334" y2="334" stroke="#3F3D39" stroke-width="3" stroke-linecap="round" marker-end="url(#vHead)"/>
      <line id="vArr2" y1="290" y2="290" stroke="#3F3D39" stroke-width="3" stroke-linecap="round" marker-end="url(#vHead)"/>
      <g font-size="20" font-weight="650" text-anchor="middle" fill="#7A7771">
        <text id="mTxt1" y="436">1000 kg</text><text id="mTxt2" y="436">8000 kg</text>
      </g>
    </svg>
  </div>

  <section class="controls" aria-label="Säätimet">
    <button id="play" type="button">Aloita</button>
    <button id="pause" type="button" disabled>Pysäytä</button>
    <button id="reset" type="button">Nollaa</button>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const el = {};
  ["car","truck","pTxt","vArr1","vArr2","vTxt1","vTxt2","mTxt1","mTxt2",
   "play","pause","reset"].forEach(id => el[id] = $(id));

  const fmt = (x, d = 1) =>
    (Math.abs(x) < 0.0005 ? 0 : x).toFixed(d).replace(".", ",").replace("-", "−");

  /* Täysin kimmottomassa törmäyksessä kappaleet jäävät yhteen, joten
     yhteinen nopeus on u = (m1 v1 + m2 v2) / (m1 + m2). */
  const m1 = 1000, v1 = 12, m2 = 8000, v2 = 0;
  const u = (m1 * v1 + m2 * v2) / (m1 + m2);

  const SCALE = 1.35, GROUND = 400;
  const CAR_W = 110 * SCALE, TRUCK_W = 190 * SCALE;
  const PX_PER_M = 30, ARROW_PER_MS = 12;
  const X1 = 80, X2 = 540;
  const LEFT = 50, RIGHT = 910;

  const speed = v1 * PX_PER_M;
  const after = u * PX_PER_M;
  const tHit  = (X2 - CAR_W - X1) / speed;
  const xStop = RIGHT - 10 - TRUCK_W - CAR_W;
  const T_END = tHit + (xStop - (X2 - CAR_W)) / after;

  let t = 0, running = false, last = 0;

  // Keskitetty teksti kehyksen sisään: muuten lukema leikkautuu, kun
  // kappale on aivan reunassa.
  function centerText(node, x){
    node.setAttribute("x", x.toFixed(1));
    const half = node.getComputedTextLength() / 2;
    node.setAttribute("x", Math.min(RIGHT - half, Math.max(LEFT + half, x)).toFixed(1));
  }

  function setV(arrow, label, cx, w){
    label.textContent = fmt(w) + " m/s";
    centerText(label, cx);
    const L = Math.abs(w) * ARROW_PER_MS;
    if (L < 3){ arrow.style.display = "none"; return; }
    arrow.style.display = "";
    const s = Math.sign(w);
    const mid = Math.min(RIGHT - L / 2, Math.max(LEFT + L / 2, cx));
    arrow.setAttribute("x1", (mid - s * L / 2).toFixed(1));
    arrow.setAttribute("x2", (mid + s * L / 2).toFixed(1));
  }

  function draw(){
    const hit = t >= tHit;
    const carL = hit
      ? Math.min(xStop, X2 - CAR_W + after * (t - tHit))
      : X1 + speed * t;
    const truckL = hit ? carL + CAR_W : X2;
    el.car.setAttribute("transform", `translate(${carL.toFixed(1)},${GROUND}) scale(${SCALE})`);
    el.truck.setAttribute("transform", `translate(${truckL.toFixed(1)},${GROUND}) scale(${SCALE})`);
    setV(el.vArr1, el.vTxt1, carL + CAR_W / 2, hit ? u : v1);
    setV(el.vArr2, el.vTxt2, truckL + TRUCK_W / 2, hit ? u : v2);
    centerText(el.mTxt1, carL + CAR_W / 2);
    centerText(el.mTxt2, truckL + TRUCK_W / 2);
    el.pTxt.textContent = `p = ${(m1 * v1 + m2 * v2).toLocaleString("fi-FI")} kg·m/s`;
  }

  function frame(now){
    if (!running) return;
    t = Math.min(T_END, t + Math.min(0.05, (now - last) / 1000));
    last = now;
    draw();
    if (t >= T_END){ stop(); return; }
    requestAnimationFrame(frame);
  }
  function start(){
    if (running) return;
    if (t >= T_END) t = 0;
    running = true;
    el.play.disabled = true; el.pause.disabled = false;
    last = performance.now();
    requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    el.play.disabled = false; el.pause.disabled = true;
  }
  function reset(){ stop(); t = 0; draw(); }

  el.play.addEventListener("click", start);
  el.pause.addEventListener("click", stop);
  el.reset.addEventListener("click", reset);
  window.addEventListener("keydown", e => {
    if (e.code === "Space"){ e.preventDefault(); running ? stop() : start(); }
  });

  draw();
})();
</script>
</body>
</html>
